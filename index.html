<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 모음</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --border:#e3e6ee;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:34px 20px 30px;
    text-align:center;
  }
  header h1{
    margin:0 0 8px;
    font-size:1.5rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.88rem;
    opacity:.92;
  }
  .wrap{
    max-width:680px;
    margin:0 auto;
    padding:20px 16px 60px;
  }
  .list{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px 18px;
    text-decoration:none;
    color:var(--text);
    box-shadow:0 2px 10px rgba(30,40,80,.04);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .item:active{transform:scale(.98);}
  .item-main{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .round{
    font-weight:800;
    font-size:1.05rem;
    color:var(--accent);
  }
  .meta{
    font-size:.8rem;
    color:var(--sub);
  }
  .arrow{
    flex:0 0 auto;
    width:32px;height:32px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    display:flex;align-items:center;justify-content:center;
    font-size:1rem;
    font-weight:800;
  }
  .empty{
    text-align:center;
    color:var(--sub);
    padding:40px 10px;
    font-size:.9rem;
  }
  footer{
    text-align:center;
    color:var(--sub);
    font-size:.75rem;
    padding:10px 16px 30px;
  }
  .section-label{
    font-size:.78rem;
    font-weight:700;
    color:var(--sub);
    margin:22px 2px 10px;
    letter-spacing:.02em;
  }
  .section-label:first-of-type{margin-top:2px;}
  .download-card{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--card);
    border:1.5px dashed var(--accent);
    border-radius:16px;
    padding:16px 18px;
    text-decoration:none;
    color:var(--text);
    box-shadow:0 2px 10px rgba(30,40,80,.04);
    transition:transform .15s ease, background .15s ease;
  }
  .download-card:active{transform:scale(.98);}
  .download-icon{
    flex:0 0 auto;
    width:42px;height:42px;
    border-radius:50%;
    background:var(--accent-soft);
    display:flex;align-items:center;justify-content:center;
  }
  .download-icon svg{width:20px;height:20px;stroke:var(--accent);}
  .download-main{
    display:flex;
    flex-direction:column;
    gap:2px;
    flex:1 1 auto;
    min-width:0;
  }
  .download-title{
    font-weight:800;
    font-size:.98rem;
    color:var(--text);
  }
  .download-meta{
    font-size:.78rem;
    color:var(--sub);
  }
  .download-chip{
    flex:0 0 auto;
    font-size:.72rem;
    font-weight:700;
    color:var(--accent);
    background:var(--accent-soft);
    padding:5px 10px;
    border-radius:20px;
  }
  @media (min-width:768px){
    header h1{font-size:1.9rem;}
    .round{font-size:1.15rem;}
  }
</style>
</head>
<body>

<header>

    <a class="item" href="problems/exam_2026-09-01.html">
