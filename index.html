<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 모음</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --border:#e3e6ee;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:34px 20px 30px;
    text-align:center;
  }
  header h1{
    margin:0 0 8px;
    font-size:1.5rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.88rem;
    opacity:.92;
  }
  .wrap{
    max-width:680px;
    margin:0 auto;
    padding:20px 16px 60px;
  }
  .list{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px 18px;
    text-decoration:none;
    color:var(--text);
    box-shadow:0 2px 10px rgba(30,40,80,.04);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .item:active{transform:scale(.98);}
  .item-main{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .round{
    font-weight:800;
    font-size:1.05rem;
    color:var(--accent);
  }
  .meta{
    font-size:.8rem;
    color:var(--sub);
  }
  .arrow{
    flex:0 0 auto;
    width:32px;height:32px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    display:flex;align-items:center;justify-content:center;
    font-size:1rem;
    font-weight:800;
  }
  .empty{
    text-align:center;
    color:var(--sub);
    padding:40px 10px;
    font-size:.9rem;
  }
  footer{
    text-align:center;
    color:var(--sub);
    font-size:.75rem;
    padding:10px 16px 30px;
  }
  @media (min-width:768px){
    header h1{font-size:1.9rem;}
    .round{font-size:1.15rem;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 모음</h1>
  <p>필기 + 실기 통합 연습문제 · 클릭 한 번으로 정답 확인</p>
</header>

<div class="wrap">
  <div class="list" id="examList">
    <!-- 최신 회차가 위로 오도록 정렬 (내림차순) -->
    <a class="item" href="problems/exam_2026-09-01.html">
      <div class="item-main">
        <span class="round">제1회</span>
        <span class="meta">2026-09-01 출제 · 13문항 (필기 9 · 실기 4)</span>
      </div>
      <span class="arrow">›</span>
    </a>
  </div>
</div>

<footer>
  정보처리기능사 자격 대비 개인 학습용 모의고사입니다.
</footer>

</body>
</html>
