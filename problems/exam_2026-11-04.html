<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-11-04 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {type:"written",q:"인터럽트 우선순위 판별 방법 중 소프트웨어 방식에 해당하는 것은?",kind:"mc",
   options:["폴링(Polling)","데이지 체인(Daisy Chain)","병렬 우선 처리","벡터 인터럽트 하드웨어 회로"],answer:0,
   explain:"인터럽트 우선순위 판별은 폴링(소프트웨어), 데이지 체인(하드웨어), 병렬 우선 처리(하드웨어) 방식이 있습니다."},
  {type:"written",q:"CPU 내부에서 '다음에 실행할 명령어의 주소'를 기억하는 레지스터는?",kind:"mc",
   options:["프로그램 카운터(PC)","명령 레지스터(IR)","메모리 버퍼 레지스터(MBR)","누산기(Accumulator)"],answer:0,
   explain:"프로그램 카운터(PC)는 다음에 실행할 명령어를 기억합니다. IR은 현재 실행 중인 명령어, MBR은 기억장치를 출입하는 데이터를 일시 저장, 누산기는 연산 결과를 일시 저장합니다."},
  {type:"written",q:"스풀링(Spooling)에 대한 설명으로 옳은 것은?",kind:"mc",
   options:["보조기억장치를 이용하며 다중 작업에 사용된다.","주기억장치를 이용하며 단일 작업에 사용된다.","CPU의 속도를 높이기 위한 방식이다.","명령어를 해독하는 기능을 한다."],answer:0,
   explain:"버퍼링은 주기억장치를 사용하는 단일 작업 방식이고, 스풀링은 보조기억장치(디스크)를 사용하는 다중 작업 방식입니다. 둘 다 입출력장치와 CPU의 속도 차이를 해결합니다."},
  {type:"written",q:"JK 플립플롭에서 J=1, K=1이 입력될 때의 동작은?",kind:"mc",
   options:["보수(토글, 반전)","무변화","0으로 리셋(Clear)","1로 세트(Set)"],answer:0,
   explain:"JK FF는 (0,0) 무변화, (0,1) 0, (1,0) 1, (1,1) 보수(반전)입니다. RS FF의 불능 상태를 개선한 가장 널리 쓰이는 FF입니다."},
  {type:"written",q:"해밍 코드(Hamming Code)에 대한 설명으로 옳은 것은?",kind:"mc",
   options:["스스로 오류를 검출하고 1비트 오류를 교정할 수 있다.","오류 검출만 가능하고 교정은 불가능하다.","연속된 두 코드가 1비트만 다른 코드이다.","정마크 방식으로 오류를 검출한다."],answer:0,
   explain:"해밍 코드는 오류를 스스로 검출·교정할 수 있는 코드입니다(2비트 오류 검출, 1비트 오류 교정). ③은 그레이 코드, ④는 2-out-of-5 코드의 설명입니다."},
  {type:"written",q:"데이터베이스에서 하나의 속성이 가질 수 있는 값의 범위(집합)를 의미하는 것은?",kind:"mc",
   options:["도메인(Domain)","차수(Degree)","기수(Cardinality)","스키마(Schema)"],answer:0,
   explain:"도메인은 하나의 속성에서 나타낼 수 있는 값의 범위입니다. 차수는 속성의 개수, 기수는 튜플의 개수입니다."},
  {type:"written",q:"릴레이션에서 속성(Attribute)의 개수를 나타내는 용어는?",kind:"mc",
   options:["차수(Degree)","기수(Cardinality)","도메인(Domain)","튜플(Tuple)"],answer:0,
   explain:"차수(Degree)는 속성의 개수, 기수(Cardinality)는 튜플의 개수입니다."},
  {type:"written",q:"시간 조각(Time Slice)을 미리 정해 각 프로세스에 CPU를 번갈아 할당하는 선점형 스케줄링 기법은?",kind:"mc",
   options:["RR(Round Robin)","FIFO","SJF","SRT"],answer:0,
   explain:"RR은 시간 조각(Slice)을 정의하여 각 프로세스에 CPU를 제공하는 선점 방식입니다. FIFO는 비선점, SRT는 남은 실행 시간이 짧은 프로세스에 할당하는 선점 방식입니다."},
  {type:"written",q:"UNIX에서 앞 명령어의 출력을 뒤 명령어의 입력으로 연결해 주는 기능은?",kind:"mc",
   options:["파이프(pipe)","포크(fork)","쉘(shell)","커널(kernel)"],answer:0,
   explain:"pipe는 앞 명령어의 출력을 뒤 명령어의 입력으로 연결합니다. fork는 새로운 프로세스를 생성하는 시스템 호출입니다."},
  {type:"written",q:"DOS 부팅 시 가장 먼저 읽혀 실행되는 파일은?",kind:"mc",
   options:["IO.SYS","MSDOS.SYS","COMMAND.COM","AUTOEXEC.BAT"],answer:0,
   explain:"DOS 부팅 순서는 IO.SYS → MSDOS.SYS → CONFIG.SYS → COMMAND.COM → AUTOEXEC.BAT 입니다."},
  {type:"written",q:"BSC 프로토콜의 전송 제어 문자 중 '본문(텍스트)의 종료'를 나타내며 최종 블록에 들어가는 문자는?",kind:"mc",
   options:["ETX","STX","SOH","EOT"],answer:0,
   explain:"STX는 본문 시작, ETX는 본문 종료, SOH는 헤더 시작, EOT는 전송 종료를 의미합니다."},
  {type:"practical",q:"[실기 단답형] IPv6 주소는 총 몇 비트로 구성되는지 숫자만 쓰시오.",kind:"short",
   accept:["128","128비트","128bit"],answerDisplay:"128비트",
   explain:"IPv6는 16비트씩 8부분으로 구성되어 16×8 = 128비트입니다. (IPv4는 8비트×4 = 32비트)"},
  {type:"practical",q:"[실기 단답형] 그레이 코드 1101을 2진수로 변환한 값을 쓰시오.",kind:"short",
   accept:["1001"],answerDisplay:"1001",
   explain:"첫 비트는 그대로 1. 이후 이전 결과와 XOR: 1⊕1=0, 0⊕0=0, 0⊕1=1 → 1001 입니다."},
  {type:"practical",q:"[실기 단답형] 8위상 변조(3비트)로 데이터 신호 속도가 9600bps일 때, 변조 속도(Baud)를 구하시오. (숫자만)",kind:"short",
   accept:["3200","3,200"],answerDisplay:"3200Baud",
   explain:"변조 속도 = 신호 속도 ÷ 변조 시 상태 변화 비트 수 = 9600 ÷ 3 = 3200 Baud 입니다."},
  {type:"practical",q:"[실기 단답형] '사원' 테이블에서 '부서' 속성을 중복 없이 검색하는 SQL문을 작성하시오.",kind:"short",
   accept:["SELECT DISTINCT 부서 FROM 사원"],answerDisplay:"SELECT DISTINCT 부서 FROM 사원;",
   explain:"SELECT DISTINCT는 중복되지 않게 검색합니다. 형식: SELECT DISTINCT 속성명 FROM 테이블명."}
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>

</body>
</html>
