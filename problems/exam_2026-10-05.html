<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-10-05 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    "type": "written",
    "q": "다음에 실행할 명령어의 주소를 기억하고 있는 CPU 내부 레지스터는?",
    "kind": "mc",
    "options": [
      "명령 레지스터(IR)",
      "프로그램 카운터(PC)",
      "메모리 버퍼 레지스터(MBR)",
      "누산기(Accumulator)"
    ],
    "answer": 1,
    "explain": "프로그램 카운터(PC)는 다음에 실행할 명령어의 주소를 기억합니다. IR은 현재 실행 중인 명령어, MBR은 기억장치를 출입하는 데이터를 일시 저장, 누산기는 연산 결과를 일시 저장합니다."
  },
  {
    "type": "written",
    "q": "JK 플립플롭에서 J=1, K=1을 입력했을 때의 출력 상태는?",
    "kind": "mc",
    "options": [
      "변화 없음",
      "0 (Reset)",
      "1 (Set)",
      "보수(반전)"
    ],
    "answer": 3,
    "explain": "JK 플립플롭은 (0,0) 무변화, (0,1) 0, (1,0) 1, (1,1) 보수(토글)로 동작합니다. 가장 널리 사용되는 플립플롭입니다."
  },
  {
    "type": "written",
    "q": "주소 부분에 실제 데이터 주소 대신 자료(데이터) 자체를 직접 저장하는 주소 지정 방식은?",
    "kind": "mc",
    "options": [
      "직접 주소 지정",
      "간접 주소 지정",
      "즉치(Immediate) 주소 지정",
      "상대 주소 지정"
    ],
    "answer": 2,
    "explain": "즉치(즉시, Immediate) 주소 지정은 주소 대신 자료를 직접 저장합니다. 직접은 실제 데이터의 절대 주소, 간접은 데이터 주소를 가진 포인터의 주소, 상대는 PC + Operand를 사용합니다."
  },
  {
    "type": "written",
    "q": "연산 후에도 입력 자료가 보존되며, 범용 레지스터(GPR)를 가진 컴퓨터에서 사용하는 명령어 형식은?",
    "kind": "mc",
    "options": [
      "0 주소 명령어",
      "1 주소 명령어",
      "2 주소 명령어",
      "3 주소 명령어"
    ],
    "answer": 3,
    "explain": "3 주소 명령어는 연산 후 입력 자료가 보존됩니다. 2 주소 명령어는 결과를 Operand1에 저장하여 원래 자료가 파괴되고, 1 주소는 누산기, 0 주소는 스택을 이용합니다."
  },
  {
    "type": "written",
    "q": "인터럽트의 우선순위 판별 방법 중 소프트웨어적인 방법은?",
    "kind": "mc",
    "options": [
      "폴링(Polling)",
      "데이지 체인(Daisy Chain)",
      "병렬 우선 처리",
      "하드웨어 인터럽트 벡터"
    ],
    "answer": 0,
    "explain": "인터럽트 우선순위 판별 방법 중 폴링은 소프트웨어 방식이고, 데이지 체인과 병렬 우선 처리는 하드웨어 방식입니다."
  },
  {
    "type": "written",
    "q": "입출력장치와 CPU 간의 속도 차이를 해결하기 위한 방법으로, 보조기억장치를 이용하며 다중 작업에 사용되는 것은?",
    "kind": "mc",
    "options": [
      "버퍼링(Buffering)",
      "스풀링(Spooling)",
      "블로킹(Blocking)",
      "페이징(Paging)"
    ],
    "answer": 1,
    "explain": "스풀링은 보조기억장치를 사용하여 다중 작업이 가능하고, 버퍼링은 주기억장치를 사용하며 단일 작업에 사용됩니다."
  },
  {
    "type": "written",
    "q": "관계형 데이터베이스에서 릴레이션(테이블)의 속성(Attribute)의 개수를 나타내는 용어는?",
    "kind": "mc",
    "options": [
      "차수(Degree)",
      "기수(Cardinality)",
      "도메인(Domain)",
      "스키마(Schema)"
    ],
    "answer": 0,
    "explain": "차수(Degree)는 속성의 개수, 기수(Cardinality)는 튜플의 개수입니다. 도메인은 하나의 속성이 가질 수 있는 값의 범위입니다."
  },
  {
    "type": "written",
    "q": "SQL의 DROP 문에서 제거할 요소를 참조하는 다른 개체까지 함께 제거하는 옵션은?",
    "kind": "mc",
    "options": [
      "RESTRICT",
      "CASCADE",
      "DISTINCT",
      "GRANT"
    ],
    "answer": 1,
    "explain": "DROP CASCADE는 제거할 요소를 참조하는 다른 개체도 함께 제거합니다. RESTRICT는 참조 중이면 제거하지 않습니다."
  },
  {
    "type": "written",
    "q": "프로세스 스케줄링에서 준비(Ready) 상태의 프로세스 중 우선순위가 가장 높은 프로세스가 CPU를 할당받아 실행 상태로 전이되는 것을 무엇이라 하는가?",
    "kind": "mc",
    "options": [
      "디스패치(Dispatch)",
      "웨이크업(Wake-up)",
      "블록(Block)",
      "타임아웃(Timeout)"
    ],
    "answer": 0,
    "explain": "디스패치(Dispatch)는 준비 상태의 프로세스 중 우선순위가 가장 높은 프로세스가 CPU를 할당받아 실행 상태로 바뀌는 것입니다."
  },
  {
    "type": "written",
    "q": "MS-DOS의 외부 명령어에 해당하는 것은?",
    "kind": "mc",
    "options": [
      "DIR",
      "COPY",
      "FORMAT",
      "TYPE"
    ],
    "answer": 2,
    "explain": "FORMAT은 외부 명령어입니다. DIR, COPY, TYPE은 COMMAND.COM에서 처리하는 내부 명령어입니다."
  },
  {
    "type": "written",
    "q": "UNIX에서 파일 소유자는 수정 권한을 유지하고, 그룹과 기타 사용자의 쓰기 권한을 취소하는 명령은?",
    "kind": "mc",
    "options": [
      "chmod go-w 파일명",
      "chmod u-w 파일명",
      "chmod go+w 파일명",
      "chmod a+w 파일명"
    ],
    "answer": 0,
    "explain": "chmod의 g는 그룹, o는 기타 사용자이며 '-w'는 쓰기 권한 취소입니다. 따라서 chmod go-w 파일명 은 그룹·기타 사용자의 쓰기 권한을 취소합니다."
  },
  {
    "type": "practical",
    "q": "[실기 단답형] 2진수 11010110을 16진수로 변환한 값을 쓰시오.",
    "kind": "short",
    "accept": [
      "D6"
    ],
    "answerDisplay": "D6",
    "explain": "2진수를 4자리씩 묶으면 1101(=D)과 0110(=6)이므로 D6(16)입니다."
  },
  {
    "type": "practical",
    "q": "[실기 단답형] '사원' 테이블에서 '부서'가 '영업'인 튜플을 모두 삭제하는 SQL문을 작성하시오.",
    "kind": "short",
    "accept": [
      "DELETE FROM 사원 WHERE 부서='영업'",
      "DELETE FROM 사원 WHERE 부서 = '영업'",
      "DELETE FROM 사원 WHERE 부서=\"영업\"",
      "DELETE FROM 사원 WHERE 부서 = \"영업\""
    ],
    "answerDisplay": "DELETE FROM 사원 WHERE 부서='영업';",
    "explain": "DELETE 문은 'DELETE FROM 테이블명 WHERE 조건' 형식입니다. WHERE 절이 없으면 모든 튜플이 삭제되므로 주의해야 합니다."
  },
  {
    "type": "practical",
    "q": "[실기 단답형] 3비트(트리비트)씩 변조하여 1,200Baud의 속도로 전송할 때 데이터 신호 속도(bps)를 구하시오. (단위 없이 숫자만)",
    "kind": "short",
    "accept": [
      "3600",
      "3,600"
    ],
    "answerDisplay": "3600bps",
    "explain": "신호 속도(bps) = 변조 속도(Baud) × 상태 변화 비트 수 = 1,200 × 3 = 3,600bps입니다."
  },
  {
    "type": "practical",
    "q": "[실기 단답형] 6장의 디스크로 구성된 디스크 팩에서 사용 가능한 기록면의 수를 구하시오. (단위 없이 숫자만)",
    "kind": "short",
    "accept": [
      "10"
    ],
    "answerDisplay": "10",
    "explain": "디스크 팩의 기록면 수는 (디스크 수 × 2) − 2이며, 맨 위와 맨 아래 면은 기록에 사용하지 않습니다. 따라서 (6×2) − 2 = 10입니다."
  }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>
