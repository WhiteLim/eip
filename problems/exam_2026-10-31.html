<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-10-31 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {type:"written",q:"인터럽트의 우선순위 판별 방식 중 소프트웨어적으로 처리하는 방식은?",kind:"mc",
   options:["폴링(Polling)","데이지 체인(Daisy Chain)","병렬 우선 처리","DMA"],answer:0,
   explain:"우선순위 판별은 폴링(소프트웨어), 데이지 체인(하드웨어), 병렬 우선 처리(하드웨어)로 구분합니다."},
  {type:"written",q:"스풀링(Spooling)에 대한 설명으로 옳은 것은?",kind:"mc",
   options:["주기억장치를 사용하며 단일 작업에 적합하다.","보조기억장치(디스크)를 사용하며 다중 작업에 적합하다.","CPU 참여 없이 메모리와 입출력장치가 직접 통신한다.","명령어를 해독하여 실행하는 장치이다."],answer:1,
   explain:"버퍼링은 주기억장치·단일 작업, 스풀링은 보조기억장치·다중 작업을 사용해 입출력장치와 CPU의 속도 차이를 해결합니다."},
  {type:"written",q:"JK 플립플롭에서 J=1, K=1을 입력했을 때의 출력 동작은?",kind:"mc",
   options:["무변화","0(Reset)","1(Set)","보수(반전)"],answer:3,
   explain:"JK FF는 (0,0) 무변화, (0,1) 0, (1,0) 1, (1,1) 보수(토글)입니다."},
  {type:"written",q:"시간 조각(Time Slice)을 미리 정의하여 각 프로세스에 일정 시간씩 CPU를 할당하는 선점형 스케줄링 방식은?",kind:"mc",
   options:["FIFO","SRT","RR(Round Robin)","HRN"],answer:2,
   explain:"RR(라운드 로빈)은 시간 조각을 정의해 프로세스마다 CPU를 번갈아 제공하는 선점 방식입니다. FIFO는 비선점, SRT는 남은 시간이 짧은 순입니다."},
  {type:"written",q:"UNIX에서 'chmod go-w 파일명' 명령의 의미는?",kind:"mc",
   options:["소유자의 쓰기 권한을 취소한다.","그룹과 기타 사용자의 쓰기 권한을 취소한다.","그룹과 기타 사용자에게 쓰기 권한을 부여한다.","모든 사용자의 읽기 권한을 취소한다."],answer:1,
   explain:"g는 그룹, o는 기타 사용자, -w는 쓰기 권한 제거이므로 소유자만 수정할 수 있게 됩니다."},
  {type:"written",q:"MS-DOS 부팅에 반드시 필요한 파일이 아닌 것은?",kind:"mc",
   options:["IO.SYS","MSDOS.SYS","COMMAND.COM","CONFIG.SYS"],answer:3,
   explain:"필수 파일은 IO.SYS, MSDOS.SYS, COMMAND.COM이며 루트 디렉터리에 있어야 합니다. CONFIG.SYS는 설정 파일로 필수가 아닙니다."},
  {type:"written",q:"관계형 데이터베이스에서 차수(Degree)가 의미하는 것은?",kind:"mc",
   options:["튜플(Tuple)의 개수","속성(Attribute)의 개수","도메인의 크기","테이블의 개수"],answer:1,
   explain:"차수(Degree)는 속성의 개수, 기수(Cardinality)는 튜플의 개수입니다."},
  {type:"written",q:"SQL 명령어 중 DDL(데이터 정의어)에 해당하지 않는 것은?",kind:"mc",
   options:["CREATE","ALTER","DROP","UPDATE"],answer:3,
   explain:"DDL은 CREATE, ALTER, DROP입니다. UPDATE는 SELECT, INSERT, DELETE와 함께 DML(조작어)입니다."},
  {type:"written",q:"광섬유 케이블의 손실에 해당하지 않는 것은?",kind:"mc",
   options:["접속 손실","산란 손실","흡수 손실","유전체 손실"],answer:3,
   explain:"광섬유의 손실은 접속 손실, 산란 손실, 흡수 손실입니다. 유전체 손실은 해당하지 않습니다."},
  {type:"written",q:"통신 프로토콜의 기본 구성 요소가 아닌 것은?",kind:"mc",
   options:["구문(Syntax)","의미(Semantics)","시간(Timing)","처리(Processing)"],answer:3,
   explain:"프로토콜의 기본 요소는 구문, 의미, 시간입니다."},
  {type:"written",q:"IP 주소 198.0.46.201이 속하는 클래스와 기본 서브넷 마스크로 옳은 것은?",kind:"mc",
   options:["Class A, 255.0.0.0","Class B, 255.255.0.0","Class C, 255.255.255.0","Class D, 255.255.255.255"],answer:2,
   explain:"첫 옥텟이 192~223이면 Class C이며 기본 마스크는 255.255.255.0입니다. 198은 이 범위에 속합니다."},
  {type:"practical",q:"[실기 단답형] 2진수 11010110을 10진수로 변환한 값을 쓰시오. (숫자만)",kind:"short",
   accept:["214"],answerDisplay:"214",
   explain:"128+64+16+4+2 = 214 입니다."},
  {type:"practical",q:"[실기 단답형] '학생' 테이블에서 '학과'가 '컴퓨터'인 학생의 '이름'을 검색하는 SQL문을 작성하시오.",kind:"short",
   accept:["SELECT 이름 FROM 학생 WHERE 학과='컴퓨터'","SELECT 이름 FROM 학생 WHERE 학과 = '컴퓨터'","SELECT 이름 FROM 학생 WHERE 학과=\"컴퓨터\""],
   answerDisplay:"SELECT 이름 FROM 학생 WHERE 학과='컴퓨터';",
   explain:"SELECT 속성 FROM 테이블 WHERE 조건 형식입니다."},
  {type:"practical",q:"[실기 단답형] 신호 속도가 4,800bps이고 4위상(2비트) 변조를 사용할 때, 변조 속도(Baud)를 구하시오. (숫자만)",kind:"short",
   accept:["2400","2,400"],answerDisplay:"2400",
   explain:"변조 속도 = 신호 속도 ÷ 변조 시 상태 변화 비트 수 = 4800 ÷ 2 = 2400 Baud 입니다."},
  {type:"practical",q:"[실기 단답형] 8비트 부호화 2의 보수 방식으로 -5를 표현한 2진수를 쓰시오.",kind:"short",
   accept:["11111011"],answerDisplay:"11111011",
   explain:"5 = 00000101 → 1의 보수 11111010 → +1 = 11111011 입니다."}
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>

</body>
</html>
