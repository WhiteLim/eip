<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-10-13 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {type:"written",q:"드모르강(De Morgan) 법칙으로 옳은 것은?",kind:"mc",
   options:["(A+B)' = A'·B'","(A+B)' = A'+B'","(A·B)' = A'·B'","(A·B)' = A·B"],answer:0,
   explain:"드모르강 법칙은 (A+B)' = A'·B', (A·B)' = A'+B' 입니다. 즉 합의 부정은 각각의 부정의 곱, 곱의 부정은 각각의 부정의 합과 같습니다."},
  {type:"written",q:"JK 플립플롭에서 J=1, K=1이 입력되었을 때의 동작은?",kind:"mc",
   options:["무변화","리셋(0)","셋(1)","보수(토글)"],answer:3,
   explain:"JK 플립플롭은 (0,0)=무변화, (0,1)=0, (1,0)=1, (1,1)=보수(반전) 동작을 합니다. RS 플립플롭의 불확정 상태를 개선한 것입니다."},
  {type:"written",q:"명령어 실행 중 '현재 실행 중인 명령어'를 기억하는 레지스터는?",kind:"mc",
   options:["프로그램 카운터(PC)","명령 레지스터(IR)","누산기(Accumulator)","메모리 버퍼 레지스터(MBR)"],answer:1,
   explain:"명령 레지스터(IR)는 현재 실행 중인 명령어를 기억합니다. 프로그램 카운터(PC)는 다음에 실행할 명령어의 주소를 기억합니다."},
  {type:"written",q:"기억장치에 있는 실제 데이터의 주소를 가진 포인터(주소)를 저장하는 주소지정 방식은?",kind:"mc",
   options:["즉치(Immediate) 주소지정","직접(Direct) 주소지정","간접(Indirect) 주소지정","상대(Relative) 주소지정"],answer:2,
   explain:"간접 주소지정은 명령어의 주소 부분에 실제 데이터가 저장된 곳의 주소를 가진 포인터(주소)를 저장합니다. 직접 방식은 실제 데이터의 절대 주소를 저장합니다."},
  {type:"written",q:"다음 중 CPU와 입출력장치 간의 속도 차이를 해결하는 방법으로, 보조기억장치를 사용하며 다중 작업에 적합한 것은?",kind:"mc",
   options:["버퍼링(Buffering)","스풀링(Spooling)","블로킹(Blocking)","매핑(Mapping)"],answer:1,
   explain:"버퍼링은 주기억장치를 사용하는 단일 작업 방식이고, 스풀링은 보조기억장치(디스크)를 사용하는 다중 작업 방식입니다."},
  {type:"written",q:"데이터베이스 테이블에서 튜플(Tuple)의 개수를 의미하는 용어는?",kind:"mc",
   options:["차수(Degree)","기수(Cardinality)","도메인(Domain)","스키마(Schema)"],answer:1,
   explain:"기수(Cardinality)는 튜플(행)의 개수, 차수(Degree)는 속성(열)의 개수입니다. 도메인은 하나의 속성이 가질 수 있는 값의 범위입니다."},
  {type:"written",q:"SQL에서 중복된 튜플을 제거하고 검색할 때 SELECT 뒤에 사용하는 키워드는?",kind:"mc",
   options:["UNIQUE","DISTINCT","GROUP","ONLY"],answer:1,
   explain:"SELECT DISTINCT 는 중복되는 튜플을 제거하고 한 번씩만 검색합니다."},
  {type:"written",q:"CPU 스케줄링 기법 중 비선점(Non-preemptive) 방식에 해당하는 것은?",kind:"mc",
   options:["SRT","RR(Round Robin)","FIFO","다단계 피드백 큐"],answer:2,
   explain:"FIFO(FCFS)는 먼저 CPU를 요청한 프로세스에 먼저 할당하는 비선점 방식입니다. SRT, RR, 다단계 피드백 큐는 선점 방식입니다."},
  {type:"written",q:"UNIX에서 파일의 그룹(g)과 기타 사용자(o)의 쓰기 권한을 취소하는 명령은?",kind:"mc",
   options:["chmod go-w 파일명","chmod u-w 파일명","chmod go+w 파일명","chmod a+x 파일명"],answer:0,
   explain:"chmod 의 g는 그룹, o는 기타 사용자를 뜻하며 '-w'는 쓰기 권한 제거입니다. 따라서 chmod go-w 파일명 은 그룹과 기타 사용자의 쓰기 권한을 취소합니다."},
  {type:"written",q:"PCM(펄스 코드 변조)의 송신 측 처리 순서로 옳은 것은?",kind:"mc",
   options:["표본화 → 양자화 → 부호화","양자화 → 표본화 → 부호화","부호화 → 양자화 → 표본화","표본화 → 부호화 → 양자화"],answer:0,
   explain:"PCM 송신 측은 표본화(Sampling) → 양자화(Quantizing) → 부호화(Encoding) 순서(표.양.부)이며, 수신 측은 복호화 → 여과화 순서입니다."},
  {type:"written",q:"OSI 7계층 중 경로 배정(Routing)과 네트워크 어드레싱을 담당하는 계층은?",kind:"mc",
   options:["물리 계층","데이터 링크 계층","네트워크 계층","전송 계층"],answer:2,
   explain:"네트워크 계층(3계층)은 경로 배정, 중계, 네트워크 어드레싱을 담당합니다. 데이터 링크 계층은 인접 시스템 간 신뢰성 있는 전송, 전송 계층은 오류 검출과 흐름 제어를 담당합니다."},
  {type:"practical",q:"[실기 단답형] 2진수 1101을 그레이 코드(Gray Code)로 변환한 값을 쓰시오.",kind:"short",
   accept:["1011"],answerDisplay:"1011",
   explain:"첫 번째 비트는 그대로(1), 이후는 앞 비트와 현재 비트를 XOR 합니다. 1⊕1=0, 1⊕0=1, 0⊕1=1 이므로 1011 입니다."},
  {type:"practical",q:"[실기 단답형] '사원' 테이블의 모든 레코드를 '급여' 내림차순으로 검색하는 SQL문을 작성하시오.",kind:"short",
   accept:["SELECT * FROM 사원 ORDER BY 급여 DESC","SELECT * FROM 사원 ORDER BY 급여 DESC;"],answerDisplay:"SELECT * FROM 사원 ORDER BY 급여 DESC;",
   explain:"정렬은 ORDER BY 절을 사용하며 내림차순은 DESC, 오름차순은 ASC(기본값)입니다."},
  {type:"practical",q:"[실기 단답형] 4위상 변조(위상 4개 = 2비트 전송)로 변조 속도가 2,400Baud일 때, 신호 속도(bps)를 구하시오. (단위 없이 숫자만)",kind:"short",
   accept:["4800","4,800"],answerDisplay:"4800bps",
   explain:"신호 속도 = 변조 속도 × 변조 시 상태 변화 비트 수. 4위상 = 2² 이므로 2비트이며 2,400 × 2 = 4,800bps 입니다."},
  {type:"practical",q:"[실기 단답형] IP 주소 198.0.46.201 이 속하는 IP 클래스를 알파벳 한 글자로 쓰시오.",kind:"short",
   accept:["C","Class C","c"],answerDisplay:"C (Class C)",
   explain:"첫 번째 옥텟이 192~223이면 Class C 입니다. 198로 시작하므로 Class C이며 기본 서브넷 마스크는 255.255.255.0 입니다."}
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>

</body>
</html>
