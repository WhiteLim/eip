<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-10-24 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    "type": "written",
    "q": "JK 플립플롭에서 J=1, K=1을 동시에 입력했을 때의 출력 동작은?",
    "kind": "mc",
    "options": [
      "이전 상태 유지(불변)",
      "항상 0(Reset)",
      "항상 1(Set)",
      "현재 상태의 보수(반전)"
    ],
    "answer": 3,
    "explain": "JK 플립플롭은 RS 플립플롭의 불확실한 입력(1,1)을 보완한 것으로, J=K=1이면 출력이 현재 상태의 보수(반전)가 됩니다. 가장 널리 사용되는 플립플롭입니다."
  },
  {
    "type": "written",
    "q": "MS-DOS가 부팅될 때 가장 먼저 로드되어 실행되는 파일은?",
    "kind": "mc",
    "options": [
      "COMMAND.COM",
      "CONFIG.SYS",
      "IO.SYS",
      "AUTOEXEC.BAT"
    ],
    "answer": 2,
    "explain": "DOS 부팅 순서는 IO.SYS → MSDOS.SYS → CONFIG.SYS → COMMAND.COM → AUTOEXEC.BAT (I.M.C.C.A) 입니다."
  },
  {
    "type": "written",
    "q": "인터럽트의 우선순위를 판별하는 방법 중 하드웨어 방식에 해당하는 것은?",
    "kind": "mc",
    "options": [
      "폴링(Polling)",
      "데이지 체인(Daisy Chain)",
      "라운드 로빈(Round Robin)",
      "핸드셰이킹(Handshaking)"
    ],
    "answer": 1,
    "explain": "인터럽트 우선순위 판별 방법 중 폴링은 소프트웨어 방식이고, 데이지 체인과 병렬 우선 처리는 하드웨어 방식입니다."
  },
  {
    "type": "written",
    "q": "입출력장치와 CPU 간의 속도 차이를 해결하기 위한 방법 중, 보조기억장치를 버퍼로 사용하며 다중 작업에 적합한 방식은?",
    "kind": "mc",
    "options": [
      "버퍼링(Buffering)",
      "스풀링(Spooling)",
      "매핑(Mapping)",
      "인터리빙(Interleaving)"
    ],
    "answer": 1,
    "explain": "버퍼링은 주기억장치를 사용하는 단일 작업 방식이고, 스풀링은 보조기억장치(디스크)를 사용하는 다중 작업 방식입니다."
  },
  {
    "type": "written",
    "q": "프로세스 스케줄링 기법 중 시간 조각(Time Slice)을 미리 정의하여 각 프로세스에 CPU를 순서대로 할당하는 선점형 방식은?",
    "kind": "mc",
    "options": [
      "FIFO",
      "SJF",
      "RR(Round Robin)",
      "HRN"
    ],
    "answer": 2,
    "explain": "RR(Round Robin)은 시간 조각을 정해 각 프로세스에 번갈아 CPU를 할당하는 선점형 방식으로 시분할 시스템에 적합합니다. FIFO는 도착 순서대로 처리하는 비선점 방식입니다."
  },
  {
    "type": "written",
    "q": "UNIX 시스템의 구성 요소 중 명령어 해석기 역할을 하며 Korn, Bourne, C 등의 종류가 있는 것은?",
    "kind": "mc",
    "options": [
      "커널(Kernel)",
      "쉘(Shell)",
      "유틸리티(Utility)",
      "파일 시스템(UFS)"
    ],
    "answer": 1,
    "explain": "쉘(Shell)은 사용자의 명령어를 해석하여 커널에 전달하는 명령어 해석기이며 Korn Shell, Bourne Shell, C Shell 등이 있습니다(K.B.C)."
  },
  {
    "type": "written",
    "q": "OSI 7계층 중 경로 배정(Routing), 중계, 네트워크 어드레싱을 담당하는 계층은?",
    "kind": "mc",
    "options": [
      "물리 계층",
      "데이터 링크 계층",
      "네트워크 계층",
      "전송 계층"
    ],
    "answer": 2,
    "explain": "네트워크 계층(3계층)은 경로 배정, 중계, 네트워크 주소 지정을 담당합니다. 전송 계층은 오류 검출·흐름 제어·혼잡 제어를 담당합니다."
  },
  {
    "type": "written",
    "q": "통신 프로토콜의 기본 요소에 해당하지 않는 것은?",
    "kind": "mc",
    "options": [
      "구문(Syntax)",
      "의미(Semantics)",
      "시간(Timing)",
      "처리(Processing)"
    ],
    "answer": 3,
    "explain": "프로토콜의 기본 요소는 구문(Syntax), 의미(Semantics), 시간(Timing) 입니다. 처리는 기본 요소가 아닙니다."
  },
  {
    "type": "written",
    "q": "UNIX에서 파일의 그룹(g)과 기타 사용자(o)의 쓰기 권한을 취소하여 소유자만 수정할 수 있게 하는 명령은?",
    "kind": "mc",
    "options": [
      "chmod go-w 파일명",
      "chmod go+w 파일명",
      "chmod u-w 파일명",
      "chmod a+w 파일명"
    ],
    "answer": 0,
    "explain": "chmod go-w 파일명은 그룹(g)과 기타(o) 사용자의 쓰기(w) 권한을 제거(-)하여 소유자만 수정할 수 있게 합니다."
  },
  {
    "type": "written",
    "q": "IPv6 주소에 대한 설명으로 옳은 것은?",
    "kind": "mc",
    "options": [
      "32비트를 8비트씩 4부분으로 나눈다.",
      "128비트를 16비트씩 8부분으로 나눈다.",
      "64비트를 16비트씩 4부분으로 나눈다.",
      "Broadcast 방식만 지원한다."
    ],
    "answer": 1,
    "explain": "IPv4는 8비트×4부분=32비트, IPv6는 16비트×8부분=128비트로 구성됩니다."
  },
  {
    "type": "written",
    "q": "패킷 교환망에서 패킷형 단말(DTE)과 데이터 회선 종단 장치(DCE) 간의 접속 규격으로 사용되는 것은?",
    "kind": "mc",
    "options": [
      "X.21",
      "X.25",
      "X.75",
      "RS-232C"
    ],
    "answer": 1,
    "explain": "X.25는 패킷 전송을 위한 DTE/DCE 접속 규격입니다. X.75는 서로 다른 패킷 교환망 간의 상호 연결 표준입니다."
  },
  {
    "type": "practical",
    "q": "[실기 단답형] 8진수 725를 16진수로 변환한 값을 쓰시오.",
    "kind": "short",
    "accept": [
      "1D5"
    ],
    "answerDisplay": "1D5",
    "explain": "8진수 725를 2진수로 변환하면 111 010 101 입니다. 이를 오른쪽부터 4자리씩 묶으면 0001 1101 0101 이므로 16진수로 1D5 입니다."
  },
  {
    "type": "practical",
    "q": "[실기 단답형] '학생' 테이블에서 '학과' 속성을 중복 없이 검색하는 SQL문을 작성하시오.",
    "kind": "short",
    "accept": [
      "SELECT DISTINCT 학과 FROM 학생"
    ],
    "answerDisplay": "SELECT DISTINCT 학과 FROM 학생;",
    "explain": "SELECT DISTINCT는 검색 결과에서 중복된 튜플을 제거하고 한 번씩만 출력합니다."
  },
  {
    "type": "practical",
    "q": "[실기 단답형] 디스크 팩이 6장일 때, 사용 가능한 기록면의 수를 구하시오. (단위 없이 숫자만)",
    "kind": "short",
    "accept": [
      "10"
    ],
    "answerDisplay": "10",
    "explain": "디스크 팩의 기록면 수 = (디스크 수 × 2) − 2 입니다(맨 위·맨 아래 면은 기록 불가). 따라서 6×2−2 = 10 입니다."
  },
  {
    "type": "practical",
    "q": "[실기 단답형] 4위상(2비트) 변조 방식으로 신호 속도 9,600bps를 전송할 때, 변조 속도(Baud)를 구하시오. (단위 없이 숫자만)",
    "kind": "short",
    "accept": [
      "4800",
      "4,800"
    ],
    "answerDisplay": "4800Baud",
    "explain": "변조 속도 = 신호 속도 ÷ 변조 시 상태 변화 비트 수 입니다. 4위상은 2비트이므로 9,600 ÷ 2 = 4,800Baud 입니다."
  }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>
