<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-11-26 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    type:"written",
    q:"CPU 제어장치의 레지스터 중, 다음에 실행할 명령어의 주소를 기억하는 레지스터는?",
    kind:"mc",
    options:["명령 레지스터(IR)","메모리 버퍼 레지스터(MBR)","프로그램 카운터(PC)","누산기(Accumulator)"],
    answer:2,
    explain:"프로그램 카운터(PC)는 다음에 실행할 명령어의 주소를 기억합니다. IR은 현재 실행 중인 명령어, MBR은 기억장치를 출입하는 데이터를 일시 저장하며, 누산기는 연산장치에서 연산 결과를 일시적으로 저장합니다."
  },
  {
    type:"written",
    q:"JK 플립플롭에서 입력 J=1, K=1일 때의 동작으로 옳은 것은?",
    kind:"mc",
    options:["변화 없음(무)","출력이 0으로 클리어(공)","출력이 1로 세트(일)","이전 상태의 보수로 반전(보)"],
    answer:3,
    explain:"JK 플립플롭은 (0,0) 무변화 / (0,1) 공(0) / (1,0) 일(1) / (1,1) 보수(반전)로 동작합니다. RS 플립플롭에서 금지(불)였던 (1,1) 입력을 보수로 개선한 것으로, 가장 널리 사용되는 플립플롭입니다."
  },
  {
    type:"written",
    q:"2ⁿ개의 입력선 중 하나를 선택하여 한 개의 출력선으로 내보내는 조합논리회로는?",
    kind:"mc",
    options:["디코더(Decoder)","인코더(Encoder)","멀티플렉서(MUX)","디멀티플렉서(DeMUX)"],
    answer:2,
    explain:"멀티플렉서(MUX)는 2ⁿ개의 입력 중 1개를 선택하여 한 곳으로 출력합니다. 반대로 디멀티플렉서(DeMUX)는 1개의 입력을 2ⁿ개의 출력선 중 하나로 내보냅니다."
  },
  {
    type:"written",
    q:"오류를 스스로 검출하고 교정까지 할 수 있는 코드로, 2비트 오류 검출과 1비트 오류 교정이 가능한 것은?",
    kind:"mc",
    options:["패리티 검사 코드","해밍(Hamming) 코드","BCD 코드","2-out-of-5 코드"],
    answer:1,
    explain:"해밍 코드는 오류를 스스로 검출·교정할 수 있는 코드로, 2비트 오류 검출과 1비트 오류 교정이 가능합니다. 패리티 검사 코드는 1비트 오류의 '검출'만 가능하고 교정은 할 수 없습니다."
  },
  {
    type:"written",
    q:"10진수 -5를 8비트 부호화 2의 보수 방식으로 표현한 것은?",
    kind:"mc",
    options:["10000101","11111010","11111011","11111100"],
    answer:2,
    explain:"+5 = 00000101 → 1의 보수 11111010 → 여기에 1을 더한 2의 보수는 11111011입니다. 10000101은 부호화 절대치, 11111010은 부호화 1의 보수 표현입니다."
  },
  {
    type:"written",
    q:"프로그램 카운터(PC)의 값과 명령어의 주소 부분(Operand)을 더해서 유효 주소를 결정하는 주소지정 방식은?",
    kind:"mc",
    options:["직접(Direct) 주소지정","간접(Indirect) 주소지정","상대(Relative) 주소지정","즉시(Immediate) 주소지정"],
    answer:2,
    explain:"상대 주소지정 방식은 PC + 주소 부분으로 유효 주소를 구합니다. 직접은 실제 데이터의 주소를, 간접은 실제 데이터 주소를 가진 포인터의 주소를, 즉시는 주소 대신 자료 자체를 저장합니다."
  },
  {
    type:"written",
    q:"스풀링(Spooling)에 대한 설명으로 옳은 것은?",
    kind:"mc",
    options:[
      "주기억장치의 일부를 버퍼로 사용한다.",
      "단일 작업 환경에서만 사용된다.",
      "디스크 같은 보조기억장치를 버퍼처럼 사용하며 다중 작업에 적합하다.",
      "CPU의 연산 속도를 높이기 위한 하드웨어 장치이다."
    ],
    answer:2,
    explain:"버퍼링과 스풀링은 모두 입출력장치와 CPU 간 속도 차이를 해결하는 방법입니다. 버퍼링은 주기억장치를 쓰는 단일 작업 방식, 스풀링은 보조기억장치를 쓰는 다중 작업 방식입니다."
  },
  {
    type:"written",
    q:"시간 할당량(Time Slice)을 미리 정해 두고 각 프로세스에 차례대로 CPU를 할당하는 선점형 스케줄링 기법은?",
    kind:"mc",
    options:["FIFO","RR(Round Robin)","SJF","HRN"],
    answer:1,
    explain:"RR(Round Robin)은 시간 조각(Slice)을 정해 각 프로세스에 CPU를 돌아가며 할당하는 선점형 기법입니다. 할당 시간 안에 끝나지 않으면 준비 큐의 맨 뒤로 이동합니다. FIFO, SJF, HRN은 비선점형입니다."
  },
  {
    type:"written",
    q:"MS-DOS의 부팅 과정에서 시스템 파일이 실행되는 순서로 옳은 것은?",
    kind:"mc",
    options:[
      "IO.SYS → MSDOS.SYS → CONFIG.SYS → COMMAND.COM → AUTOEXEC.BAT",
      "MSDOS.SYS → IO.SYS → COMMAND.COM → CONFIG.SYS → AUTOEXEC.BAT",
      "IO.SYS → MSDOS.SYS → COMMAND.COM → AUTOEXEC.BAT → CONFIG.SYS",
      "CONFIG.SYS → IO.SYS → MSDOS.SYS → AUTOEXEC.BAT → COMMAND.COM"
    ],
    answer:0,
    explain:"DOS 부팅 순서는 IO.SYS → MSDOS.SYS → CONFIG.SYS → COMMAND.COM → AUTOEXEC.BAT (I.M.C.C.A)입니다. 이 중 필수 파일은 IO.SYS, MSDOS.SYS, COMMAND.COM 세 개입니다."
  },
  {
    type:"written",
    q:"통신 프로토콜의 기본 구성 요소에 해당하지 않는 것은?",
    kind:"mc",
    options:["구문(Syntax)","의미(Semantics)","시간(Timing)","처리(Process)"],
    answer:3,
    explain:"프로토콜의 기본 요소는 구문(Syntax), 의미(Semantics), 시간(Timing) 3가지입니다. '처리'는 기본 요소가 아니어서 자주 나오는 오답 선택지입니다."
  },
  {
    type:"written",
    q:"펄스 코드 변조(PCM) 송신 측의 처리 순서로 옳은 것은?",
    kind:"mc",
    options:[
      "양자화 → 표본화 → 부호화",
      "표본화 → 양자화 → 부호화",
      "표본화 → 부호화 → 양자화",
      "부호화 → 양자화 → 복호화"
    ],
    answer:1,
    explain:"PCM 송신 측은 표본화(Sampling) → 양자화(Quantizing) → 부호화(Encoding) 순서로 진행합니다(표.양.부). 수신 측은 복호화(Decoding) → 여과화(Filtering) 순서입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 그레이 코드(Gray Code) 1101을 2진수로 변환한 값을 쓰시오.",
    kind:"short",
    accept:["1001"],
    answerDisplay:"1001",
    explain:"Gray → 2진수 변환: 첫 비트는 그대로 쓰고, 두 번째 비트부터는 '바로 앞의 결과 비트'와 XOR합니다. 1 → 1⊕1=0 → 0⊕0=0 → 0⊕1=1 이므로 결과는 1001입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] '학생' 테이블에서 '학년'이 3인 학생의 '이름'을 중복 없이 검색하는 SQL문을 작성하시오.",
    kind:"short",
    accept:["SELECT DISTINCT 이름 FROM 학생 WHERE 학년=3","SELECT DISTINCT 이름 FROM 학생 WHERE 학년='3'"],
    answerDisplay:"SELECT DISTINCT 이름 FROM 학생 WHERE 학년 = 3;",
    explain:"중복을 제거하고 검색할 때는 SELECT 뒤에 DISTINCT를 씁니다. 형식은 'SELECT DISTINCT 속성 FROM 테이블 WHERE 조건'입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 8진수 357을 16진수로 변환한 값을 쓰시오.",
    kind:"short",
    accept:["EF"],
    answerDisplay:"EF",
    explain:"8진수와 16진수는 2진수를 거쳐 변환합니다. 3=011, 5=101, 7=111 → 011101111 → 4자리씩 묶으면 1110 1111 → E F. 따라서 357(8) = EF(16)입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 속성(Attribute) 5개와 튜플(Tuple) 8개로 구성된 릴레이션이 있다. 이 릴레이션의 차수(Degree)를 쓰시오. (숫자만)",
    kind:"short",
    accept:["5"],
    answerDisplay:"5",
    explain:"차수(Degree)는 속성(Attribute)의 개수, 기수(Cardinality)는 튜플(Tuple)의 개수입니다. 따라서 차수는 5, 기수는 8입니다."
  }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/[;；]+$/,'').replace(/["“”‘’]/g,"'").replace(/\s+/g,'');
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>

</body>
</html>
