<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-10-04 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    "type": "written",
    "kind": "mc",
    "q": "다음에 실행할 명령어의 주소를 기억하고 있는 제어장치의 레지스터는?",
    "options": [
      "명령 레지스터(IR)",
      "프로그램 카운터(PC)",
      "메모리 버퍼 레지스터(MBR)",
      "누산기(Accumulator)"
    ],
    "answer": 1,
    "explain": "프로그램 카운터(PC)는 다음에 실행할 명령어의 주소를 기억합니다. IR은 현재 실행 중인 명령어, MBR은 기억장치를 출입하는 데이터를 일시 저장, 누산기는 연산 결과를 일시 저장합니다."
  },
  {
    "type": "written",
    "kind": "mc",
    "q": "반가산기(HA)에서 자리올림수(Carry) C를 구하는 논리식은?",
    "options": [
      "C = A ⊕ B",
      "C = A · B",
      "C = A + B",
      "C = A ⊕ B ⊕ Ci"
    ],
    "answer": 1,
    "explain": "반가산기의 합(S)은 A⊕B(XOR), 자리올림수(C)는 A·B(AND)입니다."
  },
  {
    "type": "written",
    "kind": "mc",
    "q": "JK 플립플롭에서 J=1, K=1이 입력되면 출력 상태는?",
    "options": [
      "변화 없음(무변화)",
      "0(Reset)",
      "1(Set)",
      "보수(반전)"
    ],
    "answer": 3,
    "explain": "JK 플립플롭은 (0,0) 무변화, (0,1) 0, (1,0) 1, (1,1) 보수(토글)로 동작합니다. 가장 널리 사용되는 플립플롭입니다."
  },
  {
    "type": "written",
    "kind": "mc",
    "q": "오류를 스스로 검출하고 1비트 오류를 교정할 수 있는 코드는?",
    "options": [
      "패리티 검사 코드",
      "그레이 코드",
      "해밍 코드",
      "2-out-of-5 코드"
    ],
    "answer": 2,
    "explain": "해밍 코드는 오류를 스스로 검출하고 교정할 수 있는 코드입니다. 패리티 검사 코드는 1비트 오류의 검출만 가능합니다."
  },
  {
    "type": "written",
    "kind": "mc",
    "q": "인터럽트 우선순위 판별 방법 중 소프트웨어적인 방식은?",
    "options": [
      "폴링(Polling)",
      "데이지 체인(Daisy Chain)",
      "병렬 우선순위 부여",
      "벡터 인터럽트 하드웨어 방식"
    ],
    "answer": 0,
    "explain": "폴링은 소프트웨어적 방식이며, 데이지 체인과 병렬 우선 처리는 하드웨어적 방식입니다."
  },
  {
    "type": "written",
    "kind": "mc",
    "q": "버퍼링(Buffering)과 스풀링(Spooling)에 대한 설명으로 옳은 것은?",
    "options": [
      "버퍼링은 보조기억장치를 사용한다.",
      "스풀링은 주기억장치를 사용하며 단일 작업에 적합하다.",
      "스풀링은 보조기억장치를 사용하며 다중 작업에 적합하다.",
      "두 방식 모두 입출력장치 간 속도 차이와 무관하다."
    ],
    "answer": 2,
    "explain": "버퍼링은 주기억장치를 사용하는 단일 작업 방식, 스풀링은 보조기억장치(디스크)를 사용하는 다중 작업 방식입니다. 둘 다 입출력장치와 CPU 간의 속도 차이를 해결하기 위한 기법입니다."
  },
  {
    "type": "written",
    "kind": "mc",
    "q": "데이터베이스에서 물리적 저장 장치의 저장 구조를 기술하는 스키마는?",
    "options": [
      "외부 스키마",
      "개념 스키마",
      "내부 스키마",
      "논리 스키마"
    ],
    "answer": 2,
    "explain": "스키마는 개념·외부·내부 스키마로 구분하며, 내부 스키마가 물리적 저장 구조를 정의합니다. 외부 스키마는 사용자 관점, 개념 스키마는 전체 DB의 논리적 구조입니다."
  },
  {
    "type": "written",
    "kind": "mc",
    "q": "다음 중 운영체제의 제어 프로그램에 해당하지 않는 것은?",
    "options": [
      "감시 프로그램",
      "작업 제어 프로그램",
      "자료 관리 프로그램",
      "서비스 프로그램"
    ],
    "answer": 3,
    "explain": "제어 프로그램은 감시·작업 제어·자료 관리 프로그램(감.작.데)입니다. 서비스 프로그램은 언어 번역 프로그램과 함께 처리 프로그램에 속합니다."
  },
  {
    "type": "written",
    "kind": "mc",
    "q": "프로세스 상태 전이에서, 준비(Ready) 상태의 프로세스 중 우선순위가 가장 높은 프로세스가 CPU를 할당받아 실행 상태로 바뀌는 것을 무엇이라 하는가?",
    "options": [
      "웨이크업(Wake-up)",
      "블록(Block)",
      "디스패치(Dispatch)",
      "타임 아웃(Time Out)"
    ],
    "answer": 2,
    "explain": "디스패치(Dispatch)는 준비 상태의 프로세스가 CPU를 할당받아 실행 상태로 전이되는 것을 말합니다."
  },
  {
    "type": "written",
    "kind": "mc",
    "q": "DOS에서 삭제된 파일을 복구하는 외부 명령어는?",
    "options": [
      "UNDELETE",
      "SCANDISK",
      "DEFRAG",
      "CHKDSK"
    ],
    "answer": 0,
    "explain": "UNDELETE는 삭제된 파일을 복구하는 외부 명령어입니다. SCANDISK는 미미한 오류 수정, DEFRAG는 단편화 최적화, CHKDSK는 디스크 상태 점검입니다."
  },
  {
    "type": "written",
    "kind": "mc",
    "q": "섀넌(Shannon)의 공식에 따른 통신 용량 증대 방법으로 옳지 않은 것은?",
    "options": [
      "주파수 대역폭을 넓힌다.",
      "신호 세력을 높인다.",
      "잡음 세력을 높인다.",
      "S/N비를 크게 한다."
    ],
    "answer": 2,
    "explain": "통신 용량 C = W·log₂(1+S/N). 대역폭(W)과 신호 세력(S)을 키우고 잡음(N)을 줄여야 용량이 증가합니다. 잡음 증가는 용량을 감소시킵니다."
  },
  {
    "type": "practical",
    "kind": "short",
    "q": "[실기 단답형] 디스크 팩이 6장으로 구성되어 있을 때, 사용 가능한 기록면의 수를 구하시오. (단위 없이 숫자만)",
    "accept": [
      "10"
    ],
    "answerDisplay": "10",
    "explain": "디스크 팩의 기록면 수 = (디스크 수 × 2) − 2 입니다. 맨 위와 맨 아래 면은 기록에 사용하지 못하므로 (6×2)−2 = 10 입니다."
  },
  {
    "type": "practical",
    "kind": "short",
    "q": "[실기 단답형] UNIX에서 '파일명 test.txt'에 대해 그룹(g)과 기타 사용자(o)의 쓰기 권한을 취소하는 명령어를 쓰시오.",
    "accept": [
      "chmod go-w test.txt"
    ],
    "answerDisplay": "chmod go-w test.txt",
    "explain": "chmod는 파일 접근 권한을 변경하는 명령어로, 소유자 u, 그룹 g, 기타 o 에서 g와 o의 쓰기(w) 권한을 제거(-)하려면 'chmod go-w 파일명'을 사용합니다."
  },
  {
    "type": "practical",
    "kind": "short",
    "q": "[실기 단답형] '학생' 테이블에서 '학과' 속성을 중복 없이 검색하는 SQL문을 작성하시오.",
    "accept": [
      "SELECT DISTINCT 학과 FROM 학생"
    ],
    "answerDisplay": "SELECT DISTINCT 학과 FROM 학생;",
    "explain": "SELECT DISTINCT는 검색 결과에서 중복되는 튜플을 제거하고 한 번씩만 출력합니다. 형식: SELECT DISTINCT 속성명 FROM 테이블명."
  },
  {
    "type": "practical",
    "kind": "short",
    "q": "[실기 단답형] 4위상 편이변조(4개 위상 = 2비트 전송)를 사용하여 데이터 신호 속도가 4,800bps일 때, 변조 속도(Baud)를 구하시오. (단위 없이 숫자만)",
    "accept": [
      "2400",
      "2,400"
    ],
    "answerDisplay": "2400Baud",
    "explain": "변조 속도(Baud) = 신호 속도(bps) ÷ 변조 시 상태 변화 비트 수. 4위상 = 2²이므로 2비트이며, 4,800 ÷ 2 = 2,400Baud 입니다."
  }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>

</body>
</html>
