<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-11-20 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    type:"written",
    q:"CPU 제어장치의 레지스터 중, 다음에 실행할 명령어의 주소를 기억하는 레지스터는?",
    kind:"mc",
    options:["프로그램 카운터(PC)","명령 레지스터(IR)","메모리 버퍼 레지스터(MBR)","누산기(Accumulator)"],
    answer:0,
    explain:"프로그램 카운터(PC)는 다음에 실행할 명령어의 주소를 기억합니다. IR은 현재 실행 중인 명령어를, MBR은 기억장치를 출입하는 데이터를 일시 저장하며, 누산기는 연산 결과를 일시적으로 저장하는 연산장치의 레지스터입니다."
  },
  {
    type:"written",
    q:"해밍 코드(Hamming Code)에 대한 설명으로 옳은 것은?",
    kind:"mc",
    options:[
      "1Bit 패리티 비트를 추가하여 1Bit 오류만 검출할 수 있다.",
      "오류를 스스로 검출하고 교정할 수 있으며, 2Bit 오류 검출과 1Bit 오류 교정이 가능하다.",
      "연속되는 두 숫자 사이에 한 개의 비트만 변경되는 코드이다.",
      "정마크(정스페이스) 방식으로 오류를 검출한다."
    ],
    answer:1,
    explain:"해밍 코드는 오류를 스스로 검출·교정할 수 있는 코드로 2Bit 오류 검출, 1Bit 오류 교정이 가능합니다. ①은 패리티 검사 코드, ③은 그레이 코드, ④는 2-out-of-5 코드에 대한 설명입니다."
  },
  {
    type:"written",
    q:"연산 후에도 입력 자료가 보존되며, 범용 레지스터(GPR)를 가진 컴퓨터에서 주로 사용하는 명령어 형식은?",
    kind:"mc",
    options:["0 주소 명령어","1 주소 명령어","2 주소 명령어","3 주소 명령어"],
    answer:3,
    explain:"3 주소 명령어는 연산 결과를 별도의 주소에 저장하므로 입력 자료가 보존되며, 범용 레지스터(GPR) 구조의 컴퓨터에서 사용됩니다. 0 주소는 스택, 1 주소는 누산기를 이용하며, 2 주소는 결과를 Operand1에 저장해 원래 자료가 파괴됩니다."
  },
  {
    type:"written",
    q:"입출력장치와 CPU 간의 속도 차이를 해결하기 위한 버퍼링(Buffering)과 스풀링(Spooling)에 대한 설명으로 옳지 않은 것은?",
    kind:"mc",
    options:[
      "버퍼링은 주기억장치를 버퍼로 사용한다.",
      "스풀링은 보조기억장치(디스크)를 사용한다.",
      "버퍼링은 다중 작업, 스풀링은 단일 작업에 적합하다.",
      "두 방식 모두 입출력장치와 CPU 간 속도 차이를 줄이기 위한 것이다."
    ],
    answer:2,
    explain:"버퍼링은 주기억장치를 사용하며 단일 작업, 스풀링은 보조기억장치를 사용하며 다중 작업에 적합합니다. ③은 설명이 서로 뒤바뀌었으므로 옳지 않습니다."
  },
  {
    type:"written",
    q:"관계형 데이터베이스에서 릴레이션(테이블)을 구성하는 튜플(Tuple)의 개수를 의미하는 용어는?",
    kind:"mc",
    options:["차수(Degree)","기수(Cardinality)","도메인(Domain)","스키마(Schema)"],
    answer:1,
    explain:"기수(Cardinality)는 튜플(행)의 개수, 차수(Degree)는 속성(열)의 개수입니다. 도메인은 하나의 속성이 가질 수 있는 값의 범위를 의미합니다."
  },
  {
    type:"written",
    q:"준비(Ready) 상태에 있는 프로세스 중 우선순위가 가장 높은 프로세스가 CPU를 할당받아 실행(Run) 상태로 전이되는 것을 무엇이라 하는가?",
    kind:"mc",
    options:["스풀(Spool)","인터럽트(Interrupt)","디스패치(Dispatch)","교착 상태(Deadlock)"],
    answer:2,
    explain:"디스패치(Dispatch)는 준비 상태의 프로세스 중 우선순위가 가장 높은 프로세스에 CPU를 할당하여 실행 상태로 전이시키는 것입니다. 교착 상태는 프로세스가 일어날 수 없는 사건을 무한정 기다리는 상태입니다."
  },
  {
    type:"written",
    q:"MS-DOS 명령어 중 외부 명령어에 해당하는 것은?",
    kind:"mc",
    options:["DIR","COPY","CLS","FORMAT"],
    answer:3,
    explain:"FORMAT은 별도의 실행 파일이 필요한 외부 명령어입니다. DIR, COPY, CLS는 COMMAND.COM에서 처리되어 프롬프트에서 언제든 사용 가능한 내부 명령어입니다. (외부 명령어: ATTRIB, FORMAT, CHKDSK, FDISK, LABEL, SCANDISK, DISKCOPY, XCOPY, SORT, SYS 등)"
  },
  {
    type:"written",
    q:"UNIX 시스템의 구성 요소 중, 사용자가 입력한 명령어를 해석하여 커널에 전달하는 명령어 해석기는?",
    kind:"mc",
    options:["커널(Kernel)","쉘(Shell)","유틸리티(Utility)","파일 시스템(UFS)"],
    answer:1,
    explain:"쉘(Shell)은 사용자의 명령어를 해석하는 명령어 해석기로 Korn Shell, Bourne Shell, C Shell 등이 있습니다. 커널은 태스크 스케줄링·기억장치 관리 등 기초 시스템 기능을 담당합니다."
  },
  {
    type:"written",
    q:"광섬유 케이블의 손실 요인에 해당하지 않는 것은?",
    kind:"mc",
    options:["접속 손실","산란 손실","흡수 손실","유전체 손실"],
    answer:3,
    explain:"광섬유 케이블의 손실에는 접속 손실, 산란 손실, 흡수 손실이 있습니다. 유전체 손실은 광섬유의 손실 요인이 아닙니다. 광섬유는 빛의 전반사 원리를 이용하며, 잡음의 영향을 받지 않고 보안성이 높습니다."
  },
  {
    type:"written",
    q:"펄스 코드 변조(PCM) 방식에서 송신 측의 처리 순서로 옳은 것은?",
    kind:"mc",
    options:[
      "표본화 → 양자화 → 부호화",
      "양자화 → 표본화 → 부호화",
      "부호화 → 양자화 → 표본화",
      "표본화 → 부호화 → 양자화"
    ],
    answer:0,
    explain:"PCM 송신 측은 표본화(Sampling) → 양자화(Quantizing) → 부호화(Encoding) 순서(표.양.부)로 진행되며, 수신 측은 복호화(Decoding) → 여과화(Filtering) 순서로 진행됩니다."
  },
  {
    type:"written",
    q:"시분할 다중화(TDM) 방식 중, 전송할 데이터가 있는 단말기에만 시간 폭(Time Slot)을 할당하여 전송 효율을 높인 방식은?",
    kind:"mc",
    options:["동기식 시분할 다중화(STDM)","비동기식 시분할 다중화(ATDM)","주파수 분할 다중화(FDM)","코드 분할 다중 접속(CDMA)"],
    answer:1,
    explain:"비동기식 시분할 다중화(ATDM, 지능형 TDM)는 전송할 데이터가 있는 단말기에만 시간 폭을 제공합니다. 동기식(STDM)은 모든 단말기에 균등한 시간 폭을 제공하므로 데이터가 없으면 낭비가 발생합니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 10진수 -13을 8비트 부호화 2의 보수 방식으로 표현한 값을 쓰시오. (2진수 8자리)",
    kind:"short",
    accept:["11110011"],
    answerDisplay:"11110011",
    explain:"13 = 00001101(2) → 1의 보수: 11110010 → 1을 더한 2의 보수: 11110011. 부호화 2의 보수는 음수의 절대값을 2진수로 표현한 뒤 2의 보수(1의 보수 + 1)를 취합니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 대역폭(W)이 3,000Hz이고 신호 대 잡음비(S/N)가 15인 통신 회선의 통신 용량(bps)을 섀넌(Shannon) 공식으로 구하시오. (단위 없이 숫자만)",
    kind:"short",
    accept:["12000","12,000"],
    answerDisplay:"12000bps",
    explain:"섀넌 공식 C = W · log₂(1 + S/N) = 3,000 × log₂(1 + 15) = 3,000 × log₂16 = 3,000 × 4 = 12,000bps 입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] '학생' 테이블에서 '학과' 속성의 값을 중복 없이 검색하는 SQL문을 작성하시오.",
    kind:"short",
    accept:["SELECT DISTINCT 학과 FROM 학생"],
    answerDisplay:"SELECT DISTINCT 학과 FROM 학생;",
    explain:"SELECT 문에서 DISTINCT 키워드를 사용하면 중복된 값을 제거하고 한 번씩만 검색합니다. 형식: SELECT DISTINCT 속성명 FROM 테이블명;"
  },
  {
    type:"practical",
    q:"[실기 단답형] 6장의 디스크로 구성된 디스크 팩(Disk Pack)에서 데이터를 기록할 수 있는 면의 수를 구하시오. (단위 없이 숫자만)",
    kind:"short",
    accept:["10"],
    answerDisplay:"10",
    explain:"디스크 팩의 기록면 수 = (디스크 수 × 2) − 2 입니다. 맨 위와 맨 아래 면은 기록에 사용하지 않으므로 6 × 2 − 2 = 10면입니다."
  }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>

</body>
</html>
