<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-09-20 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    type:"written",
    q:"드모르간의 법칙(De Morgan's Law)을 올바르게 나타낸 것은?",
    kind:"mc",
    options:[
      "(A+B)' = A' + B'",
      "(A+B)' = A' · B'",
      "(A·B)' = A' · B'",
      "(A+B)' = A · B"
    ],
    answer:1,
    explain:"드모르간의 법칙에 따르면 (A+B)' = A'·B' 이고 (A·B)' = A'+B' 입니다. OR의 부정은 AND로, AND의 부정은 OR로 바뀌며 각 변수도 함께 부정됩니다."
  },
  {
    type:"written",
    q:"해밍 코드(Hamming Code)에 대한 설명으로 옳은 것은?",
    kind:"mc",
    options:[
      "1비트 오류만 검출할 수 있다.",
      "2비트 오류를 검출하고 1비트 오류를 교정할 수 있다.",
      "오류 검출만 가능하고 교정은 불가능하다.",
      "정마크(정스페이스) 방식으로 오류를 검출하는 코드이다."
    ],
    answer:1,
    explain:"해밍 코드는 오류를 스스로 검출·교정할 수 있는 코드로, 2비트의 오류를 검출하고 1비트의 오류를 교정할 수 있습니다. 정마크(정스페이스) 방식은 2-out-of-5 코드의 오류 검출 방식입니다."
  },
  {
    type:"written",
    q:"인터럽트(Interrupt) 우선순위를 판별하는 방식 중, 소프트웨어적인 방법에 해당하는 것은?",
    kind:"mc",
    options:["폴링(Polling)", "데이지 체인(Daisy Chain)", "병렬 우선 처리(Parallel Priority)", "벡터 인터럽트 회로"],
    answer:0,
    explain:"인터럽트 우선순위 판별 방식 중 폴링(Polling)은 소프트웨어적 방법이며, 데이지 체인과 병렬 우선 처리 방식은 하드웨어적 방법입니다."
  },
  {
    type:"written",
    q:"입출력장치와 CPU 간의 속도 차이를 해결하는 기법 중, 보조기억장치(디스크)의 일부를 이용하여 다중 프로그래밍 환경에서 입출력 효율을 높이는 기법은?",
    kind:"mc",
    options:["버퍼링(Buffering)", "스풀링(Spooling)", "캐싱(Caching)", "인터리빙(Interleaving)"],
    answer:1,
    explain:"스풀링(Spooling)은 보조기억장치를 버퍼처럼 사용하여 입출력 작업을 CPU 연산과 독립적으로 처리함으로써 다중 작업 환경에서 효율을 높이는 기법입니다. 버퍼링은 주기억장치를 이용하며 주로 단일 작업 환경에서 사용됩니다."
  },
  {
    type:"written",
    q:"데이터베이스의 3단계 스키마 구조(개·외·내)에 해당하지 않는 것은?",
    kind:"mc",
    options:["개념 스키마", "외부 스키마", "내부 스키마", "물리 스키마"],
    answer:3,
    explain:"데이터베이스의 3단계 스키마는 개념 스키마, 외부 스키마, 내부 스키마로 구성됩니다. '물리 스키마'라는 용어는 3단계 스키마 구조에 해당하지 않습니다."
  },
  {
    type:"written",
    q:"관계형 데이터베이스에서 하나의 릴레이션(테이블)에 포함된 튜플(Tuple, 행)의 개수를 의미하는 용어는?",
    kind:"mc",
    options:["차수(Degree)", "기수(Cardinality)", "도메인(Domain)", "속성(Attribute)"],
    answer:1,
    explain:"기수(Cardinality)는 릴레이션에서 튜플(행)의 개수를 의미합니다. 차수(Degree)는 속성(열)의 개수를 의미하므로 서로 구분해야 합니다."
  },
  {
    type:"written",
    q:"SQL 명령어 중 DDL(데이터 정의어, Data Definition Language)에 해당하지 않는 것은?",
    kind:"mc",
    options:["CREATE", "ALTER", "DROP", "SELECT"],
    answer:3,
    explain:"DDL(데이터 정의어)에는 CREATE, ALTER, DROP이 있습니다. SELECT는 데이터를 조회하는 명령어로 DML(데이터 조작어)에 해당합니다."
  },
  {
    type:"written",
    q:"RS-232C 25핀 커넥터에서 '송신 데이터(TXD)'를 담당하는 핀 번호는?",
    kind:"mc",
    options:["2번", "3번", "4번", "5번"],
    answer:0,
    explain:"RS-232C 25핀 커넥터에서 2번 핀은 송신 데이터(TXD), 3번 핀은 수신 데이터(RXD), 4번 핀은 송신 요청(RTS), 5번 핀은 송신 준비 완료(CTS)를 담당합니다."
  },
  {
    type:"written",
    q:"OSI 7계층 중, 경로 배정(Routing)과 네트워크 어드레싱을 담당하는 계층은?",
    kind:"mc",
    options:["데이터 링크 계층", "네트워크 계층", "전송 계층", "세션 계층"],
    answer:1,
    explain:"네트워크 계층(3계층)은 경로 배정, 중계, 네트워크 어드레싱을 담당합니다. 데이터 링크 계층은 인접 시스템 간 신뢰성 있는 전송, 전송 계층은 종단 간 오류·흐름 제어, 세션 계층은 대화 제어를 담당합니다."
  },
  {
    type:"written",
    q:"IPv6 주소 체계에 대한 설명으로 옳지 않은 것은?",
    kind:"mc",
    options:[
      "128비트 주소를 사용한다.",
      "16비트씩 8부분으로 구성된다.",
      "Broadcast 방식을 기본으로 사용한다.",
      "IPv4의 주소 고갈 문제를 해결하기 위해 개발되었다."
    ],
    answer:2,
    explain:"IPv6는 128비트 주소를 16비트씩 8부분으로 나누어 표현하며, IPv4의 주소 고갈 문제를 해결하기 위해 개발되었습니다. Broadcast 대신 Multicast 방식을 기본으로 사용하므로 '옳지 않은' 설명입니다."
  },
  {
    type:"written",
    q:"UNIX에서 'ls -l' 명령 실행 결과 맨 앞의 파일 종류 표시 문자 중, '디렉터리'를 의미하는 문자는?",
    kind:"mc",
    options:["b", "c", "d", "l"],
    answer:2,
    explain:"UNIX의 'ls -l' 결과 첫 글자는 파일 종류를 나타냅니다. b(블록형 특수 파일), c(문자형 특수 파일), d(디렉터리), l(링크)이며, 디렉터리는 'd'로 표시됩니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 2진수 11001010을 16진수로 변환한 값을 쓰시오.",
    kind:"short",
    accept:["CA"],
    answerDisplay:"CA",
    explain:"16진수 변환은 2진수를 4자리씩 묶어서 진행합니다. 1100(C) 1010(A) 이므로 11001010(2) = CA(16) 입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 8비트 레지스터에서 10진수 -5를 2의 보수로 표현한 값을 2진수 8자리로 쓰시오.",
    kind:"short",
    accept:["11111011"],
    answerDisplay:"11111011",
    explain:"5의 절대값을 2진수로 표현하면 00000101이며, 이를 1의 보수로 바꾸면 11111010이 됩니다. 여기에 1을 더하면(2의 보수) 11111011이 됩니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 대역폭이 3,000Hz이고 신호 대 잡음비(S/N)가 1,023일 때, 섀넌(Shannon)의 공식에 따른 채널 용량(bps)을 구하시오. (단, log2(1024)=10으로 계산하고 단위 없이 숫자만 쓰시오.)",
    kind:"short",
    accept:["30000","30,000"],
    answerDisplay:"30000bps",
    explain:"섀넌의 공식은 C = W · log2(1+S/N) 입니다. S/N이 1,023이므로 1+S/N = 1,024이고 log2(1024) = 10 입니다. 따라서 C = 3,000 × 10 = 30,000bps 입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] '사원' 테이블에서 '부서'가 '영업부'인 사원의 '이름'과 '급여'를 조회하는 SQL문을 작성하시오.",
    kind:"short",
    accept:[
      "SELECT 이름, 급여 FROM 사원 WHERE 부서='영업부'",
      "SELECT 이름,급여 FROM 사원 WHERE 부서='영업부'",
      "SELECT 이름, 급여 FROM 사원 WHERE 부서 = '영업부'",
      "SELECT 이름, 급여 FROM 사원 WHERE 부서=\"영업부\""
    ],
    answerDisplay:"SELECT 이름, 급여 FROM 사원 WHERE 부서='영업부';",
    explain:"SELECT 문은 'SELECT 속성명 FROM 테이블명 WHERE 조건'의 형식을 사용합니다. 특정 부서('영업부')의 이름과 급여를 조회하려면 WHERE 절에 조건을 지정합니다."
  }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>

</body>
</html>
