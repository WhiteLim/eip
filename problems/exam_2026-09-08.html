<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-09-08 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    type:"written",
    q:"RS 플립플롭에서 S=1, R=1이 동시에 입력되었을 때 나타나는 출력 상태는?",
    kind:"mc",
    options:[
      "입력 전 상태를 그대로 유지하는 무변화 상태",
      "출력이 0으로 고정되는 상태",
      "출력이 1로 고정되는 상태",
      "출력이 정의되지 않는 부정(불능) 상태"
    ],
    answer:3,
    explain:"RS 플립플롭은 S=1, R=1이 동시에 입력되면 출력이 정의되지 않는 부정(불능) 상태가 됩니다. 이를 '무(0,0)·공(0,1)·일(1,0)·불(1,1)'로 암기합니다."
  },
  {
    type:"written",
    q:"멀티플렉서(MUX)에 대한 설명으로 옳은 것은?",
    kind:"mc",
    options:[
      "1개의 입력선 정보를 2ⁿ개의 출력선 중 1개를 선택하여 출력한다.",
      "2ⁿ개의 입력 중 1개를 선택하여 한 곳으로 출력한다.",
      "입력과 출력의 개수가 항상 동일하다.",
      "입출력장치와 CPU 사이의 속도 차이를 해결한다."
    ],
    answer:1,
    explain:"멀티플렉서(MUX)는 2ⁿ개의 입력 중 1개를 선택하여 한 곳으로 출력하는 회로입니다. 반대로 디멀티플렉서(DeMUX)는 1개의 입력선 정보를 2ⁿ개의 출력선 중 1개를 선택하여 출력합니다."
  },
  {
    type:"written",
    q:"연산 후에도 입력 자료를 그대로 보존하며, 범용 레지스터(GPR)를 가진 컴퓨터에서 주로 사용되는 명령어 형식은?",
    kind:"mc",
    options:["0 주소 명령어", "1 주소 명령어", "2 주소 명령어", "3 주소 명령어"],
    answer:3,
    explain:"3 주소 명령어는 연산 후에도 입력 자료를 보존하며, 범용 레지스터(GPR)를 가진 컴퓨터에서 주로 사용됩니다. 2 주소 명령어는 연산 결과를 Operand1에 저장하여 원래 자료를 파괴합니다."
  },
  {
    type:"written",
    q:"CPU의 직접적인 개입 없이 입출력 장치를 CPU에 종속되지 않고 독립적으로 관리하는 장치는?",
    kind:"mc",
    options:["버퍼(Buffer)", "채널(Channel)", "인터럽트(Interrupt)", "레지스터(Register)"],
    answer:1,
    explain:"채널(Channel)은 입출력 장치를 CPU에 종속적이지 않고 독립적으로 관리하는 장치로, CPU의 부담을 줄여줍니다."
  },
  {
    type:"written",
    q:"스풀링(Spooling)에 대한 설명으로 옳은 것은?",
    kind:"mc",
    options:[
      "주기억장치를 사용하며 단일 작업에 적합하다.",
      "보조기억장치를 사용하며 다중 작업에 적합하다.",
      "CPU와 레지스터 간의 속도 차이를 해결한다.",
      "입출력장치 없이 동작하는 방식이다."
    ],
    answer:1,
    explain:"버퍼링은 주기억장치를 이용해 단일 작업에서 입출력장치와 CPU의 속도 차이를 해결하고, 스풀링은 보조기억장치를 이용해 다중 작업 환경에서 속도 차이를 해결합니다."
  },
  {
    type:"written",
    q:"다음 중 DDL(데이터 정의어)에 해당하지 않는 것은?",
    kind:"mc",
    options:["CREATE", "ALTER", "DROP", "SELECT"],
    answer:3,
    explain:"DDL(데이터 정의어)은 CREATE, ALTER, DROP으로 구성됩니다. SELECT는 데이터를 검색하는 DML(데이터 조작어)에 해당합니다."
  },
  {
    type:"written",
    q:"데이터베이스의 3단계 스키마에 해당하지 않는 것은?",
    kind:"mc",
    options:["개념 스키마", "외부 스키마", "내부 스키마", "논리 스키마"],
    answer:3,
    explain:"3단계 스키마는 개념 스키마·외부 스키마·내부 스키마(개.외.내)로 구성됩니다. '논리적 설계'는 요구사항 분석→개념적 설계→논리적 설계→물리적 설계→구현으로 이어지는 DB 설계 단계(개.논.물)에서 쓰이는 용어로, 스키마의 종류와는 다른 개념입니다."
  },
  {
    type:"written",
    q:"다음 중 운영체제의 발달 순서로 옳게 나열한 것은?",
    kind:"mc",
    options:[
      "일괄 처리 → 다중 프로그래밍 → 시분할 시스템 → 분산 처리",
      "시분할 시스템 → 일괄 처리 → 분산 처리 → 다중 프로그래밍",
      "다중 프로그래밍 → 일괄 처리 → 분산 처리 → 시분할 시스템",
      "분산 처리 → 시분할 시스템 → 다중 프로그래밍 → 일괄 처리"
    ],
    answer:0,
    explain:"운영체제는 '단일 처리 → 일괄 처리 → 다중 프로그래밍 → 시분할 → 다중 처리 → 실시간 → 범용 → 분산'(단.일.프.시.다.실.범.분) 순으로 발전하였습니다."
  },
  {
    type:"written",
    q:"준비(Ready) 상태의 프로세스 중 우선순위가 가장 높은 프로세스가 CPU를 할당받아 실행 상태로 전이되는 것을 의미하는 용어는?",
    kind:"mc",
    options:["접수(Admission)", "준비(Ready)", "디스패치(Dispatch)", "교착 상태(Deadlock)"],
    answer:2,
    explain:"디스패치(Dispatch)는 준비 상태의 프로세스 중 우선순위가 가장 높은 프로세스가 CPU를 할당받아 실행 상태로 전이되는 것을 의미합니다."
  },
  {
    type:"written",
    q:"하드디스크를 여러 개의 논리적 디스크로 나누어 파티션을 설정하는 DOS 외부 명령어는?",
    kind:"mc",
    options:["FORMAT", "CHKDSK", "FDISK", "ATTRIB"],
    answer:2,
    explain:"FDISK는 하드디스크를 논리적으로 여러 디스크로 나누어 파티션을 설정하는 DOS 외부 명령어입니다. FORMAT은 디스크 초기화, CHKDSK는 디스크 상태 점검, ATTRIB은 파일 속성 변경 명령어입니다."
  },
  {
    type:"written",
    q:"UNIX에서 ls -l 명령의 실행 결과로 표시되는 파일 종류 문자 중 'd'가 의미하는 것은?",
    kind:"mc",
    options:["블록형 특수 파일", "문자형 특수 파일", "디렉터리", "심볼릭 링크"],
    answer:2,
    explain:"ls 명령 결과의 첫 글자는 파일 종류를 나타내며 b(블록형 특수), c(문자형 특수), d(디렉터리), l(링크)로 구분합니다(b.c.d.l)."
  },
  {
    type:"practical",
    q:"[실기 단답형] 성형(Star) 토폴로지에서 중앙 노드 1개에 8개의 단말 노드가 연결되어 있을 때, 필요한 회선의 수를 구하시오. (단위 없이 숫자만)",
    kind:"short",
    accept:["8"],
    answerDisplay:"8",
    explain:"성형(Star) 토폴로지는 중앙 노드를 중심으로 각 단말 노드가 1개의 회선으로 연결되는 중앙 집중형 구조입니다. 따라서 단말 노드가 8개이면 필요한 회선의 수도 8개입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 대역폭(W)이 3,000Hz이고 신호 대 잡음비(S/N)가 1,023일 때, 섀넌(Shannon)의 공식을 이용해 최대 통신 용량(bps)을 구하시오. (단, log₂1,024=10, 단위 없이 숫자만)",
    kind:"short",
    accept:["30000","30,000"],
    answerDisplay:"30000bps",
    explain:"섀넌의 공식은 C = W · log₂(1 + S/N) 입니다. C = 3,000 × log₂(1+1,023) = 3,000 × log₂(1,024) = 3,000 × 10 = 30,000bps 입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] '학생' 테이블에 학번='2024001', 이름='홍길동' 값을 삽입하는 SQL문을 작성하시오.",
    kind:"short",
    accept:["INSERT INTO 학생 VALUES('2024001','홍길동')","INSERT INTO 학생 VALUES ('2024001','홍길동')","INSERT INTO 학생 VALUES(\"2024001\",\"홍길동\")"],
    answerDisplay:"INSERT INTO 학생 VALUES('2024001','홍길동');",
    explain:"INSERT 문은 'INSERT INTO 테이블명 VALUES(값1, 값2, ...)' 형식을 사용합니다. 문자(문자열) 데이터는 작은따옴표(' ')로 묶어서 입력합니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 10진수 -13을 8비트 2의 보수(2's Complement)로 표현한 값을 2진수 8자리로 쓰시오. (공백 없이)",
    kind:"short",
    accept:["11110011"],
    answerDisplay:"11110011",
    explain:"13을 2진수로 표현하면 00001101이며, 이를 1의 보수로 바꾸면 11110010, 여기에 1을 더한 11110011이 -13의 2의 보수 표현입니다."
  }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>

</body>
