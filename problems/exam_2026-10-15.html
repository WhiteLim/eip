<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-10-15 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
 {
  "type": "written",
  "q": "반가산기(HA)에서 자리올림수(Carry, C)를 구하는 논리 연산은?",
  "kind": "mc",
  "options": [
   "A ⊕ B (XOR)",
   "A · B (AND)",
   "A + B (OR)",
   "A ⊙ B (XNOR)"
  ],
  "answer": 1,
  "explain": "반가산기는 1비트 2진수 2개(A, B)를 더해 합(S)과 자리올림수(C)를 구합니다. 합은 S = A⊕B, 자리올림수는 C = A·B(AND)입니다."
 },
 {
  "type": "written",
  "q": "JK 플립플롭에서 J=1, K=1이 입력되었을 때의 동작은?",
  "kind": "mc",
  "options": [
   "상태 변화 없음(무)",
   "0으로 클리어(공)",
   "1로 세트(일)",
   "현재 상태의 보수(반전, 토글)"
  ],
  "answer": 3,
  "explain": "JK 플립플롭은 (0,0)=무변화, (0,1)=0(공), (1,0)=1(일), (1,1)=보수(반전)로 동작합니다. 가장 널리 사용되는 플립플롭입니다."
 },
 {
  "type": "written",
  "q": "인터럽트 우선순위 판별 방법 중 하드웨어적 방식에 해당하는 것은?",
  "kind": "mc",
  "options": [
   "폴링(Polling)",
   "데이지 체인(Daisy Chain)",
   "스택(Stack) 방식",
   "라운드 로빈(Round Robin)"
  ],
  "answer": 1,
  "explain": "우선순위 판별은 폴링(소프트웨어), 데이지 체인(하드웨어), 병렬 우선 처리(하드웨어) 방식이 있습니다."
 },
 {
  "type": "written",
  "q": "프로그램 카운터(PC)의 값과 명령어의 주소 부분(Operand)을 더하여 유효 주소를 구하는 주소 지정 방식은?",
  "kind": "mc",
  "options": [
   "즉치(Immediate) 주소 지정",
   "직접(Direct) 주소 지정",
   "상대(Relative) 주소 지정",
   "간접(Indirect) 주소 지정"
  ],
  "answer": 2,
  "explain": "상대 주소 지정 방식은 프로그램 카운터(PC) + 주소 부분(Operand)으로 유효 주소를 계산합니다."
 },
 {
  "type": "written",
  "q": "입출력장치와 CPU 간의 속도 차이를 해결하기 위한 방법으로, 보조기억장치를 이용하며 다중 작업에 사용되는 것은?",
  "kind": "mc",
  "options": [
   "버퍼링(Buffering)",
   "스풀링(Spooling)",
   "인터리빙(Interleaving)",
   "블로킹(Blocking)"
  ],
  "answer": 1,
  "explain": "버퍼링은 주기억장치를 사용하는 단일 작업 방식이고, 스풀링은 보조기억장치(디스크)를 사용하는 다중 작업 방식입니다."
 },
 {
  "type": "written",
  "q": "1비트 오류를 스스로 검출하고 교정할 수 있는 오류 검출·교정 코드는?",
  "kind": "mc",
  "options": [
   "패리티 검사 코드",
   "해밍 코드",
   "그레이 코드",
   "2-out-of-5 코드"
  ],
  "answer": 1,
  "explain": "해밍 코드는 오류를 스스로 검출하고 교정할 수 있는 코드입니다. 패리티 검사 코드는 1비트 오류의 검출만 가능하며 교정은 불가능합니다."
 },
 {
  "type": "written",
  "q": "디스크 팩이 6장일 때 사용 가능한 기록면의 수는? (맨 위·맨 아래 면은 기록 불가)",
  "kind": "mc",
  "options": [
   "10면",
   "11면",
   "12면",
   "14면"
  ],
  "answer": 0,
  "explain": "디스크 팩의 기록면 수 = (디스크 수 × 2) − 2 입니다. (6 × 2) − 2 = 10면입니다."
 },
 {
  "type": "written",
  "q": "SQL에서 DROP 문 사용 시, 제거할 요소를 참조하는 다른 개체도 함께 제거하는 옵션은?",
  "kind": "mc",
  "options": [
   "RESTRICT",
   "CASCADE",
   "DISTINCT",
   "GRANT"
  ],
  "answer": 1,
  "explain": "DROP CASCADE는 제거할 요소를 참조하는 다른 개체도 함께 제거하고, DROP RESTRICT는 참조 중이면 제거하지 않습니다."
 },
 {
  "type": "written",
  "q": "DOS에서 하나의 하드디스크를 논리적으로 여러 개의 디스크로 나누는(파티션 설정) 외부 명령어는?",
  "kind": "mc",
  "options": [
   "FORMAT",
   "CHKDSK",
   "FDISK",
   "DEFRAG"
  ],
  "answer": 2,
  "explain": "FDISK는 하드디스크를 논리적으로 여러 디스크로 나누는 파티션 설정 명령어입니다. FORMAT은 초기화, CHKDSK는 디스크 상태 점검, DEFRAG는 단편화 최적화입니다."
 },
 {
  "type": "written",
  "q": "UNIX의 쉘(Shell)에 해당하지 않는 것은?",
  "kind": "mc",
  "options": [
   "Korn Shell",
   "Bourne Shell",
   "C Shell",
   "Kernel Shell"
  ],
  "answer": 3,
  "explain": "UNIX의 대표적인 쉘은 Korn Shell, Bourne Shell, C Shell(K.B.C)입니다. 커널(Kernel)은 쉘과 구분되는 UNIX의 핵심 구성 요소입니다."
 },
 {
  "type": "written",
  "q": "통신 프로토콜의 기본 요소에 해당하지 않는 것은?",
  "kind": "mc",
  "options": [
   "구문(Syntax)",
   "의미(Semantics)",
   "시간(Timing)",
   "처리(Processing)"
  ],
  "answer": 3,
  "explain": "프로토콜의 기본 요소는 구문(Syntax), 의미(Semantics), 시간(Timing)입니다. 처리는 기본 요소가 아닙니다."
 },
 {
  "type": "practical",
  "q": "[실기 단답형] 10진수 45를 2진수로 변환한 값을 쓰시오.",
  "kind": "short",
  "accept": [
   "101101"
  ],
  "answerDisplay": "101101",
  "explain": "45를 2로 계속 나누어 나머지를 역순으로 나열합니다. 45=32+8+4+1 이므로 101101(2)입니다."
 },
 {
  "type": "practical",
  "q": "[실기 단답형] '도서' 테이블에서 '출판사' 속성을 중복 없이 검색하는 SQL문을 작성하시오.",
  "kind": "short",
  "accept": [
   "SELECT DISTINCT 출판사 FROM 도서",
   "SELECT DISTINCT(출판사) FROM 도서"
  ],
  "answerDisplay": "SELECT DISTINCT 출판사 FROM 도서;",
  "explain": "SELECT 문에 DISTINCT를 사용하면 중복되지 않게 검색할 수 있습니다."
 },
 {
  "type": "practical",
  "q": "[실기 단답형] 대역폭이 3,000Hz이고 신호 대 잡음비(S/N)가 7인 채널의 최대 통신 용량(bps)을 섀넌 공식으로 구하시오. (단위 없이 숫자만)",
  "kind": "short",
  "accept": [
   "9000",
   "9,000"
  ],
  "answerDisplay": "9000bps",
  "explain": "섀넌 공식 C = W·log₂(1+S/N) 에서 3000 × log₂(1+7) = 3000 × log₂8 = 3000 × 3 = 9,000bps 입니다."
 },
 {
  "type": "practical",
  "q": "[실기 단답형] IP 주소 198.0.46.201 의 클래스(A~C 중)를 알파벳 한 글자로 쓰시오.",
  "kind": "short",
  "accept": [
   "C",
   "c클래스",
   "class c",
   "C클래스"
  ],
  "answerDisplay": "C (Class C)",
  "explain": "198로 시작하는 주소는 Class C이며 기본 서브넷 마스크는 255.255.255.0 입니다."
 }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>

</body>
</html>
