<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제4회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:10px;
  }
  .short-btn{
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .short-btn.ghost{
    background:#fff;
    color:var(--accent);
    border:1.5px solid var(--accent);
  }
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제4회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-11-19 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    type:"written",
    q:"CPU 제어장치의 레지스터 중, 다음에 실행할 명령어의 주소를 기억하는 레지스터는?",
    kind:"mc",
    options:["프로그램 카운터(PC)", "명령 레지스터(IR)", "메모리 버퍼 레지스터(MBR)", "누산기(Accumulator)"],
    answer:0,
    explain:"프로그램 카운터(PC)는 다음에 실행할 명령어의 주소를 기억합니다. 명령 레지스터(IR)는 현재 실행 중인 명령어를, MBR은 기억장치를 출입하는 데이터를 일시 저장하며, 누산기는 연산 결과를 일시적으로 저장하는 연산장치의 레지스터입니다."
  },
  {
    type:"written",
    q:"프로그램 카운터(PC)의 값과 명령어의 주소 부분(Operand)을 더하여 실제 데이터의 주소(유효 주소)를 구하는 주소 지정 방식은?",
    kind:"mc",
    options:["상대(Relative) 주소 지정", "직접(Direct) 주소 지정", "간접(Indirect) 주소 지정", "즉시(Immediate) 주소 지정"],
    answer:0,
    explain:"상대 주소 지정 방식은 '프로그램 카운터(PC) + 주소 부분(Operand)'으로 유효 주소를 계산합니다. 직접 방식은 실제 데이터의 절대 주소를, 간접 방식은 실제 주소를 가진 포인터의 주소를, 즉시 방식은 주소 대신 자료 자체를 저장합니다."
  },
  {
    type:"written",
    q:"인터럽트 우선순위 판별 방법 중 소프트웨어(Software)적인 방법에 해당하는 것은?",
    kind:"mc",
    options:["폴링(Polling)", "데이지 체인(Daisy Chain)", "병렬 우선 처리(Parallel Priority)", "벡터 인터럽트(Vectored Interrupt)"],
    answer:0,
    explain:"폴링(Polling)은 CPU가 프로그램으로 각 장치를 차례로 검사하여 인터럽트 요청 장치를 찾는 소프트웨어 방식입니다. 데이지 체인과 병렬 우선 처리는 하드웨어적인 우선순위 판별 방식입니다."
  },
  {
    type:"written",
    q:"입출력장치와 CPU 간의 속도 차이를 해결하기 위한 스풀링(Spooling)에 대한 설명으로 옳은 것은?",
    kind:"mc",
    options:[
      "보조기억장치(디스크)를 버퍼처럼 사용하며 다중 작업에 적합하다.",
      "주기억장치의 일부를 사용하며 단일 작업에 적합하다.",
      "CPU의 참여 없이 메모리와 입출력장치가 직접 데이터를 주고받는다.",
      "CPU와 주기억장치 사이의 속도 차이를 줄이기 위한 고속 기억장치이다."
    ],
    answer:0,
    explain:"스풀링은 보조기억장치를 사용하며 다중 작업에 적합합니다. 주기억장치를 사용하고 단일 작업에 쓰이는 것은 버퍼링입니다. CPU 참여 없이 직접 전송하는 것은 DMA, CPU와 주기억장치 사이의 고속 기억장치는 캐시 메모리입니다."
  },
  {
    type:"written",
    q:"데이터베이스 설계 단계의 순서로 옳은 것은?",
    kind:"mc",
    options:[
      "요구사항 분석 → 개념적 설계 → 논리적 설계 → 물리적 설계 → 구현",
      "요구사항 분석 → 논리적 설계 → 개념적 설계 → 물리적 설계 → 구현",
      "개념적 설계 → 요구사항 분석 → 물리적 설계 → 논리적 설계 → 구현",
      "요구사항 분석 → 물리적 설계 → 논리적 설계 → 개념적 설계 → 구현"
    ],
    answer:0,
    explain:"데이터베이스 설계는 요구사항 분석 → 개념적 설계 → 논리적 설계 → 물리적 설계 → 구현 순으로 진행됩니다. 암기 키워드 '개.논.물'로 기억하세요."
  },
  {
    type:"written",
    q:"튜플(행)이 6개, 속성(열)이 4개인 릴레이션의 기수(Cardinality)와 차수(Degree)로 옳은 것은?",
    kind:"mc",
    options:["기수 6, 차수 4", "기수 4, 차수 6", "기수 24, 차수 4", "기수 6, 차수 24"],
    answer:0,
    explain:"기수(Cardinality)는 튜플(Tuple)의 개수, 차수(Degree)는 속성(Attribute)의 개수입니다. 따라서 튜플 6개 → 기수 6, 속성 4개 → 차수 4 입니다."
  },
  {
    type:"written",
    q:"SQL의 DROP 문에서 CASCADE 옵션을 사용했을 때의 동작으로 옳은 것은?",
    kind:"mc",
    options:[
      "제거할 요소를 참조하는 다른 개체도 함께 제거한다.",
      "제거할 요소가 다른 개체에서 참조 중이면 제거하지 않는다.",
      "중복된 튜플을 제외하고 하나만 남긴다.",
      "변경된 내용을 취소하고 이전 상태로 되돌린다."
    ],
    answer:0,
    explain:"DROP CASCADE는 제거할 요소를 참조하는 다른 개체까지 함께 제거합니다. 참조 중이면 제거하지 않는 것은 RESTRICT, 중복 제거는 SELECT DISTINCT, 변경 취소는 ROLLBACK입니다."
  },
  {
    type:"written",
    q:"운영체제의 제어 프로그램(Control Program)에 해당하지 않는 것은?",
    kind:"mc",
    options:["언어 번역 프로그램", "감시 프로그램", "작업 제어 프로그램", "자료 관리 프로그램"],
    answer:0,
    explain:"제어 프로그램은 감시 프로그램, 작업 제어 프로그램, 자료 관리 프로그램(감.작.데)으로 구성됩니다. 언어 번역 프로그램은 서비스 프로그램과 함께 '처리 프로그램'에 속합니다."
  },
  {
    type:"written",
    q:"UNIX에서 앞 명령어의 출력을 뒤 명령어의 입력으로 연결하여 사용할 수 있게 하는 기능은?",
    kind:"mc",
    options:["pipe", "fork", "finger", "kill"],
    answer:0,
    explain:"pipe(|)는 앞 명령어의 출력을 뒤 명령어의 입력으로 연결합니다. fork는 새로운 프로세스를 생성하고, finger는 등록된 사용자 정보를 조회하며, kill은 실행 중인 프로세스를 종료합니다."
  },
  {
    type:"written",
    q:"광섬유 케이블에서 발생하는 손실의 종류에 해당하지 않는 것은?",
    kind:"mc",
    options:["유전체 손실", "접속 손실", "산란 손실", "흡수 손실"],
    answer:0,
    explain:"광섬유 케이블의 손실에는 접속 손실, 산란 손실, 흡수 손실이 있습니다. 유전체 손실은 광섬유 손실에 해당하지 않으며(오답 함정), 광섬유는 잡음의 영향을 받지 않고 보안성이 높은 것이 특징입니다."
  },
  {
    type:"written",
    q:"펄스 코드 변조(PCM) 방식에서 송신 측의 처리 순서로 옳은 것은?",
    kind:"mc",
    options:[
      "표본화 → 양자화 → 부호화",
      "양자화 → 표본화 → 부호화",
      "부호화 → 양자화 → 표본화",
      "표본화 → 부호화 → 양자화"
    ],
    answer:0,
    explain:"PCM 송신 측은 표본화(Sampling) → 양자화(Quantizing) → 부호화(Encoding) 순서(표.양.부)로 처리하며, 수신 측은 복호화(Decoding) → 여과화(Filtering) 순서(복.여)로 처리합니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 그레이 코드(Gray Code) 1101을 2진수로 변환한 값을 쓰시오. (4자리 숫자만)",
    kind:"short",
    accept:["1001"],
    answerDisplay:"1001",
    explain:"① Gray → 2진수 변환은 첫 번째 비트는 그대로 내리고, 두 번째부터는 '바로 앞에서 구한 2진수 결과값'과 현재 Gray 비트를 XOR 합니다.\n② 첫 비트: 1 → 1\n③ 두 번째: 앞 결과 1 ⊕ Gray 1 = 0\n④ 세 번째: 앞 결과 0 ⊕ Gray 0 = 0\n⑤ 네 번째: 앞 결과 0 ⊕ Gray 1 = 1\n⑥ 따라서 1001 입니다. (2진수 → Gray는 '이웃한 원래 2진수끼리' XOR 하는 것과 구분하세요.)"
  },
  {
    type:"practical",
    q:"[실기 단답형] '학생' 테이블에서 '학과' 속성의 값을 중복 없이 조회하는 SQL문을 작성하시오.",
    kind:"short",
    accept:["SELECT DISTINCT 학과 FROM 학생"],
    answerDisplay:"SELECT DISTINCT 학과 FROM 학생;",
    explain:"① 조회는 DML의 SELECT 문을 사용하며 형식은 'SELECT 속성명 FROM 테이블명;' 입니다.\n② 중복된 값을 제거하고 한 번씩만 검색하려면 속성명 앞에 DISTINCT 키워드를 붙입니다.\n③ 따라서 SELECT DISTINCT 학과 FROM 학생; 이 됩니다.\n④ DISTINCT가 없으면 같은 학과 값이 학생 수만큼 반복해서 출력됩니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 대역폭(W)이 3,000Hz이고 신호 대 잡음비(S/N)가 15인 통신 채널의 통신 용량(bps)을 섀넌(Shannon) 공식으로 구하시오. (단위 없이 숫자만)",
    kind:"short",
    accept:["12000","12,000"],
    answerDisplay:"12000bps",
    explain:"① 섀넌 공식: C = W × log₂(1 + S/N) [bps]\n② 1 + S/N = 1 + 15 = 16\n③ log₂16 = 4 (2⁴ = 16)\n④ C = 3,000 × 4 = 12,000bps\n⑤ 통신 용량을 늘리려면 대역폭↑, 신호 세력↑, 잡음 세력↓ 해야 합니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 6장의 디스크로 구성된 디스크 팩에서 실제로 데이터를 기록할 수 있는 면의 수를 구하시오. (단, 맨 위와 맨 아래 면은 사용하지 않음. 숫자만)",
    kind:"short",
    accept:["10"],
    answerDisplay:"10",
    explain:"① 디스크 한 장은 위·아래 2개의 면을 가지므로 전체 면 수는 6 × 2 = 12면입니다.\n② 디스크 팩의 맨 위 면과 맨 아래 면은 보호를 위해 기록에 사용하지 않습니다.\n③ 공식: 기록면 수 = (디스크 수 × 2) − 2 = 12 − 2 = 10\n④ 따라서 기록 가능한 면은 10면입니다."
  }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btnRow = document.createElement('div');
    btnRow.className = 'short-btn-row';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const explainBtn = document.createElement('button');
    explainBtn.className = 'short-btn ghost';
    explainBtn.textContent = '해설 보기';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });
    explainBtn.addEventListener('click', () => { explain.classList.add('show'); });

    btnRow.appendChild(btn);
    btnRow.appendChild(explainBtn);
    saWrap.appendChild(input);
    saWrap.appendChild(btnRow);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>

</body>
</html>
