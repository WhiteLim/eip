<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-10-11 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {type:"written",kind:"mc",q:"2진수 1011을 그레이 코드(Gray Code)로 변환한 값은?",
   options:["1110","1010","1101","0111"],answer:0,
   explain:"2진수 → 그레이: 첫 비트는 그대로, 이후는 바로 앞 2진수 비트와 XOR 합니다. 1 → 1, 1⊕0=1, 0⊕1=1, 1⊕1=0 이므로 1110 입니다."},
  {type:"written",kind:"mc",q:"주소 필드가 없고 스택(Stack)을 이용하여 PUSH/POP으로 연산하는 주소 지정 방식은?",
   options:["즉치(Immediate) 주소 지정","직접(Direct) 주소 지정","암시적(Implied) 주소 지정","상대(Relative) 주소 지정"],answer:2,
   explain:"암시적(Implied) 주소 지정 방식은 주소 필드가 없고 스택을 이용하며, 삽입은 PUSH, 삭제는 POP 입니다. 즉치는 주소 대신 자료를 직접 저장하는 방식입니다."},
  {type:"written",kind:"mc",q:"인터럽트의 우선순위 판별 방법 중 소프트웨어 방식에 해당하는 것은?",
   options:["폴링(Polling)","데이지 체인(Daisy Chain)","병렬 우선순위 부여","벡터 인터럽트"],answer:0,
   explain:"우선순위 판별에서 폴링은 소프트웨어 방식이고, 데이지 체인과 병렬 우선 처리는 하드웨어 방식입니다."},
  {type:"written",kind:"mc",q:"입출력장치와 CPU 간의 속도 차이를 해결하기 위한 방법 중, 보조기억장치를 이용하며 다중 작업이 가능한 것은?",
   options:["버퍼링(Buffering)","스풀링(Spooling)","채널(Channel)","DMA"],answer:1,
   explain:"스풀링은 보조기억장치를 이용하고 다중 작업이 가능합니다. 버퍼링은 주기억장치를 이용하며 단일 작업에 쓰입니다."},
  {type:"written",kind:"mc",q:"다음 SQL 명령어 중 DDL(데이터 정의어)에 해당하는 것은?",
   options:["INSERT","UPDATE","ALTER","ROLLBACK"],answer:2,
   explain:"DDL은 CREATE, ALTER, DROP 입니다. INSERT·UPDATE는 DML, ROLLBACK은 DCL 입니다."},
  {type:"written",kind:"mc",q:"데이터베이스의 3단계 스키마 중, 모든 응용 시스템과 사용자가 필요로 하는 데이터를 통합한 조직 전체의 데이터베이스 구조를 나타내는 것은?",
   options:["외부 스키마","개념 스키마","내부 스키마","물리 스키마"],answer:1,
   explain:"스키마는 개념·외부·내부 스키마(개.외.내)로 구분하며, 조직 전체의 통합된 논리적 구조를 정의하는 것이 개념 스키마입니다."},
  {type:"written",kind:"mc",q:"프로세스 스케줄링 기법 중 시간 조각(Time Slice)을 미리 정의하여 각 프로세스에 CPU를 번갈아 할당하는 선점형 기법은?",
   options:["FIFO","SRT","RR(Round Robin)","HRN"],answer:2,
   explain:"RR(라운드 로빈)은 시간 할당량을 정해 각 프로세스에 CPU를 차례로 제공하는 선점형 기법입니다. FIFO는 비선점형, SRT는 남은 실행 시간이 짧은 프로세스를 우선하는 선점형입니다."},
  {type:"written",kind:"mc",q:"DOS에서 하드디스크를 논리적으로 여러 개의 디스크로 나누는 파티션 설정에 사용하는 외부 명령어는?",
   options:["CHKDSK","FDISK","DEFRAG","SCANDISK"],answer:1,
   explain:"FDISK는 하드디스크를 논리적으로 분할(파티션 설정)합니다. CHKDSK는 디스크 상태 점검, DEFRAG는 단편화 최적화, SCANDISK는 미미한 오류 수정입니다."},
  {type:"written",kind:"mc",q:"UNIX에서 'chmod go-w 파일명' 명령의 의미로 옳은 것은?",
   options:["소유자의 쓰기 권한을 취소한다.","그룹과 기타 사용자의 쓰기 권한을 취소한다.","그룹과 기타 사용자에게 쓰기 권한을 부여한다.","모든 사용자의 읽기 권한을 취소한다."],answer:1,
   explain:"파일 소유권은 소유자 u, 그룹 g, 기타 o 입니다. 'go-w'는 그룹(g)과 기타(o) 사용자에게서 쓰기(w) 권한을 뺀다(-)는 뜻이므로 소유자만 수정할 수 있게 됩니다."},
  {type:"written",kind:"mc",q:"OSI 7계층 중 경로 배정(Routing), 중계, 네트워크 어드레싱 기능을 담당하는 계층은?",
   options:["물리 계층","데이터 링크 계층","네트워크 계층","전송 계층"],answer:2,
   explain:"3계층인 네트워크 계층이 경로 배정, 중계, 어드레싱을 담당합니다. 전송 계층은 오류 검출·흐름 제어·혼잡 제어(TCP, UDP)를 담당합니다."},
  {type:"written",kind:"mc",q:"IPv6의 주소 길이는 몇 비트인가?",
   options:["32비트","64비트","128비트","256비트"],answer:2,
   explain:"IPv6는 16비트씩 8부분, 총 128비트입니다. IPv4는 8비트씩 4부분, 총 32비트입니다."},
  {type:"practical",kind:"short",q:"[실기 단답형] 2진수 10110101을 8진수로 변환한 값을 쓰시오.",
   accept:["265"],answerDisplay:"265",
   explain:"2진수를 오른쪽부터 3자리씩 묶습니다: 10 | 110 | 101 → 2, 6, 5 이므로 265(8) 입니다."},
  {type:"practical",kind:"short",q:"[실기 단답형] '학생' 테이블에서 '학과'를 중복 없이 검색하는 SQL문을 작성하시오.",
   accept:["SELECT DISTINCT 학과 FROM 학생"],answerDisplay:"SELECT DISTINCT 학과 FROM 학생;",
   explain:"SELECT 뒤에 DISTINCT를 붙이면 중복된 튜플이 제거되어 한 번씩만 검색됩니다."},
  {type:"practical",kind:"short",q:"[실기 단답형] 데이터 신호 속도가 9,600bps이고 변조 시 상태 변화 비트 수가 4비트(Quadbit)일 때, 변조 속도(Baud)를 구하시오. (단위 없이 숫자만)",
   accept:["2400","2,400"],answerDisplay:"2400Baud",
   explain:"변조 속도 = 신호 속도 ÷ 변조 시 상태 변화 비트 수 = 9600 ÷ 4 = 2400 Baud 입니다."},
  {type:"practical",kind:"short",q:"[실기 단답형] 디스크 팩이 6장의 디스크로 구성되어 있을 때, 사용 가능한 기록면의 수를 구하시오. (단위 없이 숫자만)",
   accept:["10"],answerDisplay:"10",
   explain:"디스크 팩 기록면 수 = (디스크 수 × 2) − 2 (맨 위·맨 아래 면은 기록 불가) = 6×2−2 = 10 입니다."}
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>

</body>
</html>
