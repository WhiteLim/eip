<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-09-25 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    type:"written",
    q:"드모르간 법칙에 따를 때, 논리식 (A+B)'와 같은 것은? (단, A'는 NOT A를 의미함)",
    kind:"mc",
    options:[
      "A' · B'",
      "A' + B'",
      "A · B",
      "A + B"
    ],
    answer:0,
    explain:"드모르간 법칙에 의해 (A+B)' = A'·B', (A·B)' = A'+B' 입니다. OR의 부정은 각 항을 부정한 후 AND로 결합한 것과 같습니다."
  },
  {
    type:"written",
    q:"반가산기(Half Adder)에서 입력 A, B에 대한 자리올림수(Carry) 출력을 구하는 논리식으로 옳은 것은?",
    kind:"mc",
    options:["C = A·B", "C = A+B", "C = A⊕B", "C = (A⊕B)'"],
    answer:0,
    explain:"반가산기의 합(S)은 S = A⊕B, 자리올림수(C)는 C = A·B로 계산됩니다."
  },
  {
    type:"written",
    q:"2ⁿ개의 입력 중 1개를 선택하여 한 곳으로 출력하는 조합논리회로는?",
    kind:"mc",
    options:["멀티플렉서(MUX)", "디멀티플렉서(DeMUX)", "인코더(Encoder)", "디코더(Decoder)"],
    answer:0,
    explain:"멀티플렉서(MUX)는 2ⁿ개의 입력선 중 하나를 선택하여 한 개의 출력선으로 내보내는 회로입니다. 디멀티플렉서(DeMUX)는 반대로 하나의 입력을 2ⁿ개의 출력선 중 하나로 분배합니다."
  },
  {
    type:"written",
    q:"해밍 코드(Hamming Code)에 대한 설명으로 옳은 것은?",
    kind:"mc",
    options:[
      "2비트의 오류를 검출하고 1비트의 오류를 교정할 수 있다.",
      "1비트의 오류만 검출할 수 있고 교정은 할 수 없다.",
      "오류 검출만 가능하며 스스로 교정할 수 없다.",
      "정마크(정스페이스) 방식으로 오류를 검출한다."
    ],
    answer:0,
    explain:"해밍 코드는 오류를 스스로 검출하고 교정할 수 있는 코드로, 2비트의 오류 검출과 1비트의 오류 교정이 가능합니다. 정마크(정스페이스) 방식은 2-out-of-5 코드의 특징입니다."
  },
  {
    type:"written",
    q:"우수(Even) 패리티 검사를 사용할 때, 데이터 비트 중 1의 개수가 홀수라면 패리티 비트로 추가되는 값은?",
    kind:"mc",
    options:["1", "0", "2", "데이터에 따라 정할 수 없다"],
    answer:0,
    explain:"우수 패리티는 데이터와 패리티 비트를 합한 1의 개수를 짝수로 맞춥니다. 데이터의 1의 개수가 홀수이면 패리티 비트에 1을 추가해야 전체 1의 개수가 짝수가 됩니다."
  },
  {
    type:"written",
    q:"인터럽트 우선순위를 판별하는 방식 중, 소프트웨어적으로 각 장치를 순서대로 검사하는 방식은?",
    kind:"mc",
    options:["폴링(Polling)", "데이지 체인(Daisy Chain)", "병렬 우선순위 처리 방식", "벡터 인터럽트 방식"],
    answer:0,
    explain:"폴링은 소프트웨어적으로 각 장치의 상태를 순서대로 검사하여 인터럽트를 요청한 장치를 찾는 방식입니다. 데이지 체인과 병렬 우선순위 처리 방식은 하드웨어적으로 우선순위를 판별합니다."
  },
  {
    type:"written",
    q:"데이터베이스의 3단계 스키마(개념, 외부, 내부) 중, 데이터베이스 전체를 기관이나 조직체의 관점에서 정의한 것은?",
    kind:"mc",
    options:["개념 스키마", "외부 스키마", "내부 스키마", "서브 스키마"],
    answer:0,
    explain:"개념 스키마는 데이터베이스 전체를 기관이나 조직체의 관점에서 정의한 통합 스키마입니다. 외부 스키마는 개별 사용자 관점, 내부 스키마는 물리적 저장 구조를 정의합니다."
  },
  {
    type:"written",
    q:"관계형 데이터베이스에서 하나의 릴레이션(테이블)이 갖는 속성(Attribute)의 개수를 의미하는 용어는?",
    kind:"mc",
    options:["차수(Degree)", "기수(Cardinality)", "도메인(Domain)", "튜플(Tuple)"],
    answer:0,
    explain:"차수(Degree)는 하나의 릴레이션이 갖는 속성(열)의 개수를, 기수(Cardinality)는 튜플(행)의 개수를 의미합니다."
  },
  {
    type:"written",
    q:"SQL에서 DROP CASCADE 옵션에 대한 설명으로 옳은 것은?",
    kind:"mc",
    options:[
      "제거할 요소를 참조하는 다른 모든 개체도 함께 제거한다.",
      "제거할 요소가 다른 개체에서 참조 중이면 제거하지 않는다.",
      "테이블의 데이터만 삭제하고 구조는 유지한다.",
      "뷰(View)를 삭제할 때만 사용할 수 있는 옵션이다."
    ],
    answer:0,
    explain:"DROP CASCADE는 제거하려는 개체를 참조하는 다른 모든 개체까지 연쇄적으로 함께 제거합니다. 반대로 DROP RESTRICT는 참조 중인 경우 제거를 거부합니다."
  },
  {
    type:"written",
    q:"운영체제의 발달 과정을 순서대로 옳게 나열한 것은?",
    kind:"mc",
    options:[
      "일괄 처리 → 다중 프로그래밍 → 시분할 → 다중 처리",
      "다중 처리 → 시분할 → 일괄 처리 → 다중 프로그래밍",
      "시분할 → 일괄 처리 → 다중 처리 → 다중 프로그래밍",
      "다중 프로그래밍 → 일괄 처리 → 다중 처리 → 시분할"
    ],
    answer:0,
    explain:"운영체제는 단일 처리 → 일괄 처리 → 다중 프로그래밍 → 시분할 → 다중 처리 → 실시간 → 범용 → 분산 순으로 발달하였습니다."
  },
  {
    type:"written",
    q:"DOS(MS-DOS)의 부팅 순서로 옳은 것은?",
    kind:"mc",
    options:[
      "IO.SYS → MSDOS.SYS → CONFIG.SYS → COMMAND.COM → AUTOEXEC.BAT",
      "MSDOS.SYS → IO.SYS → COMMAND.COM → CONFIG.SYS → AUTOEXEC.BAT",
      "COMMAND.COM → IO.SYS → MSDOS.SYS → CONFIG.SYS → AUTOEXEC.BAT",
      "IO.SYS → CONFIG.SYS → MSDOS.SYS → AUTOEXEC.BAT → COMMAND.COM"
    ],
    answer:0,
    explain:"DOS는 IO.SYS → MSDOS.SYS → CONFIG.SYS → COMMAND.COM → AUTOEXEC.BAT 순서(I.M.C.C.A)로 부팅됩니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 정지-대기(Stop-and-Wait) ARQ 방식에서 수신 측이 오류 없이 데이터를 수신했을 때 보내는 긍정 응답 신호를 영문 약자로 쓰시오.",
    kind:"short",
    accept:["ACK"],
    answerDisplay:"ACK",
    explain:"정지-대기 ARQ는 송신 측이 한 블록을 보낸 후 수신 측의 응답을 기다리는 방식입니다. 오류 없이 수신하면 ACK(긍정 응답), 오류가 있으면 NAK(부정 응답)를 보냅니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] UNIX에서 '파일1'에 대해 그룹(g)과 기타 사용자(o)의 쓰기(w) 권한을 제거하는 명령어를 작성하시오.",
    kind:"short",
    accept:["chmod go-w 파일1"],
    answerDisplay:"chmod go-w 파일1",
    explain:"chmod 명령어는 파일의 접근 권한을 변경합니다. go-w는 그룹(g)과 기타 사용자(o)에게서 쓰기(w) 권한을 제거(-)하라는 의미입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 한 면에 트랙이 40개, 트랙당 섹터가 20개, 섹터당 워드가 25개인 양면 디스크의 총 저장 가능한 워드 수를 구하시오. (단위 없이 숫자만)",
    kind:"short",
    accept:["40000","40,000"],
    answerDisplay:"40000",
    explain:"저장 가능한 워드 수 = 트랙 수 × 트랙당 섹터 수 × 섹터당 워드 수 × 면 수 입니다. 양면 디스크이므로 면 수는 2이며, 40 × 20 × 25 × 2 = 40,000 워드입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] '제품' 테이블에서 '가격'이 10000 이상인 레코드의 개수를 조회하는 SQL문을 작성하시오.",
    kind:"short",
    accept:[
      "SELECT COUNT(*) FROM 제품 WHERE 가격>=10000",
      "SELECT COUNT(*) FROM 제품 WHERE 가격 >= 10000",
      "SELECT COUNT(*) FROM 제품 WHERE 가격>= 10000",
      "SELECT COUNT(*) FROM 제품 WHERE 가격 >=10000"
    ],
    answerDisplay:"SELECT COUNT(*) FROM 제품 WHERE 가격 >= 10000;",
    explain:"레코드 개수를 구할 때는 COUNT(*) 함수를 사용하며, 조건은 WHERE 절에 작성합니다. '이상'은 >= 연산자로 표현합니다."
  }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>
