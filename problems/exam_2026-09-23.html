<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-09-23 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    type:"written",
    q:"드모르간(De Morgan)의 법칙을 올바르게 나타낸 것은?",
    kind:"mc",
    options:[
      "NOT(A+B) = NOT(A) + NOT(B)",
      "NOT(A+B) = NOT(A) · NOT(B)",
      "NOT(A·B) = NOT(A) · NOT(B)",
      "A + B = NOT(A) · NOT(B)"
    ],
    answer:1,
    explain:"드모르간의 법칙은 NOT(A+B) = NOT(A)·NOT(B), NOT(A·B) = NOT(A)+NOT(B) 로 정의됩니다. OR의 부정은 AND로, AND의 부정은 OR로 바뀌면서 각 항이 부정됩니다."
  },
  {
    type:"written",
    q:"RS 플립플롭의 불능 상태(입력 1,1일 때 출력이 정의되지 않는 문제)를 보완하여, 두 입력이 모두 1일 때 출력이 반전(토글)되도록 개선한, 가장 널리 사용되는 플립플롭은?",
    kind:"mc",
    options:["D 플립플롭", "JK 플립플롭", "T 플립플롭", "RS 플립플롭"],
    answer:1,
    explain:"JK 플립플롭은 RS 플립플롭에서 두 입력이 모두 1일 때 발생하는 불능(부정) 상태를 보완한 것으로, 이 경우 출력이 토글되도록 설계되어 가장 널리 사용되는 플립플롭입니다."
  },
  {
    type:"written",
    q:"2ⁿ개의 입력선 중 1개를 선택하여 1개의 출력선으로 내보내는 조합논리회로는?",
    kind:"mc",
    options:["멀티플렉서(MUX)", "디멀티플렉서(DeMUX)", "인코더(Encoder)", "디코더(Decoder)"],
    answer:0,
    explain:"멀티플렉서(MUX)는 2ⁿ개의 입력 중 1개를 선택하여 한 곳으로 출력하는 회로입니다. 반대로 디멀티플렉서(DeMUX)는 1개의 입력선 정보를 2ⁿ개의 출력선 중 1개를 선택하여 출력합니다."
  },
  {
    type:"written",
    q:"해밍 코드(Hamming Code)의 오류 검출 및 교정 능력으로 옳은 것은?",
    kind:"mc",
    options:[
      "1비트 오류 검출, 1비트 오류 교정",
      "2비트 오류 검출, 1비트 오류 교정",
      "2비트 오류 검출, 2비트 오류 교정",
      "오류 검출만 가능하고 교정은 불가능하다"
    ],
    answer:1,
    explain:"해밍 코드는 스스로 오류를 검출·교정할 수 있는 코드로, 2비트 오류까지 검출할 수 있고 1비트 오류는 교정까지 가능합니다."
  },
  {
    type:"written",
    q:"연산 수행 후에도 입력 자료가 그대로 보존되며, 범용 레지스터(GPR)를 가진 컴퓨터에서 주로 사용되는 명령어 형식은?",
    kind:"mc",
    options:["0-주소 명령어", "1-주소 명령어", "2-주소 명령어", "3-주소 명령어"],
    answer:3,
    explain:"3-주소 명령어는 연산 결과를 별도의 주소에 저장하여 원래의 입력 자료를 보존하며, 범용 레지스터(GPR)를 가진 컴퓨터에서 주로 사용됩니다. 2-주소 명령어는 연산 결과를 Operand1에 저장하여 원래 자료가 파괴된다는 점에서 차이가 있습니다."
  },
  {
    type:"written",
    q:"입출력 장치를 CPU에 종속시키지 않고 독립적으로 관리하며, 입출력 작업을 제어하는 장치는?",
    kind:"mc",
    options:["채널(Channel)", "인터럽트(Interrupt)", "버퍼(Buffer)", "스풀링(Spooling)"],
    answer:0,
    explain:"채널(Channel)은 입출력 장치를 CPU에 종속시키지 않고 독립적으로 관리하는 장치입니다. 인터럽트는 예외 상황을 CPU에 알리는 기능, 버퍼는 두 장치 간 속도 차이 극복, 스풀링은 보조기억장치를 매개로 한 다중작업 처리 방식입니다."
  },
  {
    type:"written",
    q:"자외선(UV)을 이용하여 기록된 내용을 지우고 다시 프로그램을 입력할 수 있는 반도체 기억장치는?",
    kind:"mc",
    options:["ROM", "RAM", "EPROM", "캐시 메모리"],
    answer:2,
    explain:"EPROM(Erasable Programmable ROM)은 자외선을 이용해 기록 내용을 지우고 다시 프로그래밍할 수 있는 반도체 기억장치입니다."
  },
  {
    type:"written",
    q:"데이터베이스의 3단계 스키마(외부/개념/내부)에 해당하지 않는 것은?",
    kind:"mc",
    options:["외부 스키마", "개념 스키마", "내부 스키마", "물리 스키마"],
    answer:3,
    explain:"데이터베이스의 3단계 스키마는 외부 스키마, 개념 스키마, 내부 스키마(개.외.내)로 구성됩니다. '물리 스키마'는 표준 3단계 스키마 명칭에 해당하지 않습니다."
  },
  {
    type:"written",
    q:"SQL의 DROP문 옵션 중, 제거하려는 요소를 참조하는 다른 개체까지 함께 제거하는 것은?",
    kind:"mc",
    options:["RESTRICT", "CASCADE", "DISTINCT", "DEFAULT"],
    answer:1,
    explain:"DROP CASCADE는 제거할 요소를 참조하는 다른 개체까지 함께 제거하며, DROP RESTRICT는 제거할 요소가 참조 중이면 제거하지 않습니다."
  },
  {
    type:"written",
    q:"운영체제의 발달 순서로 옳은 것은?",
    kind:"mc",
    options:[
      "일괄 처리 → 다중 프로그래밍 → 시분할 시스템 → 다중 처리 시스템",
      "다중 처리 시스템 → 시분할 시스템 → 다중 프로그래밍 → 일괄 처리",
      "시분할 시스템 → 일괄 처리 → 다중 처리 시스템 → 다중 프로그래밍",
      "다중 프로그래밍 → 일괄 처리 → 다중 처리 시스템 → 시분할 시스템"
    ],
    answer:0,
    explain:"운영체제는 단일 처리 → 일괄 처리 → 다중 프로그래밍 → 시분할 → 다중 처리 → 실시간 → 범용 → 분산 순서로 발달하였습니다."
  },
  {
    type:"written",
    q:"UNIX에서 'ls -l' 명령 실행 결과, 파일 종류를 나타내는 첫 글자가 'd'로 표시된 경우 이 파일의 종류는?",
    kind:"mc",
    options:["일반 파일", "디렉터리", "블록형 특수 파일", "링크 파일"],
    answer:1,
    explain:"UNIX의 파일 종류 표시는 b(블록형 특수), c(문자형 특수), d(디렉터리), l(링크)로 구분되며, 'd'는 디렉터리를 의미합니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] RS-232C 커넥터에서 3번 핀이 담당하는 기능을 쓰시오.",
    kind:"short",
    accept:["수신 데이터","수신데이터"],
    answerDisplay:"수신 데이터",
    explain:"RS-232C 25핀 커넥터에서 2번 핀은 송신 데이터, 3번 핀은 수신 데이터, 4번 핀은 송신 요청, 5번 핀은 송신 준비 완료를 담당합니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 대역폭(W)이 3,000Hz이고 신호 대 잡음비(S/N)가 1,023일 때, 섀넌(Shannon)의 정리에 따른 최대 통신 용량(bps)을 구하시오. (단위 없이 숫자만)",
    kind:"short",
    accept:["30000","30,000"],
    answerDisplay:"30000bps",
    explain:"섀넌의 통신 용량 공식은 C = W·log2(1+S/N) 입니다. 1+S/N = 1,024 = 2¹⁰ 이므로 log2(1,024) = 10. 따라서 C = 3,000 × 10 = 30,000bps 입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 2진수 111010을 8진수로 변환한 값을 쓰시오.",
    kind:"short",
    accept:["72"],
    answerDisplay:"72",
    explain:"2진수를 8진수로 변환할 때는 오른쪽부터 3자리씩 묶어 변환합니다. 111(=7), 010(=2) 이므로 111010(2) = 72(8) 입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] '제품' 테이블에서 '재고'가 0보다 작은 모든 튜플을 검색하는 SQL문을 작성하시오.",
    kind:"short",
    accept:["SELECT * FROM 제품 WHERE 재고<0","SELECT * FROM 제품 WHERE 재고 < 0","SELECT * FROM 제품 WHERE 재고 <0","SELECT * FROM 제품 WHERE 재고< 0"],
    answerDisplay:"SELECT * FROM 제품 WHERE 재고 < 0;",
    explain:"조건에 맞는 모든 튜플을 검색할 때는 SELECT * FROM 테이블명 WHERE 조건 형식을 사용합니다. '재고가 0보다 작다'는 조건은 재고 < 0 으로 표현합니다."
  }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>
