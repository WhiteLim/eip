<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-10-29 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {type:"written",q:"프로그램 카운터(PC)에 대한 설명으로 옳은 것은?",kind:"mc",
   options:["현재 실행 중인 명령어를 기억한다.","다음에 실행할 명령어의 주소를 기억한다.","연산 결과를 일시적으로 저장한다.","기억장치를 출입하는 데이터를 일시적으로 저장한다."],answer:1,
   explain:"프로그램 카운터(PC)는 다음에 실행할 명령어의 주소를 기억합니다. 현재 실행 중인 명령어는 명령 레지스터(IR), 연산 결과 저장은 누산기, 기억장치 출입 데이터는 MBR이 담당합니다."},
  {type:"written",q:"입력이 서로 같을 때만 출력이 1이 되는 논리 게이트는?",kind:"mc",
   options:["XOR","XNOR","NAND","NOR"],answer:1,
   explain:"XNOR는 두 입력이 같을 때(0,0 또는 1,1) 1을 출력합니다. XOR는 입력이 서로 다를 때 1을 출력합니다."},
  {type:"written",q:"2진수 1010과 0110을 XOR 연산한 결과는?",kind:"mc",
   options:["1100","1110","0010","1000"],answer:0,
   explain:"XOR는 비트가 서로 다르면 1입니다. 1010 ⊕ 0110 = 1100 입니다."},
  {type:"written",q:"주소 지정 방식 중 명령어의 주소 부분이 실제 데이터가 저장된 기억장소의 주소를 직접 지정하는 방식은?",kind:"mc",
   options:["즉시 주소 지정","직접 주소 지정","간접 주소 지정","상대 주소 지정"],answer:1,
   explain:"직접 주소 지정(Direct Addressing)은 명령어의 주소 필드가 유효 주소 그 자체인 방식입니다. 즉시 주소 지정은 주소 필드가 데이터 자체이고, 간접 주소 지정은 주소 필드가 데이터의 주소를 담은 번지를 가리킵니다."},
  {type:"written",q:"입출력 제어 방식 중 CPU가 입출력 완료 여부를 계속 확인하는 방식으로, CPU의 효율이 가장 낮은 것은?",kind:"mc",
   options:["인터럽트 방식","DMA 방식","프로그램에 의한 입출력(폴링)","채널 방식"],answer:2,
   explain:"프로그램에 의한 입출력(Polling)은 CPU가 주기적으로 입출력 장치의 상태를 확인하므로 CPU 낭비가 큽니다. 인터럽트, DMA, 채널 방식은 CPU 부담을 줄이는 방식입니다."},
  {type:"written",q:"관계 데이터베이스에서 릴레이션의 행(Row)을 가리키는 용어는?",kind:"mc",
   options:["속성(Attribute)","튜플(Tuple)","도메인(Domain)","차수(Degree)"],answer:1,
   explain:"튜플(Tuple)은 릴레이션의 행(레코드)이고, 속성(Attribute)은 열(필드)입니다. 튜플의 수를 카디널리티, 속성의 수를 차수(Degree)라고 합니다."},
  {type:"written",q:"SQL 명령어 중 DDL(데이터 정의어)에 해당하지 않는 것은?",kind:"mc",
   options:["CREATE","ALTER","DROP","SELECT"],answer:3,
   explain:"DDL에는 CREATE, ALTER, DROP이 있습니다. SELECT는 데이터를 조회하는 DML(데이터 조작어)입니다."},
  {type:"written",q:"UNIX에서 파일의 접근 권한을 변경하는 명령어는?",kind:"mc",
   options:["chmod","chown","cat","ls"],answer:0,
   explain:"chmod는 파일의 접근 권한을 변경하는 명령어입니다. chown은 소유자 변경, cat은 파일 내용 출력, ls는 파일 목록 출력입니다."},
  {type:"written",q:"운영체제의 프로세스 스케줄링 방식 중 준비 상태 큐에 먼저 도착한 프로세스를 먼저 처리하는 비선점형 방식은?",kind:"mc",
   options:["FCFS","SJF","Round Robin","SRT"],answer:0,
   explain:"FCFS(First Come First Served)는 도착 순서대로 처리하는 비선점형 방식입니다. Round Robin과 SRT는 선점형 방식입니다."},
  {type:"written",q:"통신 회선의 데이터 전송 방식 중 양쪽 방향으로 동시에 전송이 가능한 방식은?",kind:"mc",
   options:["단방향 통신","반이중 통신","전이중 통신","직렬 통신"],answer:2,
   explain:"전이중(Full Duplex) 통신은 양방향 동시 전송이 가능합니다(예: 전화). 반이중은 양방향이지만 한 번에 한 방향씩만 전송하며(예: 무전기), 단방향은 한쪽으로만 전송합니다."},
  {type:"written",q:"OSI 7계층 중 경로 설정(Routing)과 패킷 전달을 담당하는 계층은?",kind:"mc",
   options:["물리 계층","데이터 링크 계층","네트워크 계층","전송 계층"],answer:2,
   explain:"네트워크 계층은 최적의 경로 설정(라우팅)과 패킷 전달을 담당합니다. 대표 프로토콜은 IP입니다."},
  {type:"practical",q:"[실기 단답형] 10진수 45를 2진수로 변환한 값을 쓰시오.",kind:"short",
   accept:["101101"],answerDisplay:"101101",
   explain:"45를 2로 계속 나누면 나머지가 1,0,1,1,0,1 순으로 나오며, 역순으로 읽으면 101101(2)입니다. (32+8+4+1=45)"},
  {type:"practical",q:"[실기 단답형] '학생' 테이블에서 '이름' 속성만 중복 없이 조회하는 SQL문의 빈칸을 채우시오.\nSELECT ______ 이름 FROM 학생;",kind:"short",
   accept:["DISTINCT"],answerDisplay:"DISTINCT",
   explain:"SELECT 문에서 DISTINCT 키워드를 사용하면 중복된 튜플을 제거하고 한 번만 출력합니다."},
  {type:"practical",q:"[실기 단답형] 4비트로 표현할 수 있는 서로 다른 정보의 최대 가짓수를 쓰시오. (단위 없이 숫자만)",kind:"short",
   accept:["16"],answerDisplay:"16",
   explain:"n비트로 표현 가능한 정보의 가짓수는 2ⁿ입니다. 따라서 2⁴ = 16가지입니다."},
  {type:"practical",q:"[실기 단답형] 유니캐스트·멀티캐스트와 달리, 같은 네트워크의 모든 호스트에게 데이터를 전송하는 방식의 이름을 한글로 쓰시오.",kind:"short",
   accept:["브로드캐스트","브로드캐스팅","broadcast"],answerDisplay:"브로드캐스트(Broadcast)",
   explain:"브로드캐스트는 같은 네트워크에 속한 모든 호스트에게 전송하는 방식이며, 멀티캐스트는 특정 그룹에게, 유니캐스트는 특정 한 호스트에게 전송합니다."}
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>

</body>
</html>
