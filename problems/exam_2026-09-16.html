<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-09-16 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    type:"written",
    q:"명령어 실행 중 기억장치를 출입하는 데이터·메모리·워드를 일시적으로 저장하는 레지스터는?",
    kind:"mc",
    options:["프로그램 카운터(PC)", "메모리 버퍼 레지스터(MBR)", "명령 레지스터(IR)", "누산기(Accumulator)"],
    answer:1,
    explain:"메모리 버퍼 레지스터(MBR)는 기억장치를 출입하는 데이터·메모리·워드를 일시적으로 저장하는 역할을 합니다. PC는 다음에 실행할 명령어의 주소를, IR은 현재 실행 중인 명령어를, 누산기는 연산 결과를 저장합니다."
  },
  {
    type:"written",
    q:"플립플롭(Flip-Flop) 중, 두 입력이 모두 1일 때 이전 상태를 보수(반전)시키며 현재 가장 널리 사용되는 것은?",
    kind:"mc",
    options:["RS 플립플롭", "D 플립플롭", "JK 플립플롭", "T 플립플롭"],
    answer:2,
    explain:"JK 플립플롭은 RS 플립플롭에서 (1,1) 입력 시 상태가 정의되지 않는 문제를 보완한 형태로, 두 입력이 모두 1이면 이전 상태를 보수(반전)시키며 현재 가장 널리 사용되는 플립플롭입니다."
  },
  {
    type:"written",
    q:"자료의 구성 단위를 작은 것부터 큰 순서로 옳게 나열한 것은?",
    kind:"mc",
    options:[
      "바이트 → 니블 → 워드 → 필드",
      "니블 → 바이트 → 워드 → 필드",
      "워드 → 필드 → 니블 → 바이트",
      "필드 → 워드 → 바이트 → 니블"
    ],
    answer:1,
    explain:"자료의 구성 단위는 비트 → 니블 → 바이트 → 워드 → 필드 → 레코드 → 블록 → 파일 → 데이터베이스 순서로 커집니다."
  },
  {
    type:"written",
    q:"입출력 장치를 CPU에 종속되지 않고 독립적으로 관리하며 데이터 전송을 담당하는 장치는?",
    kind:"mc",
    options:["채널(Channel)", "인터럽트(Interrupt)", "레지스터(Register)", "연산장치(ALU)"],
    answer:0,
    explain:"채널(Channel)은 CPU에 종속적이지 않고 독립적으로 입출력을 관리하는 장치입니다."
  },
  {
    type:"written",
    q:"인터럽트 우선순위를 판별하는 방식 중, 별도의 하드웨어 없이 프로그램(소프트웨어)이 각 장치를 순서대로 검사하는 방식은?",
    kind:"mc",
    options:["폴링(Polling)", "데이지 체인(Daisy Chain)", "병렬 우선 처리", "DMA"],
    answer:0,
    explain:"폴링(Polling)은 소프트웨어적으로 각 장치를 순서대로 검사하여 인터럽트를 요청한 장치를 찾는 방식입니다. 데이지 체인과 병렬 우선 처리는 하드웨어 방식입니다."
  },
  {
    type:"written",
    q:"입출력장치와 CPU 사이의 속도 차이를 해결하는 기법 중, 보조기억장치를 매개로 하여 다중 작업(멀티프로그래밍) 환경에서 사용되는 것은?",
    kind:"mc",
    options:["버퍼링(Buffering)", "스풀링(Spooling)", "캐싱(Caching)", "페이징(Paging)"],
    answer:1,
    explain:"스풀링(Spooling)은 보조기억장치를 매개로 사용하며 다중 작업(멀티프로그래밍) 환경에 적합합니다. 버퍼링은 주기억장치를 매개로 하며 단일 작업에 적합합니다."
  },
  {
    type:"written",
    q:"데이터베이스의 3단계 스키마 구조에 해당하지 않는 것은?",
    kind:"mc",
    options:["개념 스키마", "외부 스키마", "내부 스키마", "물리 스키마"],
    answer:3,
    explain:"데이터베이스의 3단계 스키마는 개념 스키마, 외부 스키마, 내부 스키마로 구성됩니다(개.외.내). '물리 스키마'라는 용어는 3단계 스키마에 해당하지 않습니다."
  },
  {
    type:"written",
    q:"SQL 명령어 중 DDL(데이터 정의어)에 해당하지 않는 것은?",
    kind:"mc",
    options:["CREATE", "ALTER", "DROP", "INSERT"],
    answer:3,
    explain:"DDL(데이터 정의어)에는 CREATE, ALTER, DROP이 있습니다. INSERT는 DML(데이터 조작어)에 해당합니다."
  },
  {
    type:"written",
    q:"운영체제의 발달 과정을 옳은 순서대로 나열한 것은?",
    kind:"mc",
    options:[
      "일괄 처리 → 단일 처리 → 시분할 → 다중 프로그래밍",
      "단일 처리 → 일괄 처리 → 다중 프로그래밍 → 시분할",
      "다중 처리 → 단일 처리 → 일괄 처리 → 시분할",
      "시분할 → 다중 프로그래밍 → 일괄 처리 → 단일 처리"
    ],
    answer:1,
    explain:"운영체제는 단일 처리 → 일괄 처리 → 다중 프로그래밍 → 시분할 → 다중 처리 → 실시간 → 범용 → 분산 순으로 발달했습니다(단.일.프.시.다.실.범.분)."
  },
  {
    type:"written",
    q:"UNIX의 대표적인 쉘(Shell) 종류에 해당하지 않는 것은?",
    kind:"mc",
    options:["Korn Shell", "Bourne Shell", "C Shell", "Power Shell"],
    answer:3,
    explain:"UNIX의 대표적인 쉘은 Korn Shell, Bourne Shell, C Shell입니다(K.B.C). Power Shell은 Windows에서 사용되는 쉘입니다."
  },
  {
    type:"written",
    q:"데이터 통신 방식 중, 양방향 전송이 가능하지만 동시에는 한쪽 방향으로만 전송할 수 있는 방식은?",
    kind:"mc",
    options:["단방향(Simplex)", "반이중(Half-Duplex)", "전이중(Full-Duplex)", "베이스밴드(Baseband)"],
    answer:1,
    explain:"반이중(Half-Duplex) 방식은 양방향 전송이 가능하지만 동시에는 한쪽 방향으로만 전송할 수 있습니다. 전이중(Full-Duplex)은 양방향 동시 전송이 가능합니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 10진수 -25를 8비트 2의 보수(2's Complement)로 표현한 값을 2진수로 쓰시오.",
    kind:"short",
    accept:["11100111"],
    answerDisplay:"11100111",
    explain:"25를 2진수 8비트로 표현하면 00011001입니다. 각 비트를 반전(1의 보수)하면 11100110이 되고, 여기에 1을 더하면(2의 보수) 11100111이 됩니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 디스크 팩이 원판(디스크) 8장으로 구성되어 있을 때, 데이터 기록에 사용 가능한 면(Surface)의 수를 구하시오. (단위 없이 숫자만)",
    kind:"short",
    accept:["14"],
    answerDisplay:"14",
    explain:"기록 가능한 면의 수 = (디스크 팩 수 × 2) − 2 입니다. 맨 위와 맨 아래 면은 보호를 위해 기록에 사용하지 않으므로, 8장일 경우 8×2−2 = 14개 면을 사용할 수 있습니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 4위상 편이변조(4-PSK, 위상 4개 = 2비트 전송)를 사용하여 4,800bps의 데이터 신호 속도로 전송할 때, 필요한 변조 속도(Baud)를 구하시오. (단위 없이 숫자만)",
    kind:"short",
    accept:["2400","2,400"],
    answerDisplay:"2400Baud",
    explain:"변조 속도(Baud) = 신호 속도(bps) ÷ 변조 시 상태 변화 비트 수. 4위상(4-PSK)은 2²=4이므로 2비트를 전송합니다. 따라서 4,800 ÷ 2 = 2,400Baud 입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] IP 주소 210.100.50.5는 A, B, C, D 클래스 중 어느 클래스에 속하는지 쓰시오.",
    kind:"short",
    accept:["C","c","C클래스","Class C","클래스 C"],
    answerDisplay:"C 클래스",
    explain:"IP 주소의 첫 번째 옥텟 값이 192~223 범위이면 Class C에 해당합니다. 210은 이 범위에 속하므로 Class C이며, 기본 서브넷 마스크는 255.255.255.0입니다."
  }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>

</body>
</html>
