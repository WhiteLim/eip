<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제1회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제1회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-09-01 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    type:"written",
    q:"기억장치를 액세스하지 않고 스택(Stack)만으로 연산을 수행하는, Operand부가 없는 명령어 형식은?",
    kind:"mc",
    options:["0-주소 명령어","1-주소 명령어","2-주소 명령어","3-주소 명령어"],
    answer:0,
    explain:"0-주소 명령어는 Operand부 없이 연산자(OP-Code)만으로 구성되어, 스택에 자료를 넣고(PUSH) 빼면서(POP) 연산합니다. 1-주소 명령어는 누산기(Accumulator)를, 2·3-주소 명령어는 Operand부를 2개·3개 사용합니다."
  },
  {
    type:"written",
    q:"다음 진리표와 같은 결과를 내는 논리회로는 무엇인가?\nA=0,B=0 → 출력 0 / A=0,B=1 → 출력 0 / A=1,B=0 → 출력 0 / A=1,B=1 → 출력 1",
    kind:"mc",
    options:["AND","OR","NAND","XOR"],
    answer:0,
    explain:"입력 두 값이 모두 1일 때만 출력이 1이 되는 것은 AND 게이트의 진리표입니다. OR는 하나라도 1이면 1, NAND는 AND의 반대, XOR는 두 입력이 서로 다를 때 1이 출력됩니다."
  },
  {
    type:"written",
    q:"다음 중 로더(Loader)의 기능에 해당하지 않는 것은?",
    kind:"mc",
    options:["번역(Compile)","할당(Allocation)","재배치(Relocation)","연결(Linking)"],
    answer:0,
    explain:"번역(Compile)은 컴파일러(Compiler)의 역할입니다. 로더는 실행 프로그램을 주기억장치에 적재하기 위해 할당(기억공간 확보), 연결(부 프로그램 연결), 재배치(실제 주소로 변환), 적재(주기억장치에 올림) 기능을 수행합니다."
  },
  {
    type:"written",
    q:"명령어의 주소 부분에 인덱스 레지스터의 값을 더해 유효 주소를 계산하며, 2개의 레지스터를 사용해 순차적인 주소지정에 유리한 방식은?",
    kind:"mc",
    options:["색인(Index) 주소지정","직접(Direct) 주소지정","간접(Indirect) 주소지정","상대(Relative) 주소지정"],
    answer:0,
    explain:"색인(인덱스) 주소지정방식은 인덱스 레지스터의 값을 Operand에 더해 유효 주소를 구하는 방식으로, 배열처럼 순차적으로 주소를 증가시키며 접근할 때 유리합니다."
  },
  {
    type:"written",
    q:"16진수 FF를 10진수로 변환하면?",
    kind:"mc",
    options:["255","254","256","257"],
    answer:0,
    explain:"FF(16) = 15×16¹ + 15×16⁰ = 240 + 15 = 255 입니다."
  },
  {
    type:"written",
    q:"2진수 1011을 그레이 코드(Gray Code)로 변환한 값은?",
    kind:"mc",
    options:["1110","1010","0111","0100"],
    answer:0,
    explain:"그레이 코드 변환: 최상위 비트는 그대로 내려쓰고, 그 다음 비트부터는 바로 앞 2진수 비트와 XOR 연산합니다. 1⊕0=1, 0⊕1=1, 1⊕1=0 이므로 1,1,1,0 = 1110 입니다."
  },
  {
    type:"written",
    q:"누를 때마다 출력이 ON과 OFF로 서로 반대(보수)로 바뀌는 토글 스위치 형태의 동작을 하는 플립플롭은?",
    kind:"mc",
    options:["T 플립플롭","RS 플립플롭","D 플립플롭","JK 플립플롭"],
    answer:0,
    explain:"T 플립플롭은 입력이 1일 때마다 현재 상태의 보수(반대값)를 출력하는, ON/OFF가 교차되는 토글 스위치 형태의 플립플롭입니다."
  },
  {
    type:"written",
    q:"하나 이상의 기본 테이블(Table)로부터 유도되어 만들어지며, 실제 데이터를 저장하지 않는 가상 테이블은?",
    kind:"mc",
    options:["뷰(VIEW)","도메인(DOMAIN)","스키마(SCHEMA)","인덱스(INDEX)"],
    answer:0,
    explain:"뷰(VIEW)는 하나 이상의 기본 테이블로부터 유도된 가상 테이블로, 실제로 데이터를 저장하지 않지만 사용자에게는 테이블처럼 보이며 관리와 명령문 작성이 간단해지는 장점이 있습니다."
  },
  {
    type:"written",
    q:"UNIX에서 현재 작업 중인 디렉터리의 경로를 화면에 출력하는 명령어는?",
    kind:"mc",
    options:["pwd","ls","cd","cp"],
    answer:0,
    explain:"pwd(Print Working Directory)는 현재 작업 디렉터리의 전체 경로를 출력합니다. ls는 파일 목록 표시, cd는 디렉터리 이동, cp는 파일 복사 명령입니다."
  },
  {
    type:"written",
    q:"DOS(MS-DOS)에서 새로운 서브 디렉터리를 만드는 명령어는?",
    kind:"mc",
    options:["MD","COPY","DEL","DIR"],
    answer:0,
    explain:"MD(Make Directory)는 새로운 디렉터리를 생성하는 명령어입니다. COPY는 파일 복사, DEL은 파일 삭제, DIR은 파일 목록 확인 명령어입니다."
  },
  {
    type:"written",
    q:"회선 교환(Circuit Switching) 방식에 대한 설명으로 옳지 않은 것은?",
    kind:"mc",
    options:[
      "접속에는 짧은 시간이 소요되며 전송 지연은 길다.",
      "고정된 대역폭을 사용하는 전송 방식이다.",
      "실시간 전송에 적합하다.",
      "속도나 코드 변환이 불가능하다."
    ],
    answer:0,
    explain:"회선 교환 방식은 접속(회선 연결)에 비교적 긴 시간이 걸리지만, 일단 연결되면 전송 지연이 거의 없어 실시간 전송에 적합합니다. 따라서 '접속은 짧고 전송 지연은 길다'는 설명은 실제와 반대되어 옳지 않습니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 2진수 11011을 8진수로 변환한 값을 쓰시오.",
    kind:"short",
    accept:["33"],
    answerDisplay:"33",
    explain:"2진수를 8진수로 바꿀 때는 소수점 기준으로 3자리씩 묶습니다. 11011은 011 011로 묶이며, 각각 3(=011), 3(=011)이므로 8진수로 33 입니다. (11011₂ = 27₁₀ = 33₈)"
  },
  {
    type:"practical",
    q:"[실기 단답형] '학생' 테이블에서 '학과' 값이 '전산과'인 레코드를 모두 삭제하는 SQL문을 작성하시오.",
    kind:"short",
    accept:["DELETE FROM 학생 WHERE 학과='전산과'","DELETE FROM 학생 WHERE 학과=\"전산과\""],
    answerDisplay:"DELETE FROM 학생 WHERE 학과='전산과';",
    explain:"DELETE는 레코드(행) 단위로 삭제하므로 속성명을 따로 쓰지 않습니다. FROM 절에 테이블명, WHERE 절에 삭제 조건을 기술합니다. 따옴표 종류나 세미콜론 유무는 채점 기준에 따라 다를 수 있으니 모범 답안과 비교해 보세요."
  },
  {
    type:"practical",
    q:"[실기 단답형] 6개의 비트(bit)로 표현할 수 있는 정보의 최대 가짓수를 쓰시오.",
    kind:"short",
    accept:["64","64가지"],
    answerDisplay:"64",
    explain:"n개의 비트로 표현 가능한 정보의 가짓수는 2ⁿ 입니다. 6비트이므로 2⁶ = 64가지입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] IP 주소를 물리적 주소인 MAC 주소로 변환해주는 프로토콜의 이름(약자)을 쓰시오.",
    kind:"short",
    accept:["ARP"],
    answerDisplay:"ARP",
    explain:"ARP(Address Resolution Protocol)는 네트워크상에서 IP 주소를 이용해 해당 장치의 물리적 주소(MAC 주소)를 알아내는 프로토콜입니다."
  }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>

</body>
