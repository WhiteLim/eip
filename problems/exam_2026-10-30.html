<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-10-30 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    "type": "written",
    "q": "인터럽트 우선순위 판별 방식 중 소프트웨어 방식에 해당하는 것은?",
    "kind": "mc",
    "options": [
      "폴링(Polling)",
      "데이지 체인(Daisy Chain)",
      "병렬 우선 처리",
      "DMA"
    ],
    "answer": 0,
    "explain": "인터럽트 우선순위 판별은 폴링(소프트웨어), 데이지 체인·병렬 우선 처리(하드웨어) 방식이 있습니다. DMA는 우선순위 판별 방식이 아닙니다."
  },
  {
    "type": "written",
    "q": "주소 지정 방식 중 프로그램 카운터(PC)의 값과 주소 부분(Operand)을 더하여 유효 주소를 구하는 방식은?",
    "kind": "mc",
    "options": [
      "상대(Relative) 주소 지정",
      "직접(Direct) 주소 지정",
      "간접(Indirect) 주소 지정",
      "즉치(Immediate) 주소 지정"
    ],
    "answer": 0,
    "explain": "상대 주소 지정은 PC + Operand로 유효 주소를 계산합니다. 직접은 실제 데이터의 절대 주소, 간접은 포인터의 주소, 즉치는 자료를 직접 저장합니다."
  },
  {
    "type": "written",
    "q": "누산기(Accumulator)를 이용하여 연산을 처리하는 명령어 형식은?",
    "kind": "mc",
    "options": [
      "0주소 명령어",
      "1주소 명령어",
      "2주소 명령어",
      "3주소 명령어"
    ],
    "answer": 1,
    "explain": "1주소 명령어는 누산기를 이용해 처리합니다. 0주소는 스택, 2주소는 연산 결과를 Operand1에 저장(원 자료 파괴), 3주소는 입력 자료를 보존합니다."
  },
  {
    "type": "written",
    "q": "오류를 스스로 검출하고 교정할 수 있는 코드는?",
    "kind": "mc",
    "options": [
      "해밍 코드",
      "패리티 검사 코드",
      "그레이 코드",
      "BCD 코드"
    ],
    "answer": 0,
    "explain": "해밍 코드는 2비트 오류 검출, 1비트 오류 교정이 가능합니다. 패리티 코드는 1비트 오류만 검출할 수 있습니다."
  },
  {
    "type": "written",
    "q": "PCM(펄스 코드 변조)의 송신 측 처리 순서로 옳은 것은?",
    "kind": "mc",
    "options": [
      "표본화 → 양자화 → 부호화",
      "양자화 → 표본화 → 부호화",
      "부호화 → 표본화 → 양자화",
      "표본화 → 부호화 → 양자화"
    ],
    "answer": 0,
    "explain": "PCM 송신 측은 표본화 → 양자화 → 부호화(표.양.부), 수신 측은 복호화 → 여과화(복.여) 순서입니다."
  },
  {
    "type": "written",
    "q": "시간 조각(Time Slice)을 미리 정의하여 각 프로세스에 CPU를 번갈아 할당하는 선점형 스케줄링은?",
    "kind": "mc",
    "options": [
      "FIFO",
      "SRT",
      "RR(Round Robin)",
      "SJF"
    ],
    "answer": 2,
    "explain": "RR은 시간 조각을 정해 각 프로세스에 CPU를 제공하는 선점 방식입니다. FIFO는 비선점, SRT는 남은 실행 시간이 짧은 프로세스를 우선하는 선점 방식입니다."
  },
  {
    "type": "written",
    "q": "MS-DOS의 부팅에 필요한 필수 파일이 아닌 것은?",
    "kind": "mc",
    "options": [
      "IO.SYS",
      "MSDOS.SYS",
      "COMMAND.COM",
      "CONFIG.SYS"
    ],
    "answer": 3,
    "explain": "필수 파일은 IO.SYS, MSDOS.SYS, COMMAND.COM이며 루트 디렉터리에 있어야 합니다. CONFIG.SYS는 설정 파일로 필수가 아닙니다."
  },
  {
    "type": "written",
    "q": "UNIX의 쉘(Shell) 종류에 해당하지 않는 것은?",
    "kind": "mc",
    "options": [
      "Korn Shell",
      "Bourne Shell",
      "C Shell",
      "Kernel Shell"
    ],
    "answer": 3,
    "explain": "UNIX의 쉘은 Korn, Bourne, C Shell(K.B.C)입니다. 커널은 쉘과 별개의 구성 요소입니다."
  },
  {
    "type": "written",
    "q": "SQL의 DROP 문에서, 제거할 요소를 참조하는 다른 개체도 함께 제거하는 옵션은?",
    "kind": "mc",
    "options": [
      "CASCADE",
      "RESTRICT",
      "DISTINCT",
      "CHECK"
    ],
    "answer": 0,
    "explain": "DROP CASCADE는 참조하는 개체도 함께 제거하고, RESTRICT는 참조 중이면 제거하지 않습니다."
  },
  {
    "type": "written",
    "q": "IPv6 주소의 길이는?",
    "kind": "mc",
    "options": [
      "32비트",
      "64비트",
      "128비트",
      "256비트"
    ],
    "answer": 2,
    "explain": "IPv4는 8비트×4 = 32비트, IPv6는 16비트×8 = 128비트입니다."
  },
  {
    "type": "written",
    "q": "광섬유 케이블의 전송 손실에 해당하지 않는 것은?",
    "kind": "mc",
    "options": [
      "접속 손실",
      "산란 손실",
      "흡수 손실",
      "유전체 손실"
    ],
    "answer": 3,
    "explain": "광섬유의 손실은 접속 손실, 산란 손실, 흡수 손실이며 유전체 손실은 해당하지 않습니다."
  },
  {
    "type": "practical",
    "q": "[실기 단답형] 10진수 25를 2진수로 변환한 값을 쓰시오.",
    "kind": "short",
    "accept": [
      "11001"
    ],
    "answerDisplay": "11001",
    "explain": "25를 2로 계속 나눈 나머지를 역순으로 나열하면 11001입니다. (16+8+1 = 25)"
  },
  {
    "type": "practical",
    "q": "[실기 단답형] '학생' 테이블에서 '학과' 속성을 중복 없이 검색하는 SQL문을 작성하시오.",
    "kind": "short",
    "accept": [
      "SELECT DISTINCT 학과 FROM 학생",
      "SELECT DISTINCT(학과) FROM 학생"
    ],
    "answerDisplay": "SELECT DISTINCT 학과 FROM 학생;",
    "explain": "중복을 제거하고 검색할 때는 SELECT DISTINCT를 사용합니다."
  },
  {
    "type": "practical",
    "q": "[실기 단답형] 4위상 편이변조(2비트 전송)를 사용하여 1,200Baud로 전송할 때의 데이터 신호 속도(bps)를 구하시오. (숫자만)",
    "kind": "short",
    "accept": [
      "2400",
      "2,400"
    ],
    "answerDisplay": "2400bps",
    "explain": "신호 속도 = 변조 속도 × 상태 변화 비트 수 = 1,200 × 2 = 2,400bps 입니다."
  },
  {
    "type": "practical",
    "q": "[실기 단답형] 그레이 코드 1110을 2진수로 변환한 값을 쓰시오.",
    "kind": "short",
    "accept": [
      "1011"
    ],
    "answerDisplay": "1011",
    "explain": "첫 비트는 그대로 1, 이후 그 전 결과값과 XOR: 1⊕1=0, 0⊕1=1, 1⊕0=1 → 1011입니다."
  }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>

</body>
</html>
