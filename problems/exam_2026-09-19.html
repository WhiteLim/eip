<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 핵심요약 기반 연습문제 · 총 13문항 · 2026-09-19 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">13</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    type:"written",
    q:"해밍코드(Hamming Code)에 대한 설명으로 옳은 것은?",
    kind:"mc",
    options:[
      "오류 검출만 가능하고 정정은 불가능하다.",
      "1비트 오류를 검출하고 정정까지 할 수 있다.",
      "1의 개수가 홀수인지만 검사하는 코드이다.",
      "1의 개수가 짝수인지만 검사하는 코드이다."
    ],
    answer:1,
    explain:"해밍코드는 오류를 검출하는 것은 물론 2비트까지의 오류를 검출하고, 1비트 오류는 스스로 정정까지 할 수 있는 코드입니다. 단순히 1의 개수(홀수/짝수)만 검사하는 것은 패리티 검사 코드의 특징입니다."
  },
  {
    type:"written",
    q:"다음 중 데이터 처리 단위를 크기가 작은 것부터 큰 순서로 옳게 나열한 것은?",
    kind:"mc",
    options:[
      "Bit - Byte - Nibble - Word",
      "Bit - Nibble - Byte - Word",
      "Nibble - Bit - Byte - Word",
      "Byte - Nibble - Bit - Word"
    ],
    answer:1,
    explain:"데이터 처리 단위는 Bit(비트) → Nibble(니블, 4비트) → Byte(바이트, 8비트) → Word(워드) 순으로 커집니다."
  },
  {
    type:"written",
    q:"로더(Loader)의 기능 수행 순서로 옳은 것은?",
    kind:"mc",
    options:[
      "할당(Allocation) → 연결(Linking) → 재배치(Relocation) → 적재(Loading)",
      "연결(Linking) → 할당(Allocation) → 적재(Loading) → 재배치(Relocation)",
      "재배치(Relocation) → 할당(Allocation) → 연결(Linking) → 적재(Loading)",
      "적재(Loading) → 할당(Allocation) → 연결(Linking) → 재배치(Relocation)"
    ],
    answer:0,
    explain:"로더는 '할당(Allocation) → 연결(Linking) → 재배치(Relocation) → 적재(Loading)'의 순서로 기능을 수행하여 보조기억장치의 프로그램을 주기억장치에 올립니다."
  },
  {
    type:"written",
    q:"MS-DOS의 부팅(Booting) 순서로 옳은 것은?",
    kind:"mc",
    options:[
      "IO.SYS → MSDOS.SYS → CONFIG.SYS → COMMAND.COM → AUTOEXEC.BAT",
      "MSDOS.SYS → IO.SYS → COMMAND.COM → CONFIG.SYS → AUTOEXEC.BAT",
      "COMMAND.COM → IO.SYS → MSDOS.SYS → CONFIG.SYS → AUTOEXEC.BAT",
      "CONFIG.SYS → IO.SYS → MSDOS.SYS → AUTOEXEC.BAT → COMMAND.COM"
    ],
    answer:0,
    explain:"MS-DOS는 'IO.SYS → MSDOS.SYS → CONFIG.SYS → COMMAND.COM → AUTOEXEC.BAT' 순서로 부팅됩니다. IO.SYS, MSDOS.SYS, COMMAND.COM은 반드시 루트 디렉터리에 있어야 합니다."
  },
  {
    type:"written",
    q:"UNIX에서 'chmod go-w memo.txt' 명령을 실행했을 때의 결과로 옳은 것은?",
    kind:"mc",
    options:[
      "소유자(owner)의 쓰기 권한을 제거한다.",
      "그룹(group)과 다른 사용자(other)의 쓰기 권한을 제거한다.",
      "모든 사용자의 실행 권한을 제거한다.",
      "파일을 완전히 삭제한다."
    ],
    answer:1,
    explain:"chmod 명령의 go는 그룹(group)과 다른 사용자(other)를 의미하고, -w는 쓰기(write) 권한 제거를 의미합니다. 따라서 소유자를 제외한 그룹과 기타 사용자의 쓰기 권한이 제거됩니다."
  },
  {
    type:"written",
    q:"OSI 7계층 중, 경로 설정(라우팅)과 네트워크 주소 지정 기능을 담당하는 계층은?",
    kind:"mc",
    options:["물리 계층", "데이터 링크 계층", "네트워크 계층", "전송 계층"],
    answer:2,
    explain:"네트워크 계층(Network Layer, 3계층)은 패킷의 경로 설정(라우팅)과 네트워크 주소 지정을 담당합니다. 물리 계층은 기계적·전기적 연결, 데이터 링크 계층은 인접 시스템 간 신뢰성 있는 전송, 전송 계층은 종단 간 오류·흐름 제어를 담당합니다."
  },
  {
    type:"written",
    q:"HDLC(High-level Data Link Control) 프레임의 구성 순서로 옳은 것은?",
    kind:"mc",
    options:[
      "Flag - 주소부 - 제어부 - 정보부 - FCS - Flag",
      "Flag - 제어부 - 주소부 - FCS - 정보부 - Flag",
      "주소부 - Flag - 제어부 - 정보부 - FCS",
      "Flag - 정보부 - 주소부 - 제어부 - FCS - Flag"
    ],
    answer:0,
    explain:"HDLC 프레임은 'Flag - 주소부(Address) - 제어부(Control) - 정보부(Information) - FCS(프레임 검사부) - Flag' 순서로 구성됩니다."
  },
  {
    type:"written",
    q:"다음 중 정보통신망의 교환(스위칭) 방식에 해당하지 않는 것은?",
    kind:"mc",
    options:["회선 교환 방식", "메시지 교환 방식", "패킷 교환 방식", "반이중 교환 방식"],
    answer:3,
    explain:"정보통신망의 교환 방식에는 회선 교환, 메시지 교환, 패킷 교환 방식이 있습니다. '반이중'은 교환 방식이 아니라 데이터가 양방향으로 전송되지만 동시에는 전송되지 않는 통신 방식(전송 모드)을 의미합니다."
  },
  {
    type:"written",
    q:"새넌(Shannon)의 채널 용량 공식(C = W·log₂(1+S/N))에 따라 채널 용량을 증가시키는 방법으로 옳지 않은 것은?",
    kind:"mc",
    options:["주파수 대역폭(W)을 늘린다.", "신호 전력(S)을 높인다.", "잡음 전력(N)을 낮춘다.", "잡음 전력(N)을 높인다."],
    answer:3,
    explain:"새넌의 채널 용량 공식에 따르면 대역폭(W)과 신호 전력(S)을 높이거나 잡음 전력(N)을 낮출수록 채널 용량(C)이 커집니다. 잡음 전력을 높이면 오히려 채널 용량이 감소하므로 옳지 않습니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 2진수 1101을 그레이 코드(Gray Code)로 변환한 값을 쓰시오.",
    kind:"short",
    accept:["1011"],
    answerDisplay:"1011",
    explain:"그레이 코드 변환 시 최상위 비트는 그대로 두고, 이후 각 비트는 바로 앞 2진수 비트와 XOR 연산합니다. 1(그대로)-1⊕1=0-1⊕0=1-0⊕1=1 이므로 결과는 1011 입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 8진수 137을 10진수로 변환한 값을 쓰시오. (단위 없이 숫자만)",
    kind:"short",
    accept:["95"],
    answerDisplay:"95",
    explain:"8진수 137은 1×8² + 3×8¹ + 7×8⁰ = 64 + 24 + 7 = 95 입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 4위상 편이변조(4-PSK, 위상 4개 = 2비트 전송)를 사용하여 1,200Baud의 속도로 전송할 때, 데이터 신호 속도(bps)를 구하시오. (단위 없이 숫자만)",
    kind:"short",
    accept:["2400","2,400"],
    answerDisplay:"2400bps",
    explain:"신호 속도(bps) = 변조 속도(Baud) × 변조 시 상태 변화 비트 수. 4위상 = 2² 이므로 상태 변화 비트 수는 2비트. 따라서 1,200 × 2 = 2,400bps 입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] '사원' 테이블에 사번 '1001', 이름 '홍길동', 부서 '영업부' 데이터를 삽입하는 SQL문을 작성하시오.",
    kind:"short",
    accept:["INSERT INTO 사원 VALUES('1001','홍길동','영업부')","INSERT INTO 사원 VALUES ('1001','홍길동','영업부')","INSERT INTO 사원 VALUES('1001', '홍길동', '영업부')"],
    answerDisplay:"INSERT INTO 사원 VALUES('1001', '홍길동', '영업부');",
    explain:"레코드를 삽입할 때는 'INSERT INTO 테이블명 VALUES(값1, 값2, ...)' 형식을 사용합니다. 문자형 데이터는 작은따옴표로 묶어줍니다."
  }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>
