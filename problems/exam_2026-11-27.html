<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-11-27 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    type:"written",
    q:"제어장치의 레지스터 중, 다음에 실행할 명령어의 주소를 기억하는 레지스터는?",
    kind:"mc",
    options:["명령 레지스터(IR)","프로그램 카운터(PC)","메모리 버퍼 레지스터(MBR)","누산기(Accumulator)"],
    answer:1,
    explain:"프로그램 카운터(PC)는 다음에 실행할 명령어의 주소를 기억합니다. IR은 현재 실행 중인 명령어, MBR은 기억장치를 출입하는 데이터를 일시 저장하며, 누산기는 연산 결과를 일시적으로 저장하는 연산장치의 레지스터입니다."
  },
  {
    type:"written",
    q:"해밍 코드(Hamming Code)에 대한 설명으로 옳은 것은?",
    kind:"mc",
    options:[
      "1Bit의 패리티 비트를 추가하여 1Bit 오류만 검출한다.",
      "연속되는 두 숫자 사이에 한 비트만 변경되는 코드이다.",
      "오류를 스스로 검출·교정할 수 있으며, 2Bit 오류 검출과 1Bit 오류 교정이 가능하다.",
      "정마크(정스페이스) 방식으로 오류를 검출한다."
    ],
    answer:2,
    explain:"해밍 코드는 오류를 스스로 검출하고 교정할 수 있는 코드로, 2Bit 오류 검출 및 1Bit 오류 교정이 가능합니다. ①은 패리티 검사 코드, ②는 Gray 코드, ④는 2-out-of-5 코드에 대한 설명입니다."
  },
  {
    type:"written",
    q:"유효 주소를 '프로그램 카운터(PC) + 주소 부분(Operand)'으로 계산하는 주소 지정 방식은?",
    kind:"mc",
    options:["직접 주소 지정","간접 주소 지정","상대 주소 지정","즉시 주소 지정"],
    answer:2,
    explain:"상대(Relative) 주소 지정 방식은 PC 값에 명령어의 주소 부분을 더해 유효 주소를 구합니다. 직접은 실제 데이터의 절대 주소, 간접은 데이터 주소를 가진 포인터의 주소, 즉시는 주소 대신 자료 자체를 저장합니다."
  },
  {
    type:"written",
    q:"인터럽트 우선순위 판별 방법 중 소프트웨어(S/W)적인 방법은?",
    kind:"mc",
    options:["폴링(Polling)","데이지 체인(Daisy Chain)","병렬 우선순위 처리","벡터 인터럽트 회로"],
    answer:0,
    explain:"폴링(Polling)은 소프트웨어적으로 각 장치를 차례로 검사하여 우선순위를 판별합니다. 데이지 체인과 병렬 우선 처리는 하드웨어적인 방법입니다."
  },
  {
    type:"written",
    q:"데이터베이스 설계 순서로 옳은 것은?",
    kind:"mc",
    options:[
      "요구사항 분석 → 논리적 설계 → 개념적 설계 → 물리적 설계 → 구현",
      "요구사항 분석 → 개념적 설계 → 논리적 설계 → 물리적 설계 → 구현",
      "개념적 설계 → 요구사항 분석 → 물리적 설계 → 논리적 설계 → 구현",
      "요구사항 분석 → 물리적 설계 → 개념적 설계 → 논리적 설계 → 구현"
    ],
    answer:1,
    explain:"데이터베이스 설계는 요구사항 분석 → 개념적 설계 → 논리적 설계 → 물리적 설계 → 구현 순서로 진행됩니다. 암기법: '개.논.물'."
  },
  {
    type:"written",
    q:"관계형 데이터베이스의 릴레이션에서 튜플(Tuple)의 개수를 의미하는 용어는?",
    kind:"mc",
    options:["차수(Degree)","도메인(Domain)","기수(Cardinality)","스키마(Schema)"],
    answer:2,
    explain:"기수(Cardinality)는 튜플(행)의 개수, 차수(Degree)는 속성(열)의 개수입니다. 도메인은 하나의 속성이 가질 수 있는 값의 범위를 말합니다."
  },
  {
    type:"written",
    q:"MS-DOS의 부팅 과정에서 시스템 파일이 읽혀지는 순서로 옳은 것은?",
    kind:"mc",
    options:[
      "IO.SYS → MSDOS.SYS → CONFIG.SYS → COMMAND.COM → AUTOEXEC.BAT",
      "MSDOS.SYS → IO.SYS → COMMAND.COM → CONFIG.SYS → AUTOEXEC.BAT",
      "IO.SYS → MSDOS.SYS → COMMAND.COM → AUTOEXEC.BAT → CONFIG.SYS",
      "CONFIG.SYS → IO.SYS → MSDOS.SYS → AUTOEXEC.BAT → COMMAND.COM"
    ],
    answer:0,
    explain:"DOS 부팅 순서는 IO.SYS → MSDOS.SYS → CONFIG.SYS → COMMAND.COM → AUTOEXEC.BAT 입니다. 암기법: 'I.M.C.C.A'."
  },
  {
    type:"written",
    q:"실행 중인 프로세스와 새로 도착한 프로세스 중 남은 실행 시간이 더 짧은 프로세스에게 CPU를 할당하는 선점형 스케줄링 기법은?",
    kind:"mc",
    options:["FIFO","RR(Round Robin)","SRT(Shortest Remaining Time)","다단계 큐"],
    answer:2,
    explain:"SRT는 선점형 기법으로, 실행 중인 프로세스와 새로 도착한 프로세스의 남은 실행 시간을 비교하여 짧은 쪽에 CPU를 할당합니다. FIFO는 비선점형, RR은 시간 조각(Time Slice) 단위로 CPU를 할당하는 선점형 기법입니다."
  },
  {
    type:"written",
    q:"UNIX의 구성 요소 중, 사용자가 입력한 명령어를 해석하여 커널에 전달하는 명령어 해석기는?",
    kind:"mc",
    options:["커널(Kernel)","쉘(Shell)","유틸리티(Utility)","UFS(Unix File System)"],
    answer:1,
    explain:"쉘(Shell)은 명령어 해석기로, 종류에는 Korn Shell, Bourne Shell, C Shell(K.B.C)이 있습니다. 커널은 태스크 스케줄링·기억장치 관리 등 기초 시스템 기능을 담당하고, 유틸리티는 응용 프로그램입니다."
  },
  {
    type:"written",
    q:"광섬유 케이블에서 발생하는 손실의 종류에 해당하지 않는 것은?",
    kind:"mc",
    options:["접속 손실","산란 손실","흡수 손실","유전체 손실"],
    answer:3,
    explain:"광섬유 케이블의 손실에는 접속 손실, 산란 손실, 흡수 손실 등이 있으며, 유전체 손실은 해당하지 않습니다. 광섬유는 빛의 전반사 특성을 이용하며 잡음의 영향을 받지 않고 보안성이 높습니다."
  },
  {
    type:"written",
    q:"펄스 코드 변조(PCM) 방식에서 송신 측의 처리 순서로 옳은 것은?",
    kind:"mc",
    options:[
      "양자화 → 표본화 → 부호화",
      "부호화 → 양자화 → 표본화",
      "표본화 → 양자화 → 부호화",
      "표본화 → 부호화 → 복호화"
    ],
    answer:2,
    explain:"PCM 송신 측은 표본화(Sampling) → 양자화(Quantizing) → 부호화(Encoding) 순서로 처리합니다(표.양.부). 수신 측은 복호화(Decoding) → 여과화(Filtering) 순서입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 10진수 -5를 8비트 부호화 2의 보수 방식으로 표현한 2진수를 쓰시오.",
    kind:"short",
    accept:["11111011","1111 1011"],
    answerDisplay:"11111011",
    explain:"+5 = 00000101 → 1의 보수 11111010 → 1을 더하면 2의 보수 11111011 입니다. 부호 비트(맨 앞)가 1이므로 음수를 나타냅니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 그레이 코드(Gray Code) 1101을 2진수로 변환한 값을 쓰시오.",
    kind:"short",
    accept:["1001"],
    answerDisplay:"1001",
    explain:"Gray → 2진수: 첫 비트는 그대로(1), 이후 '직전 결과 비트'와 현재 Gray 비트를 XOR 합니다. 1 / 1⊕1=0 / 0⊕0=0 / 0⊕1=1 → 1001 입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] '학생' 테이블에서 '학과' 속성의 값을 중복 없이 검색하는 SQL문을 작성하시오.",
    kind:"short",
    accept:["SELECT DISTINCT 학과 FROM 학생"],
    answerDisplay:"SELECT DISTINCT 학과 FROM 학생;",
    explain:"SELECT 절에 DISTINCT 키워드를 붙이면 중복된 값을 제거하고 한 번씩만 검색합니다. 형식: SELECT DISTINCT 속성명 FROM 테이블명;"
  },
  {
    type:"practical",
    q:"[실기 단답형] 6장의 디스크로 구성된 디스크 팩에서 실제 데이터를 기록할 수 있는 면의 수를 구하시오. (단, 맨 위와 맨 아래 면은 기록하지 않음 · 숫자만)",
    kind:"short",
    accept:["10"],
    answerDisplay:"10",
    explain:"디스크 팩 기록면 수 = (디스크 수 × 2) − 2 입니다. 6 × 2 − 2 = 10면이 사용 가능합니다."
  }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>
