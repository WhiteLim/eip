<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-09-30 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    "type": "written",
    "q": "명령어의 주소 부분(Operand)에 프로그램 카운터(PC)의 값을 더하여 유효 주소를 구하는 주소 지정 방식은?",
    "kind": "mc",
    "options": [
      "절대 주소 지정",
      "상대 주소 지정",
      "간접 주소 지정",
      "즉치 주소 지정"
    ],
    "answer": 1,
    "explain": "상대(Relative) 주소 지정 방식은 프로그램 카운터(PC) + 주소 부분(Operand)으로 유효 주소를 계산합니다."
  },
  {
    "type": "written",
    "q": "JK 플립플롭에서 J=1, K=1을 입력했을 때의 출력 동작은?",
    "kind": "mc",
    "options": [
      "이전 상태 유지",
      "항상 0",
      "항상 1",
      "이전 상태의 보수(반전)"
    ],
    "answer": 3,
    "explain": "JK 플립플롭은 J=K=1일 때 이전 출력의 보수(토글)가 출력됩니다. RS 플립플롭에서는 (1,1) 입력이 금지되는 것을 개선한 것이 JK 플립플롭입니다."
  },
  {
    "type": "written",
    "q": "인터럽트 우선순위 판별 방법 중 하드웨어 방식에 해당하는 것은?",
    "kind": "mc",
    "options": [
      "폴링(Polling)",
      "데이지 체인(Daisy Chain)",
      "스풀링(Spooling)",
      "버퍼링(Buffering)"
    ],
    "answer": 1,
    "explain": "우선순위 판별 방식은 폴링(소프트웨어), 데이지 체인(하드웨어), 병렬 우선 처리(하드웨어)입니다. 스풀링·버퍼링은 입출력 속도 차이 해결 기법입니다."
  },
  {
    "type": "written",
    "q": "1비트 오류를 스스로 검출하여 교정까지 할 수 있는 코드는?",
    "kind": "mc",
    "options": [
      "패리티 검사 코드",
      "그레이 코드",
      "해밍 코드",
      "BCD 코드"
    ],
    "answer": 2,
    "explain": "해밍 코드는 오류를 스스로 검출·교정할 수 있으며 1비트 오류를 교정할 수 있습니다. 패리티 검사 코드는 1비트 오류의 검출만 가능합니다."
  },
  {
    "type": "written",
    "q": "CPU 스케줄링 중 시간 조각(Time Slice)을 미리 정의하여 각 프로세스에 CPU를 번갈아 할당하는 선점형 기법은?",
    "kind": "mc",
    "options": [
      "FIFO",
      "SJF",
      "SRT",
      "RR(Round Robin)"
    ],
    "answer": 3,
    "explain": "RR(Round Robin)은 시간 조각을 미리 정의하여 각 프로세스에 CPU를 제공하는 선점형 스케줄링입니다. FIFO는 비선점, SRT는 남은 실행 시간이 짧은 프로세스에 할당하는 선점형입니다."
  },
  {
    "type": "written",
    "q": "SQL의 DROP 명령에서 제거할 요소를 참조하는 다른 개체도 함께 제거하는 옵션은?",
    "kind": "mc",
    "options": [
      "RESTRICT",
      "CASCADE",
      "DISTINCT",
      "GRANT"
    ],
    "answer": 1,
    "explain": "DROP CASCADE는 제거할 요소를 참조하는 다른 개체도 함께 제거합니다. RESTRICT는 참조 중이면 제거하지 않습니다."
  },
  {
    "type": "written",
    "q": "시분할 다중화(TDM) 중 전송할 데이터가 있는 단말기에만 시간 폭(Time Slot)을 할당하는 방식은?",
    "kind": "mc",
    "options": [
      "동기식 시분할 다중화(STDM)",
      "비동기식 시분할 다중화(ATDM)",
      "주파수 분할 다중화(FDM)",
      "코드 분할 다중화(CDMA)"
    ],
    "answer": 1,
    "explain": "비동기식 시분할 다중화(ATDM)는 전송할 데이터가 있는 단말기에만 시간 폭을 제공합니다. 동기식(STDM)은 모든 단말기에 균등한 시간 폭을 제공합니다."
  },
  {
    "type": "written",
    "q": "통신 프로토콜의 기본 요소에 해당하지 않는 것은?",
    "kind": "mc",
    "options": [
      "구문(Syntax)",
      "의미(Semantics)",
      "시간(Timing)",
      "처리(Processing)"
    ],
    "answer": 3,
    "explain": "프로토콜의 기본 요소는 구문, 의미, 시간(타이밍)입니다. '처리'는 해당하지 않습니다."
  },
  {
    "type": "written",
    "q": "OSI 7계층 중 경로 배정(Routing), 중계, 네트워크 어드레싱을 담당하는 계층은?",
    "kind": "mc",
    "options": [
      "물리 계층",
      "데이터 링크 계층",
      "네트워크 계층",
      "전송 계층"
    ],
    "answer": 2,
    "explain": "네트워크 계층(3계층)은 경로 배정, 중계, 네트워크 어드레싱을 담당합니다. 전송 계층은 논리적 연결 통로, 오류 검출, 흐름 제어를 담당합니다."
  },
  {
    "type": "written",
    "q": "블루투스(Bluetooth)와 관련된 IEEE 규격은?",
    "kind": "mc",
    "options": [
      "IEEE 802.3",
      "IEEE 802.5",
      "IEEE 802.11",
      "IEEE 802.15"
    ],
    "answer": 3,
    "explain": "블루투스는 IEEE 802.15 규격입니다. 802.3은 이더넷, 802.5는 토큰링, 802.11은 무선 LAN입니다."
  },
  {
    "type": "written",
    "q": "기수(Odd) 패리티 방식에서 전체 비트(데이터 + 패리티 비트)의 1의 개수는 어떻게 되어야 하는가?",
    "kind": "mc",
    "options": [
      "짝수",
      "홀수",
      "항상 0개",
      "항상 8개"
    ],
    "answer": 1,
    "explain": "기수(Odd) 패리티는 1인 비트의 개수가 홀수가 되도록 패리티 비트를 추가합니다. 우수(Even) 패리티는 1의 개수가 짝수입니다."
  },
  {
    "type": "practical",
    "q": "[실기 단답형] 2진수 10110111을 16진수로 변환한 값을 쓰시오.",
    "kind": "short",
    "accept": [
      "B7"
    ],
    "answerDisplay": "B7",
    "explain": "2진수를 4자리씩 묶으면 1011(B) 0111(7)이므로 B7(16)입니다."
  },
  {
    "type": "practical",
    "q": "[실기 단답형] 16진수 3A를 10진수로 변환한 값을 쓰시오. (숫자만)",
    "kind": "short",
    "accept": [
      "58"
    ],
    "answerDisplay": "58",
    "explain": "3×16 + 10 = 58 입니다."
  },
  {
    "type": "practical",
    "q": "[실기 단답형] '학생' 테이블에서 '학과' 속성을 중복 없이 검색하는 SQL문을 쓰시오.",
    "kind": "short",
    "accept": [
      "SELECT DISTINCT 학과 FROM 학생",
      "SELECT DISTINCT(학과) FROM 학생"
    ],
    "answerDisplay": "SELECT DISTINCT 학과 FROM 학생;",
    "explain": "SELECT DISTINCT는 중복되지 않고 검색합니다. 형식: SELECT DISTINCT 속성명 FROM 테이블명."
  },
  {
    "type": "practical",
    "q": "[실기 단답형] 디스크 팩이 6장의 디스크로 구성될 때, 사용 가능한 기록면의 수를 구하시오. (숫자만)",
    "kind": "short",
    "accept": [
      "10"
    ],
    "answerDisplay": "10",
    "explain": "사용 가능한 기록면 수 = (디스크 수 × 2) − 2 = 12 − 2 = 10 입니다. 맨 위와 맨 아래 면은 기록에 사용하지 않습니다."
  }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>
