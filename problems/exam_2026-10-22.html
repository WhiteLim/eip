<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-10-22 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {type:"written",q:"명령어 실행 동작 단계 중 '다음에 실행할 명령어의 주소를 기억하고 있는' 레지스터는?",kind:"mc",
   options:["프로그램 카운터(PC)","명령 레지스터(IR)","메모리 버퍼 레지스터(MBR)","누산기(Accumulator)"],answer:0,
   explain:"프로그램 카운터(PC)는 다음에 실행할 명령어의 주소를 기억합니다. 명령 레지스터(IR)는 현재 실행 중인 명령어를, MBR은 기억장치를 출입하는 데이터를 일시 저장하며, 누산기는 연산 결과를 일시 저장합니다."},
  {type:"written",q:"드모르간 법칙에 따라 (A·B)'(NAND)와 같은 식은? (A', B'는 각각 A, B의 부정)",kind:"mc",
   options:["A' + B'","A' · B'","A + B","A · B'"],answer:0,
   explain:"드모르간 법칙: (A+B)' = A'·B', (A·B)' = A'+B'. 따라서 (A·B)' = A' + B' 입니다."},
  {type:"written",q:"JK 플립플롭에서 J=1, K=1 이 입력되었을 때의 출력 동작은?",kind:"mc",
   options:["무변화","0으로 리셋","1로 세트","보수(토글)"],answer:3,
   explain:"JK 플립플롭은 (0,0) 무변화, (0,1) 공(0), (1,0) 일(1), (1,1) 보수(토글)로 동작합니다."},
  {type:"written",q:"다음 중 우수(Even) 패리티 검사 코드에 대한 설명으로 옳은 것은?",kind:"mc",
   options:["1인 비트의 개수가 짝수가 되도록 패리티 비트를 추가한다.","1인 비트의 개수가 홀수가 되도록 패리티 비트를 추가한다.","2비트 오류를 검출하고 교정한다.","0인 비트의 개수가 짝수가 되도록 한다."],answer:0,
   explain:"패리티 검사 코드는 1비트의 패리티 비트를 추가해 1비트 오류만 검출합니다. 우수(Even)는 1의 개수가 짝수, 기수(Odd)는 홀수가 되게 합니다. 오류를 스스로 교정하는 것은 해밍 코드입니다."},
  {type:"written",q:"주소 지정 방식 중 '프로그램 카운터(PC)의 값에 주소 부분(Operand)을 더하여' 유효 주소를 구하는 방식은?",kind:"mc",
   options:["즉치(Immediate) 주소 지정","간접(Indirect) 주소 지정","상대(Relative) 주소 지정","직접(Direct) 주소 지정"],answer:2,
   explain:"상대 주소 지정은 PC + Operand 로 유효 주소를 구합니다. 즉치는 자료를 직접 저장, 직접은 실제 데이터의 절대 주소 저장, 간접은 데이터 주소를 가진 포인터의 주소를 저장합니다."},
  {type:"written",q:"입출력장치와 CPU 간의 속도 차이를 해결하기 위한 방법 중, 보조기억장치를 이용하며 다중 작업에 사용되는 것은?",kind:"mc",
   options:["버퍼링(Buffering)","스풀링(Spooling)","인터럽트(Interrupt)","폴링(Polling)"],answer:1,
   explain:"버퍼링은 주기억장치를 이용한 단일 작업, 스풀링은 보조기억장치(디스크)를 이용한 다중 작업에 사용됩니다."},
  {type:"written",q:"관계형 데이터베이스에서 릴레이션의 '속성(Attribute)의 개수'를 나타내는 용어는?",kind:"mc",
   options:["차수(Degree)","기수(Cardinality)","도메인(Domain)","스키마(Schema)"],answer:0,
   explain:"차수(Degree)는 속성의 개수, 기수(Cardinality)는 튜플의 개수입니다. 도메인은 하나의 속성이 가질 수 있는 값의 범위입니다."},
  {type:"written",q:"SQL에서 제거할 요소를 다른 개체가 참조 중이면 제거하지 않는 옵션은?",kind:"mc",
   options:["DROP CASCADE","DROP RESTRICT","DROP DISTINCT","DROP VIEW"],answer:1,
   explain:"DROP RESTRICT는 제거할 요소가 참조 중이면 제거하지 않고, DROP CASCADE는 그 요소를 참조하는 다른 개체도 함께 제거합니다."},
  {type:"written",q:"프로세스 상태 중 '준비(Ready) 상태의 프로세스 가운데 우선순위가 가장 높은 프로세스가 CPU를 할당받아 실행 상태로 전이'되는 것을 무엇이라 하는가?",kind:"mc",
   options:["웨이크업(Wake-up)","디스패치(Dispatch)","블록(Block)","타임아웃(Timeout)"],answer:1,
   explain:"디스패치(Dispatch)는 준비 상태에서 실행 상태로 전이되는 것을 말합니다."},
  {type:"written",q:"UNIX 명령어 중 현재 시스템에 로그인 중인 사용자의 정보를 보여주는 것은?",kind:"mc",
   options:["pwd","who","rm","ls"],answer:1,
   explain:"who는 현재 로그인 중인 사용자 정보(단말기명, 로그인명, 로그인 일시)를 표시합니다. pwd는 현재 작업 디렉터리, rm은 파일 삭제, ls는 파일 목록 출력입니다."},
  {type:"written",q:"OSI 7계층 중 경로 배정(Routing), 중계, 네트워크 어드레싱을 담당하는 계층은?",kind:"mc",
   options:["데이터 링크 계층","네트워크 계층","전송 계층","세션 계층"],answer:1,
   explain:"3계층인 네트워크 계층이 경로 배정·중계·어드레싱을 담당합니다. 전송 계층은 TCP/UDP, 오류 검출 및 흐름 제어를 담당합니다."},
  {type:"practical",q:"[실기 단답형] 10진수 45를 2진수로 변환한 값을 쓰시오.",kind:"short",
   accept:["101101"],answerDisplay:"101101",
   explain:"45를 2로 계속 나누어 나머지를 역순으로 나열합니다. 45=32+8+4+1 이므로 101101(2) 입니다."},
  {type:"practical",q:"[실기 단답형] '회원' 테이블에서 '등급'이 'VIP'인 레코드를 삭제하는 SQL문을 작성하시오.",kind:"short",
   accept:["DELETE FROM 회원 WHERE 등급='VIP'","DELETE FROM 회원 WHERE 등급=\"VIP\"","DELETE FROM 회원 WHERE 등급 = 'VIP'"],
   answerDisplay:"DELETE FROM 회원 WHERE 등급='VIP';",
   explain:"DELETE 문의 형식은 'DELETE FROM 테이블명 WHERE 조건' 입니다."},
  {type:"practical",q:"[실기 단답형] 변조 시 상태 변화 비트 수가 4비트(16위상)이고 변조 속도가 1,200Baud일 때, 신호 속도(bps)를 구하시오. (숫자만)",kind:"short",
   accept:["4800","4,800"],answerDisplay:"4800bps",
   explain:"신호 속도(bps) = 변조 속도(Baud) × 상태 변화 비트 수 = 1,200 × 4 = 4,800bps 입니다."},
  {type:"practical",q:"[실기 단답형] IPv6 주소의 전체 비트 수를 구하시오. (숫자만)",kind:"short",
   accept:["128"],answerDisplay:"128",
   explain:"IPv6는 16비트씩 8부분으로 구성되어 16×8 = 128비트입니다. (IPv4는 8비트×4 = 32비트)"}
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>

</body>
</html>
