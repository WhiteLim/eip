<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-09-22 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    type:"written",
    q:"드모르간(De Morgan)의 법칙에 따라 (A·B)'와 같은 결과를 내는 논리식은?",
    kind:"mc",
    options:["A' + B'", "A' · B'", "A + B", "A · B"],
    answer:0,
    explain:"드모르간의 법칙에 따르면 (A+B)' = A'·B' 이고, (A·B)' = A'+B' 입니다. 곱(AND)의 부정은 각 항을 부정한 후 합(OR)으로 바꾸어 표현합니다."
  },
  {
    type:"written",
    q:"반가산기(Half Adder)에서 자리올림수(Carry, C)를 구하는 논리식으로 옳은 것은?",
    kind:"mc",
    options:["A⊕B", "A·B", "A+B", "A'B' + AB"],
    answer:1,
    explain:"반가산기는 합 S = A⊕B, 자리올림수 C = A·B 로 구성됩니다. 두 입력이 모두 1일 때만 자리올림이 발생하므로 AND 연산으로 구합니다."
  },
  {
    type:"written",
    q:"JK 플립플롭에서 J=1, K=1이 입력되었을 때의 동작으로 옳은 것은?",
    kind:"mc",
    options:["출력이 항상 0으로 리셋된다", "출력이 항상 1로 세트된다", "이전 출력 상태를 그대로 유지한다", "이전 출력의 보수(반전, 토글)로 바뀐다"],
    answer:3,
    explain:"JK 플립플롭은 J=K=1일 때 이전 출력의 보수로 토글되는 동작을 합니다. 이를 통해 RS 플립플롭에서 문제가 되던 부정(사용 금지) 상태를 해결하여 가장 널리 사용되는 플립플롭입니다."
  },
  {
    type:"written",
    q:"멀티플렉서(MUX)에 대한 설명으로 옳은 것은?",
    kind:"mc",
    options:["1개의 입력선 정보를 2ⁿ개의 출력선 중 하나로 출력한다", "2ⁿ개의 입력 중 1개를 선택하여 하나의 출력선으로 출력한다", "입력과 출력의 개수가 항상 같다", "2진수를 그레이 코드로 변환하는 회로이다"],
    answer:1,
    explain:"멀티플렉서(MUX)는 2ⁿ개의 입력 중 선택 신호에 따라 하나를 골라 하나의 출력선으로 내보내는 회로입니다. 반대로 디멀티플렉서(DeMUX)는 1개의 입력을 2ⁿ개의 출력선 중 하나로 분배합니다."
  },
  {
    type:"written",
    q:"다음 중 오류를 스스로 검출할 뿐만 아니라 1비트 오류를 교정까지 할 수 있는 코드는?",
    kind:"mc",
    options:["패리티 비트 코드", "해밍(Hamming) 코드", "BCD 코드", "그레이(Gray) 코드"],
    answer:1,
    explain:"해밍 코드는 2비트의 오류 검출과 1비트의 오류 교정이 가능한 코드입니다. 패리티 비트는 1비트 오류 검출만 가능할 뿐 교정은 할 수 없습니다."
  },
  {
    type:"written",
    q:"짝수(우수, Even) 패리티를 사용하는 시스템에서 데이터 비트가 1010110일 때, 추가해야 할 패리티 비트 값은?",
    kind:"mc",
    options:["0", "1", "2", "10"],
    answer:0,
    explain:"짝수 패리티는 패리티 비트를 포함한 전체 데이터의 1의 개수가 짝수가 되도록 맞춥니다. 데이터 1010110에는 1이 4개(짝수)이므로 패리티 비트는 0을 추가해야 합니다."
  },
  {
    type:"written",
    q:"3-주소 명령어(Three-address Instruction)의 특징으로 옳은 것은?",
    kind:"mc",
    options:["기억장치 액세스 없이 스택(Stack)만으로 연산을 수행한다", "연산 결과가 Operand1에 저장되어 원래의 자료가 파괴된다", "누산기(Accumulator)를 이용하여 연산을 처리한다", "연산 후에도 입력 자료가 보존되며, 범용 레지스터(GPR)를 가진 컴퓨터에서 사용한다"],
    answer:3,
    explain:"3-주소 명령어는 연산 후에도 입력 자료가 그대로 보존되며, 범용 레지스터(GPR)를 가진 컴퓨터에서 주로 사용됩니다. ①은 0-주소, ②는 2-주소, ③은 1-주소 명령어의 특징입니다."
  },
  {
    type:"written",
    q:"데이터베이스의 3단계 스키마 구성에 해당하지 않는 것은?",
    kind:"mc",
    options:["개념 스키마", "외부 스키마", "내부 스키마", "물리 스키마"],
    answer:3,
    explain:"데이터베이스의 3단계 스키마는 개념 스키마, 외부 스키마, 내부 스키마로 구성됩니다('개.외.내'). '물리 스키마'라는 용어는 존재하지 않으며, 내부 스키마가 물리적 저장 구조 정의 역할을 담당합니다."
  },
  {
    type:"written",
    q:"다음 CPU 스케줄링 기법 중 비선점(Non-preemptive) 방식에 해당하는 것은?",
    kind:"mc",
    options:["FIFO", "SRT", "RR(Round Robin)", "다단계 피드백 큐"],
    answer:0,
    explain:"FIFO(선입선출)는 가장 먼저 CPU를 요청한 프로세스에게 먼저 할당하는 대표적인 비선점 스케줄링 기법입니다. SRT, RR, 다단계 피드백 큐는 모두 선점형 스케줄링 기법입니다."
  },
  {
    type:"written",
    q:"UNIX 시스템에서 새로운 프로세스를 호출·생성할 때 사용하는 시스템 콜은?",
    kind:"mc",
    options:["fork", "pipe", "ping", "kill"],
    answer:0,
    explain:"fork는 새로운 프로세스를 호출·생성하는 시스템 콜입니다. pipe는 앞 명령어의 출력을 뒤 명령어의 입력으로 연결하고, ping은 네트워크 문제를 진단하며, kill은 실행 중인 프로세스를 종료시킵니다."
  },
  {
    type:"written",
    q:"디지털 신호를 아날로그 신호로 변조하여 원거리 전송을 가능하게 하는 정보 통신 설비는?",
    kind:"mc",
    options:["모뎀(MODEM)", "리피터(Repeater)", "브리지(Bridge)", "허브(Hub)"],
    answer:0,
    explain:"모뎀(MODEM, MOdulator/DEModulator)은 디지털 신호와 아날로그 신호를 상호 변환하여 원거리 전송을 가능하게 하는 장치입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 2진수 11101010을 16진수로 변환한 값을 쓰시오.",
    kind:"short",
    accept:["EA"],
    answerDisplay:"EA",
    explain:"2진수를 16진수로 변환할 때는 4자리씩 묶어 계산합니다. 1110(2)=E(16), 1010(2)=A(16) 이므로 11101010(2) = EA(16) 입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 10진수 -13을 8비트 2의 보수(Two's Complement)로 표현한 값을 2진수 8자리로 쓰시오.",
    kind:"short",
    accept:["11110011"],
    answerDisplay:"11110011",
    explain:"먼저 13의 절대값을 8비트 2진수로 표현하면 00001101입니다. 이를 1의 보수로 변환(0과 1을 반전)하면 11110010이 되고, 여기에 1을 더하면 2의 보수 11110011이 됩니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] '제품' 테이블에서 '가격'이 10000 미만인 모든 데이터를 검색하는 SQL문을 작성하시오.",
    kind:"short",
    accept:["SELECT * FROM 제품 WHERE 가격<10000","SELECT * FROM 제품 WHERE 가격 < 10000","SELECT * FROM 제품 WHERE 가격<10000;","SELECT * FROM 제품 WHERE 가격 < 10000;"],
    answerDisplay:"SELECT * FROM 제품 WHERE 가격 < 10000;",
    explain:"SELECT 문은 'SELECT 열 FROM 테이블 WHERE 조건'의 형식을 사용합니다. 모든 열을 검색하므로 SELECT *를 사용하고, 조건은 가격 < 10000으로 작성합니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 4위상 편이변조(4-PSK, 위상 4개 = 2비트 전송)를 사용하여 2,400bps로 전송할 때, 변조 속도(Baud)를 구하시오. (단위 없이 숫자만)",
    kind:"short",
    accept:["1200","1,200"],
    answerDisplay:"1200Baud",
    explain:"변조 속도(Baud) = 신호 속도(bps) ÷ 변조 시 상태 변화 비트 수. 4위상 = 2² 이므로 상태 변화 비트 수는 2비트입니다. 따라서 2,400 ÷ 2 = 1,200Baud 입니다."
  }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>

</body>
</html>
