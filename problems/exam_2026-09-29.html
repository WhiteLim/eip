<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 14문항 · 2026-09-29 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">14</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    "type": "written",
    "q": "주기억장치의 내용을 보조기억장치처럼 사용하여 주기억장치보다 큰 프로그램을 실행할 수 있게 하는 기법은?",
    "kind": "mc",
    "options": [
      "캐시 메모리",
      "가상 메모리",
      "연관 메모리",
      "버퍼 메모리"
    ],
    "answer": 1,
    "explain": "가상 메모리(Virtual Memory)는 보조기억장치의 일부를 주기억장치처럼 사용하여 실제 주기억장치 용량보다 큰 프로그램을 실행할 수 있게 합니다."
  },
  {
    "type": "written",
    "q": "논리식 A + A·B 를 간단히 한 결과는?",
    "kind": "mc",
    "options": [
      "A",
      "B",
      "A·B",
      "A+B"
    ],
    "answer": 0,
    "explain": "흡수 법칙에 의해 A + A·B = A(1+B) = A 입니다."
  },
  {
    "type": "written",
    "q": "2진수 1010과 0110을 더한 결과(2진수)는?",
    "kind": "mc",
    "options": [
      "10000",
      "10010",
      "1110",
      "10100"
    ],
    "answer": 0,
    "explain": "1010(10) + 0110(6) = 16(10) = 10000(2) 입니다."
  },
  {
    "type": "written",
    "q": "프로세스 상태 전이 중 '준비(Ready) 상태에서 CPU를 할당받아 실행 상태로 바뀌는 것'을 무엇이라 하는가?",
    "kind": "mc",
    "options": [
      "Dispatch",
      "Wake up",
      "Timer Runout",
      "Block"
    ],
    "answer": 0,
    "explain": "Dispatch는 준비 상태의 프로세스가 CPU를 할당받아 실행 상태가 되는 것입니다. Timer Runout은 실행→준비, Block은 실행→대기, Wake up은 대기→준비 전이입니다."
  },
  {
    "type": "written",
    "q": "CPU 스케줄링 기법 중 비선점형(Non-preemptive) 방식에 해당하는 것은?",
    "kind": "mc",
    "options": [
      "Round Robin",
      "SRT",
      "FCFS",
      "다단계 큐"
    ],
    "answer": 2,
    "explain": "FCFS(First Come First Served)는 도착 순서대로 처리하는 비선점형 기법입니다. Round Robin과 SRT는 선점형입니다."
  },
  {
    "type": "written",
    "q": "관계형 데이터베이스에서 릴레이션의 행(Row)에 해당하는 용어는?",
    "kind": "mc",
    "options": [
      "속성(Attribute)",
      "튜플(Tuple)",
      "도메인(Domain)",
      "차수(Degree)"
    ],
    "answer": 1,
    "explain": "릴레이션의 행은 튜플(Tuple, 레코드), 열은 속성(Attribute, 필드)입니다. 튜플의 수는 카디널리티, 속성의 수는 차수입니다."
  },
  {
    "type": "written",
    "q": "정규화 과정에서 '도메인이 원자값'이 되도록 하는 단계는?",
    "kind": "mc",
    "options": [
      "제1정규형(1NF)",
      "제2정규형(2NF)",
      "제3정규형(3NF)",
      "BCNF"
    ],
    "answer": 0,
    "explain": "제1정규형은 모든 도메인이 원자값으로만 구성되도록 하는 단계입니다. 2NF는 부분 함수 종속 제거, 3NF는 이행 함수 종속 제거입니다."
  },
  {
    "type": "written",
    "q": "TCP/IP 프로토콜 중 전자우편을 전송하는 데 사용되는 프로토콜은?",
    "kind": "mc",
    "options": [
      "FTP",
      "SMTP",
      "HTTP",
      "TELNET"
    ],
    "answer": 1,
    "explain": "SMTP(Simple Mail Transfer Protocol)는 전자우편 전송 프로토콜입니다. FTP는 파일 전송, HTTP는 웹 문서 전송, TELNET은 원격 접속에 사용됩니다."
  },
  {
    "type": "written",
    "q": "IPv4 주소 체계에서 주소 길이는 몇 비트인가?",
    "kind": "mc",
    "options": [
      "32비트",
      "64비트",
      "128비트",
      "256비트"
    ],
    "answer": 0,
    "explain": "IPv4는 32비트(8비트씩 4개 영역), IPv6는 128비트 주소 체계입니다."
  },
  {
    "type": "written",
    "q": "UNIX에서 파일의 접근 권한을 변경하는 명령어는?",
    "kind": "mc",
    "options": [
      "chown",
      "chmod",
      "chgrp",
      "ls"
    ],
    "answer": 1,
    "explain": "chmod는 파일의 접근 권한을 변경합니다. chown은 소유자 변경, chgrp는 그룹 변경, ls는 목록 출력 명령어입니다."
  },
  {
    "type": "written",
    "q": "Windows에서 실행 중인 프로그램을 강제로 종료하기 위해 작업 관리자를 여는 단축키는?",
    "kind": "mc",
    "options": [
      "Ctrl + Shift + Esc",
      "Alt + F4",
      "Ctrl + Alt + C",
      "Win + D"
    ],
    "answer": 0,
    "explain": "Ctrl + Shift + Esc는 작업 관리자를 바로 실행하는 단축키입니다. Alt + F4는 활성 창 닫기, Win + D는 바탕화면 보기입니다."
  },
  {
    "type": "practical",
    "q": "[실기 단답형] 2진수 101101을 10진수로 변환한 값을 쓰시오. (숫자만)",
    "kind": "short",
    "accept": [
      "45"
    ],
    "answerDisplay": "45",
    "explain": "32+8+4+1 = 45 입니다."
  },
  {
    "type": "practical",
    "q": "[실기 단답형] '고객' 테이블에서 모든 레코드를 '이름' 기준 오름차순으로 조회하는 SQL문을 작성하시오. (모든 속성 조회)",
    "kind": "short",
    "accept": [
      "SELECT * FROM 고객 ORDER BY 이름",
      "SELECT * FROM 고객 ORDER BY 이름 ASC"
    ],
    "answerDisplay": "SELECT * FROM 고객 ORDER BY 이름 ASC;",
    "explain": "SELECT * FROM 테이블 ORDER BY 속성 [ASC|DESC] 형식이며, ASC(오름차순)는 생략 가능합니다."
  },
  {
    "type": "practical",
    "q": "[실기 단답형] 1바이트(8비트)로 표현할 수 있는 서로 다른 정보의 가짓수를 쓰시오. (숫자만)",
    "kind": "short",
    "accept": [
      "256"
    ],
    "answerDisplay": "256",
    "explain": "2^8 = 256 가지입니다."
  }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>

</body>
</html>
