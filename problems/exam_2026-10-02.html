<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-10-02 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {type:"written",kind:"mc",q:"명령어의 OP-Code(연산자부)를 3비트로 사용할 때 표현할 수 있는 명령어의 최대 개수는?",options:["3개","6개","8개","16개"],answer:2,explain:"연산자부가 n비트이면 2ⁿ개의 명령어를 사용할 수 있습니다. 3비트이므로 2³ = 8개입니다."},
  {type:"written",kind:"mc",q:"주소 지정 방식 중 프로그램 카운터(PC)의 값에 주소 부분(Operand)을 더해 유효 주소를 구하는 방식은?",options:["상대 주소 지정","직접 주소 지정","간접 주소 지정","즉치 주소 지정"],answer:0,explain:"상대(Relative) 주소 지정 방식은 PC + Operand로 유효 주소를 계산합니다."},
  {type:"written",kind:"mc",q:"반가산기(HA)에서 두 입력 A, B의 합(Sum) S를 나타내는 논리식은?",options:["A·B","A⊕B (XOR)","A+B (OR)","A'·B'"],answer:1,explain:"반가산기의 합 S = A⊕B(XOR), 자리올림수 C = A·B(AND)입니다."},
  {type:"written",kind:"mc",q:"JK 플립플롭에서 J=1, K=1일 때의 출력 상태는?",options:["변화 없음(무변화)","0(Reset)","1(Set)","보수(토글)"],answer:3,explain:"JK FF는 (0,0) 무변화, (0,1) 0, (1,0) 1, (1,1) 보수(토글)입니다."},
  {type:"written",kind:"mc",q:"자기 디스크 팩의 기록면 수를 구하는 식으로 옳은 것은? (디스크 팩 수 = n)",options:["n × 2","(n × 2) − 2","n × 2 + 2","n"],answer:1,explain:"디스크 팩의 맨 위와 맨 아래 면은 기록에 사용하지 않으므로 기록면 수 = (디스크 팩 수 × 2) − 2 입니다."},
  {type:"written",kind:"mc",q:"데이터베이스에서 튜플(Tuple)의 개수를 의미하는 용어는?",options:["차수(Degree)","기수(Cardinality)","도메인(Domain)","스키마(Schema)"],answer:1,explain:"기수(Cardinality)는 튜플의 개수, 차수(Degree)는 속성(Attribute)의 개수입니다."},
  {type:"written",kind:"mc",q:"SQL의 DROP 문에서, 제거할 요소를 참조하는 다른 개체까지 함께 제거하는 옵션은?",options:["RESTRICT","CASCADE","DISTINCT","CHECK"],answer:1,explain:"CASCADE는 제거할 요소를 참조하는 다른 개체도 함께 제거하고, RESTRICT는 참조 중이면 제거하지 않습니다."},
  {type:"written",kind:"mc",q:"준비(Ready) 상태의 프로세스 중 우선순위가 가장 높은 프로세스가 CPU를 할당받아 실행 상태로 전이되는 것을 무엇이라 하는가?",options:["디스패치(Dispatch)","웨이크업(Wake-up)","블록(Block)","타임아웃(Timeout)"],answer:0,explain:"준비 → 실행 상태로의 전이를 디스패치(Dispatch)라고 합니다."},
  {type:"written",kind:"mc",q:"DOS 부팅 시 필수 파일이 아닌 것은?",options:["IO.SYS","MSDOS.SYS","COMMAND.COM","CONFIG.SYS"],answer:3,explain:"필수 파일은 IO.SYS, MSDOS.SYS, COMMAND.COM이며 CONFIG.SYS는 설정 파일로 필수가 아닙니다."},
  {type:"written",kind:"mc",q:"UNIX에서 현재 로그인하여 사용 중인 사용자의 정보를 보여주는 명령어는?",options:["ls","who","kill","ping"],answer:1,explain:"who는 현재 로그인 중인 사용자 정보를 보여줍니다. ls는 파일 목록, kill은 프로세스 종료, ping은 네트워크 진단입니다."},
  {type:"written",kind:"mc",q:"PCM(펄스 코드 변조)의 송신 측 처리 순서로 옳은 것은?",options:["표본화 → 양자화 → 부호화","양자화 → 표본화 → 부호화","부호화 → 표본화 → 양자화","표본화 → 부호화 → 양자화"],answer:0,explain:"PCM 송신 측은 표본화 → 양자화 → 부호화(표.양.부), 수신 측은 복호화 → 여과화입니다."},
  {type:"practical",kind:"short",q:"[실기 단답형] 2진수 1101을 10진수로 변환한 값을 쓰시오. (숫자만)",accept:["13"],answerDisplay:"13",explain:"1×8 + 1×4 + 0×2 + 1×1 = 13 입니다."},
  {type:"practical",kind:"short",q:"[실기 단답형] 10진수 100을 8진수로 변환한 값을 쓰시오. (숫자만)",accept:["144"],answerDisplay:"144",explain:"100 ÷ 8 = 12 나머지 4, 12 ÷ 8 = 1 나머지 4, 몫 1. 나머지를 역순으로 나열하면 144입니다."},
  {type:"practical",kind:"short",q:"[실기 단답형] '학생' 테이블의 모든 레코드에서 '학과'를 중복 없이 검색하는 SQL문을 작성하시오.",accept:["SELECT DISTINCT 학과 FROM 학생","SELECT DISTINCT 학과 FROM 학생;"],answerDisplay:"SELECT DISTINCT 학과 FROM 학생;",explain:"중복을 제거하고 검색하려면 SELECT 뒤에 DISTINCT를 사용합니다."},
  {type:"practical",kind:"short",q:"[실기 단답형] 4개의 위상을 이용하는 위상 편이 변조로 1,200Baud의 속도로 전송할 때, 데이터 신호 속도(bps)를 구하시오. (숫자만)",accept:["2400","2,400"],answerDisplay:"2400bps",explain:"4위상 = 2²이므로 2비트 전송. 신호 속도 = 1,200 × 2 = 2,400bps 입니다."}
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>

</body>
</html>
