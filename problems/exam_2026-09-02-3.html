<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:10px;
  }
  .short-btn{
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .short-btn.ghost{
    background:#fff;
    color:var(--accent);
    border:1.5px solid var(--accent);
  }
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-09-02 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    type:"written",
    q:"해밍 코드(Hamming Code)에 대한 설명으로 옳은 것은?",
    kind:"mc",
    options:[
      "1비트의 오류만 검출할 수 있고 교정은 불가능하다.",
      "2비트의 오류를 검출하고 1비트의 오류를 교정할 수 있다.",
      "짝수 패리티 비트만 사용하는 오류 검출 코드이다.",
      "정마크(정스페이스) 방식으로 오류를 검출하는 코드이다."
    ],
    answer:1,
    explain:"해밍 코드는 스스로 오류를 검출하고 교정까지 할 수 있는 코드로, 2비트의 오류를 검출하고 1비트의 오류는 교정할 수 있습니다. '1비트 오류만 검출·교정 불가'는 패리티 검사 코드, '정마크 방식'은 2-out-of-5 코드에 대한 설명입니다."
  },
  {
    type:"written",
    q:"컴퓨터에서 음수를 표현하는 2진 연산 방식에 해당하지 않는 것은?",
    kind:"mc",
    options:["부호화 절대치", "부호화 1의 보수", "부호화 2의 보수", "부호화 그레이 코드"],
    answer:3,
    explain:"컴퓨터의 음수 표현 방식에는 부호화 절대치(부호 비트만 1로 변경), 부호화 1의 보수(절대값을 1의 보수로 변환), 부호화 2의 보수(1의 보수+1) 3가지가 있습니다. 그레이 코드는 인접한 두 수의 코드가 1비트만 다르게 만든 코드로 음수 표현 방식이 아닙니다."
  },
  {
    type:"written",
    q:"RS-232C 25핀 커넥터에서 '수신 데이터(RD, Received Data)'에 해당하는 핀 번호는?",
    kind:"mc",
    options:["2번", "3번", "4번", "5번"],
    answer:1,
    explain:"RS-232C 표준에서 2번 핀은 송신 데이터(TD), 3번 핀은 수신 데이터(RD), 4번 핀은 송신 요청(RTS), 5번 핀은 송신 준비 완료(CTS)를 담당합니다."
  },
  {
    type:"written",
    q:"OSI 7계층 중, 경로 배정(Routing)과 네트워크 어드레싱을 담당하는 계층은?",
    kind:"mc",
    options:["물리 계층", "데이터 링크 계층", "네트워크 계층", "전송 계층"],
    answer:2,
    explain:"네트워크 계층(3계층)은 패킷의 경로 배정(Routing), 중계, 네트워크 어드레싱을 담당합니다. 물리 계층은 기계적·전기적 접속, 데이터 링크 계층은 인접 시스템 간 신뢰성 있는 전송, 전송 계층은 종단 간 오류·흐름 제어를 담당합니다."
  },
  {
    type:"written",
    q:"UNIX에서 'chmod go-w 파일명' 명령을 실행했을 때의 결과로 옳은 것은?",
    kind:"mc",
    options:[
      "소유자(u)에게 쓰기 권한을 부여한다.",
      "그룹(g)과 기타 사용자(o)의 쓰기 권한을 취소한다.",
      "모든 사용자의 실행 권한을 취소한다.",
      "파일의 소유자를 변경한다."
    ],
    answer:1,
    explain:"chmod 명령에서 u(소유자)·g(그룹)·o(기타)는 대상을, +/-는 권한 부여/취소를, r·w·x는 읽기·쓰기·실행 권한을 의미합니다. 'go-w'는 그룹(g)과 기타(o) 사용자의 쓰기(w) 권한을 제거(-)한다는 뜻입니다."
  },
  {
    type:"written",
    q:"Windows에서 [실행] 창을 여는 단축키는?",
    kind:"mc",
    options:["Win + R", "Win + E", "Win + D", "Win + L"],
    answer:0,
    explain:"Win + R은 [실행] 창을 엽니다. Win + E는 탐색기, Win + D는 바탕화면 보기, Win + L은 화면 잠금 단축키입니다."
  },
  {
    type:"written",
    q:"MS-DOS 부팅 시 시스템 파일이 적재(로드)되는 순서로 옳은 것은?",
    kind:"mc",
    options:[
      "IO.SYS → MSDOS.SYS → CONFIG.SYS → COMMAND.COM → AUTOEXEC.BAT",
      "MSDOS.SYS → IO.SYS → COMMAND.COM → CONFIG.SYS → AUTOEXEC.BAT",
      "COMMAND.COM → IO.SYS → MSDOS.SYS → CONFIG.SYS → AUTOEXEC.BAT",
      "IO.SYS → CONFIG.SYS → MSDOS.SYS → AUTOEXEC.BAT → COMMAND.COM"
    ],
    answer:0,
    explain:"MS-DOS 부팅 순서는 암기 키워드 '아이엠씨씨에이(I.M.C.C.A)'로, IO.SYS → MSDOS.SYS → CONFIG.SYS → COMMAND.COM → AUTOEXEC.BAT 순으로 적재됩니다."
  },
  {
    type:"written",
    q:"통신 채널의 용량(전송 용량)을 증대시키는 방법으로 옳지 않은 것은?",
    kind:"mc",
    options:[
      "주파수 대역폭을 넓힌다.",
      "신호 세력(전력)을 크게 한다.",
      "잡음 세력(전력)을 크게 한다.",
      "신호 대 잡음비(S/N)를 높인다."
    ],
    answer:2,
    explain:"섀넌의 공식 C = W·log₂(1+S/N)에 따르면, 통신 용량은 대역폭(W)과 신호 세력(S)이 커지거나 잡음(N)이 작아질수록 증가합니다. 잡음 세력을 '크게' 하는 것은 오히려 통신 용량을 감소시키므로 옳지 않은 설명입니다."
  },
  {
    type:"written",
    q:"IP 주소 200.100.50.10은 어느 클래스에 속하는가?",
    kind:"mc",
    options:["Class A", "Class B", "Class C", "Class D"],
    answer:2,
    explain:"IP 주소의 첫 번째 옥텟(십진수) 범위로 클래스를 판별합니다: A(1~126), B(128~191), C(192~223), D(224~239, 멀티캐스트). 200은 192~223 범위에 속하므로 Class C 입니다."
  },
  {
    type:"written",
    q:"주파수 분할 다중화(FDM) 방식에서, 인접한 채널 간의 간섭을 방지하기 위해 두는 완충 대역은?",
    kind:"mc",
    options:["가드 밴드(Guard Band)", "타임 슬롯(Time Slot)", "프레임(Frame)", "베이스 밴드(Base Band)"],
    answer:0,
    explain:"FDM(주파수 분할 다중화)은 전체 주파수 대역을 여러 채널로 나누어 동시에 전송하는 방식으로, 채널 사이에 간섭을 막기 위한 완충 지역인 가드 밴드(Guard Band)를 둡니다. 타임 슬롯은 TDM(시분할 다중화)에서 사용하는 개념입니다."
  },
  {
    type:"written",
    q:"HDLC(High-level Data Link Control) 프레임의 구성 순서로 옳은 것은?",
    kind:"mc",
    options:[
      "플래그 → 주소부 → 제어부 → 정보부 → 검사부 → 플래그",
      "플래그 → 제어부 → 주소부 → 검사부 → 정보부 → 플래그",
      "주소부 → 플래그 → 정보부 → 제어부 → 검사부 → 플래그",
      "플래그 → 정보부 → 주소부 → 제어부 → 검사부 → 플래그"
    ],
    answer:0,
    explain:"HDLC 프레임 구성은 암기 키워드 '주.제.정.검'으로, 플래그(시작) → 주소부 → 제어부 → 정보부 → 검사부(FCS) → 플래그(종료) 순으로 구성됩니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 8비트 레지스터에서 -5를 2의 보수로 표현한 값을 2진수로 쓰시오. (공백 없이 8자리 숫자만)",
    kind:"short",
    accept:["11111011"],
    answerDisplay:"11111011",
    explain:"① 먼저 절대값 5를 8비트 2진수로 표현합니다: 5 = 00000101\n② 1의 보수를 구합니다 — 모든 비트를 반전(0↔1)시킵니다: 00000101 → 11111010\n③ 2의 보수는 1의 보수에 1을 더한 값입니다: 11111010 + 1 = 11111011\n④ 따라서 -5의 2의 보수 표현은 11111011 입니다. (최상위 비트가 1이므로 음수임을 나타냅니다.)"
  },
  {
    type:"practical",
    q:"[실기 단답형] '상품' 테이블에서 '재고'가 10 미만인 데이터를 조회하는 SQL문을 작성하시오.",
    kind:"short",
    accept:["SELECT * FROM 상품 WHERE 재고<10","SELECT * FROM 상품 WHERE 재고 < 10"],
    answerDisplay:"SELECT * FROM 상품 WHERE 재고 < 10;",
    explain:"① 조회(검색)는 DML의 SELECT 문을 사용하며 형식은 'SELECT 속성명 FROM 테이블명 WHERE 조건;' 입니다.\n② 모든 속성을 조회할 때는 속성명 자리에 '*'(애스터리스크)를 사용합니다.\n③ '재고가 10 미만'이라는 조건은 비교 연산자 '<'를 사용하여 재고 < 10 으로 표현합니다.\n④ '이하(10 포함)'라면 '<=', '초과'라면 '>'를 사용해야 하므로 부등호 방향과 등호 포함 여부를 꼭 구분해서 암기해야 합니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 8위상 편이변조(8-PSK)를 사용하여 2,000Baud의 속도로 전송할 때, 데이터 신호 속도(bps)를 구하시오. (단위 없이 숫자만)",
    kind:"short",
    accept:["6000","6,000"],
    answerDisplay:"6000bps",
    explain:"① 데이터 신호 속도(bps) = 변조 속도(Baud) × 변조 시 1회 신호 변화당 전송 비트 수 입니다.\n② 위상 편이 변조는 표현 가능한 위상 수가 2ⁿ이면 한 번의 신호 변화로 n비트를 전송합니다.\n③ 8위상 = 2³ 이므로 전송 비트 수는 3비트입니다.\n④ 따라서 2,000Baud × 3bit = 6,000bps 입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 망형(Mesh) 토폴로지로 8개의 노드를 서로 직접 연결할 때, 필요한 회선의 수를 구하시오. (단위 없이 숫자만)",
    kind:"short",
    accept:["28"],
    answerDisplay:"28",
    explain:"① 망형(Mesh) 토폴로지는 모든 노드가 서로 1:1로 직접 연결되는 구조로, 노드가 n개일 때 필요한 회선 수는 조합 공식 nC2 = n(n-1)/2 로 구합니다.\n② n=8이므로 8×7/2 = 56/2 = 28개의 회선이 필요합니다.\n③ 노드 수가 늘어날수록 회선 수는 제곱에 비례해 급격히 증가하므로, 대규모 망에서는 망형 대신 성형이나 계층형(Tree)을 사용하는 경우가 많습니다."
  }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btnRow = document.createElement('div');
    btnRow.className = 'short-btn-row';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const explainBtn = document.createElement('button');
    explainBtn.className = 'short-btn ghost';
    explainBtn.textContent = '해설 보기';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });
    explainBtn.addEventListener('click', () => { explain.classList.add('show'); });

    btnRow.appendChild(btn);
    btnRow.appendChild(explainBtn);
    saWrap.appendChild(input);
    saWrap.appendChild(btnRow);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>

</body>
</html>
