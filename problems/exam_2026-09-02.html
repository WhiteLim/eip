<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제2회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제2회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-09-02 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    type:"written",
    q:"전가산기(Full Adder)의 구성으로 옳은 것은?",
    kind:"mc",
    options:[
      "반가산기(HA) 1개 + OR 게이트 1개",
      "반가산기(HA) 2개 + OR 게이트 1개",
      "반가산기(HA) 2개 + AND 게이트 1개",
      "반가산기(HA) 3개"
    ],
    answer:1,
    explain:"전가산기(Full Adder)는 하위 자리에서 올라온 자리올림수(Carry-in)까지 더해야 하므로, 반가산기(HA) 2개와 OR 게이트 1개로 구성됩니다."
  },
  {
    type:"written",
    q:"CISC(Complex Instruction Set Computer)에 대한 설명으로 옳지 않은 것은?",
    kind:"mc",
    options:[
      "명령어의 종류가 많고 명령어 형식이 복잡하다.",
      "RISC에 비해 레지스터의 수가 적은 편이다.",
      "다양한 주소지정 방식을 지원한다.",
      "명령어 해독 시간이 짧고 프로그래밍이 매우 간단하다."
    ],
    answer:3,
    explain:"CISC는 명령어 종류가 많고 형식이 복잡하며, 다양한 주소지정 방식을 지원하고 RISC보다 레지스터 수가 적은 편입니다. '해독 시간이 짧고 프로그래밍이 간단하다'는 것은 오히려 RISC의 특징이므로 옳지 않습니다."
  },
  {
    type:"written",
    q:"10진수의 각 자리를 4비트의 2진수로 표현하며, Zone 2비트 + Digit 4비트로 총 6비트로 구성되는 코드는?",
    kind:"mc",
    options:["BCD 코드","ASCII 코드","EBCDIC 코드","그레이(Gray) 코드"],
    answer:0,
    explain:"BCD 코드는 10진수 한 자리를 4비트 2진수로 표현하며, Zone 2비트 + Digit 4비트의 총 6비트로 구성됩니다. ASCII는 7비트(Zone 3+Digit 4), EBCDIC은 8비트(Zone 4+Digit 4)로 구성됩니다."
  },
  {
    type:"written",
    q:"DMA(Direct Memory Access)의 구성 요소로 옳지 않은 것은?",
    kind:"mc",
    options:["인터페이스 회로", "주소 레지스터", "데이터 카운터 레지스터", "명령어 레지스터(IR)"],
    answer:3,
    explain:"DMA는 인터페이스 회로, 제어 레지스터, 주소 레지스터, 데이터 카운터 레지스터, 데이터 레지스터로 구성됩니다. 명령어 레지스터(IR)는 CPU 제어장치의 구성 요소로 DMA와는 관계가 없습니다."
  },
  {
    type:"written",
    q:"CPU와 주기억장치 사이의 속도 차이를 줄이기 위해 사용하는, 고속이지만 가격이 비싼 기억장치는?",
    kind:"mc",
    options:["캐시 메모리", "가상 기억장치", "연관 기억장치", "보조 기억장치"],
    answer:0,
    explain:"캐시 메모리는 CPU와 주기억장치 사이에 위치하여 두 장치 간의 속도 차이를 줄여주는 고속 기억장치로, 속도가 빠른 만큼 가격이 비싼 것이 특징입니다."
  },
  {
    type:"written",
    q:"DBMS(데이터베이스 관리 시스템)의 필수 기능 3가지에 해당하지 않는 것은?",
    kind:"mc",
    options:["정의(Definition) 기능", "조작(Manipulation) 기능", "제어(Control) 기능", "번역(Compile) 기능"],
    answer:3,
    explain:"DBMS의 필수 기능은 정의 기능, 조작 기능, 제어 기능(정.조.제) 3가지입니다. 번역(Compile) 기능은 언어 번역 프로그램(컴파일러)의 역할로 DBMS의 필수 기능이 아닙니다."
  },
  {
    type:"written",
    q:"SQL 명령어 중 DCL(데이터 제어어, Data Control Language)에 해당하는 것은?",
    kind:"mc",
    options:["SELECT", "CREATE", "GRANT", "DELETE"],
    answer:2,
    explain:"DCL(데이터 제어어)에는 COMMIT, ROLLBACK, GRANT, REVOKE가 있습니다. SELECT와 DELETE는 DML(데이터 조작어), CREATE는 DDL(데이터 정의어)에 해당합니다."
  },
  {
    type:"written",
    q:"운영체제의 성능 평가 항목 중, 작업을 시스템에 제시한 시점부터 결과를 얻을 때까지 걸리는 시간을 의미하는 것은?",
    kind:"mc",
    options:["처리 능력(Throughput)", "반환 시간(Turnaround Time)", "신뢰도(Reliability)", "사용 가능도(Availability)"],
    answer:1,
    explain:"반환 시간(Turnaround Time)은 작업을 제시한 시점부터 그 결과를 받을 때까지의 경과 시간을 의미합니다. 처리 능력은 일정 시간 내 처리하는 일의 양, 신뢰도는 문제를 정확히 해결하는 정도, 사용 가능도는 필요할 때 즉시 사용 가능한 정도입니다."
  },
  {
    type:"written",
    q:"다음 중 페이지 교체(Page Replacement) 알고리즘에 해당하지 않는 것은?",
    kind:"mc",
    options:["LRU", "LFU", "NUR", "SJF"],
    answer:3,
    explain:"LRU(가장 오래 참조되지 않은 페이지 교체), LFU(참조 빈도가 가장 적은 페이지 교체), NUR(최근에 사용하지 않은 페이지 교체)는 페이지 교체 알고리즘입니다. SJF(Shortest Job First)는 CPU 스케줄링 기법으로 페이지 교체 알고리즘이 아닙니다."
  },
  {
    type:"written",
    q:"Windows에서 삭제할 파일을 휴지통을 거치지 않고 즉시 삭제할 때 사용하는 단축키는?",
    kind:"mc",
    options:["Delete", "Shift + Delete", "Ctrl + Delete", "Alt + Delete"],
    answer:1,
    explain:"Shift + Delete 키를 누르면 선택한 파일이 휴지통을 거치지 않고 즉시(완전히) 삭제됩니다. Delete 키만 누르면 휴지통으로 이동합니다."
  },
  {
    type:"written",
    q:"OSI 7계층 중, 코드 변환(암호화·해독)과 압축 등을 담당하며 데이터의 표현 형식을 관리하는 계층은?",
    kind:"mc",
    options:["세션 계층", "표현 계층", "전송 계층", "응용 계층"],
    answer:1,
    explain:"표현 계층(Presentation Layer, 6계층)은 데이터의 표현 형식을 변환하는 역할을 하며, 암호화·해독, 압축 등의 코드 변환 기능을 담당합니다. 세션 계층은 대화 제어, 전송 계층은 오류·흐름 제어, 응용 계층은 사용자 서비스 제공을 담당합니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 10진수 178을 16진수로 변환한 값을 쓰시오.",
    kind:"short",
    accept:["B2"],
    answerDisplay:"B2",
    explain:"178을 16으로 나누면 몫 11, 나머지 2가 됩니다. 몫 11은 16진수로 B이므로, 178(10) = B2(16) 입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] '사원' 테이블에서 '직급'이 '과장'인 사원의 '급여'를 20% 인상(급여 × 1.2)하는 SQL문을 작성하시오.",
    kind:"short",
    accept:["UPDATE 사원 SET 급여=급여*1.2 WHERE 직급='과장'","UPDATE 사원 SET 급여 = 급여 * 1.2 WHERE 직급='과장'","UPDATE 사원 SET 급여=급여*1.2 WHERE 직급=\"과장\""],
    answerDisplay:"UPDATE 사원 SET 급여 = 급여 * 1.2 WHERE 직급='과장';",
    explain:"UPDATE 문은 'UPDATE 테이블명 SET 속성명=변경값 WHERE 조건'의 형식을 사용합니다. 급여를 20% 인상하는 것은 기존 급여에 1.2를 곱하는 것과 같으므로 SET 급여 = 급여 * 1.2 로 작성합니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 8위상 편이변조(8-PSK, 위상 8개 = 3비트 전송)를 사용하여 1,600Baud의 속도로 전송할 때, 데이터 신호 속도(bps)를 구하시오. (단위 없이 숫자만)",
    kind:"short",
    accept:["4800","4,800"],
    answerDisplay:"4800bps",
    explain:"신호 속도(bps) = 변조 속도(Baud) × 변조 시 상태 변화 비트 수. 8위상 = 2³ 이므로 상태 변화 비트 수는 3비트. 따라서 1,600 × 3 = 4,800bps 입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 망형(Mesh) 토폴로지로 6개의 노드를 서로 직접 연결할 때, 필요한 회선의 수를 구하시오. (단위 없이 숫자만)",
    kind:"short",
    accept:["15"],
    answerDisplay:"15",
    explain:"망형(Mesh) 토폴로지에서 노드가 n개일 때 필요한 회선의 수는 n(n-1)/2 입니다. 노드가 6개이므로 6×5/2 = 15개의 회선이 필요합니다."
  }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>

</body>
</html>
