<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-11-24 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    type:"written",
    q:"CPU 제어장치의 레지스터 중, 다음에 실행할 명령어의 주소를 기억하는 레지스터는?",
    kind:"mc",
    options:["프로그램 카운터(PC)","명령 레지스터(IR)","메모리 버퍼 레지스터(MBR)","누산기(Accumulator)"],
    answer:0,
    explain:"프로그램 카운터(PC)는 다음에 실행할 명령어의 주소를 기억합니다. 명령 레지스터(IR)는 현재 실행 중인 명령어를 기억하고, MBR은 기억장치를 출입하는 데이터를 일시 저장하며, 누산기는 연산 결과를 일시적으로 저장합니다."
  },
  {
    type:"written",
    q:"명령어 실행 동작 단계(메이저 스테이트)의 순서로 옳은 것은?",
    kind:"mc",
    options:[
      "인출(Fetch) → 간접(Indirect) → 실행(Execute) → 인터럽트(Interrupt)",
      "간접(Indirect) → 인출(Fetch) → 실행(Execute) → 인터럽트(Interrupt)",
      "인출(Fetch) → 실행(Execute) → 간접(Indirect) → 인터럽트(Interrupt)",
      "인터럽트(Interrupt) → 인출(Fetch) → 간접(Indirect) → 실행(Execute)"
    ],
    answer:0,
    explain:"명령어 실행 동작 단계는 인출(Fetch) → 간접(Indirect) → 실행(Execute) → 인터럽트(Interrupt) 순서로 진행됩니다."
  },
  {
    type:"written",
    q:"10진수 -5를 8비트 부호화 2의 보수 방식으로 표현한 것은?",
    kind:"mc",
    options:["10000101","11111010","11111011","00000101"],
    answer:2,
    explain:"+5 = 00000101 → 1의 보수 11111010 → 1을 더한 2의 보수 11111011 입니다. 10000101은 부호화 절대치, 11111010은 부호화 1의 보수 표현입니다."
  },
  {
    type:"written",
    q:"프로그램 카운터(PC)의 값과 명령어의 주소 부분(Operand)을 더하여 유효 주소를 결정하는 주소 지정 방식은?",
    kind:"mc",
    options:["상대 주소 지정(Relative)","간접 주소 지정(Indirect)","직접 주소 지정(Direct)","즉치 주소 지정(Immediate)"],
    answer:0,
    explain:"상대 주소 지정 방식은 PC + 주소 부분(Operand)으로 유효 주소를 구합니다. 간접은 포인터의 주소를, 직접은 실제 데이터의 절대 주소를, 즉치는 주소 대신 자료 자체를 저장합니다."
  },
  {
    type:"written",
    q:"입출력장치와 CPU 간의 속도 차이를 해결하기 위한 방식 중, 보조기억장치(디스크)를 이용하며 다중 작업에 사용되는 것은?",
    kind:"mc",
    options:["버퍼링(Buffering)","스풀링(Spooling)","폴링(Polling)","블로킹(Blocking)"],
    answer:1,
    explain:"스풀링은 보조기억장치를 이용하며 다중 작업에 사용됩니다. 버퍼링은 주기억장치를 이용하며 단일 작업에 사용됩니다. 폴링은 인터럽트 우선순위 판별 방식(소프트웨어), 블로킹은 여러 논리 레코드를 묶는 기법입니다."
  },
  {
    type:"written",
    q:"관계형 데이터베이스의 릴레이션에서 속성(Attribute)의 개수를 의미하는 용어는?",
    kind:"mc",
    options:["기수(Cardinality)","차수(Degree)","도메인(Domain)","튜플(Tuple)"],
    answer:1,
    explain:"차수(Degree)는 속성(Attribute)의 개수, 기수(Cardinality)는 튜플(Tuple)의 개수입니다. 도메인은 하나의 속성이 가질 수 있는 값의 범위입니다."
  },
  {
    type:"written",
    q:"운영체제의 제어 프로그램(Control Program)에 해당하지 않는 것은?",
    kind:"mc",
    options:["감시 프로그램","작업 제어 프로그램","자료 관리 프로그램","언어 번역 프로그램"],
    answer:3,
    explain:"제어 프로그램은 감시·작업 제어·자료 관리 프로그램(감.작.데)으로 구성됩니다. 언어 번역 프로그램은 서비스 프로그램과 함께 처리 프로그램에 속합니다."
  },
  {
    type:"written",
    q:"다음 MS-DOS 명령어 중 외부 명령어에 해당하는 것은?",
    kind:"mc",
    options:["DIR","COPY","CLS","FORMAT"],
    answer:3,
    explain:"DIR, COPY, CLS는 COMMAND.COM에서 처리되는 내부 명령어입니다. FORMAT은 별도의 실행 파일이 필요한 외부 명령어입니다(ATTRIB, CHKDSK, FDISK, XCOPY 등도 외부 명령어)."
  },
  {
    type:"written",
    q:"UNIX에서 파일의 소유자만 수정할 수 있도록, 그룹(group)과 기타 사용자(other)의 쓰기 권한을 취소하는 명령은?",
    kind:"mc",
    options:["chmod go-w 파일명","chmod go+w 파일명","chmod u-w 파일명","chmod u+w 파일명"],
    answer:0,
    explain:"chmod에서 u는 소유자, g는 그룹, o는 기타 사용자이며, -w는 쓰기 권한 제거, +w는 쓰기 권한 부여입니다. 따라서 그룹·기타 사용자의 쓰기 권한을 취소하려면 chmod go-w 파일명을 사용합니다."
  },
  {
    type:"written",
    q:"광섬유 케이블에서 발생하는 손실의 종류에 해당하지 않는 것은?",
    kind:"mc",
    options:["접속 손실","산란 손실","흡수 손실","유전체 손실"],
    answer:3,
    explain:"광섬유 케이블의 손실에는 접속 손실, 산란 손실, 흡수 손실이 있습니다. 유전체 손실은 광섬유 손실에 해당하지 않습니다(오답 함정)."
  },
  {
    type:"written",
    q:"통신 프로토콜의 기본 구성 요소에 해당하지 않는 것은?",
    kind:"mc",
    options:["구문(Syntax)","의미(Semantics)","시간(Timing)","처리(Process)"],
    answer:3,
    explain:"프로토콜의 기본 요소는 구문(Syntax), 의미(Semantics), 시간(Timing) 3가지입니다. 처리(Process)는 기본 요소가 아닙니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 그레이 코드(Gray Code) 1101을 2진수로 변환한 값을 쓰시오.",
    kind:"short",
    accept:["1001"],
    answerDisplay:"1001",
    explain:"Gray → 2진수 변환은 첫 비트는 그대로 쓰고, 두 번째부터는 '직전 결과값'과 XOR 합니다. 1 / 1⊕1=0 / 0⊕0=0 / 0⊕1=1 → 1001 입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] '학생' 테이블에서 '학년'이 3인 학생의 '이름'을 중복 없이 검색하는 SQL문을 작성하시오.",
    kind:"short",
    accept:["SELECT DISTINCT 이름 FROM 학생 WHERE 학년=3","SELECT DISTINCT 이름 FROM 학생 WHERE 학년='3'"],
    answerDisplay:"SELECT DISTINCT 이름 FROM 학생 WHERE 학년 = 3;",
    explain:"중복을 제거하고 검색할 때는 SELECT 뒤에 DISTINCT를 붙입니다. 형식: SELECT DISTINCT 속성 FROM 테이블 WHERE 조건;"
  },
  {
    type:"practical",
    q:"[실기 단답형] 대역폭(W)이 3,000Hz이고 신호 대 잡음비(S/N)가 7인 통신 회선의 통신 용량(bps)을 섀넌(Shannon) 공식으로 구하시오. (단위 없이 숫자만)",
    kind:"short",
    accept:["9000","9,000"],
    answerDisplay:"9000bps",
    explain:"섀넌 공식 C = W · log₂(1 + S/N) 에 대입하면 C = 3,000 × log₂(1 + 7) = 3,000 × log₂8 = 3,000 × 3 = 9,000bps 입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] IP 주소 203.0.113.25가 속한 클래스의 기본 서브넷 마스크를 쓰시오.",
    kind:"short",
    accept:["255.255.255.0"],
    answerDisplay:"255.255.255.0 (Class C)",
    explain:"첫 옥텟이 192~223이면 Class C이며, Class C의 기본 서브넷 마스크는 255.255.255.0 입니다. 203은 이 범위에 속하므로 Class C입니다."
  }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase()
    .replace(/[;；]+$/,'')
    .replace(/[“”"‘’]/g,"'")
    .replace(/\s+/g,'');
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>
