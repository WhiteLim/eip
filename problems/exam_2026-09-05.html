<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-09-05 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    type:"written",
    q:"RISC(Reduced Instruction Set Computer)의 특징으로 옳은 것은?",
    kind:"mc",
    options:[
      "메모리 액세스 명령이 LOAD와 STORE로 한정된다.",
      "CISC에 비해 레지스터의 수가 적은 편이다.",
      "명령어의 종류가 많고 명령어 형식이 복잡하다.",
      "프로그래밍이 매우 간단하다."
    ],
    answer:0,
    explain:"RISC는 메모리 액세스를 LOAD와 STORE 명령으로만 한정하여 처리 속도를 높입니다. 반면 RISC는 CISC보다 레지스터 수가 많고, 프로그래밍이 복잡한 편입니다. 명령어 종류가 많고 형식이 복잡한 것은 CISC의 특징입니다."
  },
  {
    type:"written",
    q:"인터럽트 우선순위를 판별하는 방식 중, 소프트웨어적인 방식에 해당하는 것은?",
    kind:"mc",
    options:["폴링(Polling)", "데이지 체인(Daisy Chain)", "병렬 우선순위 처리 방식", "하드와이어드 방식"],
    answer:0,
    explain:"폴링(Polling)은 프로그램(소프트웨어)으로 각 장치의 상태를 순차적으로 검사하여 우선순위를 판별하는 방식입니다. 데이지 체인과 병렬 우선순위 처리 방식은 하드웨어적인 방식입니다."
  },
  {
    type:"written",
    q:"전송 회선의 전기적 1차 정수(1차 상수)에 해당하지 않는 것은?",
    kind:"mc",
    options:["저항(R)", "인덕턴스(L)", "임피던스(Z)", "누설 컨덕턴스(G)"],
    answer:2,
    explain:"전송 회선의 전기적 1차 정수는 저항(R), 정전용량(C), 인덕턴스(L), 누설 컨덕턴스(G) 4가지입니다. 임피던스(Z)는 이 4가지 1차 정수로부터 계산되는 값으로, 1차 정수 자체에는 해당하지 않습니다."
  },
  {
    type:"written",
    q:"OSI 7계층 중, 경로 배정(Routing)과 중계, 네트워크 어드레싱 기능을 담당하는 계층은?",
    kind:"mc",
    options:["데이터 링크 계층", "네트워크 계층", "전송 계층", "세션 계층"],
    answer:1,
    explain:"네트워크 계층(3계층)은 경로 배정(라우팅), 중계, 네트워크 어드레싱 기능을 담당합니다. 데이터 링크 계층은 인접 시스템 간 신뢰성 있는 전송, 전송 계층은 오류·흐름 제어, 세션 계층은 대화 제어를 담당합니다."
  },
  {
    type:"written",
    q:"HDLC(High-level Data Link Control) 프레임의 구성 순서로 옳은 것은?",
    kind:"mc",
    options:[
      "플래그 - 주소부 - 제어부 - 정보부 - 검사부 - 플래그",
      "플래그 - 제어부 - 주소부 - 정보부 - 검사부 - 플래그",
      "주소부 - 플래그 - 제어부 - 검사부 - 정보부 - 플래그",
      "플래그 - 정보부 - 주소부 - 제어부 - 검사부 - 플래그"
    ],
    answer:0,
    explain:"HDLC 프레임은 플래그(Flag) - 주소부(Address) - 제어부(Control) - 정보부(Information) - 검사부(FCS) - 플래그 순서로 구성됩니다(주.제.정.검으로 암기)."
  },
  {
    type:"written",
    q:"PCM(펄스 코드 변조, Pulse Code Modulation) 방식에서 송신측의 신호 처리 순서로 옳은 것은?",
    kind:"mc",
    options:[
      "표본화 - 양자화 - 부호화",
      "양자화 - 표본화 - 부호화",
      "부호화 - 표본화 - 양자화",
      "표본화 - 부호화 - 양자화"
    ],
    answer:0,
    explain:"PCM 송신측은 표본화(Sampling) → 양자화(Quantizing) → 부호화(Encoding) 순서로 아날로그 신호를 디지털 신호로 변환합니다(표.양.부로 암기)."
  },
  {
    type:"written",
    q:"주파수 분할 다중화(FDM) 방식에서, 인접한 채널 간의 상호 간섭을 방지하기 위해 두는 완충 지역은?",
    kind:"mc",
    options:["가드 밴드(Guard Band)", "동기 비트", "스타트 비트", "프리앰블"],
    answer:0,
    explain:"FDM(주파수 분할 다중화)은 전체 대역폭을 여러 채널로 나누어 사용하며, 채널 간 간섭을 막기 위해 채널 사이에 가드 밴드(Guard Band)라는 완충 지역을 둡니다."
  },
  {
    type:"written",
    q:"통신 프로토콜(Protocol)의 기본 요소 3가지에 해당하지 않는 것은?",
    kind:"mc",
    options:["구문(Syntax)", "의미(Semantics)", "시간(Timing)", "처리(Processing)"],
    answer:3,
    explain:"프로토콜의 3대 기본 요소는 구문(Syntax), 의미(Semantics), 시간(Timing)입니다. 처리(Processing)는 프로토콜의 기본 요소에 해당하지 않습니다."
  },
  {
    type:"written",
    q:"해밍 코드(Hamming Code)에 대한 설명으로 옳은 것은?",
    kind:"mc",
    options:[
      "2비트까지 오류를 검출하고, 1비트의 오류는 스스로 교정할 수 있다.",
      "오류의 검출만 가능하고 교정은 불가능하다.",
      "정마크(정스페이스) 방식으로 오류를 검출한다.",
      "1비트의 오류만 검출할 수 있다."
    ],
    answer:0,
    explain:"해밍 코드는 오류를 스스로 검출하고 교정할 수 있는 코드로, 2비트의 오류를 검출하고 그중 1비트의 오류는 교정할 수 있습니다. 정마크 방식은 2-out-of-5 코드의 오류 검출 방식이며, 1비트 오류만 검출하는 것은 패리티 검사 코드입니다."
  },
  {
    type:"written",
    q:"UNIX 운영체제에서 사용되는 쉘(Shell)의 종류에 해당하지 않는 것은?",
    kind:"mc",
    options:["Korn Shell", "Bourne Shell", "C Shell", "PowerShell"],
    answer:3,
    explain:"UNIX의 대표적인 쉘에는 Korn Shell, Bourne Shell, C Shell이 있습니다(K.B.C로 암기). PowerShell은 Windows 운영체제에서 사용하는 명령어 해석기입니다."
  },
  {
    type:"written",
    q:"IP 주소 132.10.5.1은 어느 클래스(Class)에 속하는가?",
    kind:"mc",
    options:["Class A", "Class B", "Class C", "Class D"],
    answer:1,
    explain:"IP 주소의 클래스는 첫 번째 옥텟(8비트) 값으로 구분합니다. Class A는 0~127, Class B는 128~191, Class C는 192~223입니다. 132는 128~191 범위에 속하므로 Class B입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 트랙 수 20, 트랙당 섹터 수 30, 섹터당 워드 수 128인 단면(면 수 1) 디스크의 전체 저장 가능한 워드 수를 구하시오. (단위 없이 숫자만)",
    kind:"short",
    accept:["76800","76,800"],
    answerDisplay:"76800",
    explain:"워드 수 = 트랙 수 × 트랙당 섹터 수 × 섹터당 워드 수 × 면 수 공식을 적용합니다. 20 × 30 × 128 × 1 = 76,800 워드입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] '학생' 테이블에 '이메일'이라는 이름의 VARCHAR(50) 타입 컬럼을 추가하는 SQL문을 작성하시오.",
    kind:"short",
    accept:["ALTER TABLE 학생 ADD 이메일 VARCHAR(50)","ALTER TABLE 학생 ADD COLUMN 이메일 VARCHAR(50)"],
    answerDisplay:"ALTER TABLE 학생 ADD 이메일 VARCHAR(50);",
    explain:"테이블에 새로운 컬럼(속성)을 추가할 때는 DDL 명령어인 ALTER TABLE ~ ADD ~ 구문을 사용합니다. 'ALTER TABLE 테이블명 ADD 컬럼명 자료형' 형식으로 작성합니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 4위상 편이변조(4-PSK, 위상 4개 = 2비트 전송)를 사용하여 2,000Baud의 속도로 전송할 때, 데이터 신호 속도(bps)를 구하시오. (단위 없이 숫자만)",
    kind:"short",
    accept:["4000","4,000"],
    answerDisplay:"4000bps",
    explain:"신호 속도(bps) = 변조 속도(Baud) × 변조 시 상태 변화 비트 수. 4위상 = 2² 이므로 상태 변화 비트 수는 2비트. 따라서 2,000 × 2 = 4,000bps 입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 2진수 111010을 10진수로 변환한 값을 쓰시오. (단위 없이 숫자만)",
    kind:"short",
    accept:["58"],
    answerDisplay:"58",
    explain:"2진수를 10진수로 변환할 때는 각 자릿값에 2의 지수승을 곱해 모두 더합니다. 111010₂ = 1×2⁵ + 1×2⁴ + 1×2³ + 0×2² + 1×2¹ + 0×2⁰ = 32+16+8+0+2+0 = 58 입니다."
  }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>
