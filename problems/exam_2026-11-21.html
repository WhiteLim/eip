<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-11-21 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    type:"written",
    q:"CPU의 제어장치에서 다음에 실행할 명령어의 주소를 기억하는 레지스터는?",
    kind:"mc",
    options:["프로그램 카운터(PC)","명령 레지스터(IR)","메모리 버퍼 레지스터(MBR)","누산기(Accumulator)"],
    answer:0,
    explain:"프로그램 카운터(PC)는 다음에 실행할 명령어의 주소를 기억합니다. 명령 레지스터(IR)는 현재 실행 중인 명령어를, MBR은 기억장치를 출입하는 데이터를 일시 저장하며, 누산기는 연산 결과를 일시적으로 저장합니다."
  },
  {
    type:"written",
    q:"데이터 전송 중 발생한 오류를 스스로 검출할 뿐 아니라 1비트 오류를 교정까지 할 수 있는 코드는?",
    kind:"mc",
    options:["패리티 검사 코드","해밍 코드(Hamming Code)","BCD 코드","그레이 코드(Gray Code)"],
    answer:1,
    explain:"해밍 코드는 오류를 스스로 검출·교정할 수 있는 코드로, 2비트 오류 검출과 1비트 오류 교정이 가능합니다. 패리티 검사 코드는 1비트 오류 '검출'만 가능하고 교정은 할 수 없습니다."
  },
  {
    type:"written",
    q:"명령어의 주소 부분(Operand)에 프로그램 카운터(PC)의 값을 더하여 실제 데이터의 주소(유효 주소)를 구하는 주소 지정 방식은?",
    kind:"mc",
    options:["직접 주소 지정","간접 주소 지정","즉시 주소 지정","상대 주소 지정"],
    answer:3,
    explain:"상대 주소 지정(Relative Addressing)은 '프로그램 카운터(PC) + 주소 부분(Operand)'으로 유효 주소를 계산합니다. 직접은 실제 데이터의 절대 주소를, 간접은 포인터의 주소를 저장하며, 즉시는 주소 대신 자료 자체를 저장합니다."
  },
  {
    type:"written",
    q:"인터럽트 우선순위 판별 방법 중 소프트웨어(S/W)적인 방식에 해당하는 것은?",
    kind:"mc",
    options:["폴링(Polling)","데이지 체인(Daisy Chain)","병렬 우선순위 부여","DMA"],
    answer:0,
    explain:"폴링(Polling)은 CPU가 인터럽트 요청 장치를 차례로 검사하는 소프트웨어 방식입니다. 데이지 체인과 병렬 우선 처리는 하드웨어 방식이며, DMA는 인터럽트 우선순위 판별 방법이 아닙니다."
  },
  {
    type:"written",
    q:"버퍼링(Buffering)과 스풀링(Spooling)에 대한 설명으로 옳지 않은 것은?",
    kind:"mc",
    options:[
      "두 방식 모두 입출력장치와 CPU 간의 속도 차이를 해결하기 위해 사용한다.",
      "버퍼링은 주기억장치의 일부를 버퍼로 사용한다.",
      "스풀링은 보조기억장치(디스크)를 사용한다.",
      "스풀링은 단일 작업(단일 사용자) 환경에서만 사용할 수 있다."
    ],
    answer:3,
    explain:"버퍼링은 주기억장치를 사용하며 단일 작업에, 스풀링은 보조기억장치를 사용하며 다중 작업에 적합합니다. 따라서 '스풀링은 단일 작업에서만 사용'은 옳지 않습니다."
  },
  {
    type:"written",
    q:"데이터베이스 설계 단계의 순서로 옳은 것은?",
    kind:"mc",
    options:[
      "요구사항 분석 → 개념적 설계 → 논리적 설계 → 물리적 설계 → 구현",
      "요구사항 분석 → 논리적 설계 → 개념적 설계 → 물리적 설계 → 구현",
      "개념적 설계 → 요구사항 분석 → 논리적 설계 → 구현 → 물리적 설계",
      "요구사항 분석 → 물리적 설계 → 논리적 설계 → 개념적 설계 → 구현"
    ],
    answer:0,
    explain:"데이터베이스 설계는 요구사항 분석 → 개념적 설계 → 논리적 설계 → 물리적 설계 → 구현 순서로 진행됩니다. 암기법: '개.논.물'."
  },
  {
    type:"written",
    q:"튜플(Tuple)이 7개, 속성(Attribute)이 4개인 릴레이션의 차수(Degree)와 기수(Cardinality)로 옳은 것은?",
    kind:"mc",
    options:["차수 4, 기수 7","차수 7, 기수 4","차수 11, 기수 28","차수 28, 기수 11"],
    answer:0,
    explain:"차수(Degree)는 속성(Attribute)의 개수, 기수(Cardinality)는 튜플(Tuple)의 개수입니다. 따라서 차수 4, 기수 7입니다."
  },
  {
    type:"written",
    q:"시간 조각(Time Slice)을 미리 정의하여 각 프로세스에 차례로 CPU를 할당하고, 할당 시간 안에 끝나지 않으면 준비 큐의 맨 뒤로 보내는 선점형 스케줄링 기법은?",
    kind:"mc",
    options:["FIFO(FCFS)","SRT","RR(Round Robin)","다단계 큐"],
    answer:2,
    explain:"RR(Round Robin)은 시간 조각(Time Slice)을 정해 각 프로세스에 CPU를 순환 할당하는 선점형 기법입니다. FIFO는 비선점, SRT는 남은 실행 시간이 짧은 프로세스에 할당하는 선점형, 다단계 큐는 프로세스를 그룹별 큐로 분류하는 방식입니다."
  },
  {
    type:"written",
    q:"MS-DOS의 명령어 중 내부 명령어(COMMAND.COM에서 처리)가 아닌 것은?",
    kind:"mc",
    options:["CLS","DIR","COPY","FORMAT"],
    answer:3,
    explain:"CLS, VER, VOL, DATE, TIME, PROMPT, DIR, COPY, MD, CD, RD, TYPE, DEL 등은 내부 명령어입니다. FORMAT은 ATTRIB, CHKDSK, FDISK, XCOPY 등과 함께 별도 실행 파일이 필요한 외부 명령어입니다."
  },
  {
    type:"written",
    q:"UNIX에서 'chmod go-w 파일명' 명령의 의미로 옳은 것은?",
    kind:"mc",
    options:[
      "그룹과 기타 사용자에게 쓰기 권한을 부여한다.",
      "그룹과 기타 사용자의 쓰기 권한을 취소한다.",
      "소유자와 그룹의 쓰기 권한을 취소한다.",
      "모든 사용자의 실행 권한을 취소한다."
    ],
    answer:1,
    explain:"chmod에서 u는 소유자, g는 그룹, o는 기타 사용자를 뜻하고 '-'는 권한 제거, 'w'는 쓰기 권한입니다. 따라서 go-w는 그룹·기타 사용자의 쓰기 권한을 취소하여 소유자만 수정할 수 있게 합니다."
  },
  {
    type:"written",
    q:"펄스 코드 변조(PCM) 방식에서 송신 측의 처리 순서로 옳은 것은?",
    kind:"mc",
    options:[
      "양자화 → 표본화 → 부호화",
      "표본화 → 부호화 → 양자화",
      "표본화 → 양자화 → 부호화",
      "부호화 → 양자화 → 표본화"
    ],
    answer:2,
    explain:"PCM 송신 측은 표본화(Sampling) → 양자화(Quantizing) → 부호화(Encoding) 순서(표.양.부)이며, 수신 측은 복호화(Decoding) → 여과화(Filtering) 순서(복.여)로 처리합니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 10진수 -13을 8비트 부호화 2의 보수 방식으로 표현하시오. (예: 00000000 형태로 8자리)",
    kind:"short",
    accept:["11110011"],
    answerDisplay:"11110011",
    explain:"13을 8비트 2진수로 나타내면 00001101입니다. 1의 보수를 취하면 11110010, 여기에 1을 더하면 2의 보수 11110011이 됩니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] '학생' 테이블에서 '학년'이 3인 학생들의 '이름'을 중복 없이 검색하는 SQL문을 작성하시오.",
    kind:"short",
    accept:["SELECT DISTINCT 이름 FROM 학생 WHERE 학년=3","SELECT DISTINCT 이름 FROM 학생 WHERE 학년='3'"],
    answerDisplay:"SELECT DISTINCT 이름 FROM 학생 WHERE 학년 = 3;",
    explain:"중복을 제거하여 검색할 때는 SELECT 다음에 DISTINCT 키워드를 사용합니다. 형식: SELECT DISTINCT 속성명 FROM 테이블명 WHERE 조건;"
  },
  {
    type:"practical",
    q:"[실기 단답형] 대역폭(W)이 3,000Hz이고 신호 대 잡음비(S/N)가 15인 통신 회선의 통신 용량(C)을 섀넌(Shannon) 공식으로 구하시오. (단위 bps, 숫자만)",
    kind:"short",
    accept:["12000","12,000"],
    answerDisplay:"12000bps",
    explain:"섀넌 공식 C = W · log₂(1 + S/N) 에 대입하면 C = 3,000 × log₂(1 + 15) = 3,000 × log₂16 = 3,000 × 4 = 12,000bps 입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] IP 주소 201.100.5.68이 속한 클래스의 기본 서브넷 마스크를 쓰시오.",
    kind:"short",
    accept:["255.255.255.0"],
    answerDisplay:"255.255.255.0",
    explain:"첫 번째 옥텟이 192~223이면 C 클래스입니다. 201은 C 클래스에 해당하므로 기본 서브넷 마스크는 255.255.255.0 입니다."
  }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim().replace(/\s*([=*,()<>+\-])\s*/g,'$1');
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>

</body>
</html>
