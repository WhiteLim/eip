<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-09-04 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    type:"written",
    q:"SR 플립플롭에서 S=1, R=1일 때 발생하는 불확정(부정) 상태를 보완하여 만든 플립플롭으로, 현재 가장 널리 사용되는 것은?",
    kind:"mc",
    options:["RS 플립플롭", "D 플립플롭", "JK 플립플롭", "T 플립플롭"],
    answer:2,
    explain:"JK 플립플롭은 RS 플립플롭의 S=1, R=1일 때 발생하는 부정(불확정) 상태 문제를 해결하기 위해 고안되었으며, 현재 가장 널리 사용되는 플립플롭입니다."
  },
  {
    type:"written",
    q:"드모르간(De Morgan)의 법칙에 따라 (A+B)'(NOT)와 같은 논리식은?",
    kind:"mc",
    options:["A' + B'", "A' · B'", "A · B", "A' + B"],
    answer:1,
    explain:"드모르간의 법칙에 의해 (A+B)' = A'·B' 입니다. 즉, OR의 부정은 각 항을 부정한 뒤 AND로 연결한 것과 같습니다."
  },
  {
    type:"written",
    q:"명령어 형식 중, 연산 결과를 Operand1(첫 번째 자료)에 저장함으로써 원래의 자료가 파괴되는 형식은?",
    kind:"mc",
    options:["0 주소 명령어", "1 주소 명령어", "2 주소 명령어", "3 주소 명령어"],
    answer:2,
    explain:"2 주소 명령어는 연산 결과를 Operand1 자리에 덮어써서 저장하므로 원래의 자료가 파괴됩니다. 반면 3 주소 명령어는 범용 레지스터(GPR)를 이용해 입력 자료를 보존할 수 있습니다."
  },
  {
    type:"written",
    q:"CPU의 개입 없이 독립적으로 여러 입출력장치를 관리하며, 입출력 작업을 전담하여 처리 속도를 높이는 장치는?",
    kind:"mc",
    options:["채널(Channel)", "누산기(Accumulator)", "캐시 메모리", "레지스터"],
    answer:0,
    explain:"채널(Channel)은 CPU에 종속되지 않고 독립적으로 입출력을 관리하는 장치로, CPU의 부담을 줄이고 입출력 효율을 높입니다."
  },
  {
    type:"written",
    q:"스풀링(Spooling)에 대한 설명으로 옳은 것은?",
    kind:"mc",
    options:[
      "주기억장치를 이용하며 단일 작업 환경에서 사용된다.",
      "보조기억장치를 이용하며 다중 작업 환경에서 사용된다.",
      "CPU와 주기억장치 사이의 속도 차이를 해결하기 위한 것이다.",
      "입출력장치를 CPU가 직접 제어하는 방식이다."
    ],
    answer:1,
    explain:"스풀링은 보조기억장치를 매개로 하여 여러 작업(다중 작업)의 입출력을 동시에 처리할 수 있게 하는 기법입니다. 첫 번째 보기는 버퍼링에 대한 설명이며, 세 번째는 캐시 메모리에 대한 설명입니다."
  },
  {
    type:"written",
    q:"하드디스크를 여러 개의 논리 드라이브로 나누는 파티션(Partition) 설정에 사용하는 DOS의 외부 명령어는?",
    kind:"mc",
    options:["FORMAT", "FDISK", "CHKDSK", "ATTRIB"],
    answer:1,
    explain:"FDISK는 하드디스크를 논리적으로 여러 디스크(파티션)로 나눌 때 사용하는 DOS 외부 명령어입니다. FORMAT은 디스크 초기화, CHKDSK는 디스크 상태 점검, ATTRIB은 파일 속성 변경에 사용됩니다."
  },
  {
    type:"written",
    q:"UNIX에서 'ls -l' 명령의 실행 결과 중, 파일 종류를 나타내는 문자가 'd'로 표시될 때 이 파일의 종류는?",
    kind:"mc",
    options:["블록형 특수 파일", "문자형 특수 파일", "디렉터리", "링크 파일"],
    answer:2,
    explain:"UNIX의 파일 종류 표시는 b(블록형 특수), c(문자형 특수), d(디렉터리), l(링크)로 구분됩니다. 'd'는 디렉터리(폴더)를 의미합니다."
  },
  {
    type:"written",
    q:"OSI 7계층 중, 경로 배정(Routing)과 중계, 네트워크 어드레싱을 담당하는 계층은?",
    kind:"mc",
    options:["물리 계층", "데이터 링크 계층", "네트워크 계층", "전송 계층"],
    answer:2,
    explain:"네트워크 계층(3계층)은 패킷의 경로 배정, 중계, 네트워크 어드레싱을 담당합니다. 데이터 링크 계층은 인접 시스템 간 신뢰성 있는 전송을, 전송 계층은 오류·흐름 제어를 담당합니다."
  },
  {
    type:"written",
    q:"RS-232C 25핀 커넥터에서 송신 데이터(TxD)를 전달하는 핀 번호는?",
    kind:"mc",
    options:["2번", "3번", "4번", "5번"],
    answer:0,
    explain:"RS-232C에서 2번 핀은 송신 데이터(TxD), 3번은 수신 데이터(RxD), 4번은 송신 요청(RTS), 5번은 송신 준비 완료(CTS)를 의미합니다."
  },
  {
    type:"written",
    q:"시간 조각(Time Slice)을 미리 정해두고, 각 프로세스에게 정해진 시간만큼 순환적으로 CPU를 할당하는 선점형 스케줄링 기법은?",
    kind:"mc",
    options:["FIFO", "SRT", "RR(Round Robin)", "다단계 큐"],
    answer:2,
    explain:"RR(Round Robin)은 시간 조각(Time Slice)을 미리 정의하여 각 프로세스에 순차적으로 CPU를 제공하는 선점형 스케줄링 기법입니다. FIFO는 비선점형이며, SRT는 실행 시간이 가장 짧은 프로세스를 우선 처리하는 선점형 기법입니다."
  },
  {
    type:"written",
    q:"통신 용량(전송 가능한 최대 정보량)을 증대시키는 방법으로 옳지 않은 것은?",
    kind:"mc",
    options:["주파수 대역폭을 증가시킨다.", "신호 세력을 증가시킨다.", "잡음 세력을 증가시킨다.", "잡음 세력을 감소시킨다."],
    answer:2,
    explain:"섀넌 공식(C=W·log2(1+S/N))에 따르면 통신 용량은 대역폭(W)과 신호 전력(S)이 클수록, 잡음 전력(N)이 작을수록 커집니다. 잡음 세력을 증가시키는 것은 오히려 통신 용량을 감소시키므로 옳지 않습니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 10진수 -5를 8비트 2의 보수(2's Complement)로 표현한 값을 2진수로 쓰시오. (예시 형식: 00000000)",
    kind:"short",
    accept:["11111011"],
    answerDisplay:"11111011",
    explain:"5의 절대값을 8비트 2진수로 표현하면 00000101입니다. 1의 보수(비트 반전)로 바꾸면 11111010이 되고, 여기에 1을 더하면 2의 보수 11111011이 됩니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 트랙 수 40, 트랙당 섹터 수 20, 섹터당 워드 수 100인 양면 디스크(면 수 2)의 총 저장 가능한 워드 수를 구하시오. (단위 없이 숫자만)",
    kind:"short",
    accept:["160000","160,000"],
    answerDisplay:"160000",
    explain:"워드 수 = 트랙 수 × 트랙당 섹터 수 × 섹터당 워드 수 × 면 수 이므로, 40 × 20 × 100 × 2 = 160,000 워드입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] '사원' 테이블에서 '부서명' 컬럼의 값을 중복 없이 조회하는 SQL문을 작성하시오.",
    kind:"short",
    accept:["SELECT DISTINCT 부서명 FROM 사원","SELECT DISTINCT 부서명 FROM 사원;"],
    answerDisplay:"SELECT DISTINCT 부서명 FROM 사원;",
    explain:"SELECT DISTINCT는 검색 결과에서 중복된 행을 제거하고 유일한 값만 반환합니다. 따라서 'SELECT DISTINCT 부서명 FROM 사원;'과 같이 작성합니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] IP 주소 210.100.50.1은 어느 클래스(Class)에 속하는지 알파벳 한 글자로 쓰시오.",
    kind:"short",
    accept:["C","c","Class C","클래스 C"],
    answerDisplay:"C",
    explain:"IP 클래스는 첫 번째 옥텟(자리) 값으로 구분하며, 192~223 범위는 Class C에 해당합니다. 210은 이 범위에 포함되므로 Class C이며 기본 서브넷 마스크는 255.255.255.0입니다."
  }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>

</body>
</html>
