<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-09-07 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    type:"written",
    q:"명령어의 자료부(Operand)에 실제 데이터가 저장된 절대 주소를 직접 기록하는 주소지정 방식은?",
    kind:"mc",
    options:["직접(Direct) 주소지정", "간접(Indirect) 주소지정", "상대(Relative) 주소지정", "색인(Index) 주소지정"],
    answer:0,
    explain:"직접(Direct) 주소지정 방식은 자료부(Operand)에 실제 데이터가 저장된 절대 주소를 직접 기록합니다. 간접 주소지정은 데이터 주소를 가진 포인터의 주소를 저장하고, 상대 주소지정은 PC(프로그램 카운터) + Operand로 계산하며, 색인 주소지정은 인덱스 레지스터를 사용해 순차적 주소지정에 유리합니다."
  },
  {
    type:"written",
    q:"반가산기(Half Adder)에서 두 입력 A, B의 합(Sum)을 구하는 논리식으로 옳은 것은?",
    kind:"mc",
    options:["S = A·B", "S = A+B", "S = A⊕B", "S = (A·B)′"],
    answer:2,
    explain:"반가산기는 두 입력 A, B의 배타적 논리합(XOR)으로 합(S)을 구하고, 자리올림수(C)는 AND 연산(A·B)으로 구합니다. 따라서 S = A⊕B 입니다."
  },
  {
    type:"written",
    q:"RISC(Reduced Instruction Set Computer)에 대한 설명으로 옳지 않은 것은?",
    kind:"mc",
    options:["레지스터의 수가 많은 편이다.", "프로그래밍이 상대적으로 복잡한 편이다.", "명령어의 종류가 많고 형식이 복잡하다.", "명령어 해독 시간이 짧고 실행 속도가 빠르다."],
    answer:2,
    explain:"RISC는 CISC에 비해 레지스터 수가 많고 프로그래밍이 복잡한 대신, 명령어 종류가 적고 형식이 단순하며 해독 시간이 짧고 실행 속도가 빠른 것이 특징입니다. '명령어 종류가 많고 형식이 복잡하다'는 것은 CISC의 특징이므로 옳지 않습니다."
  },
  {
    type:"written",
    q:"패리티 검사 코드에서, 1인 비트(Bit)의 개수가 홀수가 되도록 패리티 비트를 부여하는 방식은?",
    kind:"mc",
    options:["우수(Even) 패리티", "기수(Odd) 패리티", "수직 패리티", "수평 패리티"],
    answer:1,
    explain:"기수(Odd) 패리티는 1인 비트의 개수가 홀수가 되도록 패리티 비트를 부여하는 방식이며, 우수(Even) 패리티는 1인 비트의 개수가 짝수가 되도록 부여하는 방식입니다."
  },
  {
    type:"written",
    q:"해밍 코드(Hamming Code)에 대한 설명으로 옳은 것은?",
    kind:"mc",
    options:["1비트의 오류만 검출할 수 있고 교정은 불가능하다.", "2비트의 오류를 검출하고 1비트의 오류를 스스로 교정할 수 있다.", "정마크(정스페이스) 방식으로 오류를 검출한다.", "오류 검출만 가능하며 스스로 교정할 수 없다."],
    answer:1,
    explain:"해밍 코드는 스스로 오류를 검출하고 교정할 수 있는 코드로, 2비트의 오류를 검출하고 1비트의 오류는 스스로 교정할 수 있습니다. 정마크(정스페이스) 방식은 2-out-of-5 코드의 오류 검출 방식입니다."
  },
  {
    type:"written",
    q:"데이터베이스 설계 순서를 올바르게 나열한 것은?",
    kind:"mc",
    options:[
      "요구조건 분석 → 개념적 설계 → 논리적 설계 → 물리적 설계 → 구현",
      "요구조건 분석 → 논리적 설계 → 개념적 설계 → 물리적 설계 → 구현",
      "개념적 설계 → 요구조건 분석 → 물리적 설계 → 논리적 설계 → 구현",
      "요구조건 분석 → 물리적 설계 → 논리적 설계 → 개념적 설계 → 구현"
    ],
    answer:0,
    explain:"데이터베이스 설계는 요구조건 분석 → 개념적 설계 → 논리적 설계 → 물리적 설계 → 구현의 순서로 진행됩니다."
  },
  {
    type:"written",
    q:"SQL의 DROP TABLE 문에서, 삭제하려는 테이블을 다른 개체가 참조하고 있을 경우 삭제를 수행하지 않는 옵션은?",
    kind:"mc",
    options:["CASCADE", "RESTRICT", "DISTINCT", "UNIQUE"],
    answer:1,
    explain:"DROP RESTRICT는 제거할 요소가 다른 개체에서 참조되고 있으면 제거하지 않습니다. 반대로 DROP CASCADE는 참조하는 다른 개체까지 함께 제거합니다."
  },
  {
    type:"written",
    q:"UNIX에서 'ls -l' 명령 실행 결과, 파일 종류를 나타내는 첫 글자가 'd'로 표시되는 것은 무엇을 의미하는가?",
    kind:"mc",
    options:["일반 파일", "디렉터리", "문자형 특수 파일", "링크 파일"],
    answer:1,
    explain:"UNIX의 파일 종류 표시 문자는 b(블록형 특수), c(문자형 특수), d(디렉터리), l(링크)이며, 'd'는 디렉터리를 의미합니다."
  },
  {
    type:"written",
    q:"운영체제의 발달 과정을 오래된 순서대로 옳게 나열한 것은?",
    kind:"mc",
    options:[
      "일괄 처리 → 단일 처리 → 다중 프로그래밍 → 시분할 시스템",
      "단일 처리 → 일괄 처리 → 다중 프로그래밍 → 시분할 시스템",
      "다중 프로그래밍 → 일괄 처리 → 단일 처리 → 시분할 시스템",
      "시분할 시스템 → 다중 프로그래밍 → 일괄 처리 → 단일 처리"
    ],
    answer:1,
    explain:"운영체제는 단일 처리 → 일괄 처리 → 다중 프로그래밍 → 시분할 → 다중 처리 → 실시간 → 범용 → 분산 순서로 발전하였습니다."
  },
  {
    type:"written",
    q:"OSI 7계층 중, 경로 배정(Routing)과 네트워크 어드레싱을 담당하는 계층은?",
    kind:"mc",
    options:["데이터 링크 계층", "네트워크 계층", "전송 계층", "세션 계층"],
    answer:1,
    explain:"네트워크 계층(3계층)은 경로 배정(라우팅), 중계, 네트워크 어드레싱 기능을 담당합니다. 데이터 링크 계층은 인접 시스템 간 신뢰성 있는 전송, 전송 계층은 오류·흐름 제어, 세션 계층은 대화 제어를 담당합니다."
  },
  {
    type:"written",
    q:"IP 주소 198.0.46.201은 어느 클래스에 속하는가?",
    kind:"mc",
    options:["Class A", "Class B", "Class C", "Class D"],
    answer:2,
    explain:"198로 시작하는 IP 주소는 Class C에 해당하며, 기본 서브넷 마스크는 255.255.255.0 입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 2진수 110101을 10진수로 변환한 값을 쓰시오. (단위 없이 숫자만)",
    kind:"short",
    accept:["53"],
    answerDisplay:"53",
    explain:"110101 = 1×2⁵ + 1×2⁴ + 0×2³ + 1×2² + 0×2¹ + 1×2⁰ = 32+16+0+4+0+1 = 53 입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] '학생' 테이블에서 '학과'별 학생 수를 조회하는 SQL문을 작성하시오. (컬럼명은 학과, 개수는 COUNT(*)로 집계, GROUP BY 사용)",
    kind:"short",
    accept:["SELECT 학과, COUNT(*) FROM 학생 GROUP BY 학과","SELECT 학과, COUNT(*) FROM 학생 GROUP BY 학과;"],
    answerDisplay:"SELECT 학과, COUNT(*) FROM 학생 GROUP BY 학과;",
    explain:"특정 컬럼(학과)별로 그룹을 지어 집계할 때는 GROUP BY 절을 사용합니다. COUNT(*)는 그룹별 행(레코드)의 개수를 세는 집계 함수입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 4위상 편이변조(4-PSK, 위상 4개 = 2비트 전송)를 사용하여 1,200Baud의 속도로 전송할 때, 데이터 신호 속도(bps)를 구하시오. (단위 없이 숫자만)",
    kind:"short",
    accept:["2400","2,400"],
    answerDisplay:"2400bps",
    explain:"신호 속도(bps) = 변조 속도(Baud) × 변조 시 상태 변화 비트 수. 4위상 = 2² 이므로 상태 변화 비트 수는 2비트. 따라서 1,200 × 2 = 2,400bps 입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 트랙 수 10, 트랙당 섹터 수 5, 섹터당 워드 수 4인 양면(2면) 디스크 팩에 저장 가능한 총 워드 수를 구하시오. (단위 없이 숫자만)",
    kind:"short",
    accept:["400"],
    answerDisplay:"400",
    explain:"저장 가능한 워드 수 = 트랙 수 × 트랙당 섹터 수 × 섹터당 워드 수 × 면 수. 10 × 5 × 4 × 2 = 400 입니다."
  }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>

</body>
