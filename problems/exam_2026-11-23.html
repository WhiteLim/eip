<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-11-23 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    type:"written",
    q:"명령어의 주소 부분(Operand)에 프로그램 카운터(PC)의 값을 더하여 유효 주소를 계산하는 주소 지정 방식은?",
    kind:"mc",
    options:["직접 주소 지정","간접 주소 지정","상대 주소 지정","즉시 주소 지정"],
    answer:2,
    explain:"상대(Relative) 주소 지정 방식은 '프로그램 카운터(PC) + 주소 부분(Operand)'으로 유효 주소를 구합니다. 직접은 실제 데이터의 절대 주소, 간접은 데이터 주소를 가진 포인터의 주소, 즉시는 주소 대신 자료 자체를 저장합니다."
  },
  {
    type:"written",
    q:"연산 후에도 입력 자료가 보존되며, 범용 레지스터(GPR)를 가진 컴퓨터에서 주로 사용하는 명령어 형식은?",
    kind:"mc",
    options:["0 주소 명령어","1 주소 명령어","2 주소 명령어","3 주소 명령어"],
    answer:3,
    explain:"3 주소 명령어는 연산 결과를 별도의 주소에 저장하므로 입력 자료가 보존되며 범용 레지스터(GPR) 구조에서 사용됩니다. 0 주소는 스택, 1 주소는 누산기를 이용하고, 2 주소는 결과를 Operand1에 저장해 원래 자료가 파괴됩니다."
  },
  {
    type:"written",
    q:"오류를 스스로 검출하고 교정까지 할 수 있는 코드로, 2비트의 오류 검출과 1비트의 오류 교정이 가능한 코드는?",
    kind:"mc",
    options:["패리티 검사 코드","해밍 코드","그레이 코드","2-out-of-5 코드"],
    answer:1,
    explain:"해밍(Hamming) 코드는 오류를 스스로 검출·교정할 수 있는 코드로 2비트 오류 검출, 1비트 오류 교정이 가능합니다. 패리티 검사 코드는 1비트 오류 검출만 가능하고 교정은 불가능합니다."
  },
  {
    type:"written",
    q:"2ⁿ개의 입력선 중 하나를 선택하여 1개의 출력선으로 내보내는 조합 논리회로는?",
    kind:"mc",
    options:["디코더(Decoder)","디멀티플렉서(DeMUX)","멀티플렉서(MUX)","전가산기(FA)"],
    answer:2,
    explain:"멀티플렉서(MUX)는 2ⁿ개의 입력 중 1개를 선택하여 한 곳으로 출력합니다. 반대로 디멀티플렉서(DeMUX)는 1개의 입력을 2ⁿ개의 출력선 중 하나로 내보냅니다."
  },
  {
    type:"written",
    q:"여러 장치에서 인터럽트가 발생했을 때 우선순위를 판별하는 방법 중 소프트웨어적인 방식은?",
    kind:"mc",
    options:["폴링(Polling)","데이지 체인(Daisy Chain)","병렬 우선순위 처리","벡터 인터럽트"],
    answer:0,
    explain:"폴링(Polling)은 CPU가 프로그램으로 각 장치를 차례로 검사하여 우선순위를 판별하는 소프트웨어 방식입니다. 데이지 체인과 병렬 우선순위 처리는 하드웨어 방식입니다."
  },
  {
    type:"written",
    q:"관계형 데이터베이스의 릴레이션에서 속성(Attribute)의 개수를 의미하는 용어는?",
    kind:"mc",
    options:["기수(Cardinality)","차수(Degree)","도메인(Domain)","튜플(Tuple)"],
    answer:1,
    explain:"차수(Degree)는 속성(Attribute)의 개수, 기수(Cardinality)는 튜플(Tuple)의 개수입니다. 도메인은 하나의 속성이 가질 수 있는 값의 범위입니다."
  },
  {
    type:"written",
    q:"MS-DOS의 부팅 과정에서 시스템 파일이 메모리에 적재되는 순서로 옳은 것은?",
    kind:"mc",
    options:[
      "IO.SYS → MSDOS.SYS → CONFIG.SYS → COMMAND.COM → AUTOEXEC.BAT",
      "MSDOS.SYS → IO.SYS → COMMAND.COM → CONFIG.SYS → AUTOEXEC.BAT",
      "IO.SYS → MSDOS.SYS → COMMAND.COM → AUTOEXEC.BAT → CONFIG.SYS",
      "CONFIG.SYS → IO.SYS → MSDOS.SYS → AUTOEXEC.BAT → COMMAND.COM"
    ],
    answer:0,
    explain:"DOS 부팅 순서는 IO.SYS → MSDOS.SYS → CONFIG.SYS → COMMAND.COM → AUTOEXEC.BAT (암기: I.M.C.C.A) 입니다."
  },
  {
    type:"written",
    q:"UNIX에서 새로운 프로세스를 생성(호출)할 때 사용하는 시스템 호출은?",
    kind:"mc",
    options:["pipe","fork","kill","finger"],
    answer:1,
    explain:"fork는 새로운 프로세스를 호출·생성합니다. pipe는 앞 명령의 출력을 뒤 명령의 입력으로 연결하고, kill은 실행 중인 프로세스를 종료하며, finger는 사용자 정보를 조회합니다."
  },
  {
    type:"written",
    q:"펄스 코드 변조(PCM) 방식에서 송신 측의 처리 순서로 옳은 것은?",
    kind:"mc",
    options:["양자화 → 표본화 → 부호화","표본화 → 부호화 → 양자화","표본화 → 양자화 → 부호화","부호화 → 양자화 → 표본화"],
    answer:2,
    explain:"PCM 송신 측은 표본화(Sampling) → 양자화(Quantizing) → 부호화(Encoding) 순서(표.양.부)로 처리하며, 수신 측은 복호화 → 여과화(복.여) 순서입니다."
  },
  {
    type:"written",
    q:"시분할 다중화(TDM) 방식 중, 전송할 데이터가 있는 단말기에만 동적으로 시간 폭(Time Slot)을 할당하는 방식은?",
    kind:"mc",
    options:["동기식 TDM(STDM)","비동기식 TDM(ATDM)","주파수 분할 다중화(FDM)","코드 분할 다중 접속(CDMA)"],
    answer:1,
    explain:"비동기식 TDM(ATDM, 지능형 TDM)은 전송할 데이터가 있는 단말기에만 시간 폭을 할당합니다. 동기식 TDM(STDM)은 데이터 유무와 관계없이 모든 단말기에 균등한 시간 폭을 제공합니다."
  },
  {
    type:"written",
    q:"광섬유 케이블에서 발생하는 손실의 종류에 해당하지 않는 것은?",
    kind:"mc",
    options:["접속 손실","산란 손실","흡수 손실","유전체 손실"],
    answer:3,
    explain:"광섬유 케이블의 손실에는 접속 손실, 산란 손실, 흡수 손실이 있습니다. 유전체 손실은 동축 케이블 등 금속 선로에서 나타나는 손실로 광섬유의 손실이 아닙니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 10진수 -13을 8비트 부호화 2의 보수 방식으로 표현하시오. (8자리 2진수)",
    kind:"short",
    accept:["11110011"],
    answerDisplay:"11110011",
    explain:"+13 = 00001101 → 1의 보수: 11110010 → 1을 더한 2의 보수: 11110011 입니다. 부호 비트(맨 앞)가 1이므로 음수를 나타냅니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] '학생' 테이블에서 '학년'이 3인 학생들의 '이름'을 중복 없이 검색하는 SQL문을 작성하시오.",
    kind:"short",
    accept:["SELECT DISTINCT 이름 FROM 학생 WHERE 학년=3","SELECT DISTINCT 이름 FROM 학생 WHERE 학년='3'"],
    answerDisplay:"SELECT DISTINCT 이름 FROM 학생 WHERE 학년 = 3;",
    explain:"중복을 제거하여 검색할 때는 SELECT 뒤에 DISTINCT를 붙입니다. 형식: SELECT DISTINCT 속성 FROM 테이블 WHERE 조건;"
  },
  {
    type:"practical",
    q:"[실기 단답형] 6장의 디스크로 구성된 디스크 팩에서 실제로 데이터를 기록할 수 있는 면의 수를 구하시오. (단위 없이 숫자만)",
    kind:"short",
    accept:["10"],
    answerDisplay:"10",
    explain:"디스크 팩의 기록면 수 = (디스크 수 × 2) − 2 입니다. 맨 위와 맨 아래 면은 보호를 위해 기록에 사용하지 않으므로 (6 × 2) − 2 = 10면입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] IPv6 주소는 총 몇 비트로 구성되는지 쓰시오. (단위 없이 숫자만)",
    kind:"short",
    accept:["128"],
    answerDisplay:"128비트 (16비트 × 8부분)",
    explain:"IPv6는 16비트씩 8부분으로 구성되어 총 128비트입니다. IPv4는 8비트씩 4부분, 총 32비트입니다."
  }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/[;；]+$/,'').replace(/\s+/g,'').replace(/"/g,"'");
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>

</body>
</html>
