<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-10-10 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    type:"written",
    q:"인터럽트 우선순위를 판별하는 방법 중 하드웨어 방식에 해당하는 것은?",
    kind:"mc",
    options:["폴링(Polling)","데이지 체인(Daisy Chain)","스풀링(Spooling)","버퍼링(Buffering)"],
    answer:1,
    explain:"인터럽트 우선순위 판별 방법에는 폴링(소프트웨어), 데이지 체인(하드웨어), 병렬 우선 처리(하드웨어)가 있습니다. 스풀링과 버퍼링은 입출력장치와 CPU 간의 속도 차이를 해결하는 기법입니다."
  },
  {
    type:"written",
    q:"스풀링(Spooling)에 대한 설명으로 옳은 것은?",
    kind:"mc",
    options:[
      "주기억장치를 버퍼로 사용하며 단일 작업에 적합하다.",
      "보조기억장치를 버퍼로 사용하며 다중 작업에 적합하다.",
      "CPU 참여 없이 입출력장치와 메모리가 직접 데이터를 주고받는다.",
      "기억장치의 주소를 논리 주소에서 물리 주소로 변환한다."
    ],
    answer:1,
    explain:"버퍼링은 주기억장치를 이용하는 단일 작업 방식이고, 스풀링은 보조기억장치(디스크)를 이용하는 다중 작업 방식입니다. ③은 DMA, ④는 매핑에 대한 설명입니다."
  },
  {
    type:"written",
    q:"프로그램 카운터(PC)의 값과 명령어의 주소 부분(Operand)을 더하여 유효 주소를 구하는 주소 지정 방식은?",
    kind:"mc",
    options:["즉치(Immediate) 주소 지정","직접(Direct) 주소 지정","상대(Relative) 주소 지정","간접(Indirect) 주소 지정"],
    answer:2,
    explain:"상대 주소 지정 방식은 프로그램 카운터(PC) + 주소 부분(Operand)으로 유효 주소를 계산합니다. 즉치는 주소 대신 자료를 직접 저장하고, 직접은 실제 데이터의 절대 주소를, 간접은 실제 데이터 주소를 가진 포인터의 주소를 저장합니다."
  },
  {
    type:"written",
    q:"연산 결과를 Operand1에 저장하므로 연산 후 원래의 자료가 파괴되는 명령어 형식은?",
    kind:"mc",
    options:["0 주소 명령어","1 주소 명령어","2 주소 명령어","3 주소 명령어"],
    answer:2,
    explain:"2 주소 명령어는 연산 결과를 Operand1에 저장하기 때문에 원래 자료가 파괴됩니다. 3 주소 명령어는 연산 후에도 입력 자료가 보존되며, 0 주소 명령어는 스택, 1 주소 명령어는 누산기를 이용합니다."
  },
  {
    type:"written",
    q:"프로세스 상태 전이에서, 준비(Ready) 상태에 있는 프로세스 중 우선순위가 가장 높은 프로세스가 CPU를 할당받아 실행 상태로 전이되는 것을 무엇이라 하는가?",
    kind:"mc",
    options:["디스패치(Dispatch)","웨이크업(Wake-up)","블록(Block)","타임아웃(Timeout)"],
    answer:0,
    explain:"디스패치(Dispatch)는 준비 상태의 프로세스 중 우선순위가 가장 높은 프로세스가 CPU를 할당받아 실행 상태로 전이되는 것을 말합니다."
  },
  {
    type:"written",
    q:"다음 CPU 스케줄링 기법 중 비선점(Non-preemptive) 방식에 해당하는 것은?",
    kind:"mc",
    options:["SRT","RR(Round Robin)","FIFO(FCFS)","다단계 피드백 큐"],
    answer:2,
    explain:"FIFO는 가장 먼저 CPU를 요청한 프로세스에게 먼저 할당하는 비선점 방식입니다. SRT와 RR은 선점 방식이며, 다단계 피드백 큐도 선점형 기법입니다."
  },
  {
    type:"written",
    q:"다음 중 DOS의 외부 명령어에 해당하지 않는 것은?",
    kind:"mc",
    options:["FORMAT","CHKDSK","CLS","ATTRIB"],
    answer:2,
    explain:"CLS는 COMMAND.COM에서 처리되는 내부 명령어(CLS, VER, DIR, COPY, MD, CD, RD, TYPE, DEL 등)입니다. FORMAT, CHKDSK, ATTRIB은 별도의 파일로 존재하는 외부 명령어입니다."
  },
  {
    type:"written",
    q:"UNIX에서 'chmod go-w 파일명' 명령의 의미로 옳은 것은?",
    kind:"mc",
    options:[
      "소유자의 쓰기 권한을 취소한다.",
      "그룹과 기타 사용자의 쓰기 권한을 취소한다.",
      "그룹과 기타 사용자에게 쓰기 권한을 부여한다.",
      "모든 사용자의 실행 권한을 취소한다."
    ],
    answer:1,
    explain:"파일 소유권은 소유자(u), 그룹(g), 기타(o)로 구분합니다. 'go-w'는 그룹(g)과 기타(o) 사용자에게서 쓰기(w) 권한을 제거(-)한다는 뜻입니다."
  },
  {
    type:"written",
    q:"광섬유 케이블에서 발생하는 손실에 해당하지 않는 것은?",
    kind:"mc",
    options:["접속 손실","산란 손실","흡수 손실","유전체 손실"],
    answer:3,
    explain:"광섬유의 손실에는 접속 손실, 산란 손실, 흡수 손실이 있습니다. 유전체 손실은 광섬유의 손실 요인에 해당하지 않습니다."
  },
  {
    type:"written",
    q:"HDLC 프레임의 구성 순서로 옳은 것은?",
    kind:"mc",
    options:[
      "플래그 → 주소부 → 제어부 → 정보부 → FCS → 플래그",
      "플래그 → 제어부 → 주소부 → 정보부 → FCS → 플래그",
      "플래그 → 주소부 → 정보부 → 제어부 → FCS → 플래그",
      "플래그 → 주소부 → 제어부 → FCS → 정보부 → 플래그"
    ],
    answer:0,
    explain:"HDLC 프레임은 플래그 → 주소부 → 제어부 → 정보부 → 검색부(FCS) → 플래그 순서(주.제.정.검)로 구성됩니다."
  },
  {
    type:"written",
    q:"IPv6 주소의 길이와 구성으로 옳은 것은?",
    kind:"mc",
    options:["8비트 × 4부분 = 32비트","16비트 × 8부분 = 128비트","32비트 × 4부분 = 128비트","16비트 × 4부분 = 64비트"],
    answer:1,
    explain:"IPv4는 8비트 × 4부분 = 32비트, IPv6는 16비트 × 8부분 = 128비트로 구성됩니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 신호 속도가 4,800bps이고 4위상 편이변조(위상 4개 = 2비트 전송)를 사용할 때, 변조 속도(Baud)를 구하시오. (단위 없이 숫자만)",
    kind:"short",
    accept:["2400","2,400"],
    answerDisplay:"2400Baud",
    explain:"변조 속도(Baud) = 신호 속도(bps) ÷ 변조 시 상태 변화 비트 수. 4위상 = 2² 이므로 2비트입니다. 따라서 4,800 ÷ 2 = 2,400Baud 입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 6장으로 구성된 디스크 팩에서 데이터를 기록할 수 있는 면(Surface)의 수를 구하시오. (단위 없이 숫자만)",
    kind:"short",
    accept:["10"],
    answerDisplay:"10",
    explain:"디스크 팩의 기록면 수 = (디스크 수 × 2) − 2 입니다. 맨 위와 맨 아래 면은 기록에 사용할 수 없으므로 (6 × 2) − 2 = 10면 입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 섀넌 공식 C = W·log₂(1 + S/N)을 이용하여, 대역폭 W가 2,000Hz이고 신호 대 잡음비(S/N)가 15일 때 통신 용량(bps)을 구하시오. (단위 없이 숫자만)",
    kind:"short",
    accept:["8000","8,000"],
    answerDisplay:"8000bps",
    explain:"C = 2000 × log₂(1 + 15) = 2000 × log₂16 = 2000 × 4 = 8,000bps 입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] '학생' 테이블에서 '학과' 속성의 값을 중복 없이 검색하는 SQL문을 작성하시오.",
    kind:"short",
    accept:["SELECT DISTINCT 학과 FROM 학생","SELECT DISTINCT(학과) FROM 학생"],
    answerDisplay:"SELECT DISTINCT 학과 FROM 학생;",
    explain:"SELECT 문에서 중복된 값을 제거하고 검색하려면 SELECT 다음에 DISTINCT 키워드를 사용합니다. 형식: SELECT DISTINCT 속성명 FROM 테이블명;"
  }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>

</body>
