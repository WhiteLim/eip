<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-11-09 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {type:"written",q:"JK 플립플롭에서 J=1, K=1을 입력했을 때의 동작은?",kind:"mc",
   options:["상태 변화 없음(무변화)","0으로 리셋(Clear)","1로 세트(Set)","현재 상태의 보수(반전, Toggle)"],answer:3,
   explain:"JK FF는 (0,0) 무변화, (0,1) 공(0), (1,0) 일(1), (1,1) 보수(반전)로 동작합니다. 'RS FF의 불확정 상태'를 해결한 가장 널리 사용되는 플립플롭입니다."},
  {type:"written",q:"인터럽트의 우선순위 판별 방법 중 소프트웨어 방식에 해당하는 것은?",kind:"mc",
   options:["폴링(Polling)","데이지 체인(Daisy Chain)","병렬 우선 처리","DMA"],answer:0,
   explain:"우선순위 판별은 폴링(소프트웨어), 데이지 체인(하드웨어), 병렬 우선 처리(하드웨어)로 구분됩니다. DMA는 우선순위 판별 방식이 아닙니다."},
  {type:"written",q:"프로그램 카운터(PC)의 값과 명령어의 주소 부분(Operand)을 더해 유효 주소를 구하는 주소지정 방식은?",kind:"mc",
   options:["즉치(Immediate) 주소지정","직접(Direct) 주소지정","상대(Relative) 주소지정","간접(Indirect) 주소지정"],answer:2,
   explain:"상대 주소지정은 PC + Operand로 유효 주소를 계산합니다. 즉치는 자료를 직접 저장, 직접은 실제 데이터의 절대 주소, 간접은 포인터의 주소를 저장합니다."},
  {type:"written",q:"버퍼링(Buffering)과 비교한 스풀링(Spooling)에 대한 설명으로 옳은 것은?",kind:"mc",
   options:["주기억장치를 사용하며 단일 작업에 적합하다.","보조기억장치를 사용하며 다중 작업에 적합하다.","CPU와 입출력장치의 속도 차이를 해결할 수 없다.","입출력 채널 없이 CPU가 직접 제어한다."],answer:1,
   explain:"버퍼링은 주기억장치·단일 작업, 스풀링은 보조기억장치(디스크)·다중 작업에 사용되며 둘 다 CPU와 입출력장치 간 속도 차이를 해결합니다."},
  {type:"written",q:"데이터베이스 설계 단계 중 '논리적 설계' 바로 다음에 수행하는 단계는?",kind:"mc",
   options:["요구사항 분석","개념적 설계","물리적 설계","구현"],answer:2,
   explain:"DB 설계 순서는 요구사항 분석 → 개념적 설계 → 논리적 설계 → 물리적 설계 → 구현입니다."},
  {type:"written",q:"관계형 데이터베이스에서 하나의 릴레이션을 구성하는 속성(Attribute)의 개수를 의미하는 것은?",kind:"mc",
   options:["기수(Cardinality)","차수(Degree)","도메인(Domain)","튜플(Tuple)"],answer:1,
   explain:"차수(Degree)는 속성의 개수, 기수(Cardinality)는 튜플의 개수입니다. 도메인은 하나의 속성이 가질 수 있는 값의 범위입니다."},
  {type:"written",q:"SQL에서 DROP 문 사용 시, 제거할 요소를 참조하는 다른 개체까지 함께 제거하는 옵션은?",kind:"mc",
   options:["RESTRICT","CASCADE","DISTINCT","GRANT"],answer:1,
   explain:"DROP CASCADE는 제거할 요소를 참조하는 다른 개체도 함께 제거하고, DROP RESTRICT는 참조 중이면 제거하지 않습니다."},
  {type:"written",q:"다음 CPU 스케줄링 기법 중 비선점(Non-preemptive) 방식은?",kind:"mc",
   options:["FIFO","SRT","RR(Round Robin)","다단계 피드백 큐"],answer:0,
   explain:"FIFO는 가장 먼저 요청한 프로세스에 CPU를 먼저 할당하는 비선점 방식입니다. SRT와 RR은 선점 방식입니다."},
  {type:"written",q:"UNIX에서 'chmod go-w 파일명' 명령의 의미로 옳은 것은?",kind:"mc",
   options:["소유자의 쓰기 권한을 취소한다.","그룹과 기타 사용자의 쓰기 권한을 취소한다.","그룹과 기타 사용자에게 쓰기 권한을 부여한다.","모든 사용자의 읽기 권한을 취소한다."],answer:1,
   explain:"소유자는 u, 그룹은 g, 기타는 o입니다. 'go-w'는 그룹(g)과 기타(o) 사용자의 쓰기(w) 권한을 제거(-)하여 소유자만 수정할 수 있게 합니다."},
  {type:"written",q:"DOS에서 하드디스크를 논리적으로 여러 개의 디스크로 나누는 파티션 설정에 사용하는 외부 명령어는?",kind:"mc",
   options:["CHKDSK","DEFRAG","FDISK","LABEL"],answer:2,
   explain:"FDISK는 하드디스크 파티션을 설정합니다. CHKDSK는 디스크 상태 점검, DEFRAG는 단편화 최적화, LABEL은 볼륨 레이블 지정에 사용합니다."},
  {type:"written",q:"PCM(펄스 코드 변조)의 송신 측 처리 순서로 옳은 것은?",kind:"mc",
   options:["표본화 → 양자화 → 부호화","양자화 → 표본화 → 부호화","부호화 → 표본화 → 양자화","표본화 → 부호화 → 양자화"],answer:0,
   explain:"PCM 송신 측은 '표.양.부'(표본화 → 양자화 → 부호화), 수신 측은 '복.여'(복호화 → 여과화) 순서입니다."},
  {type:"practical",q:"[실기 단답형] 2진수 1100을 그레이 코드(Gray Code)로 변환한 값을 쓰시오.",kind:"short",
   accept:["1010"],answerDisplay:"1010",
   explain:"첫 비트는 그대로(1), 이후 앞 비트와 XOR: 1⊕1=0, 1⊕0=1, 0⊕0=0 → 1010."},
  {type:"practical",q:"[실기 단답형] 2진수 11010110을 16진수로 변환한 값을 쓰시오.",kind:"short",
   accept:["D6"],answerDisplay:"D6",
   explain:"4비트씩 묶으면 1101(=D), 0110(=6) 이므로 D6입니다."},
  {type:"practical",q:"[실기 단답형] '학생' 테이블에서 '학과' 속성의 값을 중복 없이 검색하는 SQL문을 작성하시오.",kind:"short",
   accept:["SELECT DISTINCT 학과 FROM 학생"],answerDisplay:"SELECT DISTINCT 학과 FROM 학생;",
   explain:"중복을 제거하고 검색할 때는 SELECT 뒤에 DISTINCT를 사용합니다."},
  {type:"practical",q:"[실기 단답형] 명령어의 연산자부(OP-Code)가 5비트일 때, 사용할 수 있는 서로 다른 명령어의 최대 개수를 쓰시오. (숫자만)",kind:"short",
   accept:["32"],answerDisplay:"32",
   explain:"OP-Code가 n비트이면 2ⁿ개의 명령어를 표현할 수 있습니다. 2⁵ = 32개입니다."}
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>

</body>
</html>
