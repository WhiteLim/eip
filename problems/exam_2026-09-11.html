<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제4회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:10px;
  }
  .short-btn{
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .short-btn.ghost{
    background:#fff;
    color:var(--accent);
    border:1.5px solid var(--accent);
  }
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제4회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-09-11 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    type:"written",
    q:"드모르간의 법칙(De Morgan's Law)에 따라, (A·B)'(AND 연산의 부정)와 같은 결과를 나타내는 식은? (단, '는 NOT을 의미)",
    kind:"mc",
    options:["A' + B'", "A' · B'", "A + B", "A · B"],
    answer:0,
    explain:"드모르간 법칙에 의해 (A+B)' = A'·B', (A·B)' = A'+B' 가 성립합니다. 즉 AND 연산의 부정은 각 변수를 부정한 뒤 OR로 연결한 것과 같고, OR 연산의 부정은 각 변수를 부정한 뒤 AND로 연결한 것과 같습니다."
  },
  {
    type:"written",
    q:"컴퓨터에서 자료를 구성하는 단위를 작은 것부터 큰 것 순서로 옳게 나열한 것은?",
    kind:"mc",
    options:[
      "비트 → 바이트 → 니블 → 워드 → 필드 → 레코드 → 파일",
      "비트 → 니블 → 바이트 → 워드 → 필드 → 레코드 → 파일",
      "니블 → 비트 → 바이트 → 필드 → 워드 → 레코드 → 파일",
      "비트 → 니블 → 워드 → 바이트 → 레코드 → 필드 → 파일"
    ],
    answer:1,
    explain:"자료 구성 단위는 비트(Bit) → 니블(Nibble) → 바이트(Byte) → 워드(Word) → 필드(Field) → 레코드(Record, 논리적 단위) → 블록(Block, 물리적 단위) → 파일(File) → 데이터베이스(Database) 순으로 커집니다."
  },
  {
    type:"written",
    q:"인터럽트 발생 시 우선순위를 판별하는 방식 중, 프로그램(소프트웨어)이 각 장치를 순서대로 검사하여 우선순위를 판별하는 방식은?",
    kind:"mc",
    options:["폴링(Polling)", "데이지 체인(Daisy Chain)", "병렬 우선 처리 방식", "DMA"],
    answer:0,
    explain:"인터럽트 우선순위 판별 방식에는 소프트웨어 방식인 폴링과, 하드웨어 방식인 데이지 체인·병렬 우선 처리 방식이 있습니다. 폴링은 프로그램이 각 장치를 순서대로 검사하여 인터럽트 요청 여부를 판별합니다."
  },
  {
    type:"written",
    q:"자기 디스크에서, 사용 가능한 트랙(Track)의 수와 사용 가능한 실린더(Cylinder)의 수의 관계로 옳은 것은?",
    kind:"mc",
    options:[
      "트랙 수와 실린더 수는 항상 같다.",
      "트랙 수는 실린더 수의 2배이다.",
      "실린더 수는 트랙 수의 면 수 배이다.",
      "트랙 수와 실린더 수는 서로 관계가 없다."
    ],
    answer:0,
    explain:"실린더는 여러 디스크 면에서 같은 위치에 있는 트랙들의 집합이므로, 사용 가능한 트랙의 수는 사용 가능한 실린더의 수와 항상 같습니다."
  },
  {
    type:"written",
    q:"프로세스 스케줄링 기법 중, 실행 중인 프로세스와 새로 도착한 프로세스의 남은 실행 시간을 비교하여 더 짧은 프로세스에 CPU를 할당하는 선점형(Preemptive) 기법은?",
    kind:"mc",
    options:["FIFO", "SRT", "RR(Round Robin)", "다단계 큐"],
    answer:1,
    explain:"SRT(Shortest Remaining Time)는 선점형 스케줄링 기법으로, 실행 중인 프로세스와 새로 도착한 프로세스 중 남은 실행 시간이 더 짧은 프로세스에 우선적으로 CPU를 할당합니다. FIFO는 비선점형이며, RR은 시간 조각(Time Slice)을 기준으로 하는 선점형 기법입니다."
  },
  {
    type:"written",
    q:"두 개 이상의 프로세스가 서로 상대방이 점유한 자원을 기다리며, 어떤 프로세스도 진행하지 못하고 무한정 대기하는 상태를 의미하는 용어는?",
    kind:"mc",
    options:["교착 상태(Deadlock)", "스풀링(Spooling)", "세마포어(Semaphore)", "페이징(Paging)"],
    answer:0,
    explain:"교착 상태(Deadlock)는 두 개 이상의 프로세스가 서로 다른 프로세스가 점유한 자원의 반납을 기다리며 어느 쪽도 더 이상 진행하지 못하고 무한정 대기하는 상태를 말합니다."
  },
  {
    type:"written",
    q:"UNIX에서 'ls -l' 명령을 실행한 결과, 파일 종류를 나타내는 문자 중 'd'가 의미하는 것은?",
    kind:"mc",
    options:["디렉터리", "블록형 특수 파일", "문자형 특수 파일", "심볼릭 링크"],
    answer:0,
    explain:"UNIX의 ls 명령 결과에서 파일 종류는 b(블록형 특수), c(문자형 특수), d(디렉터리), l(링크) 문자로 표시됩니다. 'd'는 디렉터리를 의미합니다."
  },
  {
    type:"written",
    q:"Windows 운영체제에서 사용하는 파일 시스템으로 옳은 것을 모두 고른 것은?\nㄱ. FAT   ㄴ. NTFS   ㄷ. UFS   ㄹ. EXT4",
    kind:"mc",
    options:["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"],
    answer:0,
    explain:"Windows는 FAT(FAT16/FAT32)와 NTFS 파일 시스템을 사용합니다. UFS(Unix File System)는 UNIX, EXT4는 리눅스 계열에서 주로 사용하는 파일 시스템입니다."
  },
  {
    type:"written",
    q:"MS-DOS의 외부 명령어 중, 하나의 하드디스크를 여러 개의 논리적인 디스크(파티션)로 나눌 때 사용하는 명령어는?",
    kind:"mc",
    options:["FDISK", "FORMAT", "CHKDSK", "ATTRIB"],
    answer:0,
    explain:"FDISK는 하드디스크를 논리적으로 여러 개의 파티션으로 나눌 때 사용하는 외부 명령어입니다. FORMAT은 디스크 초기화, CHKDSK는 디스크 상태 점검, ATTRIB는 파일 속성 변경에 사용하는 명령어입니다."
  },
  {
    type:"written",
    q:"전송 회선의 전기적 1차 정수인 저항(R), 정전용량(C), 인덕턴스(L), 누설 컨덕턴스(G) 사이에서, 신호가 일그러짐 없이 전송되기 위한 무왜곡 조건으로 옳은 것은?",
    kind:"mc",
    options:["RC = LG", "RL = CG", "RG = LC", "R + C = L + G"],
    answer:0,
    explain:"전송 회선에서 신호가 왜곡 없이 전달되려면 저항·정전용량의 곱과 인덕턴스·누설 컨덕턴스의 곱이 같아야 합니다. 즉 RC = LG 가 성립할 때 무왜곡 조건을 만족합니다."
  },
  {
    type:"written",
    q:"통신망의 형태 중, 중앙 컴퓨터와 하위 컴퓨터들이 나무(Tree) 모양의 계층 구조로 연결되어 분산 처리가 가능하고, 특정 노드의 장애가 다른 노드에 독립적으로 작용하는 형태는?",
    kind:"mc",
    options:["계층형(Tree)", "성형(Star)", "망형(Mesh)", "버스형(Bus)"],
    answer:0,
    explain:"계층형(Tree)은 중앙 컴퓨터와 하위 컴퓨터들이 트리 구조로 연결된 분산형 망으로, 자원 공유가 신속·효율적이며 특정 노드의 장애가 다른 노드에 독립적으로 작용합니다. 성형은 중앙 집중형이고, 망형은 모든 노드가 1:1로 직접 연결되는 구조입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 2진수 11010110을 16진수로 변환한 값을 쓰시오. (알파벳은 대문자로, 공백 없이)",
    kind:"short",
    accept:["D6"],
    answerDisplay:"D6",

  },
  {
    type:"practical",
    q:"[실기 단답형] '회원' 테이블에 회원번호(1001), 이름('홍길동'), 등급('일반') 값을 새로 추가하는 SQL문을 작성하시오. (컬럼 순서: 회원번호, 이름, 등급)",
    kind:"short",
    accept:[

      "INSERT INTO 회원 VALUES (1001, '홍길동', '일반')"
    ],
    answerDisplay:"INSERT INTO 회원 VALUES(1001, '홍길동', '일반');",
    explain:"① 새로운 데이터(행)를 테이블에 추가할 때는 DML의 INSERT 문을 사용하며 기본 형식은 'INSERT INTO 테이블명 VALUES(값1, 값2, ...);' 입니다.\n② VALUES에 넣는 값은 테이블에 정의된 컬럼 순서(회원번호, 이름, 등급)와 동일한 순서로 나열해야 합니다.\n③ 숫자형 데이터(회원번호)는 따옴표 없이, 문자형 데이터(이름, 등급)는 작은따옴표(' ')로 감싸서 입력합니다.\n④ 따라서 INSERT INTO 회원 VALUES(1001, '홍길동', '일반'); 로 작성합니다."
  },
  {
    type:"practical",

    kind:"short",
    accept:["2400","2,400"],
    answerDisplay:"2400bps",
    explain:"① 데이터 신호 속도(bps) = 변조 속도(Baud) × 변조 시 1회 신호 변화당 전송 비트 수 입니다.\n② 위상 편이 변조는 표현 가능한 위상 수가 2ⁿ이면 한 번의 신호 변화로 n비트를 전송합니다.\n③ 4위상 = 2² 이므로 전송 비트 수는 2비트입니다.\n④ 따라서 1,200Baud × 2bit = 2,400bps 입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 한 면에 40개의 트랙이 있고, 트랙당 섹터 수는 20개, 섹터당 저장 가능한 워드 수는 100개인 양면 디스크가 있다. 이 디스크에 저장 가능한 전체 워드 수를 구하시오. (단위 없이 숫자만)",
    kind:"short",
    accept:["160000","160,000"],
    answerDisplay:"160000",
    explain:"① 디스크의 전체 저장 가능한 워드 수 = 트랙 수 × 트랙당 섹터 수 × 섹터당 워드 수 × 면 수 로 구합니다.\n② 트랙 수 40, 트랙당 섹터 수 20, 섹터당 워드 수 100이므로 40 × 20 × 100 = 80,000(한 면 기준)입니다.\n③ 문제에서 '양면' 디스크이므로 면 수 2를 곱합니다: 80,000 × 2 = 160,000.\n④ 따라서 전체 저장 가능한 워드 수는 160,000개입니다."
  }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btnRow = document.createElement('div');
    btnRow.className = 'short-btn-row';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const explainBtn = document.createElement('button');
    explainBtn.className = 'short-btn ghost';
    explainBtn.textContent = '해설 보기';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });
    explainBtn.addEventListener('click', () => { explain.classList.add('show'); });

    btnRow.appendChild(btn);
    btnRow.appendChild(explainBtn);
    saWrap.appendChild(input);
    saWrap.appendChild(btnRow);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>

</body>
