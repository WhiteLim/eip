<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-10-20 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {type:"written",q:"프로그램 카운터(PC)의 역할로 옳은 것은?",kind:"mc",
   options:["다음에 실행할 명령어의 주소를 기억한다","현재 실행 중인 명령어를 기억한다","연산 결과를 일시적으로 저장한다","기억장치를 출입하는 데이터를 일시 저장한다"],answer:0,
   explain:"프로그램 카운터(PC)는 다음에 실행할 명령어의 주소를 기억합니다. 현재 실행 중인 명령어는 명령 레지스터(IR), 연산 결과 저장은 누산기, 메모리 출입 데이터 저장은 MBR의 역할입니다."},
  {type:"written",q:"입력 A, B가 서로 같을 때만 출력이 1이 되는 논리 게이트는?",kind:"mc",
   options:["XOR","XNOR","NAND","NOR"],answer:1,
   explain:"XNOR는 두 입력이 같을 때 1을 출력합니다(XOR의 부정). XOR는 두 입력이 서로 다를 때 1을 출력합니다."},
  {type:"written",q:"2진수 1010과 0110을 XOR 연산한 결과는?",kind:"mc",
   options:["0010","1100","1110","0100"],answer:1,
   explain:"XOR는 비트가 다르면 1입니다. 1010 ⊕ 0110 = 1100 입니다."},
  {type:"written",q:"명령어 형식에서 주소 부분이 실제 데이터의 값 자체를 나타내는 주소지정 방식은?",kind:"mc",
   options:["직접 주소지정","간접 주소지정","즉치(Immediate) 주소지정","상대 주소지정"],answer:2,
   explain:"즉치(Immediate) 주소지정은 오퍼랜드 부분에 실제 데이터가 들어 있어 기억장치 참조 없이 바로 사용하는 방식입니다."},
  {type:"written",q:"다음 중 주기억장치(ROM)에 대한 설명으로 옳은 것은?",kind:"mc",
   options:["전원이 꺼지면 내용이 지워진다","주로 읽기 전용으로 사용되며 전원이 꺼져도 내용이 유지된다","DRAM과 SRAM으로 구분된다","캐시 메모리로 사용된다"],answer:1,
   explain:"ROM은 비휘발성 기억장치로 전원이 꺼져도 내용이 유지됩니다. 전원이 꺼지면 지워지는 것은 RAM(DRAM, SRAM)입니다."},
  {type:"written",q:"관계형 데이터베이스에서 릴레이션의 행(Row)을 가리키는 용어는?",kind:"mc",
   options:["속성(Attribute)","튜플(Tuple)","도메인(Domain)","차수(Degree)"],answer:1,
   explain:"튜플(Tuple)은 릴레이션의 행(레코드)입니다. 속성(Attribute)은 열, 차수(Degree)는 속성의 수, 카디널리티는 튜플의 수입니다."},
  {type:"written",q:"SQL의 DDL(데이터 정의어)에 해당하지 않는 명령어는?",kind:"mc",
   options:["CREATE","ALTER","DROP","SELECT"],answer:3,
   explain:"DDL에는 CREATE, ALTER, DROP이 있습니다. SELECT는 데이터를 조회하는 DML(데이터 조작어)입니다."},
  {type:"written",q:"운영체제의 프로세스 상태 전이 중, 준비(Ready) 상태의 프로세스가 CPU를 할당받아 실행 상태로 바뀌는 것을 무엇이라 하는가?",kind:"mc",
   options:["Wake up","Dispatch","Block","Timer runout"],answer:1,
   explain:"준비 상태에서 실행 상태로의 전이는 Dispatch입니다. 실행→준비는 Timer runout, 실행→대기는 Block, 대기→준비는 Wake up입니다."},
  {type:"written",q:"UNIX에서 파일의 접근 권한을 변경하는 명령어는?",kind:"mc",
   options:["chown","chmod","chgrp","ls"],answer:1,
   explain:"chmod는 파일의 접근 권한(읽기·쓰기·실행)을 변경합니다. chown은 소유자 변경, chgrp는 그룹 변경, ls는 목록 출력입니다."},
  {type:"written",q:"데이터 전송 방식 중 한 방향으로만 전송이 가능한 통신 방식은?",kind:"mc",
   options:["단방향(Simplex)","반이중(Half Duplex)","전이중(Full Duplex)","양방향 동시 전송"],answer:0,
   explain:"단방향(Simplex)은 한쪽 방향으로만 전송 가능한 방식(예: 라디오, TV 방송)입니다. 반이중은 양방향이지만 교대로, 전이중은 동시에 전송합니다."},
  {type:"written",q:"TCP/IP 프로토콜에서 전송 계층(Transport Layer)에 해당하는 프로토콜은?",kind:"mc",
   options:["IP","ARP","UDP","FTP"],answer:2,
   explain:"전송 계층의 대표 프로토콜은 TCP와 UDP입니다. IP·ARP는 인터넷(네트워크) 계층, FTP는 응용 계층 프로토콜입니다."},
  {type:"practical",q:"[실기 단답형] 2진수 101101을 10진수로 변환한 값을 쓰시오. (숫자만)",kind:"short",
   accept:["45"],answerDisplay:"45",
   explain:"101101(2) = 32 + 0 + 8 + 4 + 0 + 1 = 45 입니다."},
  {type:"practical",q:"[실기 단답형] '학생' 테이블에서 '학년'이 3인 모든 학생의 레코드를 조회하는 SQL문을 작성하시오. (모든 속성 조회)",kind:"short",
   accept:["SELECT * FROM 학생 WHERE 학년=3","SELECT * FROM 학생 WHERE 학년 = 3","SELECT * FROM 학생 WHERE 학년=3;","SELECT * FROM 학생 WHERE 학년 = 3;"],
   answerDisplay:"SELECT * FROM 학생 WHERE 학년 = 3;",
   explain:"SELECT 문은 'SELECT 속성 FROM 테이블 WHERE 조건' 형식이며, 모든 속성은 *로 나타냅니다."},
  {type:"practical",q:"[실기 단답형] 4위상 편이변조(4-PSK, 2비트 전송)를 사용하여 2,400Baud로 전송할 때 데이터 신호 속도(bps)를 구하시오. (숫자만)",kind:"short",
   accept:["4800","4,800"],answerDisplay:"4800bps",
   explain:"bps = Baud × 상태 변화 비트 수. 4위상 = 2²이므로 2비트, 2,400 × 2 = 4,800bps 입니다."},
  {type:"practical",q:"[실기 단답형] 1KB(킬로바이트)는 몇 바이트(Byte)인지 쓰시오. (컴퓨터 기준, 숫자만)",kind:"short",
   accept:["1024","1,024"],answerDisplay:"1024",
   explain:"컴퓨터에서 1KB = 2¹⁰ = 1,024Byte 입니다."}
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>

</body>
</html>
