<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-09-12 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    type:"written",
    q:"RS 플립플롭에서 S=1, R=1이 동시에 입력되었을 때의 출력 상태는?",
    kind:"mc",
    options:["이전 상태 유지(무변화)", "0으로 리셋(Reset)", "1로 세트(Set)", "부정(정의되지 않는 불능 상태)"],
    answer:3,
    explain:"RS 플립플롭은 S(Set)=0, R(Reset)=0일 때 이전 상태를 유지(무), S=0,R=1일 때 0(공), S=1,R=0일 때 1(일)이 되지만, S=1, R=1이 동시에 입력되면 출력이 정의되지 않는 부정(불능) 상태가 됩니다."
  },
  {
    type:"written",
    q:"2ⁿ개의 입력선 중 하나를 선택하여 1개의 출력선으로 내보내는 조합논리회로는?",
    kind:"mc",
    options:["디멀티플렉서(DeMUX)", "멀티플렉서(MUX)", "인코더(Encoder)", "디코더(Decoder)"],
    answer:1,
    explain:"멀티플렉서(MUX)는 2ⁿ개의 입력 중 1개를 선택하여 한 곳으로 출력하는 회로입니다. 반대로 디멀티플렉서(DeMUX)는 1개의 입력을 2ⁿ개의 출력선 중 하나로 선택하여 내보냅니다."
  },
  {
    type:"written",
    q:"데이터 표현 단위를 작은 것부터 큰 순서로 옳게 나열한 것은?",
    kind:"mc",
    options:[
      "비트 → 바이트 → 니블 → 워드 → 필드 → 레코드",
      "니블 → 비트 → 바이트 → 필드 → 워드 → 레코드",
      "비트 → 니블 → 바이트 → 워드 → 필드 → 레코드",
      "비트 → 니블 → 워드 → 바이트 → 레코드 → 필드"
    ],
    answer:2,
    explain:"데이터 표현 단위는 비트(Bit) → 니블(Nibble) → 바이트(Byte) → 워드(Word) → 필드(Field) → 레코드(Record) → 블록(Block) → 파일(File) → 데이터베이스 순으로 커집니다."
  },
  {
    type:"written",
    q:"연산 수행 후에도 입력 자료가 그대로 보존되며, 범용 레지스터(GPR)를 가진 컴퓨터에서 주로 사용되는 명령어 형식은?",
    kind:"mc",
    options:["0 주소 명령어", "1 주소 명령어", "2 주소 명령어", "3 주소 명령어"],
    answer:3,
    explain:"3 주소 명령어는 연산 결과를 별도의 주소에 저장하므로 연산 후에도 원래의 입력 자료가 보존되며, 범용 레지스터(GPR)를 가진 컴퓨터에서 주로 사용됩니다. 2 주소 명령어는 연산 결과를 Operand1에 저장하여 원래 자료가 파괴됩니다."
  },
  {
    type:"written",
    q:"스풀링(Spooling)에 대한 설명으로 옳은 것은?",
    kind:"mc",
    options:[
      "주기억장치를 이용하며 단일 작업에 적합하다.",
      "보조기억장치를 이용하며 다중 작업에 적합하다.",
      "CPU와 캐시 메모리 사이의 속도 차이를 해결한다.",
      "입출력장치 없이 CPU 단독으로 처리하는 방식이다."
    ],
    answer:1,
    explain:"버퍼링과 스풀링은 모두 입출력장치와 CPU 간의 속도 차이를 해결하기 위한 기법입니다. 버퍼링은 주기억장치를 이용하며 단일 작업에, 스풀링은 보조기억장치를 이용하며 다중 작업에 적합합니다."
  },
  {
    type:"written",
    q:"데이터베이스의 3단계 스키마(개념·외부·내부)에 해당하지 않는 것은?",
    kind:"mc",
    options:["개념 스키마", "외부 스키마", "내부 스키마", "물리 스키마"],
    answer:3,
    explain:"데이터베이스의 3단계 스키마는 개념 스키마, 외부 스키마, 내부 스키마(개.외.내)로 구분됩니다. '물리 스키마'는 3단계 스키마에 해당하지 않는 용어입니다."
  },
  {
    type:"written",
    q:"다음 SQL 명령어 중 DDL(데이터 정의어)에 해당하는 것은?",
    kind:"mc",
    options:["SELECT", "INSERT", "ALTER", "COMMIT"],
    answer:2,
    explain:"DDL(데이터 정의어)에는 CREATE, ALTER, DROP이 있습니다. SELECT와 INSERT는 DML(데이터 조작어), COMMIT은 DCL(데이터 제어어)에 해당합니다."
  },
  {
    type:"written",
    q:"시간 조각(Time Slice)을 미리 정해 놓고 각 프로세스에게 순서대로 CPU를 할당하는 선점형 스케줄링 기법은?",
    kind:"mc",
    options:["FIFO", "SRT", "RR(Round Robin)", "SJF"],
    answer:2,
    explain:"RR(Round Robin)은 시간 조각(Time Slice)을 미리 정의하여 각 프로세스에 순서대로 CPU를 제공하는 선점형 스케줄링 기법입니다. FIFO는 비선점 기법이며, SRT는 실행 시간이 가장 짧은 프로세스에 선점적으로 CPU를 할당하는 기법입니다."
  },
  {
    type:"written",
    q:"Windows에서 [실행] 창을 열 때 사용하는 단축키는?",
    kind:"mc",
    options:["Win + E", "Win + R", "Ctrl + Esc", "Alt + Tab"],
    answer:1,
    explain:"Win + R 키를 누르면 [실행] 창이 열립니다. Win + E는 탐색기 실행, Ctrl + Esc는 시작 메뉴 열기, Alt + Tab은 실행 중인 창 전환에 사용됩니다."
  },
  {
    type:"written",
    q:"UNIX에서 'ls -l' 명령 실행 결과 첫 번째 문자가 'd'로 표시될 때, 이는 어떤 파일 종류를 의미하는가?",
    kind:"mc",
    options:["블록형 특수 파일", "문자형 특수 파일", "디렉터리", "링크 파일"],
    answer:2,
    explain:"UNIX의 ls -l 결과에서 파일 종류를 나타내는 첫 글자는 b(블록형 특수), c(문자형 특수), d(디렉터리), l(링크)로 구분됩니다(b.c.d.l). 'd'는 디렉터리를 의미합니다."
  },
  {
    type:"written",
    q:"주파수 분할 다중화(FDM) 방식에서 인접한 채널 간의 상호 간섭을 방지하기 위해 사용하는 완충 지역은?",
    kind:"mc",
    options:["가드 밴드(Guard Band)", "프리앰블(Preamble)", "동기 비트", "트레일러(Trailer)"],
    answer:0,
    explain:"FDM(주파수 분할 다중화)에서는 채널 간 간섭을 막기 위해 채널과 채널 사이에 가드 밴드(Guard Band)라는 완충 지역을 둡니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 8진수 47을 2진수로 변환한 값을 쓰시오.",
    kind:"short",
    accept:["100111"],
    answerDisplay:"100111",
    explain:"8진수는 한 자리를 2진수 3자리로 변환합니다. 8진수 4는 100, 7은 111이므로, 8진수 47을 2진수로 변환하면 100111이 됩니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] '사원' 테이블에서 '부서명' 값의 중복을 제거하고 조회하는 SQL문을 작성하시오.",
    kind:"short",
    accept:["SELECT DISTINCT 부서명 FROM 사원","SELECT DISTINCT 부서명 FROM 사원;"],
    answerDisplay:"SELECT DISTINCT 부서명 FROM 사원;",
    explain:"SELECT문에 DISTINCT 키워드를 사용하면 중복된 값을 제거하고 검색할 수 있습니다. 따라서 'SELECT DISTINCT 부서명 FROM 사원;'과 같이 작성합니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] IP 주소 210.100.50.1은 어느 클래스(Class)에 해당하는지 알파벳 한 글자로 쓰시오.",
    kind:"short",
    accept:["C","c","Class C","클래스 C"],
    answerDisplay:"C",
    explain:"IP 주소의 첫 번째 옥텟 값이 192~223 범위이면 Class C에 해당합니다. 210은 이 범위에 속하므로 Class C이며, 기본 서브넷 마스크는 255.255.255.0입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 대역폭이 3,000Hz이고 신호 대 잡음비(S/N)가 1023인 통신 회선의 최대 통신 용량을 섀넌(Shannon) 공식을 이용해 구하시오. (단위 없이 숫자만, bps)",
    kind:"short",
    accept:["30000","30,000"],
    answerDisplay:"30000bps",
    explain:"섀넌 공식 C = W × log₂(1 + S/N)에 대입하면 C = 3,000 × log₂(1 + 1023) = 3,000 × log₂(1024) = 3,000 × 10 = 30,000bps 입니다."
  }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>

</body>
</html>
