<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-10-26 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    type:"written",
    q:"CPU의 레지스터 중 다음에 실행할 명령어의 주소를 기억하는 것은?",
    kind:"mc",
    options:["프로그램 카운터(PC)","명령 레지스터(IR)","메모리 버퍼 레지스터(MBR)","누산기(Accumulator)"],
    answer:0,
    explain:"프로그램 카운터(PC)는 다음에 실행할 명령어의 주소를 기억합니다. 명령 레지스터(IR)는 현재 실행 중인 명령어, MBR은 기억장치를 출입하는 데이터를 일시 저장하며, 누산기는 연산 결과를 일시 저장합니다."
  },
  {
    type:"written",
    q:"반가산기(Half Adder)에서 자리올림수(Carry, C)를 구하는 논리식은? (A, B: 입력)",
    kind:"mc",
    options:["C = A·B (AND)","C = A⊕B (XOR)","C = A+B (OR)","C = A'·B'"],
    answer:0,
    explain:"반가산기는 1비트 2진수 2개를 더해 합(S)과 자리올림수(C)를 구합니다. 합은 S = A⊕B, 자리올림수는 C = A·B 입니다."
  },
  {
    type:"written",
    q:"10진수 -5를 8비트 '부호화 2의 보수' 방식으로 표현한 것은?",
    kind:"mc",
    options:["10000101","11111010","11111011","00000101"],
    answer:2,
    explain:"절대값 5 = 00000101 → 1의 보수 11111010 → 여기에 1을 더하면 2의 보수 11111011 입니다. 10000101은 부호화 절대치, 11111010은 부호화 1의 보수 표현입니다."
  },
  {
    type:"written",
    q:"인터럽트 우선순위 판별 방법 중 소프트웨어적인 방식에 해당하는 것은?",
    kind:"mc",
    options:["폴링(Polling)","데이지 체인(Daisy Chain)","병렬 우선 처리","벡터 인터럽트 하드와이어링"],
    answer:0,
    explain:"인터럽트 우선순위 판별 방법 중 폴링은 소프트웨어 방식이고, 데이지 체인과 병렬 우선 처리는 하드웨어 방식입니다."
  },
  {
    type:"written",
    q:"입출력장치와 CPU 간의 속도 차이를 해결하기 위해 보조기억장치(디스크)를 버퍼처럼 사용하며 다중 작업에 적합한 방식은?",
    kind:"mc",
    options:["버퍼링(Buffering)","스풀링(Spooling)","DMA","채널(Channel)"],
    answer:1,
    explain:"스풀링은 보조기억장치를 이용하여 다중 작업의 입출력 속도 차이를 해결합니다. 버퍼링은 주기억장치를 사용하며 단일 작업에 적합합니다."
  },
  {
    type:"written",
    q:"관계형 데이터베이스에서 릴레이션(테이블)을 구성하는 속성(Attribute)의 개수를 의미하는 용어는?",
    kind:"mc",
    options:["기수(Cardinality)","차수(Degree)","도메인(Domain)","스키마(Schema)"],
    answer:1,
    explain:"차수(Degree)는 속성의 개수, 기수(Cardinality)는 튜플의 개수입니다. 도메인은 하나의 속성이 가질 수 있는 값의 범위입니다."
  },
  {
    type:"written",
    q:"SQL의 SELECT 문에서 검색 결과의 중복된 튜플을 제거하고 한 번씩만 검색하기 위해 사용하는 키워드는?",
    kind:"mc",
    options:["UNIQUE","DISTINCT","GROUP BY","ORDER BY"],
    answer:1,
    explain:"SELECT DISTINCT 는 중복되지 않게 검색합니다. ORDER BY는 정렬, GROUP BY는 그룹화에 사용합니다."
  },
  {
    type:"written",
    q:"프로세스 스케줄링 기법 중 각 프로세스에 일정한 시간 조각(Time Slice)을 미리 정해 CPU를 번갈아 할당하는 선점형 방식은?",
    kind:"mc",
    options:["FIFO","SJF","RR(Round Robin)","HRN"],
    answer:2,
    explain:"RR(Round Robin)은 시간 조각을 미리 정의하여 각 프로세스에 CPU를 돌아가며 제공하는 선점형 기법으로 시분할 시스템에 적합합니다. FIFO는 먼저 요청한 프로세스에 먼저 할당하는 비선점 기법입니다."
  },
  {
    type:"written",
    q:"DOS의 외부 명령어 중 하드디스크를 논리적으로 여러 개의 디스크로 나누는 파티션 설정에 사용하는 것은?",
    kind:"mc",
    options:["FORMAT","FDISK","CHKDSK","DEFRAG"],
    answer:1,
    explain:"FDISK는 하드디스크를 논리적으로 여러 디스크로 나누는 파티션 설정 명령입니다. FORMAT은 디스크 초기화, CHKDSK는 디스크 상태 점검, DEFRAG는 단편화된 파일 최적화에 사용합니다."
  },
  {
    type:"written",
    q:"UNIX 시스템의 구성 요소 중 명령어 해석기(Command Interpreter) 역할을 하며 Bourne Shell, Korn Shell, C Shell 등의 종류가 있는 것은?",
    kind:"mc",
    options:["커널(Kernel)","쉘(Shell)","유틸리티(Utility)","파일 시스템(UFS)"],
    answer:1,
    explain:"쉘(Shell)은 사용자 명령을 해석하여 커널에 전달하는 명령어 해석기입니다. 커널은 기억장치 관리, 태스크 스케줄링, 보안 등 핵심 기능을 담당합니다."
  },
  {
    type:"written",
    q:"펄스 코드 변조(PCM) 방식에서 송신 측의 처리 순서로 옳은 것은?",
    kind:"mc",
    options:["표본화 → 양자화 → 부호화","양자화 → 표본화 → 부호화","부호화 → 표본화 → 양자화","표본화 → 부호화 → 양자화"],
    answer:0,
    explain:"PCM 송신 측은 표본화(Sampling) → 양자화(Quantizing) → 부호화(Encoding) 순서(표.양.부)이며, 수신 측은 복호화 → 여과화 순서입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 2진수 101101을 10진수로 변환한 값을 쓰시오. (숫자만)",
    kind:"short",
    accept:["45"],
    answerDisplay:"45",
    explain:"101101(2) = 1×32 + 0×16 + 1×8 + 1×4 + 0×2 + 1×1 = 32 + 8 + 4 + 1 = 45 입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] '사원' 테이블에서 '부서' 속성의 값을 중복 없이 검색하는 SQL문을 작성하시오.",
    kind:"short",
    accept:["SELECT DISTINCT 부서 FROM 사원","SELECT DISTINCT(부서) FROM 사원"],
    answerDisplay:"SELECT DISTINCT 부서 FROM 사원;",
    explain:"중복을 제거하고 검색할 때는 SELECT 뒤에 DISTINCT 키워드를 사용합니다. 형식: SELECT DISTINCT 속성명 FROM 테이블명;"
  },
  {
    type:"practical",
    q:"[실기 단답형] 8위상 편이변조(위상 8개 = 3비트 전송)를 사용하여 2,400Baud의 속도로 전송할 때, 데이터 신호 속도(bps)를 구하시오. (숫자만)",
    kind:"short",
    accept:["7200","7,200"],
    answerDisplay:"7200bps",
    explain:"신호 속도(bps) = 변조 속도(Baud) × 변조 시 상태 변화 비트 수. 8위상 = 2³ 이므로 3비트, 따라서 2,400 × 3 = 7,200bps 입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] UNIX의 VI 편집기에서 편집 내용을 저장하고 종료하는 명령(콜론 포함)을 쓰시오.",
    kind:"short",
    accept:[":wq",":wq!","ZZ"],
    answerDisplay:":wq",
    explain:":wq 는 write(저장)와 quit(종료)를 합친 명령으로 저장 후 VI를 종료합니다. (:q! 는 저장하지 않고 강제 종료)"
  }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>
