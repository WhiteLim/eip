<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-10-27 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    "type": "written",
    "q": "인터럽트 우선순위 판별 방법 중 소프트웨어적 방식에 해당하는 것은?",
    "kind": "mc",
    "options": [
      "폴링(Polling)",
      "데이지 체인(Daisy Chain)",
      "병렬 우선 처리(Parallel Priority)",
      "DMA 채널 제어"
    ],
    "answer": 0,
    "explain": "인터럽트 우선순위 판별 방법 중 폴링은 소프트웨어 방식이고, 데이지 체인과 병렬 우선 처리는 하드웨어 방식입니다."
  },
  {
    "type": "written",
    "q": "2^n개의 입력 중에서 1개를 선택하여 한 곳으로 출력하는 조합논리회로는?",
    "kind": "mc",
    "options": [
      "디멀티플렉서(DeMUX)",
      "멀티플렉서(MUX)",
      "인코더",
      "반가산기"
    ],
    "answer": 1,
    "explain": "멀티플렉서(MUX)는 2^n개의 입력 중 1개를 선택해 출력합니다. 디멀티플렉서(DeMUX)는 반대로 1개의 입력을 2^n개의 출력선 중 하나로 내보냅니다."
  },
  {
    "type": "written",
    "q": "오류를 스스로 검출하고 교정까지 할 수 있는 코드는?",
    "kind": "mc",
    "options": [
      "패리티 검사 코드",
      "해밍 코드",
      "2-out-of-5 코드",
      "그레이 코드"
    ],
    "answer": 1,
    "explain": "해밍 코드는 오류를 스스로 검출하고 교정할 수 있습니다(2비트 오류 검출, 1비트 오류 교정). 패리티 코드는 1비트 오류 검출만 가능합니다."
  },
  {
    "type": "written",
    "q": "-5를 8비트 부호화 2의 보수로 표현한 것은?",
    "kind": "mc",
    "options": [
      "11111010",
      "11111011",
      "10000101",
      "00000101"
    ],
    "answer": 1,
    "explain": "5 = 00000101 → 1의 보수 11111010 → 2의 보수(1의 보수 + 1) = 11111011 입니다. 11111010은 부호화 1의 보수, 10000101은 부호화 절대치 표현입니다."
  },
  {
    "type": "written",
    "q": "프로그램 카운터(PC)의 값에 주소 부분(Operand)의 값을 더해 유효 주소를 구하는 주소지정 방식은?",
    "kind": "mc",
    "options": [
      "직접 주소지정",
      "간접 주소지정",
      "상대 주소지정",
      "즉치 주소지정"
    ],
    "answer": 2,
    "explain": "상대(Relative) 주소지정은 PC + Operand로 유효 주소를 계산합니다."
  },
  {
    "type": "written",
    "q": "버퍼링과 스풀링에 대한 설명으로 옳은 것은?",
    "kind": "mc",
    "options": [
      "버퍼링은 보조기억장치를 사용하며 다중 작업에 적합하다.",
      "스풀링은 주기억장치를 사용하며 단일 작업에 적합하다.",
      "스풀링은 보조기억장치를 사용하며 다중 작업에 적합하다.",
      "둘 다 CPU와 입출력장치 간의 속도 차이를 해결할 수 없다."
    ],
    "answer": 2,
    "explain": "버퍼링은 주기억장치를 사용하는 단일 작업 방식이고, 스풀링은 보조기억장치를 사용하는 다중 작업 방식입니다. 둘 다 CPU와 입출력장치 간 속도 차이를 해결합니다."
  },
  {
    "type": "written",
    "q": "관계형 데이터베이스에서 릴레이션의 속성(Attribute)의 개수를 의미하는 것은?",
    "kind": "mc",
    "options": [
      "차수(Degree)",
      "기수(Cardinality)",
      "도메인(Domain)",
      "튜플(Tuple)"
    ],
    "answer": 0,
    "explain": "차수(Degree)는 속성의 개수, 기수(Cardinality)는 튜플의 개수입니다. 도메인은 하나의 속성이 가질 수 있는 값의 범위입니다."
  },
  {
    "type": "written",
    "q": "시간 조각(Time Slice)을 미리 정의하여 각 프로세스에 CPU를 번갈아 할당하는 선점형 스케줄링 방식은?",
    "kind": "mc",
    "options": [
      "FIFO",
      "SJF",
      "SRT",
      "RR(Round Robin)"
    ],
    "answer": 3,
    "explain": "RR(라운드 로빈)은 정해진 시간 조각만큼씩 CPU를 돌아가며 할당하는 선점형 방식입니다. FIFO는 비선점, SRT는 남은 실행 시간이 짧은 프로세스 우선 선점 방식입니다."
  },
  {
    "type": "written",
    "q": "UNIX의 쉘(Shell) 종류에 해당하지 않는 것은?",
    "kind": "mc",
    "options": [
      "Korn Shell",
      "Bourne Shell",
      "C Shell",
      "Kernel Shell"
    ],
    "answer": 3,
    "explain": "UNIX의 대표적인 쉘은 Korn(K), Bourne(B), C Shell(K.B.C)입니다. 커널(Kernel)은 쉘과 구분되는 별개의 구성 요소입니다."
  },
  {
    "type": "written",
    "q": "삭제된 파일을 복구하는 DOS의 외부 명령어는?",
    "kind": "mc",
    "options": [
      "UNDELETE",
      "CHKDSK",
      "FDISK",
      "ATTRIB"
    ],
    "answer": 0,
    "explain": "UNDELETE는 삭제된 파일을 복구합니다. CHKDSK는 디스크 상태 점검, FDISK는 파티션 설정, ATTRIB는 파일 속성 변경 명령입니다."
  },
  {
    "type": "written",
    "q": "IPv6 주소의 길이는 몇 비트인가?",
    "kind": "mc",
    "options": [
      "32비트",
      "64비트",
      "128비트",
      "256비트"
    ],
    "answer": 2,
    "explain": "IPv4는 8비트 × 4 = 32비트, IPv6는 16비트 × 8 = 128비트입니다."
  },
  {
    "type": "practical",
    "q": "[실기 단답형] 2진수 10110101을 16진수로 변환한 값을 쓰시오.",
    "kind": "short",
    "accept": [
      "B5"
    ],
    "answerDisplay": "B5",
    "explain": "2진수를 4자리씩 묶으면 1011(B) 0101(5)이므로 B5(16)입니다."
  },
  {
    "type": "practical",
    "q": "[실기 단답형] '도서' 테이블에서 '출판사' 속성을 중복 없이 검색하는 SQL문을 작성하시오.",
    "kind": "short",
    "accept": [
      "SELECT DISTINCT 출판사 FROM 도서",
      "SELECT DISTINCT(출판사) FROM 도서"
    ],
    "answerDisplay": "SELECT DISTINCT 출판사 FROM 도서;",
    "explain": "SELECT 뒤에 DISTINCT를 붙이면 중복된 값을 제외하고 검색합니다."
  },
  {
    "type": "practical",
    "q": "[실기 단답형] 대역폭이 3,000Hz이고 신호 대 잡음비(S/N)가 15인 채널의 최대 통신 용량(bps)을 섀넌 공식으로 구하시오. (단위 없이 숫자만)",
    "kind": "short",
    "accept": [
      "12000",
      "12,000"
    ],
    "answerDisplay": "12000bps",
    "explain": "C = W·log2(1+S/N) = 3000 × log2(16) = 3000 × 4 = 12,000bps 입니다."
  },
  {
    "type": "practical",
    "q": "[실기 단답형] 6장으로 이루어진 디스크 팩에서 사용 가능한 데이터 기록면의 수를 구하시오. (단위 없이 숫자만)",
    "kind": "short",
    "accept": [
      "10"
    ],
    "answerDisplay": "10",
    "explain": "디스크 팩 기록면 = (디스크 팩 수 × 2) − 2 = 6×2−2 = 10 입니다(맨 위·맨 아래 면은 기록 불가)."
  }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>

</body>
</html>
