<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-09-15 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    type:"written",
    q:"RISC(Reduced Instruction Set Computer)의 특징으로 옳은 것은?",
    kind:"mc",
    options:[
      "메모리 액세스를 LOAD와 STORE 명령어로 제한한다.",
      "명령어의 종류가 많고 형식이 복잡하다.",
      "CISC에 비해 레지스터의 수가 적은 편이다.",
      "명령어 해독 회로의 구조가 복잡하다."
    ],
    answer:0,
    explain:"RISC는 메모리 액세스를 LOAD/STORE 명령어로만 한정하여 단순화하고, 그 외 명령어는 레지스터 간 연산으로 처리합니다. 명령어 종류가 많고 형식이 복잡하며 레지스터 수가 적은 것은 CISC의 특징입니다."
  },
  {
    type:"written",
    q:"드모르간(De Morgan)의 법칙을 올바르게 표현한 식은?",
    kind:"mc",
    options:[
      "(A+B)' = A' + B'",
      "(A+B)' = A' · B'",
      "(A · B)' = A · B",
      "(A+B) = A' · B'"
    ],
    answer:1,
    explain:"드모르간의 법칙은 (A+B)' = A'·B' 와 (A·B)' = A'+B' 입니다. OR의 부정은 AND로, AND의 부정은 OR로 바뀌면서 각 입력에도 부정이 붙습니다."
  },
  {
    type:"written",
    q:"패리티(Parity) 검사 코드에 대한 설명으로 옳지 않은 것은?",
    kind:"mc",
    options:[
      "1비트의 오류만 검출할 수 있다.",
      "우수(Even) 패리티는 1인 비트의 개수를 짝수로 맞춘다.",
      "기수(Odd) 패리티는 1인 비트의 개수를 홀수로 맞춘다.",
      "2비트의 오류까지 검출하고 1비트를 교정할 수 있다."
    ],
    answer:3,
    explain:"패리티 검사 코드는 1비트의 오류만 검출할 수 있을 뿐 교정은 하지 못합니다. 2비트 오류 검출과 1비트 오류 교정이 모두 가능한 것은 해밍(Hamming) 코드의 특징입니다."
  },
  {
    type:"written",
    q:"다음 중 이항(Binary) 연산자에 해당하지 않는 것은?",
    kind:"mc",
    options:["AND", "OR", "NOT", "XOR"],
    answer:2,
    explain:"이항 연산자는 연산을 수행하기 위해 2개의 피연산자를 필요로 하는 연산자로 사칙연산, AND, OR, XOR, XNOR 등이 있습니다. NOT은 피연산자가 1개만 필요한 단항(Unary) 연산자입니다."
  },
  {
    type:"written",
    q:"다음 중 보조기억장치에 해당하는 것은?",
    kind:"mc",
    options:["ROM", "RAM", "자기 디스크", "캐시 메모리"],
    answer:2,
    explain:"ROM과 RAM은 주기억장치이며, 캐시 메모리는 CPU와 주기억장치 사이의 속도 차이를 줄이기 위한 고속 기억장치입니다. 자기 디스크는 대용량 자료를 영구적으로 저장하는 보조기억장치입니다."
  },
  {
    type:"written",
    q:"관계형 데이터베이스에서 하나의 릴레이션(테이블)이 가지는 속성(Attribute)의 개수를 의미하는 용어는?",
    kind:"mc",
    options:["기수(Cardinality)", "차수(Degree)", "도메인(Domain)", "스키마(Schema)"],
    answer:1,
    explain:"차수(Degree)는 릴레이션이 가지는 속성(열)의 개수를 의미하며, 기수(Cardinality)는 튜플(행)의 개수를 의미합니다. 도메인은 하나의 속성이 가질 수 있는 값의 범위입니다."
  },
  {
    type:"written",
    q:"SQL 명령어 중 DDL(데이터 정의어, Data Definition Language)에 해당하지 않는 것은?",
    kind:"mc",
    options:["CREATE", "ALTER", "DROP", "UPDATE"],
    answer:3,
    explain:"DDL(데이터 정의어)에는 CREATE, ALTER, DROP이 있습니다. UPDATE는 SELECT, INSERT, DELETE와 함께 DML(데이터 조작어)에 해당합니다."
  },
  {
    type:"written",
    q:"운영체제의 발달 순서로 옳은 것은?",
    kind:"mc",
    options:[
      "단일 처리 → 일괄 처리 → 다중 프로그래밍 → 시분할 → 다중 처리",
      "일괄 처리 → 단일 처리 → 시분할 → 다중 프로그래밍 → 다중 처리",
      "다중 처리 → 다중 프로그래밍 → 시분할 → 일괄 처리 → 단일 처리",
      "단일 처리 → 다중 처리 → 일괄 처리 → 시분할 → 다중 프로그래밍"
    ],
    answer:0,
    explain:"운영체제는 단일 처리 → 일괄 처리 → 다중 프로그래밍 → 시분할 → 다중 처리 → 실시간 → 범용 → 분산 순으로 발달하였습니다(암기 키워드: 단.일.프.시.다.실.범.분)."
  },
  {
    type:"written",
    q:"준비(Ready) 상태의 프로세스 중 우선순위가 가장 높은 프로세스가 CPU를 할당받아 실행 상태로 전이되는 과정을 의미하는 용어는?",
    kind:"mc",
    options:["디스패치(Dispatch)", "인터럽트(Interrupt)", "스풀링(Spooling)", "페이징(Paging)"],
    answer:0,
    explain:"디스패치(Dispatch)는 준비 상태의 프로세스 중 우선순위가 가장 높은 프로세스가 CPU를 할당받아 실행 상태로 전이되는 과정을 말합니다."
  },
  {
    type:"written",
    q:"OSI 7계층 중 경로 배정(Routing), 중계, 네트워크 어드레싱 기능을 담당하는 계층은?",
    kind:"mc",
    options:["데이터 링크 계층", "네트워크 계층", "전송 계층", "세션 계층"],
    answer:1,
    explain:"네트워크 계층(3계층)은 송신 측과 수신 측 사이의 경로 배정(라우팅), 중계, 네트워크 어드레싱 기능을 담당합니다. 데이터 링크 계층은 인접 시스템 간 신뢰성 있는 전송, 전송 계층은 오류·흐름 제어, 세션 계층은 대화 제어를 담당합니다."
  },
  {
    type:"written",
    q:"모뎀(MODEM)의 주요 기능으로 옳은 것은?",
    kind:"mc",
    options:[
      "디지털 신호와 아날로그 신호를 상호 변환하여 원거리 전송이 가능하게 한다.",
      "인터넷에서 패킷의 경로를 설정한다.",
      "사설 IP 주소를 고정 IP 주소로 변환하여 연결한다.",
      "여러 개의 회선을 하나로 통합하여 전송한다."
    ],
    answer:0,
    explain:"모뎀(MODEM, MOdulator/DEModulator)은 디지털 신호를 아날로그 신호로, 아날로그 신호를 다시 디지털 신호로 변환하여 원거리 데이터 전송을 가능하게 하는 장치입니다. 패킷 경로 설정은 라우터, 사설 IP 변환은 NAT의 기능입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 10진수 -13을 8비트(bit) 2의 보수(2's Complement)로 표현하시오. (2진수로 답하시오)",
    kind:"short",
    accept:["11110011"],
    answerDisplay:"11110011",
    explain:"먼저 13을 8비트 2진수로 표현하면 00001101 입니다. 1의 보수는 각 비트를 반전시킨 11110010 이며, 여기에 1을 더하면(1의 보수 + 1) 2의 보수인 11110011 이 됩니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 대역폭(W)이 3,000Hz이고 신호 대 잡음비(S/N)가 1,023인 회선의 최대 통신 용량(C)을 섀넌(Shannon)의 공식을 이용하여 구하시오. (단위 없이 숫자만, bps)",
    kind:"short",
    accept:["30000","30,000"],
    answerDisplay:"30000bps",
    explain:"섀넌의 공식은 C = W · log₂(1 + S/N) 입니다. 1 + S/N = 1 + 1023 = 1024 = 2¹⁰ 이므로 log₂(1024) = 10. 따라서 C = 3,000 × 10 = 30,000bps 입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] '학생' 테이블에 '주소'라는 이름의 VARCHAR(20)형 컬럼(속성)을 새로 추가하는 SQL문을 작성하시오.",
    kind:"short",
    accept:[
      "ALTER TABLE 학생 ADD 주소 VARCHAR(20)",
      "ALTER TABLE 학생 ADD COLUMN 주소 VARCHAR(20)"
    ],
    answerDisplay:"ALTER TABLE 학생 ADD 주소 VARCHAR(20);",
    explain:"기존 테이블의 구조를 변경할 때는 ALTER TABLE 문을 사용합니다. 컬럼을 추가할 때는 'ALTER TABLE 테이블명 ADD 속성명 자료형' 형식으로 작성합니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 회선 교환과 달리 전송할 데이터를 일정한 크기의 단위로 나누어 전송하며, 주로 공중 데이터 교환망(PSDN)에서 사용되는 교환 방식의 이름을 한글로 쓰시오.",
    kind:"short",
    accept:["패킷 교환","패킷교환","패킷 교환 방식","패킷교환방식"],
    answerDisplay:"패킷 교환(Packet Switching)",
    explain:"패킷 교환 방식은 전송 데이터를 일정한 크기의 패킷 단위로 나누어 전송하는 방식으로, 디지털 전송에 적합하며 주로 공중 데이터 교환망(PSDN)에서 사용됩니다. 메시지 교환, 회선 교환과 함께 정보 교환망의 한 종류입니다(암기 키워드: 패.메.회)."
  }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>

</body>
</html>
