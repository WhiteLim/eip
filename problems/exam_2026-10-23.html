<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 14문항 · 2026-10-23 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">14</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    "type": "written",
    "q": "제어장치(Control Unit)가 명령어를 해독한 뒤 다음에 실행할 명령어의 주소를 저장하고 있는 레지스터는?",
    "kind": "mc",
    "options": [
      "프로그램 카운터(PC)",
      "명령 레지스터(IR)",
      "누산기(ACC)",
      "메모리 주소 레지스터(MAR)"
    ],
    "answer": 0,
    "explain": "프로그램 카운터(PC)는 다음에 실행할 명령어의 주소를 기억합니다. IR은 현재 실행 중인 명령어, MAR은 기억장치 접근 주소를 저장합니다."
  },
  {
    "type": "written",
    "q": "논리식 A + A·B 를 간소화한 결과는?",
    "kind": "mc",
    "options": [
      "A",
      "B",
      "A·B",
      "A + B"
    ],
    "answer": 0,
    "explain": "흡수법칙에 의해 A + A·B = A(1 + B) = A 입니다."
  },
  {
    "type": "written",
    "q": "컴퓨터에서 음수를 표현하는 방법 중 2의 보수에 대한 설명으로 옳은 것은?",
    "kind": "mc",
    "options": [
      "1의 보수에 1을 더한 값이다.",
      "1의 보수에서 1을 뺀 값이다.",
      "부호 비트만 반전한 값이다.",
      "절댓값에 부호 비트 1을 붙인 값이다."
    ],
    "answer": 0,
    "explain": "2의 보수는 1의 보수(각 비트 반전)에 1을 더해서 구합니다."
  },
  {
    "type": "written",
    "q": "인터럽트 발생 시 처리 순서로 옳은 것은?",
    "kind": "mc",
    "options": [
      "현재 상태 저장 → 인터럽트 서비스 루틴 실행 → 상태 복구 → 원래 프로그램 재개",
      "인터럽트 서비스 루틴 실행 → 현재 상태 저장 → 원래 프로그램 재개",
      "상태 복구 → 서비스 루틴 실행 → 상태 저장",
      "프로그램 종료 → 서비스 루틴 실행"
    ],
    "answer": 0,
    "explain": "인터럽트가 발생하면 현재 실행 중인 프로그램의 상태를 저장하고, 서비스 루틴을 실행한 뒤 상태를 복구하여 원래 프로그램을 재개합니다."
  },
  {
    "type": "written",
    "q": "관계 데이터베이스에서 릴레이션의 행(Row)에 해당하는 용어는?",
    "kind": "mc",
    "options": [
      "튜플(Tuple)",
      "속성(Attribute)",
      "도메인(Domain)",
      "차수(Degree)"
    ],
    "answer": 0,
    "explain": "튜플은 릴레이션의 행, 속성은 열을 의미합니다. 튜플의 수는 카디널리티, 속성의 수는 차수(Degree)입니다."
  },
  {
    "type": "written",
    "q": "SQL에서 테이블 자체를 삭제하는 명령어는?",
    "kind": "mc",
    "options": [
      "DROP TABLE",
      "DELETE FROM",
      "TRUNCATE ROW",
      "REMOVE TABLE"
    ],
    "answer": 0,
    "explain": "DROP TABLE은 테이블 구조와 데이터를 모두 삭제하는 DDL입니다. DELETE는 조건에 맞는 튜플만 삭제하는 DML입니다."
  },
  {
    "type": "written",
    "q": "프로세스 상태 전이에서 준비(Ready) 상태의 프로세스가 CPU를 할당받아 실행 상태로 바뀌는 것을 무엇이라 하는가?",
    "kind": "mc",
    "options": [
      "디스패치(Dispatch)",
      "웨이크업(Wake-up)",
      "타임아웃(Timeout)",
      "블록(Block)"
    ],
    "answer": 0,
    "explain": "준비 → 실행 전이는 디스패치입니다. 타임아웃은 실행 → 준비, 블록은 실행 → 대기, 웨이크업은 대기 → 준비 전이입니다."
  },
  {
    "type": "written",
    "q": "UNIX에서 파일의 접근 권한을 변경하는 명령어는?",
    "kind": "mc",
    "options": [
      "chmod",
      "chown",
      "ls",
      "cat"
    ],
    "answer": 0,
    "explain": "chmod는 파일 접근 권한을 변경합니다. chown은 소유자 변경, ls는 목록 출력, cat은 파일 내용 출력 명령입니다."
  },
  {
    "type": "written",
    "q": "다음 중 네트워크 계층(3계층)의 프로토콜이 아닌 것은?",
    "kind": "mc",
    "options": [
      "IP",
      "ICMP",
      "ARP",
      "HTTP"
    ],
    "answer": 3,
    "explain": "HTTP는 응용 계층 프로토콜입니다. IP, ICMP는 네트워크 계층에서 동작합니다."
  },
  {
    "type": "written",
    "q": "데이터 전송 방식 중 한 번에 한 방향씩 교대로 전송할 수 있으며 무전기가 대표적인 예인 방식은?",
    "kind": "mc",
    "options": [
      "반이중(Half Duplex)",
      "단방향(Simplex)",
      "전이중(Full Duplex)",
      "병렬 전송"
    ],
    "answer": 0,
    "explain": "반이중 방식은 양방향 전송이 가능하나 동시에는 불가능하고 교대로 전송합니다. 전이중은 동시 양방향 전송(전화)입니다."
  },
  {
    "type": "written",
    "q": "전송 오류 검출 방식 중 정보 비트에 1비트의 검사 비트를 추가하여 홀수/짝수를 맞추는 방식은?",
    "kind": "mc",
    "options": [
      "패리티 검사",
      "해밍 코드",
      "CRC",
      "체크섬"
    ],
    "answer": 0,
    "explain": "패리티 검사는 1비트의 패리티 비트를 덧붙여 1의 개수를 짝수 또는 홀수로 맞추어 오류를 검출합니다."
  },
  {
    "type": "practical",
    "q": "[실기 단답형] 2진수 101101을 10진수로 변환한 값을 쓰시오. (숫자만)",
    "kind": "short",
    "accept": [
      "45"
    ],
    "answerDisplay": "45",
    "explain": "32+8+4+1 = 45 입니다."
  },
  {
    "type": "practical",
    "q": "[실기 단답형] '학생' 테이블에서 모든 튜플을 '이름' 기준 오름차순으로 검색하는 SQL문을 작성하시오.",
    "kind": "short",
    "accept": [
      "SELECT * FROM 학생 ORDER BY 이름",
      "SELECT * FROM 학생 ORDER BY 이름 ASC"
    ],
    "answerDisplay": "SELECT * FROM 학생 ORDER BY 이름 ASC;",
    "explain": "ORDER BY 절로 정렬하며, 오름차순은 ASC(생략 가능), 내림차순은 DESC입니다."
  },
  {
    "type": "practical",
    "q": "[실기 단답형] 8비트로 표현할 수 있는 서로 다른 정보의 개수를 구하시오. (숫자만)",
    "kind": "short",
    "accept": [
      "256"
    ],
    "answerDisplay": "256",
    "explain": "n비트로 표현 가능한 정보는 2ⁿ개이므로 2⁸ = 256 입니다."
  }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>

</body>
</html>
