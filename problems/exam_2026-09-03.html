<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-09-03 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    type:"written",
    q:"데이터베이스 설계 과정의 순서로 옳은 것은?",
    kind:"mc",
    options:[
      "개념적 설계 → 요구사항 분석 → 논리적 설계 → 물리적 설계 → 구현",
      "요구사항 분석 → 개념적 설계 → 논리적 설계 → 물리적 설계 → 구현",
      "요구사항 분석 → 논리적 설계 → 개념적 설계 → 물리적 설계 → 구현",
      "요구사항 분석 → 물리적 설계 → 개념적 설계 → 논리적 설계 → 구현"
    ],
    answer:1,
    explain:"데이터베이스 설계는 '요구사항 분석 → 개념적 설계 → 논리적 설계 → 물리적 설계 → 구현'의 순서(개.논.물)로 진행됩니다."
  },
  {
    type:"written",
    q:"SQL의 DROP문에서, 제거할 요소를 참조하는 다른 모든 개체까지 함께 제거하도록 하는 옵션은?",
    kind:"mc",
    options:["RESTRICT", "CASCADE", "DISTINCT", "UNIQUE"],
    answer:1,
    explain:"DROP CASCADE는 제거할 요소를 참조하는 다른 개체도 함께 제거합니다. 반대로 DROP RESTRICT는 제거할 요소가 다른 곳에서 참조 중이면 제거하지 않습니다."
  },
  {
    type:"written",
    q:"UNIX에서 'ls -l' 명령의 결과로 파일 종류를 나타내는 첫 글자 중, 'd'가 의미하는 것은?",
    kind:"mc",
    options:["블록형 특수 파일", "문자형 특수 파일", "디렉터리", "링크 파일"],
    answer:2,
    explain:"UNIX의 파일 종류 표시는 b(블록형 특수), c(문자형 특수), d(디렉터리), l(링크)로 구분되며, 'd'는 디렉터리를 의미합니다."
  },
  {
    type:"written",
    q:"다음 중 Windows 탐색기의 파일 보기 방식에 해당하지 않는 것은?",
    kind:"mc",
    options:["큰 아이콘", "자세히", "목록", "그룹 정렬"],
    answer:3,
    explain:"Windows 탐색기는 큰/보통/작은 아이콘, 목록, 자세히 등의 보기 방식을 제공하지만, '그룹 정렬'이라는 보기 방식은 제공하지 않습니다."
  },
  {
    type:"written",
    q:"OSI 7계층 중, 경로 배정(라우팅)과 네트워크 어드레싱을 담당하는 계층은?",
    kind:"mc",
    options:["데이터 링크 계층", "네트워크 계층", "전송 계층", "세션 계층"],
    answer:1,
    explain:"네트워크 계층(3계층)은 경로 배정, 중계, 네트워크 어드레싱을 담당합니다. 데이터 링크 계층은 인접 시스템 간 신뢰성 있는 전송, 전송 계층은 오류·흐름 제어, 세션 계층은 대화 제어를 담당합니다."
  },
  {
    type:"written",
    q:"정보 교환망의 3가지 기본 방식(패.메.회)에 해당하지 않는 것은?",
    kind:"mc",
    options:["패킷 교환망", "메시지 교환망", "회선 교환망", "위성 교환망"],
    answer:3,
    explain:"정보 교환망은 패킷 교환망, 메시지 교환망, 회선 교환망(패.메.회)의 3가지로 구분됩니다. 위성 교환망은 이 3가지 기본 분류에 해당하지 않습니다."
  },
  {
    type:"written",
    q:"RS-232C 25핀 커넥터에서 '수신 데이터'에 해당하는 핀 번호는?",
    kind:"mc",
    options:["2번", "3번", "4번", "5번"],
    answer:1,
    explain:"RS-232C 커넥터는 2번 송신 데이터, 3번 수신 데이터, 4번 송신 요청, 5번 송신 준비 완료로 핀이 할당되어 있습니다."
  },
  {
    type:"written",
    q:"섀넌(Shannon)의 공식 C = W·log₂(1+S/N)에서, 통신 용량(C)을 증대시키는 방법으로 옳지 않은 것은?",
    kind:"mc",
    options:["주파수 대역폭(W)을 증가시킨다.", "신호 세력(S)을 증가시킨다.", "잡음 세력(N)을 증가시킨다.", "잡음 세력(N)을 감소시킨다."],
    answer:2,
    explain:"섀넌 공식에서 통신 용량을 늘리려면 대역폭(W)과 신호 세력(S)은 늘리고, 잡음 세력(N)은 줄여야 합니다. 잡음 세력을 증가시키는 것은 오히려 통신 용량을 감소시킵니다."
  },
  {
    type:"written",
    q:"IPv6 주소는 총 몇 비트로 구성되는가?",
    kind:"mc",
    options:["32비트", "64비트", "128비트", "256비트"],
    answer:2,
    explain:"IPv6는 16비트씩 8부분으로 구성되어 총 128비트입니다. 참고로 IPv4는 8비트씩 4부분으로 구성되어 총 32비트입니다."
  },
  {
    type:"written",
    q:"HDLC 프레임의 구성 순서(주.제.정.검)로 옳은 것은?",
    kind:"mc",
    options:[
      "플래그 → 주소부 → 제어부 → 정보부 → 검색부(FCS) → 플래그",
      "플래그 → 제어부 → 주소부 → 정보부 → 검색부(FCS) → 플래그",
      "주소부 → 플래그 → 제어부 → 검색부(FCS) → 정보부 → 플래그",
      "플래그 → 정보부 → 제어부 → 주소부 → 검색부(FCS) → 플래그"
    ],
    answer:0,
    explain:"HDLC 프레임은 '플래그 → 주소부 → 제어부 → 정보부 → 검색부(FCS) → 플래그'(주.제.정.검) 순서로 구성됩니다."
  },
  {
    type:"written",
    q:"인터럽트 우선순위를 판별하는 방식 중, 소프트웨어적인 방법에 해당하는 것은?",
    kind:"mc",
    options:["폴링(Polling)", "데이지 체인(Daisy Chain)", "병렬 우선 처리 방식", "벡터 인터럽트 방식"],
    answer:0,
    explain:"인터럽트 우선순위 판별 방식 중 폴링은 소프트웨어적 방법이며, 데이지 체인과 병렬 우선 처리 방식은 하드웨어적 방법입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 10진수 -13을 8비트 2의 보수(2's Complement)로 표현한 값을 쓰시오. (8자리 2진수로 쓰시오)",
    kind:"short",
    accept:["11110011"],
    answerDisplay:"11110011",
    explain:"13을 8비트 2진수로 표현하면 00001101 입니다. 1의 보수로 변환하면 11110010 이고, 여기에 1을 더하면 2의 보수인 11110011 이 됩니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 2진수 11001010을 16진수로 변환한 값을 쓰시오.",
    kind:"short",
    accept:["CA","0xCA"],
    answerDisplay:"CA",
    explain:"2진수를 16진수로 변환할 때는 4자리씩 묶습니다. 1100 = C, 1010 = A 이므로 11001010(2) = CA(16) 입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] '학생' 테이블을 삭제하되, 이 테이블을 참조하는 다른 모든 개체도 함께 삭제되도록 하는 SQL문을 작성하시오.",
    kind:"short",
    accept:["DROP TABLE 학생 CASCADE","DROP TABLE 학생 CASCADE;"],
    answerDisplay:"DROP TABLE 학생 CASCADE;",
    explain:"DROP TABLE 문에 CASCADE 옵션을 지정하면, 삭제할 테이블을 참조하는 다른 개체(뷰, 제약조건 등)까지 함께 삭제됩니다. 형식은 'DROP TABLE 테이블명 CASCADE'입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 트랙 수 40, 트랙당 섹터 수 25, 섹터당 워드 수 50인 양면 디스크의 전체 저장 가능한 워드 수를 구하시오. (단위 없이 숫자만)",
    kind:"short",
    accept:["100000","100,000"],
    answerDisplay:"100000",
    explain:"보조기억장치의 전체 워드 수 = 트랙 수 × 트랙당 섹터 수 × 섹터당 워드 수 × 면 수 입니다. 양면 디스크이므로 면 수는 2이며, 40 × 25 × 50 × 2 = 100,000 워드가 됩니다."
  }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>

</body>
</html>
