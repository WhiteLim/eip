<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제4회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:10px;
  }
  .short-btn{
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .short-btn.ghost{
    background:#fff;
    color:var(--accent);
    border:1.5px solid var(--accent);
  }
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제4회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-11-25 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    type:"written",
    q:"JK 플립플롭에서 입력 J=1, K=1을 동시에 가했을 때의 출력 상태로 옳은 것은?",
    kind:"mc",
    options:["무변화(이전 상태 유지)","항상 0(Reset)","항상 1(Set)","보수(현재 상태의 반전)"],
    answer:3,
    explain:"JK 플립플롭의 동작은 '무(0,0) / 공(0,1) / 일(1,0) / 보(1,1)'로 암기합니다. J=K=1이면 현재 출력이 반전되는 보수(Toggle) 동작을 합니다. RS 플립플롭은 같은 입력(1,1)에서 '불(허용되지 않음)' 상태가 되는데, 이를 개선한 것이 JK 플립플롭이며 가장 널리 사용됩니다."
  },
  {
    type:"written",
    q:"2ⁿ개의 입력선 중 하나를 선택하여 단일 출력선으로 내보내는 조합 논리회로는?",
    kind:"mc",
    options:["멀티플렉서(MUX)","디멀티플렉서(DeMUX)","디코더(Decoder)","반가산기(Half Adder)"],
    answer:0,
    explain:"멀티플렉서(MUX)는 2ⁿ개의 입력 중 1개를 선택하여 한 곳으로 출력하는 회로입니다. 반대로 디멀티플렉서(DeMUX)는 1개의 입력선 정보를 2ⁿ개의 출력선 중 하나로 내보냅니다."
  },
  {
    type:"written",
    q:"프로그램 카운터(PC)의 값과 명령어의 주소 부분(Operand)을 더하여 유효 주소를 결정하는 주소 지정 방식은?",
    kind:"mc",
    options:["직접 주소 지정","간접 주소 지정","상대 주소 지정","즉시 주소 지정"],
    answer:2,
    explain:"상대(Relative) 주소 지정 방식은 '프로그램 카운터(PC) + 주소 부분(Operand)'으로 유효 주소를 계산합니다. 직접 방식은 실제 데이터의 절대 주소를, 간접 방식은 데이터 주소를 가진 포인터의 주소를 저장하며, 즉시 방식은 주소 대신 자료 자체를 저장합니다."
  },
  {
    type:"written",
    q:"인터럽트 우선순위 판별 방법 중 하드웨어적인 방법이 아닌 것은?",
    kind:"mc",
    options:["데이지 체인(Daisy Chain)","병렬 우선순위 처리","폴링(Polling)","우선순위 인코더(Priority Encoder)"],
    answer:2,
    explain:"인터럽트 우선순위 판별 방법 중 폴링(Polling)은 CPU가 각 장치를 차례로 검사하는 소프트웨어적 방법입니다. 데이지 체인(직렬)과 병렬 우선순위 처리는 하드웨어적 방법입니다."
  },
  {
    type:"written",
    q:"입출력장치와 CPU 간 속도 차이를 해결하는 방법 중 '스풀링(Spooling)'에 대한 설명으로 옳은 것은?",
    kind:"mc",
    options:[
      "보조기억장치(디스크)를 이용하며 다중 작업에 적합하다.",
      "주기억장치를 이용하며 단일 작업에 적합하다.",
      "CPU의 레지스터만을 이용하여 처리한다.",
      "하드웨어로만 구현되며 운영체제와 관계가 없다."
    ],
    answer:0,
    explain:"버퍼링은 주기억장치를 이용하고 단일 작업에 쓰이며, 스풀링은 보조기억장치(디스크)를 이용하고 다중 작업에 쓰입니다. 둘 다 입출력장치와 CPU의 속도 차이를 줄이기 위한 방법입니다."
  },
  {
    type:"written",
    q:"데이터베이스 설계 단계의 순서로 옳은 것은?",
    kind:"mc",
    options:[
      "요구사항 분석 → 개념적 설계 → 논리적 설계 → 물리적 설계 → 구현",
      "요구사항 분석 → 논리적 설계 → 개념적 설계 → 물리적 설계 → 구현",
      "개념적 설계 → 요구사항 분석 → 물리적 설계 → 논리적 설계 → 구현",
      "요구사항 분석 → 물리적 설계 → 논리적 설계 → 개념적 설계 → 구현"
    ],
    answer:0,
    explain:"데이터베이스 설계는 '요구사항 분석 → 개념적 설계 → 논리적 설계 → 물리적 설계 → 구현' 순으로 진행합니다. 가운데 세 단계는 '개.논.물'로 암기합니다."
  },
  {
    type:"written",
    q:"관계형 데이터베이스의 릴레이션에서 '기수(Cardinality)'가 의미하는 것은?",
    kind:"mc",
    options:["속성(Attribute)의 개수","튜플(Tuple)의 개수","도메인(Domain)의 개수","기본키(Primary Key)의 개수"],
    answer:1,
    explain:"기수(Cardinality)는 릴레이션을 구성하는 튜플(행)의 개수이고, 차수(Degree)는 속성(열)의 개수입니다. 도메인은 하나의 속성이 가질 수 있는 값의 범위를 뜻합니다."
  },
  {
    type:"written",
    q:"운영체제의 제어 프로그램(Control Program)에 해당하지 않는 것은?",
    kind:"mc",
    options:["감시 프로그램","작업 제어 프로그램","자료 관리 프로그램","언어 번역 프로그램"],
    answer:3,
    explain:"제어 프로그램은 감시 프로그램, 작업 제어 프로그램, 자료 관리 프로그램('감.작.데')으로 구성됩니다. 언어 번역 프로그램은 서비스 프로그램과 함께 처리 프로그램에 속합니다."
  },
  {
    type:"written",
    q:"MS-DOS 명령어 중 외부 명령어에 해당하는 것은?",
    kind:"mc",
    options:["DIR","COPY","FORMAT","CLS"],
    answer:2,
    explain:"FORMAT은 별도의 실행 파일이 있어야 쓸 수 있는 외부 명령어입니다. DIR, COPY, CLS는 COMMAND.COM에 들어 있어 프롬프트에서 언제든 쓸 수 있는 내부 명령어입니다. 외부 명령어로는 ATTRIB, FORMAT, CHKDSK, FDISK, LABEL, SCANDISK, DISKCOPY, XCOPY, SORT, SYS 등이 있습니다."
  },
  {
    type:"written",
    q:"펄스 코드 변조(PCM) 방식에서 송신 측의 처리 순서로 옳은 것은?",
    kind:"mc",
    options:["표본화 → 양자화 → 부호화","양자화 → 표본화 → 부호화","부호화 → 양자화 → 표본화","표본화 → 부호화 → 양자화"],
    answer:0,
    explain:"PCM 송신 측은 '표본화(Sampling) → 양자화(Quantizing) → 부호화(Encoding)'('표.양.부') 순서로 처리하고, 수신 측은 '복호화(Decoding) → 여과화(Filtering)' 순서로 처리합니다."
  },
  {
    type:"written",
    q:"광섬유 케이블에서 발생하는 손실의 종류에 해당하지 않는 것은?",
    kind:"mc",
    options:["접속 손실","산란 손실","흡수 손실","유전체 손실"],
    answer:3,
    explain:"광섬유 케이블의 손실에는 접속 손실, 산란 손실, 흡수 손실이 있습니다. 유전체 손실은 동축 케이블 같은 금속 선로에서 생기는 손실이라 광섬유와는 관계가 없습니다. 광섬유는 잡음의 영향을 받지 않고 보안성이 높아 장거리·대용량 전송에 쓰입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 6장의 디스크로 구성된 디스크 팩에서 실제로 데이터를 기록할 수 있는 면의 수를 구하시오. (단위 없이 숫자만)",
    kind:"short",
    accept:["10"],
    answerDisplay:"10",
    explain:"① 디스크 팩 기록면 공식: (디스크 장 수 × 2) − 2\n② 디스크 1장에는 윗면과 아랫면 2개의 면이 있으므로 전체 면 수는 6 × 2 = 12입니다.\n③ 맨 위 디스크의 윗면과 맨 아래 디스크의 아랫면은 보호를 위해 기록에 쓰지 않으므로 2를 뺍니다.\n④ 따라서 12 − 2 = 10면입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] '사원' 테이블에서 '부서' 속성의 값을 중복 없이 조회하는 SQL문을 작성하시오.",
    kind:"short",
    accept:["SELECT DISTINCT 부서 FROM 사원"],
    answerDisplay:"SELECT DISTINCT 부서 FROM 사원;",
    explain:"① 조회는 DML의 SELECT 문을 사용합니다: SELECT 속성 FROM 테이블\n② 중복된 값을 한 번씩만 표시하려면 SELECT 뒤에 DISTINCT를 붙입니다.\n③ 조회할 속성은 '부서', 대상 테이블은 '사원'입니다.\n④ 따라서 SELECT DISTINCT 부서 FROM 사원; 이 됩니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 8진수 755를 10진수로 변환한 값을 쓰시오.",
    kind:"short",
    accept:["493"],
    answerDisplay:"493",
    explain:"① 8진수 → 10진수는 각 자리 숫자 × 8의 자리 지수승을 모두 더합니다.\n② 7 × 8² = 7 × 64 = 448\n③ 5 × 8¹ = 5 × 8 = 40\n④ 5 × 8⁰ = 5 × 1 = 5\n⑤ 448 + 40 + 5 = 493 이므로 755(8) = 493(10) 입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 대역폭이 3,000Hz이고 신호 대 잡음비(S/N)가 15인 채널의 통신 용량(bps)을 섀넌(Shannon)의 공식으로 구하시오. (단위 없이 숫자만)",
    kind:"short",
    accept:["12000","12,000"],
    answerDisplay:"12000bps",
    explain:"① 섀넌 공식: C = W × log₂(1 + S/N)\n② W = 3,000Hz, S/N = 15이므로 1 + S/N = 16입니다.\n③ log₂16 = 4 (2⁴ = 16)\n④ C = 3,000 × 4 = 12,000bps 입니다."
  }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btnRow = document.createElement('div');
    btnRow.className = 'short-btn-row';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const explainBtn = document.createElement('button');
    explainBtn.className = 'short-btn ghost';
    explainBtn.textContent = '해설 보기';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });
    explainBtn.addEventListener('click', () => { explain.classList.add('show'); });

    btnRow.appendChild(btn);
    btnRow.appendChild(explainBtn);
    saWrap.appendChild(input);
    saWrap.appendChild(btnRow);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>
