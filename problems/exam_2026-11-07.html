<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-11-07 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    "type": "written",
    "q": "데이터 전송 방식 중 양방향으로 동시에 전송이 가능한 방식은?",
    "kind": "mc",
    "options": [
      "단방향(Simplex)",
      "반이중(Half-Duplex)",
      "전이중(Full-Duplex)",
      "직렬(Serial)"
    ],
    "answer": 2,
    "explain": "전이중(Full-Duplex)은 양방향 동시 전송이 가능합니다. 반이중은 양방향 전송은 가능하지만 동시에는 불가능합니다."
  },
  {
    "type": "written",
    "q": "펄스 코드 변조(PCM)의 송신 측 처리 순서로 옳은 것은?",
    "kind": "mc",
    "options": [
      "표본화 → 양자화 → 부호화",
      "양자화 → 표본화 → 부호화",
      "부호화 → 표본화 → 양자화",
      "표본화 → 부호화 → 양자화"
    ],
    "answer": 0,
    "explain": "PCM 송신 측은 표본화(Sampling) → 양자화(Quantizing) → 부호화(Encoding) 순서(표.양.부)입니다. 수신 측은 복호화 → 여과화입니다."
  },
  {
    "type": "written",
    "q": "준비(Ready) 상태의 프로세스 중 우선순위가 가장 높은 프로세스가 CPU를 할당받아 실행 상태로 전이되는 것을 무엇이라 하는가?",
    "kind": "mc",
    "options": [
      "디스패치(Dispatch)",
      "웨이크업(Wake-up)",
      "블록(Block)",
      "스풀링(Spooling)"
    ],
    "answer": 0,
    "explain": "디스패치(Dispatch)는 준비 상태의 프로세스 중 우선순위가 가장 높은 프로세스에 CPU를 할당하여 실행 상태로 바꾸는 동작입니다."
  },
  {
    "type": "written",
    "q": "가장 오래 참조되지 않은 페이지를 교체하는 페이지 교체 알고리즘은?",
    "kind": "mc",
    "options": [
      "FIFO",
      "LRU",
      "LFU",
      "NUR"
    ],
    "answer": 1,
    "explain": "LRU는 가장 오래 사용되지 않은 페이지를 교체합니다. LFU는 사용 빈도가 가장 적은 페이지, NUR은 최근에 사용하지 않은 페이지를 교체합니다."
  },
  {
    "type": "written",
    "q": "Windows 탐색기에서 연속되지 않은 여러 파일을 선택할 때 함께 사용하는 키는?",
    "kind": "mc",
    "options": [
      "Shift",
      "Ctrl",
      "Alt",
      "Tab"
    ],
    "answer": 1,
    "explain": "연속 파일 선택은 Shift, 비연속 파일 선택은 Ctrl 키를 누른 채 클릭합니다."
  },
  {
    "type": "written",
    "q": "MS-DOS 부팅 시 가장 먼저 실행되는 파일은?",
    "kind": "mc",
    "options": [
      "COMMAND.COM",
      "AUTOEXEC.BAT",
      "IO.SYS",
      "CONFIG.SYS"
    ],
    "answer": 2,
    "explain": "DOS 부팅 순서는 IO.SYS → MSDOS.SYS → CONFIG.SYS → COMMAND.COM → AUTOEXEC.BAT (I.M.C.C.A) 입니다."
  },
  {
    "type": "written",
    "q": "관계 데이터베이스에서 차수(Degree)의 의미로 옳은 것은?",
    "kind": "mc",
    "options": [
      "튜플(Tuple)의 개수",
      "속성(Attribute)의 개수",
      "도메인의 크기",
      "테이블의 개수"
    ],
    "answer": 1,
    "explain": "차수(Degree)는 속성(Attribute)의 개수, 기수(Cardinality)는 튜플(Tuple)의 개수입니다."
  },
  {
    "type": "written",
    "q": "인터럽트 우선순위 판별 방법 중 하드웨어 방식에 해당하지 않는 것은?",
    "kind": "mc",
    "options": [
      "데이지 체인(Daisy Chain)",
      "병렬 우선순위 부여",
      "폴링(Polling)",
      "하드웨어 우선순위 인코더"
    ],
    "answer": 2,
    "explain": "폴링(Polling)은 소프트웨어 방식입니다. 데이지 체인과 병렬 우선 처리는 하드웨어 방식입니다."
  },
  {
    "type": "written",
    "q": "프로그램 카운터(PC)의 값과 명령어의 주소 부분(Operand)을 더하여 유효 주소를 구하는 주소 지정 방식은?",
    "kind": "mc",
    "options": [
      "직접 주소 지정",
      "간접 주소 지정",
      "상대 주소 지정",
      "즉치 주소 지정"
    ],
    "answer": 2,
    "explain": "상대(Relative) 주소 지정은 PC + 주소 부분(Operand)으로 유효 주소를 계산합니다."
  },
  {
    "type": "written",
    "q": "광섬유 케이블의 전송 손실에 해당하지 않는 것은?",
    "kind": "mc",
    "options": [
      "접속 손실",
      "산란 손실",
      "흡수 손실",
      "유전체 손실"
    ],
    "answer": 3,
    "explain": "광섬유의 손실은 접속 손실, 산란 손실, 흡수 손실입니다. 유전체 손실은 해당하지 않습니다."
  },
  {
    "type": "practical",
    "q": "[실기 단답형] 2진수 101110을 8진수로 변환한 값을 쓰시오. (숫자만)",
    "kind": "short",
    "accept": [
      "56"
    ],
    "answerDisplay": "56",
    "explain": "2진수를 3자리씩 묶으면 101 | 110 이고, 각각 5와 6이므로 56(8) 입니다."
  },
  {
    "type": "practical",
    "q": "[실기 단답형] 대역폭 3,000Hz, 신호 대 잡음비(S/N) 255인 채널의 섀넌 통신 용량(bps)을 구하시오. (C = W·log₂(1+S/N), 숫자만)",
    "kind": "short",
    "accept": [
      "24000",
      "24,000"
    ],
    "answerDisplay": "24000bps",
    "explain": "C = 3000 × log₂(1+255) = 3000 × log₂256 = 3000 × 8 = 24,000bps 입니다."
  },
  {
    "type": "practical",
    "q": "[실기 단답형] UNIX에서 앞 명령어의 출력을 뒤 명령어의 입력으로 연결해 주는 기능(명령)의 이름을 영문 소문자로 쓰시오.",
    "kind": "short",
    "accept": [
      "pipe",
      "파이프"
    ],
    "answerDisplay": "pipe (파이프)",
    "explain": "pipe는 앞 명령어의 출력을 뒤 명령어의 입력으로 전달합니다."
  },
  {
    "type": "practical",
    "q": "[실기 단답형] '학생' 테이블에서 '학과' 속성을 중복 없이 검색하는 SQL문을 작성하시오.",
    "kind": "short",
    "accept": [
      "SELECT DISTINCT 학과 FROM 학생",
      "select distinct 학과 from 학생"
    ],
    "answerDisplay": "SELECT DISTINCT 학과 FROM 학생;",
    "explain": "SELECT DISTINCT는 중복된 튜플을 제거하고 검색합니다."
  },
  {
    "type": "practical",
    "q": "[실기 단답형] 연산자부(OP-Code)가 4비트일 때 사용할 수 있는 명령어의 최대 개수를 쓰시오. (숫자만)",
    "kind": "short",
    "accept": [
      "16"
    ],
    "answerDisplay": "16",
    "explain": "n비트의 OP-Code로는 2ⁿ개의 명령어를 표현할 수 있으므로 2⁴ = 16개 입니다."
  }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>

</body>
</html>
