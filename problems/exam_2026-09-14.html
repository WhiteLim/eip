<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-09-14 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    type:"written",
    q:"드모르강(De Morgan) 법칙에 따라 NOT(A+B), 즉 (A+B)' 를 올바르게 변환한 것은?",
    kind:"mc",
    options:["A' · B'","A' + B'","A · B","A + B"],
    answer:0,
    explain:"드모르강 법칙에 의해 (A+B)' = A'·B', (A·B)' = A'+B' 로 변환됩니다. OR의 부정은 AND로, 각 항은 부정으로 바뀝니다."
  },
  {
    type:"written",
    q:"해밍 코드(Hamming Code)에 대한 설명으로 옳은 것은?",
    kind:"mc",
    options:[
      "오류를 스스로 검출하고 교정할 수 있으며, 2비트 오류 검출과 1비트 오류 교정이 가능하다.",
      "오류 검출만 가능하고 교정은 불가능하다.",
      "1비트 패리티 비트만 추가하여 다중 비트 오류까지 교정한다.",
      "정마크(정스페이스) 방식으로 오류를 검출하는 코드이다."
    ],
    answer:0,
    explain:"해밍 코드는 오류를 스스로 검출·교정할 수 있는 대표적인 코드로, 2비트 오류 검출과 1비트 오류 교정이 가능합니다. 정마크(정스페이스) 방식은 2-out-of-5 코드에 대한 설명입니다."
  },
  {
    type:"written",
    q:"CPU의 참여 없이 입출력장치와 메모리가 직접 데이터를 주고받는 방식은?",
    kind:"mc",
    options:["DMA(Direct Memory Access)", "채널(Channel)", "인터럽트(Interrupt)", "폴링(Polling)"],
    answer:0,
    explain:"DMA(Direct Memory Access)는 CPU의 개입 없이 입출력장치와 메모리가 직접 데이터를 주고받는 방식입니다. 채널은 CPU에 종속되지 않고 독립적으로 입출력을 관리하는 장치이며, 인터럽트와 폴링은 이와는 다른 개념입니다."
  },
  {
    type:"written",
    q:"버퍼링(Buffering)과 스풀링(Spooling)에 대한 설명으로 옳은 것은?",
    kind:"mc",
    options:[
      "스풀링은 보조기억장치를 이용하며 다중 작업(멀티태스킹) 환경에 적합하다.",
      "버퍼링은 보조기억장치를 이용하며 다중 작업 환경에 적합하다.",
      "스풀링은 주기억장치만 이용하며 단일 작업에서만 사용된다.",
      "버퍼링과 스풀링 모두 보조기억장치를 사용하는 동일한 개념이다."
    ],
    answer:0,
    explain:"버퍼링은 주기억장치의 일부를 버퍼로 사용하며 단일 작업에 적합하고, 스풀링은 보조기억장치를 이용하며 다중 작업(멀티태스킹) 환경에 적합합니다."
  },
  {
    type:"written",
    q:"데이터베이스의 3단계 스키마 중, 데이터베이스 전체를 통합한 관점에서 조직 전체가 필요로 하는 데이터를 정의하며 하나만 존재하는 스키마는?",
    kind:"mc",
    options:["개념 스키마(Conceptual Schema)", "외부 스키마(External Schema)", "내부 스키마(Internal Schema)", "물리 스키마(Physical Schema)"],
    answer:0,
    explain:"3단계 스키마는 개념 스키마, 외부 스키마, 내부 스키마(개.외.내)로 구분됩니다. 이 중 개념 스키마는 데이터베이스 전체를 통합한 관점에서 정의되며 데이터베이스마다 하나만 존재합니다."
  },
  {
    type:"written",
    q:"SQL의 DROP 명령에서, 제거하려는 요소를 다른 개체가 참조하고 있을 경우 삭제를 수행하지 않는 옵션은?",
    kind:"mc",
    options:["RESTRICT", "CASCADE", "GRANT", "REVOKE"],
    answer:0,
    explain:"DROP ... RESTRICT는 제거할 요소를 다른 개체가 참조 중이면 제거하지 않습니다. 반대로 CASCADE는 참조하는 다른 개체까지 함께 제거합니다."
  },
  {
    type:"written",
    q:"운영체제의 발달 순서로 옳은 것은?",
    kind:"mc",
    options:[
      "단일 처리 → 일괄 처리 → 다중 프로그래밍 → 시분할 → 다중 처리 → 실시간",
      "일괄 처리 → 단일 처리 → 시분할 → 다중 프로그래밍 → 실시간 → 다중 처리",
      "다중 처리 → 시분할 → 일괄 처리 → 단일 처리 → 실시간 → 범용",
      "시분할 → 다중 프로그래밍 → 일괄 처리 → 단일 처리 → 다중 처리 → 실시간"
    ],
    answer:0,
    explain:"운영체제는 단일 처리 → 일괄 처리 → 다중 프로그래밍 → 시분할 → 다중 처리 → 실시간 → 범용 → 분산 순서로 발달했습니다(단.일.프.시.다.실.범.분)."
  },
  {
    type:"written",
    q:"CPU 스케줄링 기법 중, 시간 조각(Time Slice)을 미리 정하여 각 프로세스에 순서대로 CPU를 제공하는 선점형 기법은?",
    kind:"mc",
    options:["RR(Round Robin)", "FIFO", "SJF", "HRN"],
    answer:0,
    explain:"RR(Round Robin)은 시간 조각(Time Slice)을 미리 정의하여 각 프로세스에 순차적으로 CPU를 제공하는 선점형 스케줄링 기법입니다. FIFO는 비선점형으로 먼저 요청한 프로세스에 먼저 할당합니다."
  },
  {
    type:"written",
    q:"UNIX에서 'ls -l' 명령의 결과 중, 파일 종류를 나타내는 첫 글자가 'd'로 표시될 때 이 파일의 종류는?",
    kind:"mc",
    options:["디렉터리", "블록형 특수 파일", "문자형 특수 파일", "링크 파일"],
    answer:0,
    explain:"UNIX에서 파일 종류는 b(블록형 특수), c(문자형 특수), d(디렉터리), l(링크)로 구분됩니다(b.c.d.l). 'd'는 디렉터리를 의미합니다."
  },
  {
    type:"written",
    q:"OSI 7계층 중, TCP와 UDP 프로토콜이 동작하며 논리적 연결 통로 설정과 오류 검출, 흐름 제어, 혼잡 제어를 담당하는 계층은?",
    kind:"mc",
    options:["전송 계층(Transport Layer)", "세션 계층(Session Layer)", "표현 계층(Presentation Layer)", "네트워크 계층(Network Layer)"],
    answer:0,
    explain:"전송 계층(4계층)은 TCP, UDP가 동작하는 계층으로 논리적 연결 통로, 오류 검출, 흐름 제어, 혼잡 제어를 담당합니다. 세션 계층은 대화 제어, 표현 계층은 코드 변환, 네트워크 계층은 경로 배정을 담당합니다."
  },
  {
    type:"written",
    q:"FDM(주파수 분할 다중화 방식)에서 인접한 채널 간의 상호 간섭을 방지하기 위해 두는 완충 지역은?",
    kind:"mc",
    options:["가드 밴드(Guard Band)", "타임 슬롯(Time Slot)", "프레임(Frame)", "체크섬(Checksum)"],
    answer:0,
    explain:"FDM은 전송 대역을 여러 개의 채널로 분할하여 사용하는데, 이때 채널 간 상호 간섭을 막기 위해 가드 밴드(Guard Band)라는 완충 지역을 둡니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 8진수 27을 2진수로 변환한 값을 쓰시오.",
    kind:"short",
    accept:["010111","10111"],
    answerDisplay:"010111 (= 10111)",
    explain:"8진수 1자리는 2진수 3자리로 변환합니다. 2(8) = 010, 7(8) = 111 이므로 27(8) = 010111(2) 입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] '학생' 테이블에 학번 '2024001', 이름 '홍길동'을 삽입하는 SQL문을 작성하시오.",
    kind:"short",
    accept:[
      "INSERT INTO 학생(학번,이름) VALUES('2024001','홍길동')",
      "INSERT INTO 학생 (학번,이름) VALUES ('2024001','홍길동')",
      "INSERT INTO 학생(학번,이름) VALUES(\"2024001\",\"홍길동\")"
    ],
    answerDisplay:"INSERT INTO 학생(학번, 이름) VALUES('2024001', '홍길동');",
    explain:"INSERT 문은 'INSERT INTO 테이블명(속성명...) VALUES(값...)' 형식을 사용합니다. 속성 순서와 값의 순서를 일치시켜 작성해야 합니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 변조 속도가 2,400Baud이고, 16위상 편이변조(16-PSK, 위상 16개 = 4비트 전송)를 사용할 때 데이터 신호 속도(bps)를 구하시오. (단위 없이 숫자만)",
    kind:"short",
    accept:["9600","9,600"],
    answerDisplay:"9600bps",
    explain:"신호 속도(bps) = 변조 속도(Baud) × 변조 시 상태 변화 비트 수. 16위상 = 2⁴ 이므로 상태 변화 비트 수는 4비트. 따라서 2,400 × 4 = 9,600bps 입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 트랙 수 10개, 트랙당 섹터 수 20개, 섹터당 워드 수 100개인 단면(면 수 1) 디스크가 있다. 이 디스크에 저장 가능한 총 워드 수를 구하시오. (단위 없이 숫자만)",
    kind:"short",
    accept:["20000","20,000"],
    answerDisplay:"20,000",
    explain:"워드 수 = 트랙 수 × 트랙당 섹터 수 × 섹터당 워드 수 × 면 수. 단면 디스크이므로 면 수는 1이며, 10 × 20 × 100 × 1 = 20,000 워드입니다."
  }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>

</body>
</html>
