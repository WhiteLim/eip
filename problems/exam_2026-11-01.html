<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-11-01 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {type:"written",kind:"mc",q:"다음 중 CPU의 제어장치에 속하는 레지스터로, 다음에 실행할 명령어의 주소를 기억하는 것은?",
   options:["프로그램 카운터(PC)","누산기(Accumulator)","명령 레지스터(IR)","메모리 버퍼 레지스터(MBR)"],answer:0,
   explain:"프로그램 카운터(PC)는 다음에 실행할 명령어의 주소를 기억합니다. 명령 레지스터(IR)는 현재 실행 중인 명령어, 누산기는 연산 결과를 일시 저장하는 연산장치 레지스터입니다."},
  {type:"written",kind:"mc",q:"플립플롭(FF) 중 입력이 (1,1)일 때 출력이 반전(보수)되며, 가장 널리 사용되는 것은?",
   options:["RS 플립플롭","D 플립플롭","JK 플립플롭","T 플립플롭"],answer:2,
   explain:"JK 플립플롭은 RS FF의 부정(불능) 상태를 개선하여 (1,1) 입력 시 보수(반전)가 되며 가장 널리 사용됩니다. RS FF는 (1,1)이 불능입니다."},
  {type:"written",kind:"mc",q:"그레이 코드(Gray Code)에 대한 설명으로 옳은 것은?",
   options:["연속되는 두 숫자 코드 사이에 1비트만 변하는 코드이다.","10진수를 4비트 2진수로 표현한 가중치 코드이다.","1비트 오류를 검출하고 교정하는 코드이다.","8비트로 구성된 대형 컴퓨터용 코드이다."],answer:0,
   explain:"그레이 코드는 연속된 두 코드 간에 한 비트만 변경되는 코드로 A/D 변환, 데이터 전송 등에 사용됩니다. 4비트 가중치 표현은 BCD, 8비트 대형 컴퓨터용은 EBCDIC입니다."},
  {type:"written",kind:"mc",q:"명령어 형식 중 주소 필드가 없고 스택(Stack)을 이용하여 연산하는 방식은?",
   options:["0 주소 명령어","1 주소 명령어","2 주소 명령어","3 주소 명령어"],answer:0,
   explain:"0 주소 명령어는 기억장치 액세스 없이 스택(PUSH/POP)을 이용합니다. 1 주소는 누산기, 2 주소는 연산 결과를 Operand1에 저장(원 자료 파괴), 3 주소는 입력 자료를 보존합니다."},
  {type:"written",kind:"mc",q:"CPU의 참여 없이 입출력장치와 주기억장치 사이에서 직접 데이터를 주고받는 방식은?",
   options:["폴링(Polling)","DMA","데이지 체인","스풀링(Spooling)"],answer:1,
   explain:"DMA(Direct Memory Access)는 CPU 개입 없이 입출력장치와 메모리가 직접 데이터를 교환합니다. 폴링·데이지 체인은 인터럽트 우선순위 판별 방식입니다."},
  {type:"written",kind:"mc",q:"입출력장치와 CPU 간의 속도 차이를 해결하기 위한 방법 중, 보조기억장치를 이용하며 다중 작업에 적합한 것은?",
   options:["버퍼링(Buffering)","스풀링(Spooling)","블로킹(Blocking)","매핑(Mapping)"],answer:1,
   explain:"스풀링은 보조기억장치(디스크)를 이용하여 다중 작업이 가능하고, 버퍼링은 주기억장치를 이용하며 단일 작업에 쓰입니다."},
  {type:"written",kind:"mc",q:"관계형 데이터베이스에서 릴레이션의 '속성(Attribute)의 개수'를 의미하는 용어는?",
   options:["카디널리티(기수)","차수(Degree)","도메인(Domain)","스키마(Schema)"],answer:1,
   explain:"차수(Degree)는 속성의 개수, 카디널리티(기수)는 튜플의 개수입니다. 도메인은 한 속성이 가질 수 있는 값의 범위입니다."},
  {type:"written",kind:"mc",q:"데이터베이스 설계 단계를 순서대로 바르게 나열한 것은?",
   options:["요구사항 분석 → 논리적 설계 → 개념적 설계 → 물리적 설계","요구사항 분석 → 개념적 설계 → 논리적 설계 → 물리적 설계","요구사항 분석 → 물리적 설계 → 논리적 설계 → 개념적 설계","개념적 설계 → 요구사항 분석 → 논리적 설계 → 물리적 설계"],answer:1,
   explain:"데이터베이스 설계는 요구사항 분석 → 개념적 설계 → 논리적 설계 → 물리적 설계 → 구현 순서입니다(개.논.물)."},
  {type:"written",kind:"mc",q:"SQL에서 뷰(View)에 대한 설명으로 옳은 것은?",
   options:["실제 데이터를 별도로 저장하는 물리 테이블이다.","기본 테이블로부터 만들어지는 가상 테이블이다.","반드시 하나의 기본 테이블에서만 만들 수 있다.","DCL에 속하는 명령으로 정의한다."],answer:1,
   explain:"뷰는 하나 이상의 기본 테이블로부터 만들어지는 가상 테이블로 관리가 용이하고 명령문이 간단해집니다. CREATE VIEW로 정의하므로 DDL에 해당합니다."},
  {type:"written",kind:"mc",q:"프로세스 스케줄링 기법 중 선점(Preemptive) 방식이 아닌 것은?",
   options:["RR(Round Robin)","SRT","다단계 피드백 큐","FIFO"],answer:3,
   explain:"FIFO는 가장 먼저 CPU를 요청한 프로세스에 먼저 할당하는 비선점 방식입니다. RR, SRT는 선점 방식입니다."},
  {type:"written",kind:"mc",q:"DOS 부팅 시 필수 파일이 아니며 시스템 환경 설정을 위해 사용하는 파일은?",
   options:["IO.SYS","MSDOS.SYS","COMMAND.COM","CONFIG.SYS"],answer:3,
   explain:"IO.SYS, MSDOS.SYS, COMMAND.COM은 반드시 루트 디렉터리에 있어야 하는 필수 파일이며, CONFIG.SYS는 설정 파일로 필수가 아닙니다."},
  {type:"written",kind:"mc",q:"UNIX에서 현재 작업 중인 디렉터리의 경로를 표시하는 명령어는?",
   options:["ls","who","pwd","finger"],answer:2,
   explain:"pwd는 현재 작업 디렉터리를 표시합니다. ls는 파일 목록, who는 현재 로그인 사용자, finger는 등록된 사용자 정보 조회입니다."},
  {type:"practical",kind:"short",q:"[실기 단답형] 2진수 1011010을 16진수로 변환한 값을 쓰시오.",
   accept:["5A"],answerDisplay:"5A",
   explain:"2진수를 오른쪽부터 4자리씩 묶으면 0101 1010 이고, 0101=5, 1010=A 이므로 5A(16)입니다."},
  {type:"practical",kind:"short",q:"[실기 단답형] 4위상 편이변조(2비트 전송)를 사용하는 변조 속도가 2,400Baud일 때, 데이터 신호 속도(bps)를 구하시오. (단위 없이 숫자만)",
   accept:["4800","4,800"],answerDisplay:"4800bps",
   explain:"신호 속도 = 변조 속도 × 변조 시 상태 변화 비트 수. 4위상 = 2² 이므로 2비트 → 2,400 × 2 = 4,800bps."},
  {type:"practical",kind:"short",q:"[실기 단답형] '학생' 테이블에서 '학과'가 '컴퓨터'인 학생을 모두 삭제하는 SQL문을 작성하시오.",
   accept:["DELETE FROM 학생 WHERE 학과='컴퓨터'","DELETE FROM 학생 WHERE 학과=\"컴퓨터\""],answerDisplay:"DELETE FROM 학생 WHERE 학과='컴퓨터';",
   explain:"DELETE 문은 'DELETE FROM 테이블명 WHERE 조건' 형식이며 DML에 속합니다."}
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>
