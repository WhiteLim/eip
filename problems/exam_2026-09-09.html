<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-09-09 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    type:"written",
    q:"다음 중 명령어 실행 동작 단계를 순서대로 옳게 나열한 것은?",
    kind:"mc",
    options:[
      "인출(Fetch) → 간접(Indirect) → 실행(Execute) → 인터럽트(Interrupt)",
      "실행(Execute) → 인출(Fetch) → 간접(Indirect) → 인터럽트(Interrupt)",
      "인터럽트(Interrupt) → 인출(Fetch) → 실행(Execute) → 간접(Indirect)",
      "간접(Indirect) → 인출(Fetch) → 인터럽트(Interrupt) → 실행(Execute)"
    ],
    answer:0,
    explain:"명령어의 실행 동작 단계는 인출(Fetch) → 간접(Indirect) → 실행(Execute) → 인터럽트(Interrupt) 순서로 진행됩니다. 인출 단계에서 명령어를 읽어오고, 간접 단계에서 간접 주소일 경우 유효 주소를 구하며, 실행 단계에서 연산을 수행하고, 인터럽트 단계에서 인터럽트 요청을 확인합니다."
  },
  {
    type:"written",
    q:"다음 진리표와 같은 결과를 내는 논리회로는 무엇인가?\nA=0,B=0 → 출력 1 / A=0,B=1 → 출력 1 / A=1,B=0 → 출력 1 / A=1,B=1 → 출력 0",
    kind:"mc",
    options:["OR","AND","NAND","XOR"],
    answer:2,
    explain:"두 입력이 모두 1일 때만 출력이 0이 되고 그 외에는 모두 1이 출력되는 것은 NAND(AND의 부정) 게이트의 진리표입니다."
  },
  {
    type:"written",
    q:"해밍 코드(Hamming Code)에 대한 설명으로 옳은 것은?",
    kind:"mc",
    options:[
      "오류를 검출만 할 수 있고 교정은 할 수 없다.",
      "최대 1Bit의 오류만 검출할 수 있다.",
      "2Bit의 오류를 검출하고 1Bit의 오류를 교정할 수 있다.",
      "오류 검출과 교정 모두 불가능하다."
    ],
    answer:2,
    explain:"해밍 코드는 데이터에 여러 개의 검사 비트를 추가하여 스스로 오류를 검출하고 교정할 수 있는 코드로, 2Bit의 오류를 검출하고 1Bit의 오류를 교정할 수 있습니다."
  },
  {
    type:"written",
    q:"명령어의 Operand 부분에 실제 데이터를 직접 저장하여, 별도의 기억장치 접근 없이 가장 빠르게 오퍼랜드를 사용할 수 있는 주소지정 방식은?",
    kind:"mc",
    options:["즉시(Immediate) 주소지정","직접(Direct) 주소지정","간접(Indirect) 주소지정","상대(Relative) 주소지정"],
    answer:0,
    explain:"즉시(즉치) 주소지정방식은 Operand 부분에 실제 데이터를 직접 저장하는 방식으로, 기억장치에 다시 접근할 필요가 없어 실행 속도가 가장 빠릅니다."
  },
  {
    type:"written",
    q:"다음 중 채널(Channel)에 대한 설명으로 옳은 것은?",
    kind:"mc",
    options:[
      "CPU에 종속되어 CPU의 명령을 받아야만 입출력을 수행한다.",
      "CPU와는 독립적으로 입출력을 관리하는 장치이다.",
      "입출력장치와 메모리가 CPU 없이 직접 데이터를 주고받는 방식이다.",
      "여러 인터럽트의 우선순위를 하드웨어적으로 결정하는 회로이다."
    ],
    answer:1,
    explain:"채널(Channel)은 CPU에 종속적이지 않고 독립적으로 입출력을 관리하는 장치입니다. CPU 없이 메모리와 입출력장치가 직접 데이터를 주고받는 방식은 DMA에 대한 설명입니다."
  },
  {
    type:"written",
    q:"데이터베이스의 3단계 스키마(개념·외부·내부)에 해당하지 않는 것은?",
    kind:"mc",
    options:["개념 스키마","외부 스키마","내부 스키마","논리 스키마"],
    answer:3,
    explain:"데이터베이스의 3단계 스키마는 개념 스키마, 외부 스키마, 내부 스키마(개.외.내)로 구성됩니다. '논리 스키마'는 3단계 스키마의 명칭에 해당하지 않는 오답 함정입니다."
  },
  {
    type:"written",
    q:"SQL 명령어 중 DDL(데이터 정의어, Data Definition Language)에 해당하는 것은?",
    kind:"mc",
    options:["SELECT","INSERT","ALTER","DELETE"],
    answer:2,
    explain:"DDL(데이터 정의어)에는 CREATE, ALTER, DROP이 있습니다. SELECT와 INSERT, DELETE는 DML(데이터 조작어)에 해당합니다."
  },
  {
    type:"written",
    q:"CPU 스케줄링 기법 중, 가장 먼저 CPU를 요청한 프로세스에게 먼저 CPU를 할당하는 비선점(Non-preemptive) 방식은?",
    kind:"mc",
    options:["FIFO","SRT","RR","다단계 피드백 큐"],
    answer:0,
    explain:"FIFO(First In First Out)는 가장 먼저 CPU를 요청한 프로세스에게 먼저 CPU를 할당하는 대표적인 비선점 스케줄링 기법입니다. SRT와 RR은 선점형 기법입니다."
  },
  {
    type:"written",
    q:"UNIX에서 앞 명령어의 출력 결과를 뒤 명령어의 입력으로 전달할 때 사용하는 기능은?",
    kind:"mc",
    options:["pipe","fork","kill","finger"],
    answer:0,
    explain:"pipe(|)는 앞 명령어의 출력을 뒤 명령어의 입력으로 전달하는 기능입니다. fork는 새 프로세스 생성, kill은 프로세스 종료, finger는 사용자 정보 조회 명령입니다."
  },
  {
    type:"written",
    q:"OSI 7계층 중 종단 간(End-to-End) 오류 검출과 흐름 제어, 혼잡 제어를 담당하며 TCP, UDP 프로토콜이 속하는 계층은?",
    kind:"mc",
    options:["네트워크 계층","전송 계층","세션 계층","표현 계층"],
    answer:1,
    explain:"전송 계층(Transport Layer, 4계층)은 종단 간의 논리적 연결 통로를 제공하며 오류 검출, 흐름 제어, 혼잡 제어를 담당합니다. TCP, UDP가 이 계층에 속하는 대표적인 프로토콜입니다."
  },
  {
    type:"written",
    q:"Windows에서 서로 떨어져 있는(비연속적인) 여러 개의 파일을 동시에 선택할 때 함께 눌러야 하는 키는?",
    kind:"mc",
    options:["Shift","Ctrl","Alt","Tab"],
    answer:1,
    explain:"비연속적인 여러 파일을 선택할 때는 Ctrl 키를 누른 상태에서 파일을 클릭합니다. Shift 키는 연속된 범위의 파일을 선택할 때 사용합니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 2진수 1101101을 16진수로 변환한 값을 쓰시오.",
    kind:"short",
    accept:["6D","6d"],
    answerDisplay:"6D",
    explain:"16진수로 변환할 때는 소수점 기준으로 4자리씩 묶습니다. 1101101은 0110 1101로 묶이며, 0110=6, 1101=D이므로 16진수로 6D 입니다. (1101101₂ = 109₁₀ = 6D₁₆)"
  },
  {
    type:"practical",
    q:"[실기 단답형] 제거할 요소를 다른 개체가 참조하고 있으면 제거하지 않는 DROP 옵션의 이름을 쓰시오.",
    kind:"short",
    accept:["RESTRICT"],
    answerDisplay:"RESTRICT",
    explain:"DROP RESTRICT는 제거하려는 요소를 다른 개체가 참조하고 있으면 제거하지 않는 옵션입니다. 반대로 DROP CASCADE는 참조하는 다른 개체까지 함께 제거합니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 성형(Star) 토폴로지로 8개의 노드를 중앙 시스템에 직접 연결할 때 필요한 회선의 수를 구하시오. (단위 없이 숫자만)",
    kind:"short",
    accept:["7"],
    answerDisplay:"7",
    explain:"성형(Star) 토폴로지는 중앙 시스템과 각 노드가 1:1로 연결되므로, 노드가 n개일 때 필요한 회선의 수는 n-1개입니다. 노드가 8개이므로 8-1=7개의 회선이 필요합니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 16진수 3F를 10진수로 변환한 값을 쓰시오. (단위 없이 숫자만)",
    kind:"short",
    accept:["63"],
    answerDisplay:"63",
    explain:"3F(16) = 3×16¹ + 15×16⁰ = 48 + 15 = 63 입니다."
  }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>

</body>
</html>
