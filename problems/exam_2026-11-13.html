<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제4회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:10px;
  }
  .short-btn{
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .short-btn.ghost{
    background:#fff;
    color:var(--accent);
    border:1.5px solid var(--accent);
  }
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
    white-space:pre-line;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제4회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-11-13 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    type:"written",
    q:"반가산기(Half Adder)에서 자리올림수(Carry, C)를 구하는 논리식으로 옳은 것은?",
    kind:"mc",
    options:["C = A·B", "C = A + B", "C = A ⊕ B", "C = (A·B)'"],
    answer:0,
    explain:"반가산기는 1비트 2진수 A, B를 더해 합(S)과 자리올림수(C)를 구하는 조합논리회로입니다. 합 S = A'B + AB' = A⊕B (XOR), 자리올림수 C = A·B (AND) 입니다. A, B가 모두 1일 때만 자리올림이 발생합니다."
  },
  {
    type:"written",
    q:"2ⁿ개의 입력선 중 하나를 선택하여 단일 출력선으로 내보내는 조합논리회로는?",
    kind:"mc",
    options:["멀티플렉서(MUX)", "디멀티플렉서(DeMUX)", "인코더(Encoder)", "플립플롭(Flip-Flop)"],
    answer:0,
    explain:"멀티플렉서(MUX)는 2ⁿ개의 입력 중 1개를 선택해 한 곳으로 출력합니다. 반대로 디멀티플렉서(DeMUX)는 1개의 입력을 2ⁿ개의 출력선 중 하나로 내보냅니다. 플립플롭은 1비트를 기억하는 순서논리회로입니다."
  },
  {
    type:"written",
    q:"명령어의 주소 부분(Operand)에 데이터의 주소 대신 실제 자료(값)를 직접 넣어 두는 주소 지정 방식은?",
    kind:"mc",
    options:["즉시(Immediate) 주소 지정", "직접(Direct) 주소 지정", "간접(Indirect) 주소 지정", "상대(Relative) 주소 지정"],
    answer:0,
    explain:"즉시(즉치) 주소 지정은 주소 대신 자료를 직접 저장하므로 메모리 참조가 필요 없어 가장 빠릅니다. 직접 방식은 실제 데이터의 절대 주소, 간접 방식은 데이터 주소를 가진 포인터의 주소, 상대 방식은 PC + Operand로 유효 주소를 구합니다."
  },
  {
    type:"written",
    q:"인터럽트 우선순위 판별 방법 중 소프트웨어적인 방식에 해당하는 것은?",
    kind:"mc",
    options:["폴링(Polling)", "데이지 체인(Daisy Chain)", "병렬 우선 처리", "벡터 인터럽트 회로"],
    answer:0,
    explain:"인터럽트 우선순위 판별에서 폴링(Polling)은 소프트웨어 방식으로, 우선순위가 높은 장치부터 차례로 검사합니다. 데이지 체인(직렬 연결)과 병렬 우선 처리는 하드웨어 방식입니다."
  },
  {
    type:"written",
    q:"버퍼링(Buffering)과 비교한 스풀링(Spooling)의 특징으로 옳은 것은?",
    kind:"mc",
    options:[
      "보조기억장치(디스크)를 이용하며 다중 작업에 적합하다.",
      "주기억장치를 이용하며 단일 작업에 적합하다.",
      "CPU와 주기억장치의 속도 차이만을 해결한다.",
      "하드웨어로만 구현되며 운영체제의 관여가 없다."
    ],
    answer:0,
    explain:"버퍼링과 스풀링 모두 입출력장치와 CPU 간의 속도 차이를 해결하기 위한 방법입니다. 버퍼링은 주기억장치를 사용하고 단일 작업에, 스풀링은 보조기억장치(디스크)를 사용하고 다중 작업에 적합합니다."
  },
  {
    type:"written",
    q:"관계형 데이터베이스에서 릴레이션의 '기수(Cardinality)'가 의미하는 것은?",
    kind:"mc",
    options:["튜플(Tuple)의 개수", "속성(Attribute)의 개수", "도메인(Domain)의 개수", "기본키(Primary Key)의 개수"],
    answer:0,
    explain:"기수(Cardinality)는 릴레이션에 포함된 튜플(행)의 개수이고, 차수(Degree)는 속성(열)의 개수입니다. 도메인은 하나의 속성이 가질 수 있는 값의 범위를 말합니다. '기수=튜플, 차수=속성'으로 짝지어 암기하세요."
  },
  {
    type:"written",
    q:"미리 정해진 시간 할당량(Time Slice)만큼씩 각 프로세스에게 CPU를 차례로 할당하는 선점형 스케줄링 기법은?",
    kind:"mc",
    options:["RR(Round Robin)", "FIFO(First In First Out)", "SJF(Shortest Job First)", "HRN(Highest Response-ratio Next)"],
    answer:0,
    explain:"RR(라운드 로빈)은 시간 조각(Time Slice)을 미리 정의해 각 프로세스에 순환적으로 CPU를 제공하는 선점형 기법으로, 시분할 시스템에 적합합니다. FIFO·SJF·HRN은 비선점형 기법이며, 선점형으로는 RR 외에 SRT 등이 있습니다."
  },
  {
    type:"written",
    q:"UNIX 시스템의 구성 요소 중, 사용자가 입력한 명령어를 해석하여 커널에 전달하는 '명령어 해석기' 역할을 하는 것은?",
    kind:"mc",
    options:["쉘(Shell)", "커널(Kernel)", "유틸리티(Utility)", "UFS(Unix File System)"],
    answer:0,
    explain:"UNIX는 커널·쉘·유틸리티로 구성됩니다. 쉘(Shell)은 명령어 해석기로 Korn Shell, Bourne Shell, C Shell(K.B.C) 등이 있습니다. 커널은 태스크 스케줄링·기억장치 관리 등 핵심 기능을, 유틸리티는 응용 프로그램 기능을 담당합니다."
  },
  {
    type:"written",
    q:"MS-DOS 명령어 중 내부 명령어가 아닌 것은?",
    kind:"mc",
    options:["FORMAT", "CLS", "COPY", "DIR"],
    answer:0,
    explain:"내부 명령어는 COMMAND.COM에 포함되어 프롬프트에서 언제든 사용할 수 있으며 CLS, VER, VOL, DATE, TIME, PROMPT, DIR, COPY, MD, CD, RD, TYPE, DEL 등이 있습니다. FORMAT은 별도의 실행 파일이 필요한 외부 명령어입니다(ATTRIB, CHKDSK, FDISK, XCOPY 등도 외부 명령어)."
  },
  {
    type:"written",
    q:"통신 프로토콜의 기본 3요소에 해당하지 않는 것은?",
    kind:"mc",
    options:["처리(Processing)", "구문(Syntax)", "의미(Semantics)", "시간(Timing)"],
    answer:0,
    explain:"프로토콜의 기본 요소는 구문(Syntax: 데이터 형식·부호화), 의미(Semantics: 제어 정보·오류 처리), 시간(Timing: 속도 조절·순서 관리) 3가지입니다. '처리'는 기본 요소가 아닙니다."
  },
  {
    type:"written",
    q:"광섬유 케이블에서 발생하는 손실의 종류로 옳지 않은 것은?",
    kind:"mc",
    options:["유전체 손실", "산란 손실", "흡수 손실", "접속 손실"],
    answer:0,
    explain:"광섬유 케이블의 손실에는 접속 손실, 산란 손실, 흡수 손실 등이 있습니다. 유전체 손실은 동축 케이블 등 금속 선로의 절연물에서 발생하는 손실로 광섬유 손실에 해당하지 않습니다. 광섬유는 빛의 전반사를 이용하며 잡음 영향이 없고 보안성이 높습니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 그레이 코드(Gray Code) 1101을 2진수로 변환한 값을 쓰시오. (4자리 숫자만)",
    kind:"short",
    accept:["1001"],
    answerDisplay:"1001",
    explain:"① Gray → 2진수 변환은 첫 번째 비트는 그대로 내려쓰고, 두 번째 비트부터는 '바로 앞에서 구한 2진수 결과값'과 XOR 합니다.\n② 1번째: 1 (그대로)\n③ 2번째: 결과 1 ⊕ Gray 1 = 0\n④ 3번째: 결과 0 ⊕ Gray 0 = 0\n⑤ 4번째: 결과 0 ⊕ Gray 1 = 1\n⑥ 따라서 2진수는 1001 입니다. (검산: 1001 → Gray 변환 시 1, 1⊕0=1, 0⊕0=0, 0⊕1=1 → 1101 ✓)\n※ 2진수 → Gray는 '앞의 2진수 비트'와, Gray → 2진수는 '앞의 결과값'과 XOR 한다는 차이를 구분하세요."
  },
  {
    type:"practical",
    q:"[실기 단답형] '학생' 테이블에서 '학과' 속성의 값을 중복 없이 조회하는 SQL문을 작성하시오.",
    kind:"short",
    accept:["SELECT DISTINCT 학과 FROM 학생"],
    answerDisplay:"SELECT DISTINCT 학과 FROM 학생;",
    explain:"① 조회는 DML의 SELECT 문을 사용합니다: SELECT 속성명 FROM 테이블명;\n② 검색 결과에서 중복된 값을 제거하려면 SELECT 바로 뒤에 DISTINCT 키워드를 붙입니다.\n③ 따라서 SELECT DISTINCT 학과 FROM 학생; 이 됩니다.\n④ DISTINCT를 빼면 같은 학과명이 학생 수만큼 반복 출력됩니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 6장으로 구성된 디스크 팩(Disk Pack)에서 데이터를 기록할 수 있는 면의 수를 구하시오. (단위 없이 숫자만)",
    kind:"short",
    accept:["10","10면","10개"],
    answerDisplay:"10",
    explain:"① 디스크 팩의 기록 가능 면 수 = (디스크 수 × 2) − 2 입니다.\n② 각 디스크는 윗면과 아랫면 2면을 가지므로 6 × 2 = 12면입니다.\n③ 단, 맨 위 디스크의 윗면과 맨 아래 디스크의 아랫면은 보호를 위해 기록에 사용하지 않으므로 2면을 뺍니다.\n④ 따라서 12 − 2 = 10면입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 한 번의 신호 변화로 4비트를 전송하는 변조 방식(16가지 상태)을 사용하여 데이터 신호 속도 9,600bps로 전송할 때, 변조 속도(Baud)를 구하시오. (단위 없이 숫자만)",
    kind:"short",
    accept:["2400","2,400"],
    answerDisplay:"2400Baud",
    explain:"① 변조 속도(Baud) = 데이터 신호 속도(bps) ÷ 변조 시 1회 상태 변화당 비트 수 입니다.\n② 16가지 상태 = 2⁴ 이므로 한 번의 신호 변화로 4비트를 전송합니다.\n③ 따라서 9,600bps ÷ 4bit = 2,400Baud 입니다.\n④ 반대로 신호 속도(bps) = 변조 속도(Baud) × 비트 수 이므로, 두 공식은 곱셈/나눗셈 관계로 함께 암기하세요."
  }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btnRow = document.createElement('div');
    btnRow.className = 'short-btn-row';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const explainBtn = document.createElement('button');
    explainBtn.className = 'short-btn ghost';
    explainBtn.textContent = '해설 보기';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });
    explainBtn.addEventListener('click', () => { explain.classList.add('show'); });

    btnRow.appendChild(btn);
    btnRow.appendChild(explainBtn);
    saWrap.appendChild(input);
    saWrap.appendChild(btnRow);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>

</body>
</html>
