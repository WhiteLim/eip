<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제2회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제2회</h1>
  <p>필기 + 실기 통합 연습문제 · 총 13문항 · 2026-09-01 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">13</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    type:"written",
    q:"불 대수의 드모르간 법칙에 따라, (A OR B)를 부정(NOT)한 것과 같은 결과를 내는 식은?",
    kind:"mc",
    options:["(NOT A) AND (NOT B)","(NOT A) OR (NOT B)","A AND B","NOT (A AND B)"],
    answer:0,
    explain:"드모르간 법칙에 따르면 NOT(A+B) = (NOT A)·(NOT B) 입니다. 즉 OR의 부정은 각 항을 부정한 뒤 AND로 묶은 것과 같습니다."
  },
  {
    type:"written",
    q:"RISC(Reduced Instruction Set Computer)의 특징으로 옳은 것은?",
    kind:"mc",
    options:[
      "메모리에 대한 액세스는 LOAD와 STORE 명령으로만 한정된다.",
      "명령어 종류가 많고 명령어 길이가 가변적이다.",
      "마이크로 코드에 의해 해석된 후 명령어를 수행한다.",
      "주소지정방식이 CISC보다 다양하게 존재한다."
    ],
    answer:0,
    explain:"RISC는 메모리 액세스를 LOAD/STORE 명령으로 한정하여 구조를 단순화합니다. 명령어 종류가 많고 가변 길이이며 마이크로 코드를 사용하는 것은 CISC의 특징입니다."
  },
  {
    type:"written",
    q:"인터럽트(Interrupt) 발생 시 우선순위를 판별하는 방법 중, CPU가 소프트웨어적으로 각 장치를 순서대로 검사하여 요청 여부를 확인하는 방식은?",
    kind:"mc",
    options:["폴링(Polling)","데이지 체인(Daisy Chain)","DMA","채널(Channel)"],
    answer:0,
    explain:"폴링(Polling)은 소프트웨어적으로 각 장치를 순차적으로 검사하여 인터럽트 요청 여부를 확인하는 방식입니다. 데이지 체인은 하드웨어적으로 우선순위를 판별하는 방식입니다."
  },
  {
    type:"written",
    q:"8비트 컴퓨터에서 -8을 2의 보수(2's Complement)로 바르게 표현한 것은?",
    kind:"mc",
    options:["11111000","00001000","11110111","10001000"],
    answer:0,
    explain:"8을 2진수로 표현하면 00001000, 1의 보수는 11110111, 여기에 1을 더한 2의 보수는 11111000 입니다."
  },
  {
    type:"written",
    q:"SQL 언어 중 테이블·뷰·인덱스 등의 구조를 정의·변경·삭제하는 데이터 정의어(DDL)에 해당하는 명령은?",
    kind:"mc",
    options:["CREATE","SELECT","INSERT","COMMIT"],
    answer:0,
    explain:"CREATE, ALTER, DROP은 데이터 정의어(DDL)입니다. SELECT/INSERT/UPDATE/DELETE는 DML, COMMIT/ROLLBACK/GRANT/REVOKE는 DCL에 속합니다."
  },
  {
    type:"written",
    q:"UNIX에서 현재 작업 중인 디렉터리의 전체 경로를 화면에 출력하는 명령어는?",
    kind:"mc",
    options:["pwd","ls","cat","cd"],
    answer:0,
    explain:"pwd(Print Working Directory)는 현재 작업 디렉터리의 경로를 출력합니다. ls는 파일 목록, cat은 파일 내용 출력, cd는 디렉터리 이동 명령어입니다."
  },
  {
    type:"written",
    q:"Windows에서 현재 활성화된 창(응용 프로그램)을 닫고 프로그램을 종료하는 단축키는?",
    kind:"mc",
    options:["Alt + F4","Ctrl + Esc","Ctrl + C","Alt + Tab"],
    answer:0,
    explain:"Alt+F4는 활성 창을 닫고 프로그램을 종료합니다. Ctrl+Esc는 시작 메뉴 표시, Ctrl+C는 복사, Alt+Tab은 실행 중인 프로그램 전환입니다."
  },
  {
    type:"written",
    q:"LAN의 망 형태 중, 중앙의 허브(또는 스위치)를 중심으로 각 단말기가 개별적으로 연결되어 시스템 운영 및 관리가 간단한 형태는?",
    kind:"mc",
    options:["성형(Star)","망형(Mesh)","버스형(Bus)","링형(Ring)"],
    answer:0,
    explain:"성형(Star)은 중앙 집중형 구조로 각 단말기가 중앙 장치에 개별 연결되어 시스템 운영 조직이 간단합니다. 망형(Mesh)은 노드 n개일 때 n(n-1)/2개의 회선이 필요합니다."
  },
  {
    type:"written",
    q:"페이지 교체 알고리즘 중, 가장 오랫동안 참조되지 않은 페이지를 교체 대상으로 선정하는 기법은?",
    kind:"mc",
    options:["LRU(Least Recently Used)","FIFO(First In First Out)","LFU(Least Frequently Used)","최적 교체(Optimal)"],
    answer:0,
    explain:"LRU는 가장 오래(최근에) 참조되지 않은 페이지를 교체합니다. LFU는 사용 빈도가 가장 적은 페이지를, FIFO는 가장 먼저 적재된 페이지를 교체합니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 8진수 247을 10진수로 변환한 값을 쓰시오.",
    kind:"short",
    accept:["167"],
    answerDisplay:"167",
    explain:"247(8) = 2×8² + 4×8¹ + 7×8⁰ = 128 + 32 + 7 = 167 입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] '제품' 테이블에서 '가격'이 10000 이상인 행을 모두 삭제하는 SQL문을 작성하시오.",
    kind:"short",
    accept:["DELETE FROM 제품 WHERE 가격>=10000","DELETE FROM 제품 WHERE 가격 >= 10000"],
    answerDisplay:"DELETE FROM 제품 WHERE 가격>=10000;",
    explain:"DELETE FROM 절에 테이블명, WHERE 절에 삭제 조건을 기술합니다. WHERE 절을 생략하면 테이블의 모든 행이 삭제되므로 주의해야 합니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] A=1, B=0일 때, (A AND B) OR (NOT B) 의 값을 구하시오. (0 또는 1)",
    kind:"short",
    accept:["1"],
    answerDisplay:"1",
    explain:"(A AND B) = (1 AND 0) = 0 이고, (NOT B) = (NOT 0) = 1 입니다. 따라서 0 OR 1 = 1 입니다."
  },
  {
    type:"practical",
    q:"[실기 단답형] 빈 큐(Queue)에 대해 ENQUEUE A → ENQUEUE B → DEQUEUE → ENQUEUE C → DEQUEUE → DEQUEUE 순서로 연산을 수행할 때, DEQUEUE로 출력되는 값을 순서대로 나열하시오. (예: A, B, C)",
    kind:"short",
    accept:["A, B, C","A,B,C","A B C"],
    answerDisplay:"A, B, C",
    explain:"큐는 선입선출(FIFO) 구조입니다. ENQUEUE A→[A], ENQUEUE B→[A,B], DEQUEUE→A 출력 후 [B], ENQUEUE C→[B,C], DEQUEUE→B 출력 후 [C], DEQUEUE→C 출력. 따라서 출력 순서는 A, B, C입니다."
  }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>

</body>
</html>
