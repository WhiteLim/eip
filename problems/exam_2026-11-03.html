<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>정보처리기능사 모의고사 제3회</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1c2331;
    --sub:#5b6472;
    --accent:#3457d5;
    --accent-soft:#e8edff;
    --correct:#1f9d55;
    --correct-bg:#e6f7ed;
    --wrong:#e0483e;
    --wrong-bg:#fdeceb;
    --border:#e3e6ee;
    --badge-written:#3457d5;
    --badge-practical:#c2621a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#3457d5,#5a7bff);
    color:#fff;
    padding:28px 20px 24px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    font-weight:800;
  }
  header p{
    margin:0;
    font-size:.85rem;
    opacity:.9;
  }
  .backlink{
    display:inline-block;
    margin-top:14px;
    font-size:.8rem;
    color:#fff;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.6);
    padding:6px 14px;
    border-radius:20px;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 0;
  }
  .score-bar{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 18px;
    box-shadow:0 4px 14px rgba(30,40,80,.06);
    font-size:.85rem;
  }
  .score-bar strong{color:var(--accent);font-size:1rem;}
  .progress-track{
    height:6px;
    background:var(--accent-soft);
    border-radius:6px;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 16px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,40,80,.04);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .qnum{
    font-weight:800;
    color:var(--accent);
    font-size:.95rem;
  }
  .badge{
    font-size:.68rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    color:#fff;
  }
  .badge.written{background:var(--badge-written);}
  .badge.practical{background:var(--badge-practical);}
  .qtext{
    font-size:1rem;
    font-weight:600;
    margin:4px 0 14px;
    white-space:pre-line;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    font-size:.92rem;
    color:var(--text);
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.98);}
  .opt .oidx{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:.75rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
  }
  .opt.correct .oidx{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .opt.wrong .oidx{background:var(--wrong);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .short-answer input{
    width:100%;
    padding:12px 14px;
    font-size:.95rem;
    border:1.5px solid var(--border);
    border-radius:12px;
    background:#fbfcff;
    color:var(--text);
    font-family:inherit;
  }
  .short-answer input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .short-btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
  }
  .short-btn:active{opacity:.85;}
  .result-box{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    font-size:.88rem;
    display:none;
  }
  .result-box.show{display:block;}
  .result-box.ok{background:var(--correct-bg);color:var(--correct);}
  .result-box.no{background:var(--wrong-bg);color:var(--wrong);}
  .result-box .rlabel{font-weight:800;margin-bottom:4px;}
  .explain{
    margin-top:12px;
    padding:12px 14px;
    background:#f7f8fc;
    border-left:3px solid var(--accent);
    border-radius:8px;
    font-size:.85rem;
    color:var(--sub);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  .reset-wrap{
    text-align:center;
    margin:26px 0 10px;
  }
  .reset-btn{
    padding:12px 26px;
    background:#fff;
    border:1.5px solid var(--accent);
    color:var(--accent);
    border-radius:24px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }

  @media (min-width:600px){
    .qtext{font-size:1.08rem;}
    .opt{font-size:.96rem;}
  }
  @media (min-width:768px){
    header h1{font-size:1.7rem;}
    .card{padding:24px 26px 26px;}
  }
</style>
</head>
<body>

<header>
  <h1>정보처리기능사 모의고사 · 제3회</h1>
  <p>필기 기출 유형 기반 연습문제 · 총 15문항 · 2026-11-03 출제</p>
  <a class="backlink" href="../index.html">← 문제 목록으로</a>
</header>

<div class="wrap">
  <div class="score-bar">
    <div>
      <div>정답 <strong id="scoreCorrect">0</strong> / <span id="scoreTotal">15</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div style="text-align:right;">
      <div id="scorePercent" style="font-weight:800;color:var(--accent);font-size:1.15rem;">0%</div>
      <div style="color:var(--sub);">진행률</div>
    </div>
  </div>

  <div id="quiz"></div>

  <div class="reset-wrap">
    <button class="reset-btn" id="resetBtn">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    "type": "written",
    "q": "다음에 실행할 명령어의 주소를 기억하고 있는 제어장치의 레지스터는?",
    "kind": "mc",
    "options": [
      "명령 레지스터(IR)",
      "프로그램 카운터(PC)",
      "메모리 버퍼 레지스터(MBR)",
      "누산기(Accumulator)"
    ],
    "answer": 1,
    "explain": "프로그램 카운터(PC)는 다음에 실행할 명령어의 주소를 기억합니다. IR은 현재 실행 중인 명령어, MBR은 기억장치를 출입하는 데이터를 일시 저장하며, 누산기는 연산 결과를 저장하는 연산장치의 레지스터입니다."
  },
  {
    "type": "written",
    "q": "JK 플립플롭에서 J=1, K=1을 입력했을 때의 동작은?",
    "kind": "mc",
    "options": [
      "무변화",
      "0으로 리셋",
      "1로 셋",
      "보수(토글)"
    ],
    "answer": 3,
    "explain": "JK FF는 (0,0) 무변화, (0,1) 공(0), (1,0) 일(1), (1,1) 보수(반전)로 동작합니다. 무.공.일.보 로 암기합니다."
  },
  {
    "type": "written",
    "q": "레지스터 및 주소 지정 방식 중 '프로그램 카운터(PC) 값 + 주소 부분(Operand)'으로 유효 주소를 계산하는 방식은?",
    "kind": "mc",
    "options": [
      "상대 주소 지정",
      "색인 주소 지정",
      "직접 주소 지정",
      "즉시 주소 지정"
    ],
    "answer": 0,
    "explain": "상대(Relative) 주소 지정은 PC + Operand로 유효 주소를 구합니다. 색인 주소 지정은 인덱스 레지스터를 더하는 방식입니다."
  },
  {
    "type": "written",
    "q": "연산 후에도 입력 자료가 보존되며, 범용 레지스터(GPR)를 가진 컴퓨터에서 사용하는 명령어 형식은?",
    "kind": "mc",
    "options": [
      "0 주소 명령어",
      "1 주소 명령어",
      "2 주소 명령어",
      "3 주소 명령어"
    ],
    "answer": 3,
    "explain": "3 주소 명령어는 연산 후 입력 자료를 보존하며 범용 레지스터를 가진 컴퓨터에서 사용합니다. 2 주소 명령어는 결과를 Operand1에 저장해 원래 자료가 파괴됩니다."
  },
  {
    "type": "written",
    "q": "입출력 장치와 CPU 간의 속도 차이를 해결하는 방법 중, 보조기억장치를 이용하며 다중 작업에 적합한 것은?",
    "kind": "mc",
    "options": [
      "버퍼링(Buffering)",
      "스풀링(Spooling)",
      "채널(Channel)",
      "인터럽트(Interrupt)"
    ],
    "answer": 1,
    "explain": "버퍼링은 주기억장치를 사용하고 단일 작업에, 스풀링은 보조기억장치를 사용하고 다중 작업에 적합합니다."
  },
  {
    "type": "written",
    "q": "관계형 데이터베이스에서 속성(Attribute)의 개수를 의미하는 용어는?",
    "kind": "mc",
    "options": [
      "차수(Degree)",
      "기수(Cardinality)",
      "도메인(Domain)",
      "튜플(Tuple)"
    ],
    "answer": 0,
    "explain": "차수(Degree)는 속성의 개수, 기수(Cardinality)는 튜플의 개수입니다. 도메인은 하나의 속성이 가질 수 있는 값의 범위입니다."
  },
  {
    "type": "written",
    "q": "프로세스 스케줄링 기법 중 시간 조각(Time Slice)을 미리 정의하여 각 프로세스에 CPU를 번갈아 할당하는 선점형 기법은?",
    "kind": "mc",
    "options": [
      "FIFO",
      "SRT",
      "RR(Round Robin)",
      "SJF"
    ],
    "answer": 2,
    "explain": "RR(Round Robin)은 시간 조각을 정해 프로세스마다 CPU를 제공하는 선점형 기법입니다. FIFO는 비선점이며 먼저 도착한 프로세스에 먼저 할당합니다."
  },
  {
    "type": "written",
    "q": "MS-DOS의 부팅 시 실행 순서(I.M.C.C.A)로 옳은 것은?",
    "kind": "mc",
    "options": [
      "IO.SYS → MSDOS.SYS → CONFIG.SYS → COMMAND.COM → AUTOEXEC.BAT",
      "MSDOS.SYS → IO.SYS → COMMAND.COM → CONFIG.SYS → AUTOEXEC.BAT",
      "IO.SYS → CONFIG.SYS → MSDOS.SYS → AUTOEXEC.BAT → COMMAND.COM",
      "COMMAND.COM → IO.SYS → MSDOS.SYS → CONFIG.SYS → AUTOEXEC.BAT"
    ],
    "answer": 0,
    "explain": "DOS 부팅 순서는 IO.SYS → MSDOS.SYS → CONFIG.SYS → COMMAND.COM → AUTOEXEC.BAT(I.M.C.C.A)입니다."
  },
  {
    "type": "written",
    "q": "UNIX에서 그룹(g)과 기타 사용자(o)의 쓰기 권한을 취소하여 소유자만 수정할 수 있게 하는 명령은?",
    "kind": "mc",
    "options": [
      "chmod go+w 파일명",
      "chmod go-w 파일명",
      "chmod u-w 파일명",
      "chmod a+w 파일명"
    ],
    "answer": 1,
    "explain": "chmod go-w 파일명은 그룹(g)과 기타(o) 사용자의 쓰기(w) 권한을 제거(-)합니다."
  },
  {
    "type": "written",
    "q": "PCM(펄스 코드 변조)의 송신 측 처리 순서로 옳은 것은?",
    "kind": "mc",
    "options": [
      "양자화 → 표본화 → 부호화",
      "표본화 → 부호화 → 양자화",
      "표본화 → 양자화 → 부호화",
      "부호화 → 표본화 → 양자화"
    ],
    "answer": 2,
    "explain": "PCM 송신 측은 표본화 → 양자화 → 부호화(표.양.부)이고, 수신 측은 복호화 → 여과화(복.여)입니다."
  },
  {
    "type": "written",
    "q": "HDLC 프레임의 구성 순서로 옳은 것은?",
    "kind": "mc",
    "options": [
      "플래그 - 주소부 - 제어부 - 정보부 - FCS - 플래그",
      "플래그 - 제어부 - 주소부 - 정보부 - FCS - 플래그",
      "플래그 - 주소부 - 정보부 - 제어부 - FCS - 플래그",
      "플래그 - 주소부 - 제어부 - FCS - 정보부 - 플래그"
    ],
    "answer": 0,
    "explain": "HDLC 프레임은 플래그 → 주소부 → 제어부 → 정보부 → 검색부(FCS) → 플래그 순서(주.제.정.검)입니다."
  },
  {
    "type": "practical",
    "q": "[실기 단답형] IPv6 주소의 전체 비트 수를 쓰시오. (단위 없이 숫자만)",
    "kind": "short",
    "accept": [
      "128"
    ],
    "answerDisplay": "128",
    "explain": "IPv6는 16비트 × 8부분 = 128비트로 구성됩니다. (IPv4는 8비트 × 4부분 = 32비트)"
  },
  {
    "type": "practical",
    "q": "[실기 단답형] 2진수 1101을 10진수로 변환한 값을 쓰시오.",
    "kind": "short",
    "accept": [
      "13"
    ],
    "answerDisplay": "13",
    "explain": "1×8 + 1×4 + 0×2 + 1×1 = 13 입니다."
  },
  {
    "type": "practical",
    "q": "[실기 단답형] '학생' 테이블에서 '학과'를 중복 없이 검색하는 SQL문을 작성하시오. (학과 속성만 조회)",
    "kind": "short",
    "accept": [
      "SELECT DISTINCT 학과 FROM 학생",
      "SELECT DISTINCT 학과 FROM 학생;"
    ],
    "answerDisplay": "SELECT DISTINCT 학과 FROM 학생;",
    "explain": "SELECT DISTINCT는 중복되는 값을 제거하고 한 번씩만 검색합니다."
  },
  {
    "type": "practical",
    "q": "[실기 단답형] 대역폭 W=1000Hz, 신호 대 잡음비 S/N=7인 채널의 섀넌 통신 용량(bps)을 구하시오. (단위 없이 숫자만)",
    "kind": "short",
    "accept": [
      "3000",
      "3,000"
    ],
    "answerDisplay": "3000bps",
    "explain": "C = W·log2(1+S/N) = 1000 × log2(8) = 1000 × 3 = 3000bps 입니다."
  }
];

const quizEl = document.getElementById('quiz');
let answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,' ').replace(/[;；]+$/,'').trim();
}

function updateScore(){
  const total = QUESTIONS.length;
  const answeredCount = answered.filter(Boolean).length;
  document.getElementById('scoreCorrect').textContent = correctCount;
  document.getElementById('scoreTotal').textContent = total;
  const pct = total ? Math.round((answeredCount/total)*100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(item, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  const qnum = document.createElement('span');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + (idx+1);
  const badge = document.createElement('span');
  badge.className = 'badge ' + (item.type === 'written' ? 'written' : 'practical');
  badge.textContent = item.type === 'written' ? '필기' : '실기';
  head.appendChild(qnum);
  head.appendChild(badge);
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = item.q;
  card.appendChild(qtext);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>해설</b><br>' + item.explain;

  if(item.kind === 'mc'){
    const optWrap = document.createElement('div');
    optWrap.className = 'options';
    item.options.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="oidx">' + (oi+1) + '</span><span>' + optText + '</span>';
      btn.addEventListener('click', () => {
        if(answered[idx]) return;
        answered[idx] = true;
        const isCorrect = oi === item.answer;
        if(isCorrect) correctCount++;
        Array.from(optWrap.children).forEach((b, bi) => {
          b.classList.add('disabled');
          if(bi === item.answer) b.classList.add('correct');
          else if(bi === oi) b.classList.add('wrong');
          else b.classList.add('dim');
        });
        explain.classList.add('show');
        updateScore();
      });
      optWrap.appendChild(btn);
    });
    card.appendChild(optWrap);
  } else {
    const saWrap = document.createElement('div');
    saWrap.className = 'short-answer';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '정답을 입력하세요';
    const btn = document.createElement('button');
    btn.className = 'short-btn';
    btn.textContent = '정답 확인';
    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';

    function check(){
      if(answered[idx]) return;
      answered[idx] = true;
      const userVal = normalize(input.value || '');
      const isCorrect = item.accept.some(a => normalize(a) === userVal);
      if(isCorrect) correctCount++;
      resultBox.classList.add('show');
      resultBox.classList.add(isCorrect ? 'ok' : 'no');
      resultBox.innerHTML = '<div class="rlabel">' + (isCorrect ? '✓ 정답입니다' : '✗ 오답입니다') +
        '</div>모범 답안: ' + item.answerDisplay;
      input.disabled = true;
      btn.disabled = true;
      explain.classList.add('show');
      updateScore();
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') check(); });

    saWrap.appendChild(input);
    saWrap.appendChild(btn);
    saWrap.appendChild(resultBox);
    card.appendChild(saWrap);
  }

  card.appendChild(explain);
  quizEl.appendChild(card);
}

function shuffleForRender(item){
  if(item.kind !== 'mc') return item;
  const tagged = item.options.map((opt, i) => ({opt, isAnswer: i === item.answer}));
  for(let i = tagged.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [tagged[i], tagged[j]] = [tagged[j], tagged[i]];
  }
  return {
    ...item,
    options: tagged.map(t => t.opt),
    answer: tagged.findIndex(t => t.isAnswer)
  };
}

function renderAll(){
  quizEl.innerHTML = '';
  answered = new Array(QUESTIONS.length).fill(false);
  correctCount = 0;
  QUESTIONS.map(shuffleForRender).forEach((item, idx) => renderQuestion(item, idx));
  updateScore();
}

document.getElementById('resetBtn').addEventListener('click', renderAll);

renderAll();
</script>
